[project]
name = "iki-server"
version = "0.1.0.dev0"
description = "Iki server: the Django project behind the Iki API, MCP server and web UI."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Iki Authors" }]
dependencies = [
  "django>=6.1.3,<6.2",
  "django-environ>=0.14.0",
  "psycopg[pool]>=3.3.8",
  "structlog>=26.1.0",
  "uvicorn[standard]>=0.54.0",
  "opentelemetry-api>=1.45.2",
  "opentelemetry-sdk>=1.45.2",
  "opentelemetry-exporter-otlp-proto-http>=1.45.2",
  # The Django instrumentation needs the ASGI one to trace requests under ASGI.
  "opentelemetry-instrumentation-asgi>=0.66b2",
  "opentelemetry-instrumentation-django>=0.66b2",
  "opentelemetry-instrumentation-psycopg>=0.66b2",
  "django-allauth[socialaccount,saml]>=65.21.1",
  "servestatic>=4.4.0",
  "cryptography>=50.0.2",
  "requests>=2.34.2",
  "django-ninja>=1.7",
  "django-oauth-toolkit>=3.4.1",
  "iki-spec",
  "boto3>=1.43.0",
  "mcp>=2.3.0",
  # Comparing worker versions, as Python and Cargo write them (ADR 0060).
  "packaging>=26.3",
]

[project.optional-dependencies]
# Container images build psycopg's C extension against the distro's libpq,
# which gets OS security updates. Development uses the prebuilt binary wheel.
c = ["psycopg[c]>=3.3.8"]

[tool.uv.sources]
iki-spec = { workspace = true }

[project.scripts]
iki-server = "iki_server.manage:main"

[tool.uv.build-backend]
# The core plugin's generated app ships with the server (ADR 0038).
module-name = ["iki_server", "iki_plugin_core"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
