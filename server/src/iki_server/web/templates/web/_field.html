{# One form field with label, help text and errors. Django links the help and error ids through aria-describedby and sets aria-invalid. #}
<div class="field{% if field.errors %} field-invalid{% endif %}">
  <label for="{{ field.auto_id }}">{{ field.label }}{% if not field.field.required %} <span class="optional">(optional)</span>{% endif %}</label>
  {% if field.errors %}<p class="field-error" id="{{ field.auto_id }}_error">{{ field.errors|join:" " }}</p>{% endif %}
  {{ field.as_widget }}
  {% if field.help_text %}<p class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
</div>
