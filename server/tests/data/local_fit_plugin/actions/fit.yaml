apiVersion: iki/v1
kind: Action
name: fit_5pl
label: Fit a five-parameter logistic
description: >-
  The lab's own method. Each result records fit_version acme/5PL-WLS/1, and is reviewed as
  its project chose for plate assay results.
inputs:
  read: { type: iki/plate_assays.PlateRead, schema: ">=4", include: [measurements] }
  sample: { type: iki/core.Entity }
effects:
  creates:
    - { type: iki/plate_assays.AssayResult, cardinality: many, derived_from: [read, sample] }
runs_on: { tier: backend, environment: fits }
command: [python, ./scripts/fit.py]
