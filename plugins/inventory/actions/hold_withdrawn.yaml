apiVersion: iki/v1
kind: Action
name: hold_withdrawn
label: Hold stock derived from a withdrawn container
description: >-
  Puts the selected containers made from a withdrawn container on hold. Each hold
  names the source and gives the reason entered here, or the source's own reason.
  Containers already on hold keep their own hold.
inputs:
  source: { type: Container, label: Withdrawn container }
  tubes:
    type: Container
    cardinality: many
    optional: true
    label: Containers to hold
    description: The containers made from the source, such as its aliquots, that this hold covers.
params:
  reason:
    type: string
    max_length: 500
    pattern: "\\S"
    pattern_help: a reason, not only spaces
    description: >-
      The reason recorded on each container's hold, after the source's HRID. Leave it
      blank to give the source's hold reason.
effects:
  updates:
    source: { fields: [hold_reason] }
    tubes: { fields: [on_hold, hold_reason] }
runs_on: { tier: backend, environment: stock-tools }
command: [python, ./scripts/hold.py]
retries: { max: 2, on: [worker_lost, interrupted] }
timeout: 10m
