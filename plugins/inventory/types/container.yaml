# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: Container
label: Container
abstract: true
schema_version: 1
description: >-
  A barcoded vessel holding material from one record, such as a tube, a vial or a
  straw. Each kind of container says how its material is measured. Its contents
  determine the draw restrictions that apply at the bench.
storage:
  barcode: barcode
fields:
  name:
    type: string
    max_length: 40
    description: >-
      Its short name, as written on its label, such as "mAb-17 2 mg/mL".
  barcode:
    type: string
    max_length: 64
    unique: true
    indexed: true
    description: The 2D code on its base or label, if it has one; its HRID otherwise.
  contents:
    type: ref
    to: iki/core.Entity
    immutable: true
    description: The material it holds. An empty container can be labeled before it is filled.
  on_hold:
    type: bool
    default: false
    indexed: true
    reason_on_clear: true
    description: This container has been withdrawn from use.
  hold_reason:
    type: text
    description: Why this container was withdrawn.
  prepared_on:
    type: date
    label: Prepared
    description: When it was filled.
draws:
  guards:
    available:
      check: record.on_hold != true
      message: This container is on hold. Clear its hold with a reason before taking material.
    identified:
      check: record.contents != null
      message: Identify the contents before taking material.
rules:
  hold_explained:
    when: record.on_hold == true
    check: record.hold_reason != null && size(record.hold_reason) > 0
    message: Give a reason for withdrawing this container.
    fields: [hold_reason]
display:
  title: "{{ name or hrid }}"
