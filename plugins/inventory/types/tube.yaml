# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: Tube
label: Tube
label_plural: Tubes
extends: Container
schema_version: 2
description: >-
  A barcoded tube of liquid from one record, measured by volume. A draw needs its
  code scanned first. Its contents determine the draw restrictions that apply at
  the bench.
hrid: { prefix: TUB }
amount:
  unit: uL
  label: Volume
  description: How much is left in the tube.
  concentration: concentration
  material: contents
  follows: [contents]
storage:
  barcode: barcode
  confirm: [draw]
fields:
  concentration:
    type: quantity
    unit: mg/mL
    min: 0
    description: Mass per unit volume, when known.
display:
  title: "{{ name or hrid }}"
