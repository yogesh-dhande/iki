apiVersion: iki/v1
kind: ActionTest
name: wi38_from_atcc
description: >-
  A catalogue excerpt from https://www.cellosaurus.org/CVCL_0579.txt, with
  the supplier's reference from https://www.atcc.org/products/ccl-75.
action: import_parental_line
params:
  file: { $file: catalogue }
  supplier: ATCC
  catalogue_id: CCL-75
files: { catalogue: tests/data/wi-38.txt }
expect:
  output:
    creates:
      - type: iki/cell_lines.ParentalLine
        key: line
        values: { name: WI-38, catalogue: cellosaurus, cellosaurus_id: CVCL_0579 }
        origin: { source: Cellosaurus, id: CVCL_0579 }
      - type: iki/cell_lines.CellLineSource
        values: { supplier: ATCC, catalogue_id: CCL-75, line: { $create: line } }
---
apiVersion: iki/v1
kind: ActionTest
name: wi38_from_coriell
description: The same Cellosaurus accession has another supplier's catalogue number.
action: import_parental_line
params:
  file: { $file: catalogue }
  supplier: Coriell
  catalogue_id: AG06814-J
files: { catalogue: tests/data/wi-38.txt }
expect:
  output:
    creates:
      - type: iki/cell_lines.ParentalLine
        key: line
        values: { name: WI-38, catalogue: cellosaurus, cellosaurus_id: CVCL_0579 }
      - type: iki/cell_lines.CellLineSource
        values: { supplier: Coriell, catalogue_id: AG06814-J, line: { $create: line } }
---
apiVersion: iki/v1
kind: ActionTest
name: wrong_supplier
description: A catalogue number from a different provider cannot be attributed to ATCC.
action: import_parental_line
params:
  file: { $file: catalogue }
  supplier: ATCC
  catalogue_id: AG06814-J
files: { catalogue: tests/data/wi-38.txt }
expect:
  error: The supplier and catalogue ID do not occur together in this record.
---
apiVersion: iki/v1
kind: ActionTest
name: wi38_line_only
description: >-
  Material from a collaborator has no supplier catalogue number, so the line is
  registered alone.
action: import_parental_line
params:
  file: { $file: catalogue }
files: { catalogue: tests/data/wi-38.txt }
expect:
  output:
    creates:
      - type: iki/cell_lines.ParentalLine
        key: line
        values: { name: WI-38, catalogue: cellosaurus, cellosaurus_id: CVCL_0579 }
        origin: { source: Cellosaurus, id: CVCL_0579 }
---
apiVersion: iki/v1
kind: ActionTest
name: supplier_without_catalogue_number
description: A supplier is checked against the record only with its catalogue number.
action: import_parental_line
params:
  file: { $file: catalogue }
  supplier: ATCC
files: { catalogue: tests/data/wi-38.txt }
expect:
  error: Give both the supplier and its catalogue ID, or neither.
