apiVersion: iki/v1
kind: Action
name: import_parental_line
label: Register a parental line from Cellosaurus
description: >-
  Reads one Cellosaurus text record and checks that the supplier and catalogue
  number on the project's material appear together among its cross-references.
params:
  file: { type: file, required: true, media_types: [text/plain], max_size: 2MiB }
  supplier: { type: string, required: true, max_length: 128 }
  catalogue_id: { type: string, required: true, max_length: 128 }
effects:
  creates: [{ type: ParentalLine }, { type: CellLineSource }]
runs_on: { tier: backend, environment: cell-line-tools }
command: [python, ./scripts/import_cellosaurus.py]
deterministic: true
timeout: 5m
