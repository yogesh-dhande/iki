apiVersion: iki/v1
kind: EntityType
name: CellCulture
label: Cell culture
schema_version: 1
sample: true
description: A thaw or one subculture, with its recorded date, passage and applicable bank checks.
hrid: { prefix: CUL }
fields:
  event: { type: enum, required: true, immutable: true, values: [thaw, passage] }
  event_on: { type: date, required: true, immutable: true, indexed: true }
  passage_number: { type: int, required: true, immutable: true, min: 0 }
  bank: { type: ref, to: CellBank, required: true, immutable: true }
  vial: { type: ref, to: CellVial, immutable: true, label: Thawed vial }
  parent_culture: { type: ref, to: CellCulture, immutable: true }
  str_check: { type: ref, to: CellCheck, immutable: true, label: STR authentication }
  mycoplasma_check: { type: ref, to: CellCheck, immutable: true }
rules:
  origin:
    check: >-
      record.event == "thaw" ?
      record.vial != null && record.parent_culture == null :
      record.parent_culture != null && record.vial == null
    message: A thaw starts with a vial. A passage starts with one prior culture.
    fields: [vial, parent_culture]
  thaw_once:
    unique: [event, vial]
    while: { event: [thaw] }
    message: This vial already has a thaw record in the project.
  thaw_from_bank:
    when: record.event == "thaw"
    check: >-
      record.vial.bank == record.bank.id && record.event_on >= record.bank.banked_on &&
      record.passage_number == record.bank.passage_number
    message: Use the vial's bank and its frozen passage number, on or after its banking date.
    fields: [bank, vial, event_on, passage_number]
  next_passage:
    when: record.event == "passage"
    check: >-
      record.parent_culture.bank == record.bank.id &&
      record.event_on >= record.parent_culture.event_on &&
      record.passage_number == record.parent_culture.passage_number + 1
    message: A passage keeps its parent's bank, follows it in date and increments passage by one.
    fields: [parent_culture, bank, event_on, passage_number]
  applicable_str:
    when: record.str_check != null
    check: >-
      record.str_check.kind == "str_authentication" && record.str_check.bank == record.bank.id &&
      record.str_check.checked_on <= record.event_on &&
      (record.str_check.due_on == null || record.event_on <= record.str_check.due_on) &&
      record.str_check.review in ["accepted", "signed_off", "released"]
    message: Select a final STR check for this bank that covers the culture date.
    fields: [str_check]
  applicable_mycoplasma:
    when: record.mycoplasma_check != null
    check: >-
      record.mycoplasma_check.kind == "mycoplasma" && record.mycoplasma_check.bank == record.bank.id &&
      record.mycoplasma_check.checked_on <= record.event_on &&
      (record.mycoplasma_check.due_on == null || record.event_on <= record.mycoplasma_check.due_on) &&
      record.mycoplasma_check.review in ["accepted", "signed_off", "released"]
    message: Select a final mycoplasma check for this bank that covers the culture date.
    fields: [mycoplasma_check]
display:
  title: "{{ hrid }} · {{ event }} P{{ passage_number }}"
