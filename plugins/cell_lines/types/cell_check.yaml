# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: CellCheck
label: Cell bank check
schema_version: 4
description: >-
  One test of one bank, such as STR authentication, mycoplasma or sterility, with the
  testing laboratory's result and report. A culture can cite the final check that
  applied to it, even after the bank has been tested again.
hrid: { prefix: CCK }
fields:
  bank:
    type: ref
    to: CellBank
    required: true
    immutable: true
    description: The bank represented by the material tested.
  kind:
    type: enum
    label: Test
    values:
      [str_authentication, mycoplasma, sterility, species_identity, karyotype, viral_testing, other]
    required: true
    immutable: true
    indexed: true
    description: >-
      STR authentication or species identity compares the material with a reference.
      Mycoplasma, sterility and viral testing look for contamination. Choose Other for
      a test from the lab's own list of bank tests.
  lab_test:
    type: ref
    to: CellCheckTest
    label: Lab's test
    immutable: true
    indexed: true
    description: >-
      For a check of kind Other, the test from the lab's list, such as endotoxin. The
      list's curators add the lab's tests to it, each with the kind of result it gives.
  checked_on:
    type: date
    label: Test date
    required: true
  due_on:
    type: date
    label: Next check due
    description: >-
      The repeat date the lab assigned for this bank and test, if any. A culture
      can cite the check only up to this date.
  method:
    type: string
    max_length: 240
    required: true
    description: Method or report reference used by the testing laboratory.
  result:
    type: enum
    values: [match, mismatch, positive, negative, conforms, does_not_conform, inconclusive]
    required: true
    indexed: true
    description: >-
      Match or mismatch against a reference, positive or negative for contamination,
      or whether the result conforms to the lab's acceptance criterion. Any test may
      be inconclusive.
  report:
    type: file
    media_types: [application/pdf, text/csv, text/plain, image/png, image/jpeg]
    max_size: 50MiB
    description: The original testing laboratory report or profile comparison.
  review:
    type: state
    label: Review
    initial: recorded
    states:
      recorded:
        label: Recorded
        set_by: [analyst, reviewer, qa]
        reason: required
        guards:
          before_release:
            check: state.from == "submitted" || state.from == "reviewed"
            message: A submitted or reviewed check can be returned for correction.
      accepted:
        label: Accepted
        description: >-
          Final as recorded, without an electronic signature, for a project whose
          procedure needs none. The attached report is the evidence.
        set_by: [recorder]
        locks: true
        guards:
          recorded_check:
            check: state.from == "recorded" && last.review.submitted == null
            message: Accept a recorded check before any regulated submission.
          report_attached:
            check: record.report != null
            message: Attach the testing laboratory's report before accepting the check.
      signed_off:
        label: Signed off
        description: The research signer attests to the recorded result.
        set_by: [research_signer]
        locks: true
        signatures:
          - meaning: approval
            statement: I sign off this research check as recorded.
        guards:
          research_check:
            check: state.from == "recorded" && last.review.submitted == null
            message: Research sign-off is available for a recorded check before a regulated submission.
      submitted:
        label: Submitted
        description: The analyst signed the result for independent review.
        set_by: [analyst]
        locks: true
        signatures:
          - meaning: authorship
            statement: I recorded this bank check as observed.
        guards:
          recorded:
            check: state.from == "recorded"
            message: Submit the recorded check for review.
      reviewed:
        label: Independently reviewed
        set_by: [reviewer]
        locks: true
        signatures:
          - meaning: review
        guards:
          submitted:
            check: state.from == "submitted"
            message: Review the check after its analyst signs the submission.
          independent_reviewer:
            check: history.review[0].by != actor.person && last.review.submitted.by != actor.person
            message: Someone other than the creator and submitting analyst must review this check.
          independent_of_edits:
            check: edits.review.recorded.all(e, e.by != actor.person)
            message: Someone other than an editor of this check in the current review cycle must review it.
      released:
        label: Released by QA
        description: QA has signed the reviewed result for reporting, whatever the test found.
        set_by: [qa]
        locks: true
        signatures:
          - meaning: approval
            label: QA release
            statement: I release the reviewed bank check as reported.
        guards:
          reviewed:
            check: state.from == "reviewed" && last.review.reviewed.from == "submitted"
            message: Release the submitted check after its independent review.
          independent_of_review:
            check: last.review.reviewed.by != actor.person
            message: Someone other than the reviewer must release this check.
          independent_of_analyst:
            check: history.review[0].by != actor.person && last.review.submitted.by != actor.person
            message: Someone other than the creator and submitting analyst must release this check.
          independent_of_edits:
            check: edits.review.recorded.all(e, e.by != actor.person)
            message: Someone other than an editor of this check in the current review cycle must release it.
due: due_on
rules:
  result_for_test:
    label: Result belongs to the test
    check: >-
      record.result == "inconclusive" ||
      (record.kind in ["str_authentication", "species_identity"] && record.result in ["match", "mismatch"]) ||
      (record.kind in ["mycoplasma", "sterility", "viral_testing"] && record.result in ["positive", "negative"]) ||
      (record.kind == "karyotype" && record.result in ["conforms", "does_not_conform"]) ||
      (record.kind == "other" && (
        (record.lab_test.result_family == "identity" && record.result in ["match", "mismatch"]) ||
        (record.lab_test.result_family == "contamination" && record.result in ["positive", "negative"]) ||
        (record.lab_test.result_family == "conformance" && record.result in ["conforms", "does_not_conform"])))
    message: >-
      Record match or mismatch for an identity test, positive or negative for a
      contamination test, conforms or does not conform for a karyotype or a test with an
      acceptance criterion, or inconclusive.
    fields: [result]
  lab_test_for_other:
    label: Other tests are the lab's
    check: '(record.kind == "other") == (record.lab_test != null)'
    message: Choose the lab's test for a check of kind Other, and only then.
    fields: [lab_test]
  existing_bank:
    label: Bank exists on test date
    check: record.checked_on >= record.bank.banked_on
    message: The test date must be on or after the date the bank was made.
    fields: [checked_on]
  next_check_after_test:
    label: Repeat date on or after test date
    when: record.due_on != null
    check: record.due_on >= record.checked_on
    message: The next check is due on or after this test.
    fields: [due_on]
display:
  title: "{{ kind }} · {{ result }} ({{ checked_on }})"
