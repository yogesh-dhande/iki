apiVersion: iki/v1
kind: EntityType
name: CellVial
label: Banked cell vial
extends: iki/inventory.Tube
schema_version: 3
sample: true
description: >-
  One barcoded vial from a cell bank, placed in an Iki storage box. Its contents
  are its bank, chosen once.
hrid: { prefix: CVL }
refines:
  contents: { to: CellBank }
rules:
  banked:
    check: record.contents != null
    message: Select the vial's bank as its contents.
    fields: [contents]
