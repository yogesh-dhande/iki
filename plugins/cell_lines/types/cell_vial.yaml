apiVersion: iki/v1
kind: EntityType
name: CellVial
label: Banked cell vial
extends: iki/inventory.Tube
schema_version: 2
sample: true
description: One barcoded vial from a cell bank, placed in an Iki storage box.
hrid: { prefix: CVL }
fields:
  bank: { type: ref, to: CellBank, required: true, immutable: true }
rules:
  bank_contents:
    check: record.contents != null && record.contents.id == record.bank.id
    message: Identify the vial's bank as its contents.
    fields: [contents, bank]
