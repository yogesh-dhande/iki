apiVersion: iki/v1
kind: Action
name: import_result
label: Import sequencing result
description: Select one sample's VCF or gene counts, or import immunoglobulin annotations from an AIRR rearrangement TSV.
inputs:
  library: { type: iki/sequencing.SequencingLibrary }
  run: { type: iki/sequencing.SequencingRun, optional: true }
  material:
    type: iki/core.Entity
    optional: true
    description: For VCF, select the strain or cell line from which the library sample came.
  antibodies:
    type: iki/antibody.Antibody
    cardinality: many
    optional: true
    max: 100
    description: Registered antibodies named in the rearrangement associations.
params:
  format:
    type: enum
    values: [vcf, counts, airr]
    required: true
  report:
    type: file
    label: Pipeline report
    required: true
    max_size: 2GiB
    media_types:
      [
        text/plain,
        text/tab-separated-values,
        text/x-vcf,
        application/gzip,
        application/octet-stream,
      ]
  tool: { type: string, label: Pipeline or tool, required: true, max_length: 120 }
  tool_version: { type: string, label: Pipeline or tool version, required: true, max_length: 120 }
  reference:
    type: string
    label: Reference build and annotation
    max_length: 250
    description: Supply the accession and version used for the VCF or RNA counts.
  column:
    type: string
    label: Sample column
    max_length: 500
    description: Type the header of the sample to import when a VCF or counts TSV has multiple samples.
  repertoire_id:
    type: string
    label: AIRR repertoire ID
    max_length: 250
    description: Choose one repertoire when the AIRR file contains several.
  antibody_matches:
    type: text
    max_length: 20000
    description: One AIRR sequence_id and registered antibody HRID per line, separated by a tab.
effects:
  creates: [{ type: SequencingAnalysisResult, derived_from: [library, run, material, antibodies] }]
runs_on: { tier: backend, environment: analysis-tools }
command: [python, ./scripts/import_result.py]
artifacts: { keep: [selected.tsv] }
deterministic: true
timeout: 30m
