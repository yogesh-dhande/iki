apiVersion: iki/v1
kind: Action
name: assign_dilution_series
label: Assign a dilution series
description: >-
  Lay out decreasing concentrations of one sample along a row or column. Replicates
  occupy parallel rows or columns. All wells must be free and on the plate.
inputs:
  plate: { type: AssayPlate, schema_version: ">=1" }
  sample: { type: iki/core.Entity, schema_version: ">=1" }
params:
  start_well: { type: string, required: true, label: First well }
  direction: { type: enum, values: [across, down], default: across }
  start_concentration: { type: float, required: true, min: 0 }
  concentration_unit: { type: enum, values: [nM, uM, mM, M], default: nM }
  fold_dilution: { type: float, default: 2, min: 1 }
  steps: { type: int, min: 1, max: 24, required: true, label: Number of concentrations }
  replicates: { type: int, min: 1, max: 24, default: 1 }
effects:
  updates: { plate: { fields: [assignments, preview] } }
runs_on: { tier: backend, environment: assay-tools }
command: [python, ./scripts/dilution_series.py]
deterministic: true
timeout: 2m
