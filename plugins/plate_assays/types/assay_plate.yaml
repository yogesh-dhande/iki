apiVersion: iki/v1
kind: EntityType
name: AssayPlate
label: Assay plate
schema_version: 5
hrid: { prefix: APL }
description: >-
  A physical plate: the samples, dilution series and controls assigned to its wells, and
  the reader exports committed against that layout, one read per export.
fields:
  procedure: { type: string, max_length: 200, label: Analytical procedure ID }
  procedure_revision: { type: string, max_length: 80, label: Procedure revision }
  name: { type: string, required: true, max_length: 200 }
  size: { type: enum, values: [plate_96, plate_384], required: true }
  reader_format:
    type: enum
    label: Reader file format
    required: true
    default: bmg_mars_absorbance
    values: [bmg_mars_absorbance, iki_plate_matrix]
    description: >-
      The format of the reader file: a BMG LABTECH MARS absorbance endpoint export in OD, or
      Iki's plate matrix of normalized activity (%).
  reader_file:
    type: file
    media_types: [text/csv, text/plain, application/vnd.ms-excel]
    max_size: 1MiB
    description: >-
      The export of the read to preview and commit next. After a commit, attach the next
      read's export to add another read of the same plate.
  request:
    type: ref
    to: iki/requests.Request
    description: The analytical request these measurements will answer, when the plate is run for a requester.
  reagent_tube:
    type: ref
    to: iki/inventory.Tube
    immutable: true
    description: The tube of reagent used for this plate.
  assignments:
    type: list
    label: Well assignments
    max_items: 384
    items:
      type: row
      fields:
        well: { type: string, required: true, max_length: 4 }
        sample: { type: ref, to: iki/core.Entity }
        control: { type: string, max_length: 100 }
        replicate: { type: int, min: 1, max: 384, default: 1, required: true }
        concentration: { type: float, min: 0 }
        concentration_unit: { type: enum, values: [nM, uM, mM, M] }
  preview:
    {
      type: json,
      computed: true,
      description: The well join and its problems for this layout and reader file.,
    }
  committed:
    { type: bool, computed: true, description: "A read is committed, so the layout is fixed." }
  committed_layout:
    type: json
    computed: true
    description: The size, assignments, procedure and request the plate's reads were joined to.
  committed_reads:
    type: json
    computed: true
    description: The reader file and content digest of each committed read, in commit order.
display: { title: "{{ name }}" }
rules:
  committed_source:
    label: A committed plate retains its layout
    when: record.committed == true
    check: >-
      record.committed_layout != null &&
      record.size == record.committed_layout.size &&
      record.assignments == record.committed_layout.assignments &&
      record.procedure == record.committed_layout.procedure &&
      record.procedure_revision == record.committed_layout.procedure_revision &&
      (record.request == null ? record.committed_layout.request == null :
       record.request.id == record.committed_layout.request)
    fields: [size, assignments, request, procedure, procedure_revision]
    message: Measurements for this layout have been committed. Start a new plate for a corrected layout.
