apiVersion: iki/v1
kind: EntityType
name: PlateRead
label: Committed plate read
schema_version: 4
hrid: { prefix: PRD }
description: >-
  One read of a plate: its reader file, the format it was read in and the measurement records
  committed together for the plate's layout.
fields:
  procedure: { type: string, computed: true, max_length: 200, label: Analytical procedure ID }
  procedure_revision: { type: string, computed: true, max_length: 80, label: Procedure revision }
  plate: { type: ref, to: AssayPlate, required: true, immutable: true }
  name: { type: string, computed: true, max_length: 200 }
  import_key:
    type: string
    computed: true
    indexed: true
    unique: true
    max_length: 36
    description: >-
      A name-based UUID of the plate ID and the reader file's content digest. The same export commits to a
      plate once, including when commits race or requests overlap.
  reader_format:
    type: string
    computed: true
    max_length: 100
    label: Reader file format
    description: The format and its version the file was read in, such as bmg_mars_absorbance/1.
  acquisition:
    type: json
    computed: true
    description: The export header's own run identification, verbatim, such as its test name, run number, date and time.
  plate_revision: { type: int, min: 1, computed: true }
  reader_file: { type: file, computed: true }
  request: { type: ref, to: iki/requests.Request, computed: true }
  measurements:
    { type: list, items: { type: ref, to: WellMeasurement }, max_items: 384, computed: true }
display: { title: "{{ name or hrid }}" }
