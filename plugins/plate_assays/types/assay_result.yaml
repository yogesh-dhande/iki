apiVersion: iki/v1
kind: EntityType
name: AssayResult
schema_version: 4
label: Assay result
hrid: { prefix: AR }
description: >-
  A dose-response result: an IC50 or EC50 fitted to one sample's committed readings by a
  named method, recorded in fit_version. Other analyses of a plate read are their own types.
fields:
  procedure: { type: string, computed: true, max_length: 200, label: Analytical procedure ID }
  procedure_revision: { type: string, computed: true, max_length: 80, label: Procedure revision }
  read: { type: ref, to: PlateRead, required: true, immutable: true }
  sample: { type: ref, to: iki/core.Entity, required: true, immutable: true }
  measurements:
    { type: list, items: { type: ref, to: WellMeasurement }, max_items: 384, computed: true }
  points:
    type: json
    computed: true
    description: Measured points including the pinned reading revision, dose, response and any exclusion with its author and reason.
  channel: { type: string, computed: true, max_length: 100 }
  response_unit: { type: enum, computed: true, values: [AU, percent] }
  concentration_unit: { type: enum, values: [nM, uM, mM, M], computed: true }
  endpoint_kind: { type: enum, values: [IC50, EC50], computed: true }
  endpoint_value: { type: float, computed: true }
  ci_low: { type: float, computed: true, label: Lower 95% confidence limit }
  ci_high: { type: float, computed: true, label: Upper 95% confidence limit }
  ci_method: { type: string, computed: true, max_length: 200 }
  bottom: { type: float, computed: true }
  top: { type: float, computed: true }
  hill_slope: { type: float, computed: true }
  normalization: { type: string, computed: true, max_length: 100 }
  fit_version:
    type: string
    computed: true
    max_length: 100
    label: Fit method
    description: >-
      The fit method's name and version, such as 4PL-OLS/1. A lab's own plugin may record a
      locally qualified method under its own name.
  fit_reason: { type: text, computed: true }
  fit_status: { type: enum, computed: true, values: [fitted, unreportable] }
  qualifier:
    { type: enum, computed: true, values: [within_range, above_range, below_range, unavailable] }
  point_count: { type: int, computed: true, min: 0 }
  notes: { type: text, description: Interpretation and review notes. }
# Reviewed under the procedure its project chose, pinned as the fit is recorded (ADR 0302).
review:
  needs:
    final: [signed_off, released]
    locks: signed
  guards:
    recorded_fit:
      on: [signed]
      check: record.fit_status != null && record.fit_version != null
      message: Sign a recorded fit, with its method.
  statements:
    signed_off: I checked the measurements, exclusions and reported fit.
display: { title: "{{ endpoint_kind or hrid }} · {{ fit_status or 'recorded' }}" }
