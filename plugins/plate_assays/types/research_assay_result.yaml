apiVersion: iki/v1
kind: EntityType
name: ResearchAssayResult
label: Research assay result
extends: AssayResult
schema_version: 1
hrid: { prefix: RAR }
fields:
  review:
    type: state
    initial: recorded
    states:
      recorded: { label: Recorded }
      signed:
        label: Signed off
        set_by: [reviewer]
        locks: true
        signatures:
          [
            {
              meaning: review,
              statement: "I checked the measurements, exclusions and reported fit.",
            },
          ]
        guards:
          recorded_fit:
            check: state.from == "recorded" && record.review_flow == "research" && record.fit_status != null && record.fit_version != null
            message: Sign the recorded fit produced under the research review flow.
