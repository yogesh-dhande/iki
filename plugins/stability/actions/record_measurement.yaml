apiVersion: iki/v1
kind: Action
name: record_measurement
label: Record stability measurement
description: Record a planned test on a completed pull with the study's reporting unit and pinned method.
inputs:
  pull: { type: Pull, schema_version: ">=1", include: [study] }
params:
  test:
    type: string
    max_length: 100
    required: true
    description: The test or attribute from the study protocol.
  value: { type: float, description: A numeric test's observed value. }
  result:
    type: enum
    label: Conforms
    values: [conforms, does_not_conform]
    description: For a test that conforms or doesn't, which it did.
  observation:
    type: text
    max_length: 2000
    description: What was seen, such as the solution's colour.
  report:
    type: file
    label: Test report
    media_types: [application/pdf, text/csv, text/plain]
    max_size: 50MiB
  notes: { type: text, max_length: 4000 }
effects:
  creates: [{ type: Measurement, derived_from: [pull] }]
runs_on: { tier: backend, environment: stability-tools }
command: [python, ./scripts/stability.py, measure]
