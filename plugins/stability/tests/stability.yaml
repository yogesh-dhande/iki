apiVersion: iki/v1
kind: ActionTest
name: schedule_a_public_long_term_condition
description: The general-case long-term storage condition is from ICH Q1A(R2) §2.1.7.1. Dates, tube and window are synthetic scheduling fixtures.
action: schedule_pulls
settings: { review_flow: regulated_qc }
inputs:
  study:
    - values:
        name: Synthetic stability study
        material: 00000000-0000-7000-8003-000000000011
        starts_on: "2028-01-31"
        owner: 00000000-0000-7000-8003-000000000013
        conditions:
          - {
              code: long_term,
              label: Long term,
              temperature: 25,
              temperature_tolerance: 2,
              humidity: 60,
              humidity_tolerance: 5,
            }
        time_points: [{ code: M1, interval: 1, unit: month, days_before: 2, days_after: 3 }]
        assignments:
          - { condition: long_term, time_point: M1, replicate: 1, amount: 12, amount_unit: uL }
        tests: [{ test: Demo peak area, method: Synthetic method v1, unit: AU }]
      included:
        lot:
          - type: iki/lots.GenericLot
            values: { of: 00000000-0000-7000-8003-000000000011 }
        assignments.tube:
          # The harness allocates the study and the included lot the first two IDs.
          - values: { contents: 00000000-0000-7000-8003-000000000002 }
expect:
  output:
    updates:
      study:
        - require_unchanged: true
          values: { scheduled: true, review_flow: regulated_qc }
    creates:
      - type: iki/stability.Pull
        values:
          time_point: M1
          interval: 1
          interval_unit: month
          elapsed_days: 29
          replicate: 1
          tests: [Demo peak area]
          condition_label: Long term
          amount: 12
          amount_unit: uL
          study_revision: 1
          opens_on: "2028-02-27"
          due_on: "2028-02-29"
          closes_on: "2028-03-03"
---
apiVersion: iki/v1
