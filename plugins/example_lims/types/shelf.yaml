# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: Shelf
label: Shelf
label_plural: Shelves
schema_version: 1
description: A shelf of a freezer, holding racks and boxes (ADR 0180).
hrid: { prefix: SHF }
storage:
  holds: [Rack, Box]
fields:
  name:
    type: string
    required: true
    max_length: 100
    description: Such as "Shelf 2".
display:
  title: "{{ name }}"
