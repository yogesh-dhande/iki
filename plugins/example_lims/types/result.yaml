# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: Result
label: Result
schema_version: 1
description: >-
  What an assay measured in an aliquot. One on hold mustn't be reported or
  used, until someone takes it off hold, saying why.
hrid: { prefix: RES }
fields:
  aliquot:
    type: ref
    to: Aliquot
    required: true
    immutable: true
    description: The aliquot it was measured in.
  assay:
    type: string
    required: true
    max_length: 120
    indexed: true
    description: What was measured, and how.
  value:
    type: float
    description: What it measured.
  unit:
    type: string
    max_length: 32
  on_hold:
    type: bool
    label: On hold
    indexed: true
    reason_on_clear: true
    description: >-
      It mustn't be reported or used, as `hold_reason` says. Give a reason when clearing the hold.
  hold_reason:
    type: text
    label: Why it's on hold
display:
  title: "{{ assay }}"
