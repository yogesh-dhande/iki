# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: CoreFacilityRequest
label: Core facility request
abstract: true
extends: AnalysisRequest
schema_version: 1
description: >-
  A request for protein production or sequencing. It uses the facility queue,
  assignments, and tube receipt of an analysis request.
fields:
  facility_service:
    type: enum
    label: Service requested
    values: [protein_production, sequencing]
    required: true
    immutable: true
    indexed: true
  requested_mass:
    type: quantity
    label: Requested protein mass
    unit: mg
    min: 0
    immutable: true
  sequencing_method:
    type: enum
    label: Sequencing method
    values: [sanger, short_read, long_read]
    immutable: true
rules:
  production_scope:
    when: record.facility_service == "protein_production"
    check: record.protein != null && record.requested_mass != null && record.requested_mass > 0
    message: Name the protein and give a positive requested mass.
    fields: [protein, requested_mass]
  sequencing_scope:
    when: record.facility_service == "sequencing"
    check: record.sequencing_method != null && record.tubes != null && size(record.tubes) > 0
    message: Choose a sequencing method and name the tubes the facility will receive.
    fields: [sequencing_method, tubes]
  only_requested_service:
    check: >-
      record.facility_service == "protein_production" ? record.sequencing_method == null :
      record.requested_mass == null
    message: Give only the protein mass or sequencing method for the selected service.
    fields: [requested_mass, sequencing_method]
