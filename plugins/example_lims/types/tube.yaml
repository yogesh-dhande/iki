# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: Tube
label: Tube
label_plural: Tubes
schema_version: 1
description: >-
  A tube of a sample or a lot, kept at a position in a box (ADR 0180). Its
  volume is drawn at the bench, each draw saying what it went into. Its
  sample's and lot's holds apply to it: a tube of an expired lot gives none,
  and one of a lot due for retest only to QA sampling. Its barcode is scanned
  before each draw, so it's the right tube.
hrid: { prefix: TUB }
amount:
  unit: uL
  label: Volume
  description: How much is left in the tube.
  concentration: concentration
  follows: [lot, sample]
storage:
  barcode: barcode
  confirm: [draw]
fields:
  name:
    type: string
    max_length: 40
    description: >-
      Its short name, as written on its label, such as "mAb-17 2 mg/mL".
  barcode:
    type: string
    max_length: 64
    unique: true
    indexed: true
    description: The 2D code on its base or label, if it has one; its HRID otherwise.
  sample:
    type: ref
    to: Sample
    description: The sample it holds, if it's of one.
  lot:
    type: ref
    to: iki/lots.Lot
    description: The lot it was aliquoted from, whose expiry and retest dates apply to it.
  concentration:
    type: quantity
    unit: mg/mL
    min: 0
    description: How much protein each volume holds.
  prepared_on:
    type: date
    label: Prepared
    description: When it was filled.
  # Its box, position, volume and whether it was stored, as fields, before where it is
  # was kept by Iki and its volume as its amount: one ledger, never below zero.
  box: { type: ref, to: Box, removed: true }
  position: { type: string, removed: true }
  volume: { type: quantity, unit: uL, removed: true }
  stored: { type: bool, removed: true }
display:
  title: "{{ name or hrid }}"
