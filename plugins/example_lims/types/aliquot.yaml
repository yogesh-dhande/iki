# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: Aliquot
label: Aliquot
schema_version: 2
# Its records are samples (ADR 0177): a project's Files finds files by them.
sample: true
description: >-
  A portion of a sample, in a tube or well of its own, which an assay uses.
  One on hold mustn't be used, until someone takes it off hold, saying why.
hrid: { prefix: ALQ }
# How much of it there is (ADR 0139): drawn by an assay, never below zero.
amount: { unit: uL, label: Volume }
fields:
  sample:
    type: ref
    to: Sample
    required: true
    immutable: true
    description: The sample it was taken from.
  location:
    type: string
    max_length: 120
    indexed: true
    description: Where it's kept, such as a freezer, rack and position.
  on_hold:
    type: bool
    label: On hold
    indexed: true
    reason_on_clear: true
    description: It mustn't be used, as `hold_reason` says. Give a reason when clearing the hold.
  hold_reason:
    type: text
    label: Why it's on hold
