# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: AnalysisRequest
label: Analysis request
schema_version: 1
description: >-
  A project's request to an analytical core to characterize samples of a
  protein (ADR 0132). The project asking writes what it wants and sends it to
  a core that takes analysis requests from it; the core then reads the request
  and its samples, and nothing else of the project's. The core accepts it,
  schedules it, names its analyst and delivers it; its results come back as
  analysis results its QA releases.
hrid: { prefix: REQ }
# The core's: where the work is, how urgent, when, who, and its notes. Every other
# field is the asking project's.
request:
  service_fields: [status, priority, scheduled_on, analyst, core_notes]
  sends: [samples, protein]
fields:
  title:
    type: string
    required: true
    max_length: 200
    description: What it's for, such as "Lot 12 release testing".
  protein:
    type: ref
    to: iki/protein.Protein
    description: The protein its samples are of.
  samples:
    type: list
    items: { type: ref, to: Sample }
    max_items: 50
    description: The samples to test. Each goes to the core with the request.
  analyses:
    type: list
    items: { type: enum, values: [sec_purity, intact_mass, peptide_map, endotoxin] }
    max_items: 4
    description: What to measure.
  needed_by:
    type: date
    label: Needed by
    description: When the project needs the results, which My work sorts by.
  instructions:
    type: text
    description: How to handle the samples, and anything the core should know.
  standing:
    type: state
    label: Standing
    initial: open
    description: Whether the project asking still wants it. Its own coordinators set it.
    states:
      open: { label: Open, set_by: [coordinator] }
      withdrawn:
        label: Withdrawn
        description: The project no longer needs it; the core stops work on it.
        set_by: [coordinator]
        reason: required
  # The core's.
  status:
    type: state
    label: Status
    initial: submitted
    description: >-
      Where the work is, at the core. Its people set it, with the lab roles
      they hold in the core's project.
    states:
      submitted:
        label: Submitted
        description: Sent, and waiting for the core.
        set_by: [coordinator]
      accepted:
        label: Accepted
        description: The core will do it, and schedules it.
        set_by: [coordinator]
      in_progress:
        label: In progress
        description: Its analyst is testing its samples.
        set_by: [analyst]
      delivered:
        label: Delivered
        description: Its results are released back to the project that asked.
        set_by: [reviewer, qa]
        locks: true
      declined:
        label: Declined
        description: The core won't do it, and says why.
        set_by: [coordinator]
        reason: required
  priority:
    type: enum
    values: [routine, urgent]
    default: routine
    description: How soon the core does it, which it decides.
  scheduled_on:
    type: date
    label: Scheduled
    description: When the core plans to run it.
  analyst:
    type: person
    role: analyst
    assignment: { field: status, states: [accepted, in_progress] }
    description: >-
      Who at the core does it: someone with the Analyst role in its project.
      Accepted requests nobody has are open to its analysts.
  core_notes:
    type: text
    label: Core notes
    description: What the core says about it.
display:
  title: "{{ title }}"
due: needed_by
