# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: Sample
label: Sample
schema_version: 1
description: >-
  A sample of a protein, as the lab tests it: received, tested by an analyst,
  reviewed by another, then released by QA. Once it's approved its results
  can't change, unless it's sent back or reopened, with a reason.
hrid: { prefix: SAM }
fields:
  protein:
    type: ref
    to: iki/protein.Protein
    required: true
    immutable: true
    description: The protein it's a sample of.
  lot:
    type: string
    label: Lot
    max_length: 64
    indexed: true
    description: The lot or batch it was taken from.
  lims_id:
    type: string
    label: LIMS ID
    max_length: 64
    indexed: true
    unique: true
    link: "https://{settings.lims_host}/samples/{value}"
    description: Its record in the LIMS, when it came from there.
  received_at:
    type: datetime
    label: Received
    description: When the lab received it.
  concentration:
    type: quantity
    unit: mg/mL
    min: 0
    description: Its protein concentration.
  purity:
    type: float
    label: Purity (%)
    min: 0
    max: 100
    description: The share of the main species, by SEC or SDS-PAGE.
  result:
    type: enum
    values: [pass, fail]
    description: Whether it meets its specification.
  notes:
    type: text
    description: What the analyst saw, and anything a reviewer should know.
states:
  registered:
    label: Registered
    initial: true
    description: Logged, and on its way to the lab.
  received:
    label: Received
    description: In the lab, waiting to be tested.
  in_testing:
    label: In testing
    description: An analyst is testing it and recording the results.
  in_review:
    label: In review
    description: Its results wait for a reviewer.
  approved:
    label: Approved
    locks: true
    description: A reviewer checked its results; they can't change now.
  released:
    label: Released
    locks: true
    description: QA released it, so its results can be used.
  rejected:
    label: Rejected
    locks: true
    description: QA rejected it; it's kept, with its results, but not used.
transitions:
  receive:
    label: Receive
    from: [registered]
    to: received
    roles: [analyst]
  start_testing:
    label: Start testing
    from: [received]
    to: in_testing
    roles: [analyst]
  submit:
    label: Submit for review
    from: [in_testing]
    to: in_review
    roles: [analyst]
  approve:
    label: Approve
    from: [in_review]
    to: approved
    roles: [reviewer]
    not_by: [submit]
    description: Someone other than whoever submitted it checks its results.
  send_back:
    label: Send back
    from: [in_review, approved]
    to: in_testing
    roles: [reviewer, qa]
    reason: required
    description: Its results need more work; the analyst sees why.
  release:
    label: Release
    from: [approved]
    to: released
    roles: [qa]
    not_by: [submit, approve]
    reason: optional
    description: Neither its analyst nor its reviewer releases it.
  reject:
    label: Reject
    from: [in_review, approved]
    to: rejected
    roles: [qa]
    not_by: [submit, approve]
    reason: required
  reopen:
    label: Reopen
    from: [released, rejected]
    to: in_testing
    roles: [qa]
    reason: required
    description: For a correction after release; the reason is kept with it.
