# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: Sample
label: Sample
schema_version: 1
description: >-
  A sample of a protein, as the lab tests it: received, tested by an analyst,
  reviewed, then released by QA. Once it's approved its results can't change,
  unless someone with the role sets it back, with a reason. Its analyst,
  reviewer and QA are assigned it in turn, and each has it on My work while
  it's theirs.
hrid: { prefix: SAM }
fields:
  protein:
    type: ref
    to: iki/protein.Protein
    required: true
    immutable: true
    description: The protein it's a sample of.
  lot:
    type: string
    label: Lot
    max_length: 64
    indexed: true
    description: The lot or batch it was taken from.
  lims_id:
    type: string
    label: LIMS ID
    max_length: 64
    indexed: true
    unique: true
    link: "https://{settings.lims_host}/samples/{value}"
    description: Its record in the LIMS, when it came from there.
  received_at:
    type: datetime
    label: Received
    description: When the lab received it.
  concentration:
    type: quantity
    unit: mg/mL
    min: 0
    description: Its protein concentration.
  purity:
    type: float
    label: Purity (%)
    min: 0
    max: 100
    description: The share of the main species, by SEC or SDS-PAGE.
  result:
    type: enum
    values: [pass, fail]
    description: Whether it meets its specification.
  notes:
    type: text
    description: What the analyst saw, and anything a reviewer should know.
  due_on:
    type: date
    label: Due
    description: When its results are due, which My work sorts by.
  # People in records (ADR 0122): each is assigned the sample in its turn.
  analyst:
    type: person
    role: analyst
    assignment: { field: status, states: [received, in_testing] }
    description: Who tests it. Received samples nobody has are open to analysts.
  reviewer:
    type: person
    role: reviewer
    assignment: { field: status, states: [in_review] }
    description: >-
      Who checks its results, named before it's submitted. In review samples
      nobody has are open to reviewers.
  qa:
    type: person
    label: QA
    role: qa
    assignment: { field: status, states: [approved] }
    description: >-
      Who releases or rejects it, named before it's approved: an approved sample
      is locked, its people with it. Approved samples nobody has are open to QA.
  status:
    type: state
    label: Status
    initial: registered
    description: Where it is in testing. Each lab role sets the states that are its own.
    states:
      registered:
        label: Registered
        description: Logged, and on its way to the lab.
        set_by: [coordinator]
        reason: required
      received:
        label: Received
        description: In the lab, waiting to be tested.
        set_by: [coordinator, analyst]
      in_testing:
        label: In testing
        description: An analyst is testing it and recording the results.
        set_by: [analyst, reviewer, qa]
        reason: optional
      in_review:
        label: In review
        description: Its results wait for a reviewer.
        set_by: [analyst]
      approved:
        label: Approved
        description: A reviewer checked its results; they can't change now.
        set_by: [reviewer]
        locks: true
      released:
        label: Released
        description: QA released it, so its results can be used.
        set_by: [qa]
        locks: true
        reason: optional
      rejected:
        label: Rejected
        description: QA rejected it; it's kept, with its results, but not used.
        set_by: [qa]
        locks: true
        reason: required
due: due_on
