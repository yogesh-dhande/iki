# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: Sample
label: Sample
schema_version: 1
description: >-
  A sample of a protein, as the lab tests it: received, tested by an analyst,
  reviewed, then released by QA. Once it's approved its results can't change,
  unless someone with the role sets it back, with a reason. Submitting,
  approving, releasing and rejecting it are electronic signatures (21 CFR Part
  11): each signer signs in again, and the signature shows with the sample.
  Its analyst, reviewer and QA are assigned it in turn, and each has it on My
  work while it's theirs.
  A result outside its specification is recorded as measured, with why,
  and held until QA reviews it.
hrid: { prefix: SAM }
# How much of it there is (ADR 0139): drawn by volume, or by protein mass at its
# concentration, and split into aliquots, each an Aliquot holding its share.
amount:
  unit: uL
  label: Volume
  description: How much of the sample is left.
  display_unit: mL
  concentration: concentration
  aliquots: { type: Aliquot, of: sample }
fields:
  protein:
    type: ref
    to: iki/protein.Protein
    required: true
    immutable: true
    description: The protein it's a sample of.
  donor:
    type: ref
    to: Donor
    immutable: true
    description: >-
      Who it was taken from, for a sample from a person: whose consent covers
      it, and everything made from it.
  lot:
    type: string
    label: Lot
    max_length: 64
    indexed: true
    description: The lot or batch it was taken from.
  lims_id:
    type: string
    label: LIMS ID
    max_length: 64
    indexed: true
    unique: true
    link: "https://{settings.lims_host}/samples/{value}"
    description: Its record in the LIMS, when it came from there.
  received_at:
    type: datetime
    label: Received
    description: When the lab received it.
  concentration:
    type: quantity
    unit: mg/mL
    min: 0
    description: Its protein concentration.
  purity:
    type: float
    label: Purity (%)
    min: 0
    max: 100
    description: The share of the main species, by SEC or SDS-PAGE.
  result:
    type: enum
    values: [pass, fail]
    description: Whether it meets its specification.
  notes:
    type: text
    description: What the analyst saw, and anything a reviewer should know.
  due_on:
    type: date
    label: Due
    description: When its results are due, which My work sorts by.
  # People in records (ADR 0122): each is assigned the sample in its turn.
  analyst:
    type: person
    role: analyst
    assignment: { field: status, states: [received, in_testing] }
    description: Who tests it. Received samples nobody has are open to analysts.
  reviewer:
    type: person
    role: reviewer
    assignment: { field: status, states: [in_review] }
    description: >-
      Who checks its results, named before it's submitted. In review samples
      nobody has are open to reviewers.
  qa:
    type: person
    label: QA
    role: qa
    assignment: { field: status, states: [approved] }
    description: >-
      Who releases or rejects it, named before it's approved: an approved sample
      is locked, its people with it. Approved samples nobody has are open to QA.
  status:
    type: state
    label: Status
    initial: registered
    description: Where it is in testing. Each lab role sets the states that are its own.
    states:
      registered:
        label: Registered
        description: Logged, and on its way to the lab.
        set_by: [coordinator]
        reason: required
        # Nothing's drawn from a sample the lab hasn't received.
        holds_amount: true
      received:
        label: Received
        description: In the lab, waiting to be tested.
        set_by: [coordinator, analyst]
      in_testing:
        label: In testing
        description: An analyst is testing it and recording the results.
        set_by: [analyst, reviewer, qa]
        reason: optional
      in_review:
        label: In review
        description: Its results wait for a reviewer.
        set_by: [analyst]
        # Electronic signatures (21 CFR Part 11): each signer signs in again to give one.
        signatures:
          - meaning: authorship
            statement: I performed these tests and recorded the results as observed.
        guards:
          tested:
            description: It's submitted for review once it's been tested.
            check: state.from == "in_testing"
            message: A sample is submitted for review from In testing.
          has_result:
            check: record.result != null
            message: Record its result, pass or fail, before submitting it for review.
      approved:
        label: Approved
        description: A reviewer checked its results; they can't change now.
        set_by: [reviewer]
        locks: true
        signatures:
          - meaning: review
        guards:
          reviewed:
            description: Only a sample in review is approved.
            check: state.from == "in_review"
            message: A sample is approved from In review.
          four_eyes:
            description: >-
              Whoever submitted it for review doesn't approve it: a second person
              checks the first's work.
            check: last.status.in_review == null || last.status.in_review.by != actor.person
            message: >-
              You submitted it for review, so someone else approves it.
      released:
        label: Released
        description: QA released it, so its results can be used.
        set_by: [qa]
        locks: true
        reason: optional
        signatures:
          - meaning: approval
            label: QA release
            statement: I release this sample for use.
        guards:
          approved:
            description: Only an approved sample is released.
            check: state.from == "approved"
            message: A sample is released once it's approved.
          passed:
            check: record.result == "pass"
            message: Only a sample that passed is released; reject one that failed.
          not_its_approver:
            check: last.status.approved == null || last.status.approved.by != actor.person
            message: You approved it, so someone else in QA releases it.
      rejected:
        label: Rejected
        description: QA rejected it; it's kept, with its results, but not used.
        set_by: [qa]
        locks: true
        reason: required
        holds_amount: true
        signatures:
          - meaning: responsibility
            label: QA rejection
            statement: I reject this sample; it isn't to be used.
        guards:
          reviewed:
            description: QA rejects a sample once it's been reviewed.
            check: state.from == "approved" || state.from == "in_review"
            message: A sample is rejected once it's in review or approved.
due: due_on
# Rules its records keep at every save (ADR 0127). Its specification's limits hold a
# sample that's outside them: it's saved as measured, with why, and QA reviews it. While
# it's held it can't be approved, released or rejected.
rules:
  purity_in_specification:
    label: Purity in specification
    description: At least 95%, by SEC or SDS-PAGE.
    check: record.purity >= 95.0
    message: >-
      Purity {{ record.purity }}% is below its specification, at least 95%.
    hold: { reviewed_by: [qa] }
  concentration_in_specification:
    label: Concentration in specification
    description: From 0.5 to 10 mg/mL.
    check: record.concentration >= 0.5 && record.concentration <= 10.0
    message: >-
      Concentration {{ record.concentration }} mg/mL is outside its
      specification, 0.5 to 10 mg/mL.
    hold: { reviewed_by: [qa] }
  pass_in_specification:
    label: A pass is in specification
    description: A sample whose purity is below its specification doesn't pass.
    check: record.result != "pass" || record.purity >= 95.0
    message: It can't pass with purity {{ record.purity }}%, below its specification.
    fields: [result]
  reviewer_isnt_analyst:
    label: Its reviewer isn't its analyst
    check: record.reviewer != record.analyst
    when: record.reviewer != null && record.analyst != null
    message: Someone other than its analyst reviews it.
    fields: [reviewer]
# What its records tell, and whom (ADR 0129): in Iki and by email, each person only of
# samples they can read, and not of their own changes.
notifications:
  in_review:
    label: Submitted for review
    description: QA hears when an analyst submits a sample's results, to plan its release.
    when: { field: status, to: in_review }
    tell: { roles: [qa], watchers: true }
    message:
      title: "{{ hrid }} is in review"
      body: "{{ protein }}, lot {{ lot or 'not given' }}, tested by {{ analyst or 'nobody named' }}."
  rejected:
    label: Rejected
    description: >-
      Its analyst hears when QA rejects a sample. It's required: a rejection needs
      following up, so nobody can turn it off.
    when: { field: status, to: rejected }
    tell: { fields: [analyst], watchers: true }
    message:
      title: "{{ hrid }} was rejected"
      body: "QA rejected {{ protein }}, lot {{ lot or 'not given' }}. Its history says why."
    required: true
