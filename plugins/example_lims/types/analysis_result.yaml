# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: AnalysisResult
label: Analysis result
schema_version: 1
description: >-
  What an analytical core measured for an analysis request (ADR 0132). The
  core owns it: its analyst records it, a reviewer checks it, and its QA
  releases it, signing for it. Released, it goes back to the project that
  asked, locked, and stays there.
hrid: { prefix: ANR }
result:
  of: request
  released: { field: review, states: [released] }
fields:
  request:
    type: ref
    to: AnalysisRequest
    required: true
    immutable: true
    description: The request it answers.
  sample:
    type: ref
    to: Sample
    description: The sample it's of.
  analysis:
    type: enum
    values: [sec_purity, intact_mass, peptide_map, endotoxin]
    required: true
    description: What was measured.
  purity:
    type: float
    label: Purity (%)
    min: 0
    max: 100
    description: The share of the main species, for a purity analysis.
  measured_mass:
    type: quantity
    unit: u
    display_unit: ku
    min: 0
    description: The intact mass, for a mass analysis.
  result:
    type: enum
    values: [pass, fail]
    description: Whether it meets its specification.
  notes:
    type: text
    description: What the analyst saw, and anything the project should know.
  review:
    type: state
    label: Review
    initial: draft
    description: The core's review of it, before it goes back.
    states:
      draft:
        label: Draft
        description: Its analyst is recording it.
        set_by: [analyst]
      reviewed:
        label: Reviewed
        description: A reviewer checked it.
        set_by: [reviewer]
      released:
        label: Released
        description: QA released it to the project that asked; it can't change now.
        set_by: [qa]
        locks: true
        signatures:
          - meaning: approval
            label: QA release
            statement: I release these results to the project that requested them.
