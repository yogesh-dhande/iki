# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Plugin
name: iki/example_lims
version: 0.8.0
title: Example LIMS
description: >-
  Links each protein to its record in a LIMS: imports the LIMS's proteins
  nightly, updating those Iki already has, and writes Iki's IDs back. It
  tracks donors' samples, aliquots and results, and holds everything derived
  from a donor whose consent is withdrawn. It also books instruments, with a
  calendar of their bookings, tests samples against their specifications, and
  keeps tubes in boxes in racks on freezer shelves, receiving them from
  projects that send them. Its core facilities serve protein production and
  sequencing requests with signed deliverables. A starting point for a
  plugin that connects a real LIMS or ELN.
license: Apache-2.0
homepage: https://ikisci.org/plugins/example_lims
dependencies:
  iki/protein:
    types:
      Protein: ">=1"
  iki/lots:
    types:
      Lot: ">=1"
settings:
  lims_host:
    type: string
    format: hostname
    required: true
    description: >-
      The LIMS's host name, such as lims.example.org. Runs reach it, and only
      it, over HTTPS, and each protein's LIMS ID links to its page there.
roles:
  coordinator:
    label: Coordinator
    description: >-
      Logs samples as they're sent, receives them and the tubes projects send
      the core, and records whether each donor consents, or withdrew their
      consent.
  engineer:
    label: Engineer
    description: >-
      Services and calibrates instruments, and retires them.
  analyst:
    label: Analyst
    description: >-
      Tests samples and records their results, then submits them for review,
      and says when an instrument is out of service.
  reviewer:
    label: Reviewer
    description: >-
      Checks analysts' results, and approves them or sends them back.
  qa:
    label: Sample and result QA
    description: >-
      Releases or rejects approved samples, sends released ones back when they
      need correcting, and says when an instrument's calibration is due.
