apiVersion: iki/v1
kind: Plugin
name: iki/strains
version: 0.1.0
title: Bacterial and yeast strains
description: >-
  Register base strains by their source's accession and transformed strains by the
  base and its set of plasmids. Track individual glycerol stocks in storage and
  trace draws into the records that use the material.
license: Apache-2.0
iki: ">=0.1"
homepage: https://ikisci.org/plugins/strains
dependencies:
  iki/plasmid:
    types:
      Plasmid: ">=1"
  iki/example_lims:
    types:
      Box: ">=1"
      Tube: ">=1"
