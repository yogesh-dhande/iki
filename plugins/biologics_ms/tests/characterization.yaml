apiVersion: iki/v1
kind: ActionTest
name: published_intact_glycoform
action: characterize
inputs:
  antibody:
    - values:
        name: Trastuzumab
        molecular_weight: 145199.44
        components:
          - part: 00000000-0000-7000-8003-000000000002
            role: heavy
            copies: 2
          - part: 00000000-0000-7000-8003-000000000003
            role: light
            copies: 2
      included:
        components.part:
          - values:
              sequence: 
            type: iki/protein.Protein
          - values:
              sequence: DIQMTQSPSSLSASVGDRVTITCRASQDVNTAVAWYQQKPGKAPKLLIYSASFLYSGVPSRFSGSRSGTDFTLTISSLQPEDFATYYCQQHYTTPPTFGQGTKVEIKRTVAAPSVFIFPPSDEQLKSGTASVVCLLNNFYPREAKVQWKVDNALQSGNSQESVTEQDSKDSTYSLSSTLTLSKADYEKHKVYACEVTHQGLSSPVTKSFNRGEC
            type: iki/protein.Protein
files:
  report: tests/data/trastuzumab-intact.tsv
params:
  analysis: mass
  report:
    $file: report
  mass_basis: average
  tolerance_ppm: 35
expect:
  output:
    creates:
      - type: iki/biologics_ms.MSResult
        values:
          report_format: iki_mass_table_1
          comparison:
            basis: average
            peaks:
              - observed_da: 148058.4
                expected_da: 148057.866
                within_tolerance: true
---
