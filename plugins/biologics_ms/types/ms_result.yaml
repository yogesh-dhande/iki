apiVersion: iki/v1
kind: EntityType
name: MSResult
label: Biologics MS result
schema_version: 3
hrid: { prefix: BMS }
description: A comparison of reported LC-MS observations with a pinned antibody or conjugate and its component sequences.
fields:
  antibody: { type: ref, to: iki/antibody.Antibody, required: true, immutable: true }
  adc: { type: ref, to: iki/conjugate.Conjugate, immutable: true }
  lot: { type: ref, to: iki/lots.BiologicLot, immutable: true }
  report: { type: file, max_size: 50MiB, computed: true, immutable: true }
  report_sha256: { type: string, max_length: 64, computed: true, immutable: true }
  analysis: { type: enum, values: [mass, peptide_map], computed: true, immutable: true }
  report_format:
    type: enum
    label: Report profile
    values: [iki_mass_table_1, iki_peptide_map_1]
    computed: true
    immutable: true
    description: The versioned Iki interchange table the report follows, as the plugin README defines it.
  source_reports:
    type: list
    label: Source exports
    max_items: 8
    items: { type: file }
    description: >-
      The processing software's own exports that the interchange table was made from, registered in
      place. Attach them before review.
  source_software:
    type: string
    label: Processing software
    max_length: 200
    description: The deconvolution or peptide-mapping software and version that made the source exports.
  comparison: { type: json, computed: true, immutable: true }
  input_revisions: { type: json, computed: true, immutable: true }
  raw_files:
    type: list
    max_items: 20
    items: { type: file }
    description: Raw instrument files registered in place. Attach them before review.
  notes: { type: text, max_length: 3000, description: Findings for the reviewer. }
review:
  needs: { locks: signed }
rules:
  action_evidence:
    check: record.comparison != null && record.report != null && record.input_revisions != null
    message: Use Compare mass or peptide coverage to capture the input report and its comparison.
    fields: [comparison, report, input_revisions]
display: { title: "{{ hrid }}" }
