apiVersion: iki/v1
kind: Plugin
name: iki/biologics_ms
version: 0.4.0
title: Biologics mass spectrometry
description: Check deconvoluted mass and peptide maps against registered antibodies, ADCs and their lots.
license: Apache-2.0
iki: ">=0.1"
dependencies:
  iki/lab_roles: {}
  iki/antibody:
    types: { Antibody: ">=2" }
  iki/protein:
    types: { Protein: ">=1" }
  iki/conjugate:
    types: { Conjugate: ">=1" }
  iki/lots:
    types: { BiologicLot: ">=1", ProteinLot: ">=1", ConjugateLot: ">=1" }
