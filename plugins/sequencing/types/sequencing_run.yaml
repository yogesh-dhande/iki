apiVersion: iki/v1
kind: EntityType
name: SequencingRun
label: Sequencing run
schema_version: 1
hrid: { prefix: SEQR }
description: One instrument run, with separate read sets for its libraries and lanes.
fields:
  name: { type: string, required: true, max_length: 200 }
  instrument_model: { type: string, required: true, max_length: 200 }
  started_on: { type: date, label: Run date }
  flow_cell: { type: string, max_length: 100 }
  run_accession:
    type: string
    label: INSDC run accession
    max_length: 30
    pattern: "^(SRR|ERR|DRR)[0-9]+$"
    link: https://www.ebi.ac.uk/ena/browser/view/{value}
display: { title: "{{ name }}" }
