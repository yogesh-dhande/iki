apiVersion: iki/v1
kind: EntityType
name: FASTQSummary
label: FASTQ quality summary
label_plural: FASTQ quality summaries
schema_version: 3
hrid: { prefix: FQC }
description: Aggregate Phred+33 statistics for the exact source files inspected by the sequencing action.
fields:
  read_set: { type: ref, to: ReadSet, required: true, immutable: true }
  sample: { type: ref, to: iki/core.Entity, required: true, immutable: true }
  read_set_revision: { type: int, min: 1, computed: true, immutable: true }
  library_revision: { type: int, min: 1, computed: true, immutable: true }
  files:
    type: list
    label: Source files
    items: { type: file }
    max_items: 2
    computed: true
    immutable: true
  statistics:
    type: json
    computed: true
    immutable: true
    description: Counts, lengths and base qualities for each source file, with its SHA-256.
  notes: { type: text, max_length: 3000, description: Findings for the reviewer. }
review:
  needs: { locks: signed }
rules:
  action_evidence:
    check: record.statistics != null && record.read_set_revision != null && record.library_revision != null
    message: Use Summarize FASTQ quality on the read set to record its evidence.
    fields: [statistics, read_set_revision, library_revision]
display: { title: "{{ hrid }}" }
