apiVersion: iki/v1
kind: EntityType
name: ProteomicsResult
label: Proteomics search result
schema_version: 3
hrid: { prefix: PSR }
description: Search results and quantities imported from versioned reports, with links to their raw data and matched proteins.
fields:
  dataset: { type: ref, to: ProteomicsDataset, required: true, immutable: true }
  dataset_revision: { type: int, min: 1, computed: true, immutable: true }
  raw_files:
    type: list
    items: { type: ref, to: MSFile }
    max_items: 300
    computed: true
    immutable: true
  archive: { type: string, max_length: 400, computed: true, immutable: true }
  proteins:
    type: list
    items: { type: ref, to: iki/protein.Protein }
    max_items: 200
    computed: true
    immutable: true
  reports:
    type: list
    items: { type: file }
    max_items: 8
    computed: true
    immutable: true
  format:
    type: enum
    label: Report format
    values: [mztab_1_0, maxquant_txt, diann_tsv, fragpipe_tsv]
    computed: true
    immutable: true
    description: The supported report the importer read. Each source's table is in the summary.
  version:
    type: string
    label: Search engine or exporter version
    max_length: 120
    computed: true
    immutable: true
  summary: { type: json, computed: true, immutable: true }
  notes: { type: text, max_length: 3000, description: Findings for the reviewer. }
review:
  needs: { locks: signed }
rules:
  action_evidence:
    check: record.summary != null && record.dataset_revision != null
    message: Use Import proteomics search reports to capture the report and dataset revisions.
    fields: [summary, dataset_revision]
display: { title: "{{ hrid }}" }
