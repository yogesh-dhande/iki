apiVersion: iki/v1
kind: Action
name: import_search
label: Import proteomics search reports
description: Read identifications and quantities from an mzTab 1.0 file, MaxQuant txt tables, a DIA-NN main report TSV or FragPipe protein and peptide TSVs.
inputs:
  dataset: { type: ProteomicsDataset }
  proteins:
    type: iki/protein.Protein
    optional: true
    cardinality: many
    max: 200
    description: Registered proteins to link by exact UniProt accession.
params:
  format:
    type: enum
    label: Report format
    values: [mztab_1_0, maxquant_txt, diann_tsv, fragpipe_tsv]
    required: true
    description: >-
      mztab_1_0 is proteomics mzTab 1.0.0 or the PRIDE 1.0 rc5 export. maxquant_txt is
      proteinGroups.txt, peptides.txt or evidence.txt. diann_tsv is DIA-NN's main report as
      tab-separated text; convert a Parquet report to TSV first. fragpipe_tsv is a FragPipe protein
      or peptide TSV, single or combined.
  version:
    { type: string, required: true, max_length: 120, label: Search engine or exporter version }
  reports:
    type: list
    required: true
    max_items: 8
    items:
      type: file
      media_types:
        [text/plain, text/tab-separated-values, application/octet-stream, application/gzip]
      max_size: 1GiB
effects:
  creates: [{ type: ProteomicsResult, derived_from: [dataset, proteins] }]
runs_on: { tier: backend, environment: report-tools }
command: [python, ./scripts/import_search.py]
artifacts: { keep: [identifications.jsonl] }
deterministic: true
timeout: 30m
