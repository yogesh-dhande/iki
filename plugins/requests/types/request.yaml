# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: Request
label: Request
abstract: true
schema_version: 1
description: A project's specification of work to be done by another team.
request:
  service_fields: [status, priority, scheduled_on, analyst, service_notes]
  sends: [records, materials, tubes]
  materials: [materials, tubes]
  completed: { field: status, state: delivered }
  # The service's coordinators receive its tubes against what was sent (ADR 0180).
  receives: { field: tubes, by: [iki/lab_roles.coordinator] }
fields:
  title:
    type: string
    required: true
    max_length: 200
    description: What it's for, such as "Lot 12 release testing".
  records:
    type: list
    items: { type: ref, to: iki/core.Entity }
    max_items: 50
    description: The records the requesting project sends with this work.
  materials:
    type: list
    items: { type: ref, to: iki/core.Entity }
    max_items: 50
    description: The physical material records supplied for this work.
  tubes:
    type: list
    items: { type: ref, to: iki/inventory.Tube }
    max_items: 96
    description: >-
      The tubes shipped with it. The service receives each against this list, and
      tells whoever asked of any missing, extra, damaged or rejected.
  analyses:
    type: list
    items: { type: enum, values: [sec_purity, intact_mass, peptide_map, endotoxin] }
    max_items: 4
    description: What to measure.
  needed_by:
    type: date
    label: Needed by
    description: When the project needs the results, which My work sorts by.
  instructions:
    type: text
    description: How to handle the samples, and anything the service should know.
  standing:
    type: state
    label: Standing
    initial: open
    description: Whether the project asking still wants it. Its own coordinators set it.
    states:
      open: { label: Open, set_by: [iki/lab_roles.coordinator] }
      withdrawn:
        label: Withdrawn
        description: The project no longer needs it; the service stops work on it.
        set_by: [iki/lab_roles.coordinator]
        reason: required
  # The service's.
  status:
    type: state
    label: Status
    initial: submitted
    description: >-
      Where the work is, at the service. Its people set it, with the lab roles
      they hold in the service's project.
    states:
      submitted:
        label: Submitted
        description: Sent, and waiting for the service.
        set_by: [iki/lab_roles.coordinator]
      accepted:
        label: Accepted
        description: The service will do it, and schedules it.
        set_by: [iki/lab_roles.coordinator]
      in_progress:
        label: In progress
        description: Its assignee is doing the requested work.
        set_by: [iki/lab_roles.analyst]
      delivered:
        label: Delivered
        description: Its results are released back to the project that asked.
        set_by: [iki/lab_roles.reviewer, iki/lab_roles.qa]
        locks: true
      declined:
        label: Declined
        description: The service won't do it, and says why.
        set_by: [iki/lab_roles.coordinator]
        reason: required
  priority:
    type: enum
    values: [routine, urgent]
    default: routine
    description: How soon the service does it, which it decides.
  scheduled_on:
    type: date
    label: Scheduled
    description: When the service plans to run it.
  analyst:
    type: person
    role: iki/lab_roles.analyst
    assignment: { field: status, states: [accepted, in_progress] }
    description: >-
      Who at the service does it: someone with the Analyst role in its project.
      Accepted requests nobody has are open to its analysts.
  service_notes:
    type: text
    label: Service notes
    description: What the service says about it.
  facility_service:
    type: enum
    label: Service requested
    values: [protein_production, sequencing]
    immutable: true
    indexed: true
  requested_mass:
    type: quantity
    label: Requested protein mass
    unit: mg
    min: 0
    immutable: true
  sequencing_method:
    type: enum
    label: Sequencing method
    values: [sanger, short_read, long_read]
    immutable: true
display:
  title: "{{ title }}"
due: needed_by
# Whom a request tells (ADR 0129), as GitHub tells a repository's watchers of a new issue
# and its author and subscribers as it's closed: the service's coordinators, who accept or
# decline it, as it arrives; and whoever made it, or watches it, as its results come back.
notifications:
  received:
    label: A request arrives
    description: >-
      The service's coordinators hear of each request sent to it, to accept or
      decline it.
    when: { sent: true }
    tell: { roles: [iki/lab_roles.coordinator] }
    message:
      title: "{{ hrid }} arrived: {{ title }}"
      body: "Needed by {{ needed_by or 'no date given' }}."
  results_released:
    label: Its results are released
    description: >-
      Whoever made a request, and whoever watches it, hears as the service
      returns each deliverable.
    when: { released: true }
    tell: { creator: true, watchers: true }
    message:
      title: "{{ hrid }} has results: {{ title }}"
rules:
  production_scope:
    when: record.facility_service == "protein_production"
    check: record.records != null && size(record.records) == 1 && record.requested_mass != null && record.requested_mass > 0
    message: Name the protein and give a positive requested mass.
    fields: [records, requested_mass]
  sequencing_scope:
    when: record.facility_service == "sequencing"
    check: record.sequencing_method != null && record.tubes != null && size(record.tubes) > 0
    message: Choose a sequencing method and name the tubes the facility will receive.
    fields: [sequencing_method, tubes]
  only_requested_service:
    check: >-
      (record.facility_service == "protein_production" || record.requested_mass == null) &&
      (record.facility_service == "sequencing" || record.sequencing_method == null)
    message: Give only the protein mass or sequencing method for the selected service.
    fields: [requested_mass, sequencing_method]
