# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: QCDeliverable
label: QC deliverable
extends: Deliverable
schema_version: 3
hrid: { prefix: QCD }
result:
  of: request
  material: material
  released: { field: review, states: [released] }
fields:
  request:
    type: ref
    to: QCRequest
    required: true
    immutable: true
    description: The request for this deliverable.
  notes:
    type: text
    description: What the analyst saw, and anything the project should know.
  review:
    type: state
    initial: recorded
    states:
      recorded:
        label: Recorded
        set_by: [iki/lab_roles.analyst, iki/lab_roles.reviewer, iki/lab_roles.qa]
        reason: required
        guards:
          before_release:
            check: state.from == "submitted" || state.from == "reviewed"
            message: Only a submitted or reviewed deliverable can return to Recorded.
      submitted:
        label: Submitted
        set_by: [iki/lab_roles.analyst]
        locks: true
        signatures:
          - meaning: authorship
            statement: I recorded this deliverable and its evidence.
        guards:
          recorded:
            check: state.from == "recorded"
            message: Submit the deliverable from Recorded.
          active_request:
            check: record.request.standing == "open" && record.request.status == "in_progress"
            message: Sign the deliverable while the request is open and in progress at the service.
          still_requested:
            check: record.material == null || size(covered_subjects) > 0
            message: The material must still be on the request, or be an aliquot or sample of it.
      reviewed:
        label: Reviewed
        set_by: [iki/lab_roles.reviewer]
        locks: true
        signatures:
          - meaning: review
            statement: I reviewed the delivery report, outcome, and supporting evidence.
        guards:
          submitted:
            check: state.from == "submitted"
            message: Review the deliverable after its analyst submits it.
          independent_review:
            check: >-
              history.review[0].by != actor.person && last.review.submitted.by != actor.person &&
              edits.review.recorded.all(e, e.by != actor.person)
            message: Have a reviewer who did not create, submit or edit the deliverable sign it.
          active_request:
            check: record.request.standing == "open" && record.request.status == "in_progress"
            message: Sign the deliverable while the request is open and in progress at the service.
          still_requested:
            check: record.material == null || size(covered_subjects) > 0
            message: The material must still be on the request, or be an aliquot or sample of it.
      released:
        label: Released
        set_by: [iki/lab_roles.qa]
        locks: true
        signatures:
          - meaning: approval
            label: QA release
            statement: I release the independently reviewed deliverable to the requesting project.
        guards:
          reviewed:
            check: state.from == "reviewed" && last.review.reviewed.from == "submitted"
            message: Release the submitted deliverable after its independent review.
          independent_release:
            check: >-
              history.review[0].by != actor.person && last.review.submitted.by != actor.person &&
              last.review.reviewed.by != actor.person &&
              edits.review.recorded.all(e, e.by != actor.person)
            message: Have someone in QA who did not create, submit, edit or review the deliverable release it.
          active_request:
            check: record.request.standing == "open" && record.request.status == "in_progress"
            message: Sign the deliverable while the request is open and in progress at the service.
          still_requested:
            check: record.material == null || size(covered_subjects) > 0
            message: The material must still be on the request, or be an aliquot or sample of it.
