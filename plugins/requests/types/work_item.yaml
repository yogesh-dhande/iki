# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: WorkItem
label: Work item
schema_version: 2
hrid: { prefix: WKI }
description: A service project's private record of work on a request.
service:
  work_item: { of: request }
fields:
  request:
    type: ref
    to: Request
    required: true
    immutable: true
    description: The request sent to the project doing the work.
  # The request's scale, so a work item's priority reads the same as its request's.
  priority:
    type: enum
    values: [routine, high, urgent]
    default: routine
    description: >-
      How soon the service does it: routine, in its turn; high, ahead of routine work;
      urgent, before anything else.
  # The instrument it runs on is a booking of iki/equipment's for the work item, which
  # checks the instrument is in service and shows on its lineage, rather than a name here.
  scheduled_on:
    type: date
    label: Scheduled date
  notes:
    type: text
    label: Internal notes
    max_length: 10000
  status:
    type: state
    initial: queued
    states:
      queued:
        label: Queued
      scheduled:
        label: Scheduled
        set_by: [iki/lab_roles.analyst]
        guards:
          queued:
            check: state.from == "queued"
            message: Schedule a work item from Queued.
      # Scheduling and starting are steps a service takes when they help it: a desk-based
      # service finishes what it never scheduled.
      running:
        label: Running
        set_by: [iki/lab_roles.analyst]
        guards:
          waiting:
            check: state.from in ["queued", "scheduled"]
            message: Start a work item that's queued or scheduled.
      done:
        label: Done
        set_by: [iki/lab_roles.analyst]
        guards:
          open:
            check: state.from in ["queued", "scheduled", "running"]
            message: Finish a work item that's queued, scheduled or running.
      cancelled:
        label: Cancelled
        set_by: [iki/lab_roles.analyst]
        reason: required
        guards:
          active:
            check: state.from in ["queued", "scheduled", "running"]
            message: Cancel a work item while work is pending or running.
