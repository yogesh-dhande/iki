# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: PlainDeliverable
label: Plain deliverable
extends: Deliverable
schema_version: 2
hrid: { prefix: DLV }
description: A result the service project can return to the team that asked without a signature.
result:
  of: request
  material: material
  released: { field: status, states: [delivered] }
fields:
  request:
    type: ref
    to: PlainRequest
    required: true
    immutable: true
    description: The request this deliverable answers.
  status:
    type: state
    initial: recorded
    states:
      recorded:
        label: Recorded
      delivered:
        label: Delivered
        set_by: [iki/lab_roles.reviewer]
        locks: true
        guards:
          recorded:
            check: state.from == "recorded"
            message: Deliver a recorded result.
          active_request:
            check: record.request.standing == "open" && record.request.status == "in_progress"
            message: Deliver while the request is open and in progress.
          still_requested:
            check: record.material == null || size(covered_subjects) > 0
            message: The material must still be on the request, or be an aliquot or sample of it.
