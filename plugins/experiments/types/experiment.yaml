apiVersion: iki/v1
kind: EntityType
name: Experiment
schema_version: 4
label: Experiment
hrid: { prefix: EXP }
description: A project record for an experiment, its evidence, any external notebook entry and the signatures the project's review flow asks for.
draws_received: material_draws
fields:
  title: { type: string, required: true, max_length: 200 }
  eln_id:
    type: string
    label: ELN entry ID
    max_length: 256
    pattern: '.*\S.*'
    description: The lab notebook's stable entry identifier. An entry URL may be supplied instead.
  eln_url:
    {
      type: string,
      label: ELN entry URL,
      format: uri,
      pattern: 'https?://[^\s]+',
      max_length: 2048,
    }
  eln_revision:
    type: string
    label: ELN entry revision
    max_length: 256
    pattern: '.*\S.*'
    description: The notebook's exact version, check-in ID or immutable rendition identifier.
  protocol_id:
    type: string
    label: Protocol ID or URL
    max_length: 2048
    pattern: '.*\S.*'
    description: The controlled method that was followed.
  protocol_revision: { type: string, label: Protocol revision, max_length: 256, pattern: '.*\S.*' }
  samples:
    type: list
    items: { type: ref, to: iki/core.Entity }
    max_items: 1000
    description: The sample records examined in this experiment. Quantities used are recorded by drawing material from stock.
  observations:
    type: list
    max_items: 1000
    items:
      type: row
      row_id: observation_id
      fields:
        observed_at: { type: datetime, required: true, label: Observed at }
        note: { type: text, required: true, max_length: 10000 }
        observation_id:
          type: string
          label: Observation ID
          max_length: 36
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: The stable row ID. Preserve it on edits and leave it out for a new observation.
  attachments:
    type: list
    items: { type: file }
    max_items: 100
    description: Direct evidence files, including a versioned notebook rendition if available. The signature binds each file's content hash.
  material_draws:
    type: json
    label: Material used
    computed: true
    description: The incoming amounts ledger movements recorded for this experiment, including their sources, amounts, units and operators.
  result_pins:
    type: list
    label: Captured results
    computed: true
    max_items: 1000
    description: The project records and revisions selected for witnessing, with the corresponding registry revisions when applicable.
    items:
      type: row
      fields:
        result:
          {
            type: ref,
            to: iki/core.Entity,
            required: true,
            description: The link to the result or its registry entry.,
          }
        record_id: { type: string, required: true, max_length: 36, label: Project record ID }
        record_revision: { type: int, min: 1, required: true, label: Record revision }
        entry_id: { type: string, max_length: 36, label: Registry entry ID }
        entry_revision: { type: int, min: 1, label: Registry entry revision }
  capture_id:
    type: string
    computed: true
    max_length: 36
    label: Evidence capture run
    description: The last run that captured the record for witnessing. A change to its content requires a fresh capture.
  review_flow:
    type: enum
    label: Review flow
    computed: true
    values: [author_signed, research, regulated_qc]
    description: The review flow captured with the evidence, the project's choice or the deployment's.
  review:
    type: state
    initial: recorded
    states:
      recorded:
        label: Recorded
        set_by: [author, reviewer, qa]
        reason: required
        guards:
          correctable:
            check: state.from == "submitted" || state.from == "reviewed"
            message: Only a submission awaiting review or release can be returned for correction.
      signed:
        label: Signed by author
        set_by: [author]
        locks: true
        signatures:
          - {
              meaning: authorship,
              statement: I recorded this experiment and checked the evidence it cites.,
            }
        guards:
          author_signed:
            check: state.from == "recorded" && record.review_flow == "author_signed"
            message: Capture the evidence with the author sign-off flow before signing this record.
          author:
            description: The authorship signature is the signer's own record, not a colleague's.
            check: history.review[0].by == actor.person || edits.review.recorded.exists(e, e.by == actor.person)
            message: Only the person who created or edited this record signs it as its author.
          closed:
            check: >-
              size(edits.review.recorded) > 0 &&
              "capture_id" in edits.review.recorded[size(edits.review.recorded) - 1].fields
            message: The experiment changed since its evidence was captured. Capture it again before signing.
          cited_exactly:
            description: A notebook entry or protocol isn't needed, but one that's cited names its revision.
            check: >-
              ((record.eln_id == null && record.eln_url == null) || record.eln_revision != null) &&
              (record.protocol_id == null || record.protocol_revision != null)
            message: Give the revision of the notebook entry or protocol this record cites.
          evidence:
            check: size(record.result_pins) > 0 || size(record.observations) > 0 || size(record.attachments) > 0
            message: Capture a result, record a dated observation or attach evidence before signing.
      witnessed:
        label: Witnessed
        set_by: [reviewer]
        locks: true
        signatures:
          - {
              meaning: witness,
              statement: I witnessed the experiment record and checked the cited notebook version and evidence.,
            }
        guards:
          research:
            check: state.from == "recorded" && record.review_flow == "research"
            message: Capture the evidence with the research review flow before witnessing this record.
          closed:
            check: >-
              size(edits.review.recorded) > 0 &&
              "capture_id" in edits.review.recorded[size(edits.review.recorded) - 1].fields
            message: The experiment changed since its evidence was captured. Capture it again before signing.
          notebook:
            check: (record.eln_id != null || record.eln_url != null) && record.eln_revision != null
            message: Record the ELN entry URL or ID and its exact revision.
          protocol:
            check: record.protocol_id != null && record.protocol_revision != null
            message: Identify the protocol followed and its revision.
          evidence:
            check: size(record.result_pins) > 0 || size(record.observations) > 0 || size(record.attachments) > 0
            message: Capture a result, record a dated observation or attach evidence before signing.
          independent:
            check: history.review[0].by != actor.person && edits.review.recorded.all(e, e.by != actor.person)
            message: The creator or a person who edited this record cannot witness it.
      submitted:
        label: Submitted
        set_by: [author]
        locks: true
        signatures:
          - {
              meaning: authorship,
              statement: I close this experiment on the stated notebook version and captured evidence.,
            }
        guards:
          regulated:
            check: state.from == "recorded" && record.review_flow == "regulated_qc"
            message: Capture the evidence with the regulated QC flow before submitting this experiment.
          closed:
            check: >-
              size(edits.review.recorded) > 0 &&
              "capture_id" in edits.review.recorded[size(edits.review.recorded) - 1].fields
            message: The experiment changed since its evidence was captured. Capture it again before signing.
          notebook:
            check: (record.eln_id != null || record.eln_url != null) && record.eln_revision != null
            message: Record the ELN entry URL or ID and its exact revision.
          protocol:
            check: record.protocol_id != null && record.protocol_revision != null
            message: Identify the protocol followed and its revision.
          evidence:
            check: size(record.result_pins) > 0 || size(record.observations) > 0 || size(record.attachments) > 0
            message: Capture a result, record a dated observation or attach evidence before signing.
      reviewed:
        label: Independently reviewed
        set_by: [reviewer]
        locks: true
        signatures: [{ meaning: review }]
        guards:
          submitted:
            check: state.from == "submitted"
            message: Review the experiment after the author signs the submission.
          independent:
            check: history.review[0].by != actor.person && last.review.submitted.by != actor.person && edits.review.recorded.all(e, e.by != actor.person)
            message: Someone independent of the creator, submitter and current cycle's editors must review this experiment.
      released:
        label: QA released
        set_by: [qa]
        locks: true
        signatures: [{ meaning: approval, label: QA release }]
        guards:
          reviewed:
            check: state.from == "reviewed" && last.review.reviewed.from == "submitted"
            message: QA can release the experiment after independent review of the signed submission.
          independent:
            check: history.review[0].by != actor.person && last.review.submitted.by != actor.person && last.review.reviewed.by != actor.person && edits.review.recorded.all(e, e.by != actor.person)
            message: QA release requires a person independent of the creator, submitter, reviewer and current cycle's editors.
display: { title: "{{ title }}" }
