apiVersion: iki/v1
kind: Plugin
name: iki/experiments
version: 0.2.5
title: Experiment records
description: Record an experiment's evidence, notebook entry, protocol, material drawn and result revisions, and sign it the way the project chose.
iki: ">=0.1"
license: Apache-2.0
starters: { experiment-review: "1.0.0" }
settings:
  review_flow:
    type: enum
    label: Experiment review
    values: [author_signed, research, regulated_qc]
    default: research
    description: >-
      Author sign-off: the author signs the record. Research: an independent witness signs it.
      Regulated QC: the author signs a submission, then independent review and QA release.
      A project's experiment-review starter chooses its own. Each record keeps the flow it
      was captured under.
roles:
  author:
    {
      label: Experiment author,
      description: "Records observations, signs an author sign-off, and submits an experiment for QC review.",
    }
  reviewer:
    {
      label: Experiment reviewer,
      description: Witnesses a research record or independently reviews a QC submission.,
    }
  qa: { label: Experiment QA, description: Releases the independently reviewed experiment. }
