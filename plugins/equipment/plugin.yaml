# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Plugin
name: iki/equipment
version: 0.6.2
title: Equipment service
description: Schedule calibration and maintenance, pin calibration evidence at use, and trace results after failed checks.
license: Apache-2.0
iki: ">=0.1"
dependencies:
  iki/lab_roles: {}
settings:
  review_flow:
    type: enum
    label: Equipment evidence review
    values: [research, regulated_qc]
    default: research
    description: The review procedure kept with every service appointment and resulting impact assessment.
roles:
  reviewer:
    label: Equipment reviewer
    description: Independently reviews calibration, maintenance and measurement impacts in regulated QC.
  qa:
    label: Equipment QA
    description: Releases reviewed equipment evidence and signs or releases the disposition of affected results.
