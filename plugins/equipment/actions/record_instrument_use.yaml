apiVersion: iki/v1
kind: Action
name: record_instrument_use
label: Record instrument use
description: >-
  Pin the measured record and the signed calibration in force when the measurement was made.
  Measured after a signed failed calibration, before the next passing one, the use is
  recorded as not covered, with why, and its result's impact case is opened in the same run.
  While the instrument is marked Failed, a use isn't covered by the passing calibration
  before it.
inputs:
  instrument: { type: Instrument }
  result: { type: iki/core.Entity, label: Measured result }
  calibration:
    type: EquipmentService
    label: Calibration in force
    description: >-
      The instrument's latest signed calibration before the measurement: the passing one
      that covers it, or the failed one found since.
params:
  measurement_at:
    type: string
    max_length: 40
    required: true
    label: Measured at
    description: Date, time and time zone of the measurement in RFC 3339 format, such as 2026-01-19T15:30:00Z.
effects:
  creates:
    - type: InstrumentUse
      cardinality: one
      match_on: key
      derived_from: [instrument, result, calibration]
    # Measured after a signed failed calibration: the result's case, with this use.
    - type: CalibrationImpact
      cardinality: one
      match_on: key
      # One case for each result a failure affects: one opened first stands.
      on_match: keep
      derived_from: [instrument, calibration]
runs_on: { tier: backend, environment: equipment-tools }
command: [python, ./scripts/equipment.py, record-use]
deterministic: true
timeout: 1m
