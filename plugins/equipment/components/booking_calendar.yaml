# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
#
# A calendar of bookings, a month at a time (ADR 0117). Iki runs it in a sandboxed
# frame and gives it the bookings each place's search finds, as the person viewing it
# may read them, with only the fields it reads. It asks for one month at a time with a
# refinement, which can only narrow what its place shows.
apiVersion: iki/v1
kind: Component
name: booking_calendar
label: Calendar
description: Bookings by day, a month at a time.
module: ./components/booking-calendar.js
element: equipment-booking-calendar
entities:
  type: Booking
  fields: [purpose, instrument, starts_at, ends_at, booked_by, work]
  limit: 1000
slots:
  # An instrument's bookings, on its page.
  - slot: entity.tab
    type: Instrument
    label: Bookings
    search: { where: { field: instrument, op: eq, value: "{{ entity }}" }, sort: starts_at }
  # "Show as" in the grid of bookings: what the grid finds.
  - { slot: search.results, label: Calendar }
  # A section of the project's page: its bookings.
  - { slot: project.page, label: Instrument bookings, search: { sort: starts_at } }
  # A section of each person's home: the time booked for them, by them or by someone else
  # (a core's coordinator booking its sequencer for an analyst), as a calendar shows the
  # rooms booked for its owner's meetings. The bookings they made for others are
  # bookings_made's.
  - slot: person.home
    label: Your bookings
    search:
      where:
        any:
          - { field: booked_by, op: eq, value: "{{ me }}" }
          - all:
              - { field: created_by, op: eq, value: "{{ me }}" }
              - { field: booked_by, op: is_set, value: false }
      sort: starts_at
