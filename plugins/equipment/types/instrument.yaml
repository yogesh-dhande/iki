# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: Instrument
label: Instrument
label_plural: Instruments
schema_version: 1
description: An instrument the lab books time on, such as a plate reader.
hrid: { prefix: INS }
fields:
  name: { type: string, required: true, max_length: 200, indexed: true }
  location: { type: string, max_length: 200, description: "Where it is, such as a room." }
  # Two state fields (ADR 0125): whether it can be used, and whether it's calibrated. Each is
  # set on its own; a retired instrument's record is locked.
  service:
    type: state
    label: Service
    initial: in_service
    states:
      in_service: { label: In service, set_by: [iki/lab_roles.engineer] }
      out_of_service:
        label: Out of service
        description: Broken, or being repaired. Anyone who finds it so says why.
        set_by: [iki/lab_roles.engineer, iki/lab_roles.analyst]
        reason: required
      retired:
        label: Retired
        description: No longer used. Its record is kept as it was.
        set_by: [iki/lab_roles.engineer]
        locks: true
        reason: required
  calibration:
    type: state
    label: Calibration
    initial: due
    states:
      due:
        {
          label: Due,
          description: It needs calibrating before use.,
          set_by: [iki/lab_roles.engineer, iki/lab_roles.qa],
        }
      calibrated: { label: Calibrated, set_by: [iki/lab_roles.engineer], reason: optional }
      failed: { label: Failed, set_by: [iki/lab_roles.engineer], reason: required }
display:
  title: "{{ name }}"
