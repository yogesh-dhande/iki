apiVersion: iki/v1
kind: ActionTest
name: brentuximab_vedotin_by_hic
description: >-
  Brentuximab vedotin by HIC (Agilent application note 5994-3522EN, Table 1): D0 8.11%,
  D2 38.83%, D4 36.88%, D6 12.78% and D8 3.4%, which Agilent gives as DAR 3.3: 3.2906,
  and 8.11% unconjugated.
action: compute_conjugate_lot
inputs:
  lot:
    - values:
        dar_method: hic
        drug_loads:
          - { chain: intact, drug_load: 0, area: 8.11 }
          - { chain: intact, drug_load: 2, area: 38.83 }
          - { chain: intact, drug_load: 4, area: 36.88 }
          - { chain: intact, drug_load: 6, area: 12.78 }
          - { chain: intact, drug_load: 8, area: 3.4 }
expect:
  output:
    updates:
      lot:
        - values: { dar: 3.29, unconjugated: 8.11 }
---
apiVersion: iki/v1
kind: ActionTest
name: disitamab_vedotin_by_hic
description: >-
  Disitamab vedotin by HIC (Thermo Fisher application note AN002598, Figure 9): DAR0
  4.3%, DAR2 26.51%, DAR4 43.88%, DAR6 20.13% and DAR8 5.19%, average 3.91. The shares
  add to 100.01%, so each is taken of their sum: 4.30% unconjugated.
action: compute_conjugate_lot
inputs:
  lot:
    - values:
        dar_method: hic
        drug_loads:
          - { chain: intact, drug_load: 0, area: 4.3 }
          - { chain: intact, drug_load: 2, area: 26.51 }
          - { chain: intact, drug_load: 4, area: 43.88 }
          - { chain: intact, drug_load: 6, area: 20.13 }
          - { chain: intact, drug_load: 8, area: 5.19 }
expect:
  output:
    updates:
      lot:
        - values: { dar: 3.91, unconjugated: 4.3 }
---
apiVersion: iki/v1
kind: ActionTest
name: adcetris_by_its_reduced_chains
description: >-
  Adcetris reduced, by RP-HPLC and Q-TOF (Agilent application note 5991-6559EN, Table
  1): LC 43.3%, LC+1 56.7%; HC 19.9%, HC+1 36.1%, HC+2 25.4%, HC+3 18.6%, which Agilent
  gives as a weighted average DAR of 4.0: 2 × (0.567 + 1.427) = 3.988. A reduced
  distribution has no intact DAR 0, so no unconjugated share. Its A280 with its
  measured ε280 gives its concentration.
action: compute_conjugate_lot
inputs:
  lot:
    - values:
        dar_method: rp_hplc_reduced
        a280: 0.9
        dilution_factor: 10
        path_length: 1
        extinction_coefficient: 1.5
        concentration_method: a280
        drug_loads:
          - { chain: light, drug_load: 0, area: 43.3 }
          - { chain: light, drug_load: 1, area: 56.7 }
          - { chain: heavy, drug_load: 0, area: 19.9 }
          - { chain: heavy, drug_load: 1, area: 36.1 }
          - { chain: heavy, drug_load: 2, area: 25.4 }
          - { chain: heavy, drug_load: 3, area: 18.6 }
expect:
  output:
    updates:
      lot:
        - values: { dar: 3.99, a280_extinction: 1.5, concentration: 6 }
