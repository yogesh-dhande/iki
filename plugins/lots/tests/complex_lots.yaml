# Run with `iki plugin test plugins/lots --with plugins/dna --with plugins/protein --with plugins/antibody --with plugins/complex --with plugins/oligo --with plugins/plasmid` (ADR 0093).
apiVersion: iki/v1
kind: ActionTest
name: a_complex_of_a_fab_and_its_antigen
description: >-
  Trastuzumab's Fab bound to HER2's extracellular domain (PDB 1N8Z; Cho et al., Nature
  421:756, 2003), as the complex plugin's compute_composition gives it: 113,766.39 g/mol
  and 133,620 L/(mol·cm) with every thiol free. Its own bonds are HER2's 23 disulfides;
  its part the Fab has 4 of its own, which compute_composition counted for this
  project. All 27 are cystines: 133,620 + 27 × 125 = 136,995 L/(mol·cm) over 113,766.39
  − 27 × 2.01588 = 113,711.96 g/mol, 1.2048 mL/(mg·cm): an A280 of 1.2 diluted 1 in
  10 is 9.9605 mg/mL. Counting HER2's 23 alone would give 1.2003 mL/(mg·cm), 0.4% too
  little.
action: compute_protein_lot
inputs:
  lot:
    - values: { a280: 1.2, dilution_factor: 10, path_length: 1, concentration_method: a280 }
      included:
        protein:
          - type: iki/complex.ProteinComplex
            values:
              name: trastuzumab Fab–HER2
              components:
                - { part: 00000000-0000-7000-8003-000000000002, copies: 1, role: antibody }
                - { part: 00000000-0000-7000-8003-000000000003, copies: 1, role: antigen }
              # HER2's 23 disulfides, as PDB 1N8Z's SSBOND records give them.
              bonds:
                - {
                    kind: disulfide,
