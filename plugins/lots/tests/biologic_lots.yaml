apiVersion: iki/v1
kind: ActionTest
name: lysozyme_by_its_sequences_e280
upgrade: true
description: >-
  Hen egg-white lysozyme, its 129 mature residues (UniProt P00698, 19–147): 6 Trp, 3 Tyr
  and 4 cystines give 37,970 L/(mol·cm) (Pace et al., 1995). Its sequence weighs
  14,313.18 g/mol; its 4 cystines take 8 H (8.06 g/mol) off, 14,305.12, as a complex's
  disulfides do, so 2.6543 mL/(mg·cm), within 0.6% of the 2.64 measured (E1% 26.4 at
  281.5 nm; Aune & Tanford, 1969). An A280 of 0.53 diluted 1 in 10 is 0.53 × 10 /
  2.6543 = 1.9968 mg/mL.
action: compute_protein_lot
inputs:
  lot:
    - values: { a280: 0.53, dilution_factor: 10, path_length: 1, cysteines: cystines }
      included:
        concentration_method:
          - values: { code: a280, label: A280, calculation: a280 }
        protein:
          - type: iki/protein.Protein
            values:
              sequence: KVFGRCELAAAMKRHGLDNYRGYSLGNWVCAAKFESNFNTQATNRNTDGSTDYGILQINSRWWCNDGRTPGSRNLCNIPCSALLSSDITASVNCAKKIVSDGNGMNAWVAWRNRCKGTDVQAWIRGCRL
              molecular_weight: 14313.18
              extinction_coefficient_oxidized: 37970
              extinction_coefficient_reduced: 37470
expect:
  output:
    updates:
      lot:
        - values:
            {
              a280_extinction: 2.6543,
              a280_basis: cystines,
              a280_estimate: false,
              a280_concentration: 1.9968,
              concentration: 1.9968,
            }
---
