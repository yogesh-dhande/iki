apiVersion: iki/v1
kind: ActionTest
name: a_complex_without_an_e280
description: >-
  Hemoglobin A's heme isn't a protein, and Pace's values weigh only proteins, so its
  complex has no ε280 (ADR 0161): without a measured one, its A280 says nothing, and the
  run says so.
action: compute_protein_lot
inputs:
  lot:
    - hrid: PLOT-000001
      values: { a280: 0.84, dilution_factor: 10, concentration_method: a280 }
      included:
        protein:
          - type: iki/complex.ProteinComplex
            values:
              name: hemoglobin A
              components:
                - { part: 00000000-0000-7000-8003-000000000001, copies: 2, role: alpha }
                - { part: 00000000-0000-7000-8003-000000000002, copies: 2, role: beta }
                - { part: 00000000-0000-7000-8003-000000000003, copies: 4, role: heme }
              molecular_weight: 64452.3
expect:
  output:
    updates: { lot: [] }
    messages:
      - level: warning
        text: >-
          PLOT-000001: its concentration isn't worked out from its A280: its complex has
          no ε280 and molecular weight computed, and the lot gives no measured ε280.
