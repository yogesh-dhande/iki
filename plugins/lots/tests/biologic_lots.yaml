apiVersion: iki/v1
kind: ActionTest
name: lysozyme_by_its_sequences_e280
description: >-
  Hen egg-white lysozyme, its 129 mature residues (UniProt P00698, 19–147): 6 Trp, 3 Tyr
  and 4 cystines give 37,970 L/(mol·cm) (Pace et al., 1995), over 14,313.0 g/mol, 2.6528
  mL/(mg·cm), within 0.5% of the 2.64 measured (E1% 26.4 at 281.5 nm; Aune & Tanford,
  1969). An A280 of 0.53 diluted 1 in 10 is 0.53 × 10 / 2.6528 = 1.9979 mg/mL.
action: compute_protein_lot
inputs:
  lot:
    - values:
        {
          a280: 0.53,
          dilution_factor: 10,
          path_length: 1,
          cysteines: cystines,
          concentration_method: a280,
        }
      included:
        protein:
          - type: iki/protein.Protein
            values:
              molecular_weight: 14313.0
              extinction_coefficient_oxidized: 37970
              extinction_coefficient_reduced: 37470
expect:
  output:
    updates:
      lot:
        - values: { a280_extinction: 2.6528, concentration: 1.9979 }
---
apiVersion: iki/v1
kind: ActionTest
name: reduced_its_cysteines_dont_absorb
description: >-
  Reduced, its cysteines don't absorb as cystines do: 37,470 L/(mol·cm), 2.6179
  mL/(mg·cm), so the same A280 is 2.0245 mg/mL.
action: compute_protein_lot
inputs:
  lot:
    - values:
        {
          a280: 0.53,
