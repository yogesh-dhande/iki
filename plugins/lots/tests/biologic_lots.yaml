            }
---
apiVersion: iki/v1
kind: ActionTest
name: a_measured_e280_is_used_instead
description: Lysozyme's measured 2.64 mL/(mg·cm), given, is what its concentration is worked out with.
action: compute_protein_lot
inputs:
  lot:
    - values: { a280: 0.528, dilution_factor: 10, path_length: 1, extinction_coefficient: 2.64 }
      included:
        concentration_method:
          - values: { code: a280, label: A280, calculation: a280 }
        protein:
          - type: iki/protein.Protein
            values: { molecular_weight: 14313.18, extinction_coefficient_oxidized: 37970 }
expect:
  output:
    updates:
      lot:
        - values:
            { a280_extinction: 2.64, a280_basis: measured, a280_estimate: false, concentration: 2 }
