apiVersion: iki/v1
kind: ActionTest
name: one_by_bca_keeps_its_own
description: >-
  Measured by BCA, its concentration is as entered; the ε280 its A280 would use is
  still recorded.
action: compute_protein_lot
inputs:
  lot:
    - values: { a280: 0.53, concentration: 1.9, concentration_method: bca }
      included:
        protein:
          - type: iki/protein.Protein
            values: { molecular_weight: 14313.0, extinction_coefficient_oxidized: 37970 }
expect:
  output:
    updates:
      lot:
        - values: { a280_extinction: 2.6528 }
