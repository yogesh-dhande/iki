apiVersion: iki/v1
kind: ActionTest
name: the_labs_own_a280_method_is_worked_out_too
description: >-
  A lab's own method on its list, an A280 by variable path length (SoloVPE), whose
  option says it's an A280: Iki works lysozyme's out as any other, 0.53 × 10 / 2.6543
  = 1.9968 mg/mL.
action: compute_protein_lot
inputs:
  lot:
    - values: { a280: 0.53, dilution_factor: 10, path_length: 1, cysteines: cystines }
      included:
        concentration_method:
          - values:
              code: slope_a280
              label: Slope A280 (SoloVPE, SOP-AN-204)
              calculation: a280
        protein:
          - type: iki/protein.Protein
            values:
              molecular_weight: 14313.18
              extinction_coefficient_oxidized: 37970
              extinction_coefficient_reduced: 37470
expect:
  output:
    updates:
      lot:
        - values: { a280_concentration: 1.9968, concentration: 1.9968 }
