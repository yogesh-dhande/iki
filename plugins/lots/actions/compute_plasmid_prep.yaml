# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Action
name: compute_plasmid_prep
label: Compute a plasmid prep's concentration from its A260
description: >-
  A plasmid prep's DNA concentration from its A260: 50 ng/µL of double-stranded DNA for
  an absorbance of 1 over 1 cm, times its dilution, over its path length. Only while its
  concentration method is one Iki works out from its A260, as the lab's list says, or
  none is named; otherwise its concentration is as measured. A
  concentration a pool set, or one entered, since its A260 was read is kept.
inputs:
  lot: { type: PlasmidPrep, schema: ">=3", include: [concentration_method] }
effects:
  updates: [{ input: lot, fields: [a260_concentration, concentration] }]
runs_on: { tier: backend, environment: lot-tools }
command: [python, ./scripts/lots.py, plasmid]
deterministic: true
batchable: 100
timeout: 5m
