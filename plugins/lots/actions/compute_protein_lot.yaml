# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Action
name: compute_protein_lot
label: Compute a protein lot's concentration from its A280
description: >-
  A protein lot's concentration from its A280: c = A280 × dilution / (ε × path length),
  with ε its measured ε280, or the molar ε280 (Pace et al., 1995) over the molecular
  weight of what it's a lot of: a protein's, with its cysteines as cystines (each two
  hydrogens lighter) or reduced as the lot says; or a complex's, such as an antibody's,
  with each disulfide its bonds place applied while its cysteines are cystines. Only
  while its concentration method is one Iki works out from its A280, as the lab's list
  says, or none is named; otherwise its concentration is as measured.
  A concentration a pool set, or one entered, since its A280 was read is kept.
inputs:
  lot: { type: ProteinLot, schema_version: ">=4", include: [protein, concentration_method] }
effects:
  updates:
    lot: { fields: [a280_extinction, a280_basis, a280_estimate, a280_concentration, concentration] }
runs_on: { tier: backend, environment: lot-tools }
command: [python, ./scripts/lots.py, protein]
deterministic: true
batchable: 100
timeout: 5m
