# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Action
name: compute_conjugate_lot
label: Compute a conjugate lot's DAR and concentration
description: >-
  A conjugate lot's average DAR from its drug load distribution: the mean drug load
  weighted by each species' share of the area, of the intact conjugate, or of its
  reduced chains using each chain's copy count in the registered antibody carrier.
  Computes the unconjugated share from the intact DAR 0 species, and concentration
  from the lot's A280 and measured ε280, while its concentration method is one Iki works
  out from its A280, or none is named. A DAR by UV/Vis is entered as measured.
inputs:
  lot: { type: ConjugateLot, schema: ">=5", include: [conjugate, concentration_method] }
effects:
  updates:
    - input: lot
      fields:
        [
          dar,
          distribution_dar,
          unconjugated,
          a280_extinction,
          a280_basis,
          a280_estimate,
          a280_concentration,
          concentration,
        ]
runs_on: { tier: backend, environment: lot-tools }
command: [python, ./scripts/lots.py, conjugate]
deterministic: true
batchable: 100
timeout: 5m
