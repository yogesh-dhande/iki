# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Trigger
name: compute_protein_lot_when_recorded
label: Compute a protein lot's concentration from its A280 when it's recorded
description: >-
  Works out what follows from what was measured of a protein lot as soon as it's recorded,
  such as from its form.
on: entity.created
type: ProteinLot
run: compute_protein_lot
---
# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Trigger
name: compute_protein_lot_when_measured
label: Compute a protein lot's concentration from its A280 again when it's measured
description: >-
  Works out what follows from what was measured of a protein lot again when what it's worked
  out from changes.
on: entity.updated
type: ProteinLot
fields:
  [a280, path_length, dilution_factor, extinction_coefficient, cysteines, concentration_method]
watch_included:
  protein:
    [
      molecular_weight,
      extinction_coefficient_reduced,
      extinction_coefficient_oxidized,
      bonds,
      bond_map,
      part_disulfides,
      part_bonds_complete,
      molecular_formula,
    ]
run: compute_protein_lot
