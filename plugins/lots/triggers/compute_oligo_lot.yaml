# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Trigger
name: compute_oligo_lot_when_recorded
label: Compute an oligonucleotide lot's mass difference and yield when it's recorded
description: >-
  Works out what follows from what was measured of an oligonucleotide lot as soon as it's recorded,
  such as from its form.
on: entity.created
type: OligoLot
run: compute_oligo_lot
---
# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Trigger
name: compute_oligo_lot_when_measured
label: Compute an oligonucleotide lot's mass difference and yield again when it's measured
description: >-
  Works out what follows from what was measured of an oligonucleotide lot again when what it's worked
  out from changes.
on: entity.updated
type: OligoLot
fields: [measured_mass, mass_basis, yield_od, extinction_260]
run: compute_oligo_lot
