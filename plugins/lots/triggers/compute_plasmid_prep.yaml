# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Trigger
name: compute_plasmid_prep_when_recorded
label: Compute a plasmid prep's concentration from its A260 when it's recorded
description: >-
  Works out what follows from what was measured of a plasmid prep as soon as it's recorded,
  such as from its form.
on: entity.created
type: PlasmidPrep
run: compute_plasmid_prep
---
# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Trigger
name: compute_plasmid_prep_when_measured
label: Compute a plasmid prep's concentration from its A260 again when it's measured
description: >-
  Works out what follows from what was measured of a plasmid prep again when what it's worked
  out from changes.
on: entity.updated
type: PlasmidPrep
fields: [a260, path_length, dilution_factor, concentration_method]
watch_included:
  concentration_method: [calculation]
run: compute_plasmid_prep
