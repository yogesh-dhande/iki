# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Plugin
name: iki/lots
version: 0.7.0
title: Lots
description: >-
  Lots of any registered entity: what was made or bought at one time, how much of it is
  left, what was measured of it, its certificates of analysis, and whether QA released
  it. Oligonucleotide synthesis lots with their mass by ESI-MS checked against the
  computed one, plasmid preps with signed verification evidence, lots of proteins and
  complexes with their concentration by A280, conjugate lots with their DAR, polymer
  lots with their Mn, Mw and dispersity, microbial strain isolates and their glycerol stocks,
  and generic lots of other registered entities.
license: Apache-2.0
iki: ">=0.1"
homepage: https://ikisci.org/plugins/lots
dependencies:
  iki/conjugate:
    types:
      Conjugate: ">=1"
  iki/polymer:
    types:
      Polymer: ">=1"
  iki/protein:
    types:
      Protein: ">=3"
  iki/inventory:
    types:
      Tube: ">=1"
  iki/strains:
    types:
      BaseStrain: ">=1"
      TransformedStrain: ">=1"
  iki/oligo:
    types:
      Oligonucleotide: ">=1"
  iki/plasmid:
    types:
      Plasmid: ">=1"
settings:
  verification_flow:
    type: enum
    label: Plasmid verification review
    values: [research, regulated_qc]
    default: research
    description: >-
      Research requires a single reviewer signature. Regulated QC requires signed submission,
      independent review and QA release. Each verification keeps the choice made at recording.
roles:
  verification_analyst:
    label: Verification analyst
    description: Submits the evidence and outcome for a physical plasmid prep.
  verification_reviewer:
    label: Verification reviewer
    description: Reviews a prep’s evidence against the pinned plasmid revision and signs the outcome.
  qa:
    label: Lot QA
    description: >-
      Draws samples for quality testing and releases lots for use once their records and
      certificates of analysis meet their specification. Puts lots on hold or rejects them,
      says when they've expired, and returns released ones to quarantine for correction.
      Signs the release of independently reviewed plasmid verification records.
