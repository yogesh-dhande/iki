# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
#
# A prep of a plasmid, whose own record says it's circular (ADR 0163) and what it's for.
apiVersion: iki/v1
kind: EntityType
name: PlasmidPrep
label: Plasmid prep
label_plural: Plasmid preps
extends: Lot
schema_version: 2
description: >-
  A prep of a plasmid from its host: its scale and method, its concentration from its
  A260 (50 µg/mL of double-stranded DNA for each unit, over 1 cm), its purity by
  A260/A280 and A260/A230, its supercoiled share and endotoxin, and how its sequence
  was checked. Open its Verification tab for the evidence, reference revision and signed outcome.
hrid: { prefix: PREP }
# How much of it is left (ADR 0139): kept by mass, drawn by volume at its
# concentration, so 2 µg of a 500 ng/µL prep is 4 µL; only its plasmid's.
amount:
  unit: ug
  label: Amount
  description: How much DNA is left.
  concentration: concentration
  material: plasmid
fields:
  plasmid:
    type: ref
    to: iki/plasmid.Plasmid
    label: Prep of
    required: true
    immutable: true
    description: The plasmid it's a prep of.
  scale:
    type: enum
    label: Prep scale
    values: [miniprep, midiprep, maxiprep, megaprep, gigaprep]
    indexed: true
    description: How large a prep it was, from a miniprep's few mL of culture to a gigaprep's litres.
  method:
    type: enum
    label: Prep method
    values: [silica_column, anion_exchange, endotoxin_free, cesium_chloride, other]
    description: >-
      How it was purified: alkaline lysis then a silica spin column, or an anion
      exchange column, with an endotoxin removal step for endotoxin_free, or by a
      caesium chloride gradient. For one not listed, choose other and name it.
  method_other:
    type: string
    label: Other prep method
    max_length: 200
    description: >-
      The lab's own purification, such as PEG precipitation then anion exchange
      (SOP-MB-031).
  kit:
    type: string
    max_length: 200
    description: The kit it was made with, such as its supplier's name for it and its lot.
  host_strain:
    type: string
    label: Host strain
    max_length: 200
    description: The strain it was grown in, such as E. coli DH5α.
  culture_volume:
    type: quantity
    unit: mL
    min: 0
    description: How much culture it was made from.
  a260:
    type: float
    label: A260
    min: 0
    description: >-
      Its absorbance at 260 nm, as read, of the dilution its dilution factor says,
      blank subtracted.
  path_length:
    type: quantity
    unit: cm
    default: 1
    min: 0
    description: >-
      The cuvette's path length, or the one a microvolume reading is given for: more
      than 0.
  dilution_factor:
    type: float
    min: 1
    default: 1
    description: How much it was diluted to be read, such as 10 for 1 in 10.
  concentration:
    type: quantity
    unit: ng/uL
    min: 0
    indexed: true
    description: >-
      Its DNA concentration, which its amount is drawn through. Worked out from its
      A260 when that's recorded, as its concentration method says; otherwise as
      measured by another assay. A transfer into it sets it to the pool's (ADR 0157),
      which a later run keeps until its A260 is read again.
  a260_concentration:
    type: quantity
    label: Concentration by A260
    unit: ng/uL
    computed: true
    min: 0
    description: >-
      What its A260 gives, while its concentration is by A260. Its concentration
      follows it when it's read again, and is emptied with it if it was what it gave;
      a pool's or one entered since is kept.
  concentration_method:
    type: enum
    label: Concentration by
    values: [a260, fluorescence, other]
    default: a260
    description: >-
      How its concentration was measured: a260 from its absorbance at 260 nm, which
      Iki works out; or by a fluorescent dye's assay (such as Qubit or PicoGreen), or
      another, entered as measured, which other names.
  concentration_method_other:
    type: string
    label: Other concentration method
    max_length: 200
    description: >-
      The lab's own concentration method, such as droplet digital PCR of the backbone.
  a260_a280:
    type: float
    label: A260/A280
    min: 0
    description: Its absorbance at 260 nm over 280 nm. Pure DNA's is about 1.8; protein lowers it.
  a260_a230:
    type: float
    label: A260/A230
    min: 0
    description: >-
      Its absorbance at 260 nm over 230 nm, usually 2.0 to 2.2 for pure DNA;
      guanidine, phenol and carbohydrate left from the prep lower it.
  supercoiled:
    type: quantity
    unit: "%"
    min: 0
    max: 100
    description: Its supercoiled share, by agarose gel or capillary electrophoresis.
  endotoxin:
    type: quantity
    unit: "{EU}/ug"
    min: 0
    description: Its endotoxin by LAL, in endotoxin units for each µg of DNA.
  verified_by:
    type: enum
    label: Sequence verified by
    values: [whole_plasmid, sanger, restriction_digest, other]
    description: >-
      How it was checked to be its plasmid: whole-plasmid sequencing, Sanger
      sequencing of its insert, a restriction digest's bands, or another way other
      names. The Verification tab links each evidence record for this physical prep.
  verified_by_other:
    type: string
    label: Verified another way
    max_length: 200
    description: >-
      How it was checked, if not listed, such as diagnostic PCR across both junctions.
rules:
  method_other_is_named:
    label: Another prep method is named
    check: (record.method == "other") == (record.method_other != null)
    message: >-
      Name the prep method when it's Other, and only then.
    fields: [method, method_other]
  concentration_method_other_is_named:
    label: Another concentration method is named
    check: (record.concentration_method == "other") == (record.concentration_method_other != null)
    message: >-
      Name the concentration method when it's Other, and only then.
    fields: [concentration_method, concentration_method_other]
  verified_by_other_is_named:
    label: Another verification is named
    check: (record.verified_by == "other") == (record.verified_by_other != null)
    message: >-
      Name the way it was verified when it's Other, and only then.
    fields: [verified_by, verified_by_other]
  path_length_is_positive:
    label: Its path length is more than 0
    check: record.path_length > 0
    message: >-
      Its path length is {{ record.path_length }} cm: an absorbance is read over a
      path longer than 0.
    fields: [path_length]
display:
  title: "{{ lot_number or hrid }}"
