# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
#
# What every lot of a protein, a complex such as an antibody, or a protein conjugate has:
# its concentration by A280, its purity and aggregates by SEC, its endotoxin. Each
# concrete type names what it's a lot of, which says where its ε280 comes from.
apiVersion: iki/v1
kind: EntityType
name: BiologicLot
label: Biologic lot
label_plural: Biologic lots
extends: Lot
abstract: true
schema_version: 2
description: >-
  A lot of a protein, a complex such as an antibody, or a protein conjugate, in
  solution: its concentration, by A280 from its ε280 or by another assay, its purity
  and aggregates by SEC, and its endotoxin.
# Each concrete type keeps its amount, by protein mass, of what it names it's a lot of.
fields:
  concentration:
    type: quantity
    unit: mg/mL
    min: 0
    indexed: true
    description: >-
      Its protein concentration, which its amount is drawn through. Worked out from its
      A280 when that's recorded, as its concentration method says; otherwise as
      measured by another assay. A transfer into it sets it to the pool's (ADR 0157),
      which a later run keeps until its A280 is read again.
  concentration_method:
    type: enum
    label: Concentration by
    values: [a280, bca, bradford, amino_acid_analysis, other]
    default: a280
    description: >-
      How its concentration was measured: a280 from its absorbance at 280 nm and its
      ε280, which Iki works out; or by another assay, entered as measured. For one not
      listed, choose other and name it.
  concentration_method_other:
    type: string
    label: Other concentration method
    max_length: 200
    description: >-
      The lab's own concentration method, with its SOP or kit, such as CE-SDS against a
      reference standard (SOP-AN-112 rev 3).
  a280:
    type: float
    label: A280
    min: 0
    description: >-
      Its absorbance at 280 nm, as read, of the dilution its dilution factor says,
      blank subtracted.
  path_length:
    type: quantity
    unit: cm
    default: 1
    min: 0
    description: >-
      The cuvette's path length, or the one a microvolume reading is given for: more
      than 0.
  dilution_factor:
    type: float
    min: 1
    default: 1
    description: How much it was diluted to be read, such as 10 for 1 in 10.
  extinction_coefficient:
    type: quantity
    label: ε280 (measured)
    unit: mL/(mg.cm)
    min: 0
    description: >-
      Its absorbance at 280 nm of 1 mg/mL over 1 cm, if it's been measured or is known
      otherwise, as a conjugate's must be: its payload absorbs too. More than 0. Left
      empty, its sequence's is used.
  a280_extinction:
    type: quantity
    label: ε280 used
    unit: mL/(mg.cm)
    computed: true
    min: 0
    description: >-
      The absorbance of 1 mg/mL over 1 cm its concentration was worked out with: its
      measured ε280, or its sequence's molar ε280 over its molecular weight.
  a280_concentration:
    type: quantity
    label: Concentration by A280
    unit: mg/mL
    computed: true
    min: 0
    description: >-
      What its A280 gives, while its concentration is by A280. Its concentration
      follows it when it's read again, and is emptied with it if it was what it gave;
      a pool's or one entered since is kept.
  purity:
    type: quantity
    label: Purity
    unit: "%"
    min: 0
    max: 100
    indexed: true
    description: >-
      Its main species as a share of every peak's area, by the method its purity method
      names: size-exclusion chromatography's main peak, unless it says otherwise.
  purity_method:
    type: string
    label: Purity by
    max_length: 200
    description: >-
      How its purity was measured, such as SEC-HPLC at 280 nm, or CE-SDS non-reduced.
      Left empty, it's the main peak by SEC.
  aggregates:
    type: quantity
    label: High molecular weight species
    unit: "%"
    min: 0
    max: 100
    description: >-
      Its aggregates, the species larger than its main one, as a share of the area, by the
      method its aggregates method names: the peaks before SEC's main peak, unless it says
      otherwise.
  aggregates_method:
    type: string
    label: Aggregates by
    max_length: 200
    description: >-
      How its aggregates were measured, such as SEC-MALS, or analytical
      ultracentrifugation. Left empty, it's SEC.
  endotoxin:
    type: quantity
    unit: "{EU}/mg"
    min: 0
    description: Its endotoxin by LAL, in endotoxin units for each mg of protein.
  buffer:
    type: string
    label: Formulation
    max_length: 300
    description: What it's in, such as 20 mM histidine, 240 mM sucrose, pH 6.0.
rules:
  concentration_method_other_is_named:
    label: Another concentration method is named
    check: (record.concentration_method == "other") == (record.concentration_method_other != null)
    message: >-
      Name the concentration method when it's Other, and only then.
    fields: [concentration_method, concentration_method_other]
  path_length_is_positive:
    label: Its path length is more than 0
    check: record.path_length > 0
    message: >-
      Its path length is {{ record.path_length }} cm: an absorbance is read over a
      path longer than 0.
    fields: [path_length]
  extinction_coefficient_is_positive:
    label: Its measured ε280 is more than 0
    check: record.extinction_coefficient > 0
    message: >-
      Its measured ε280 is {{ record.extinction_coefficient }} mL/(mg·cm): an
      absorbance gives a concentration only through an ε280 above 0.
    fields: [extinction_coefficient]
