# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
#
# A lot is a project's record of material: what was made or bought at one time of a
# registry entry, the molecule (ADR 0115). Every kind of lot extends this type, so one
# search finds them all, and each has the same disposition (ADR 0162): released by QA's
# signature, or made available by a stock keeper where the lab's procedure has no QA
# release, as for research material (ADR 0242). A lot the lab says needs QA's release
# is never made available that way (ADR 0242's amendment).
apiVersion: iki/v1
kind: EntityType
name: Lot
label: Lot
label_plural: Lots
abstract: true
# Its records are samples (ADR 0177): a project's Files finds files by them.
sample: true
schema_version: 4
description: >-
  A lot of a registered entity: what was made or bought of it at one time, which a
  label and a certificate of analysis name. The entity is the molecule, the same for
  every project; a lot is the material, each project's own, with how much of it is
  left, what was measured of it, and whether QA released it for use. Each kind of
  lot has the measurements its kind needs.
fields:
  lot_number:
    type: string
    label: Lot number
    max_length: 100
    indexed: true
    description: >-
      Its number on its label and certificate of analysis: its supplier's, for one
      bought, or the lab's own.
  source:
    type: enum
    values: [made, bought]
    indexed: true
    description: Whether the lab made it, or bought it.
  supplier:
    type: string
    max_length: 200
    indexed: true
    description: Who made or sold it, such as a synthesis vendor or a contract manufacturer.
  catalogue_number:
    type: string
    max_length: 100
    indexed: true
    description: Its supplier's catalogue number, for one bought.
  made_by:
    type: person
    label: Made by
    description: >-
      Who made it, for a lot made in the lab: needed to release it. QA releases it, not
      they, nor whoever recorded it.
  made_on:
    type: date
    label: Made on
    description: When it was made, synthesised or prepared.
  received_on:
    type: date
    label: Received on
    description: When it arrived, for a lot bought.
  retest_on:
    type: date
    label: Retest by
    description: When it's tested again to see that it still meets its specification.
  expires_on:
    type: date
    label: Expires on
    description: When it may no longer be used.
  responsible:
    type: person
    label: Responsible
    description: >-
      Who looks after it, such as whoever ordered a bought lot: told, with whoever made
      it, when it's released or made available, and when it's held or rejected.
  storage:
    type: string
    label: Storage conditions
    max_length: 200
    description: How it's kept, such as −80 °C, or 2–8 °C protected from light.
  certificates:
    type: list
    label: Certificates of analysis
    items:
      {
        type: file,
        media_types: [application/pdf, image/png, image/jpeg, text/csv],
        max_size: 50MiB,
      }
    max_items: 20
    description: >-
      Its certificates of analysis, its supplier's or the lab's, and the reports they
      cite: what QA releases it on.
  notes:
    type: text
    max_length: 10000
    description: Anything else about how it was made or tested.
  requires_qa_release:
    type: bool
    label: Needs a QA release
    default: false
    immutable: true
    description: >-
      Whether it was recorded as needing Lot QA's signed release before use: received from
      a stock item that needs one, such as a critical reagent, or marked so when it was
      recorded. Lot QA changes what applies with its QA release requirement.
  release_requirement:
    type: state
    label: QA release requirement
    initial: as_recorded
    description: >-
      Whether only Lot QA's signed release makes it usable. While it's needed, a stock
      keeper can't make it available. Only Lot QA changes it, saying why, and its history
      keeps each change.
    states:
      as_recorded:
        label: As recorded
        description: A QA release is needed if the lot was recorded as needing one.
      required:
        label: Required
        description: Only Lot QA's signed release makes it usable.
        set_by: [qa]
        reason: required
      not_required:
        label: Not required
        description: A stock keeper may make it available, under the lab's own procedure.
        set_by: [qa]
        reason: required
  disposition:
    type: state
    label: Disposition
    initial: quarantined
    description: >-
      Whether it may be used: quarantined until QA releases it, as GMP keeps material
      until it's tested and released (21 CFR 211.84), or, where the lab's procedure has
      no QA release, until a stock keeper makes it available. While it's on hold,
      rejected or expired, none of it can be drawn, transferred or split off.
    states:
      quarantined:
        label: Quarantined
        description: >-
          Made or received, and not yet released or made available. It can be drawn from
          to be tested.
        set_by: [qa]
        reason: required
        guards:
          reopened:
            description: A released lot goes back to quarantine only to correct it, saying why.
            check: state.from in ["released", "on_hold", "available", "retest_due"]
            message: A lot goes back to quarantine from Released, Available, Due for retest or On hold.
      released:
        label: Released
        description: QA released it for use. Its values can't change while it's released.
        set_by: [qa]
        locks: true
        signatures:
          - meaning: approval
            label: QA release
            statement: >-
              I release this lot for use: its records and certificate of analysis meet
              its specification.
        guards:
          from_quarantine:
            description: >-
              A lot is released from quarantine, once a hold is lifted, or once it's been
              retested.
            check: state.from in ["quarantined", "on_hold", "retest_due"]
            message: A lot is released from Quarantined, On hold or Due for retest.
          has_a_certificate:
            description: QA releases a lot on its certificate of analysis.
            check: size(record.certificates) > 0
            message: Attach its certificate of analysis before releasing it.
          says_where_it_came_from:
            description: QA releases a lot knowing whether it was made or bought.
            check: record.source != null
            message: Say whether it was made or bought before releasing it.
          names_its_maker:
            description: >-
              A lot made in the lab names who made it, so QA can see it isn't
              releasing its own work.
            check: record.source != "made" || record.made_by != null
            message: Say who made it before releasing it.
          not_its_maker:
            description: Whoever made a lot doesn't release it; a second person checks it.
            check: record.made_by == null || record.made_by != actor.person
            message: You made this lot, so someone else in QA releases it.
          not_who_recorded_it:
            description: >-
              Whoever recorded a lot made in the lab doesn't release it either: Iki knows
              who that was, whoever it says made it.
            check: record.source != "made" || history.disposition[0].by != actor.person
            message: You recorded this lot, so someone else in QA releases it.
          not_who_edited_it:
            when: record.source == "made"
            check: >-
              edits.disposition.quarantined.all(e, e.by != actor.person) &&
              edits.disposition.retest_due.all(e, e.by != actor.person)
            message: You edited this lot's record, so someone else in QA releases it.
          a_person:
            check: actor.agent == null
            message: Release it yourself, in Iki, not through an app or agent.
      available:
        label: Available
        description: >-
          In use under the lab's own procedure, without a QA release or certificate:
          research material and consumables. It isn't Released, and its values stay
          editable.
        set_by: [stock_keeper]
        reason: optional
        guards:
          not_held_by_qa:
            description: >-
              A stock keeper makes a lot available once it's received, or again after a
              hold put on it while it was available. A hold on a released or retested lot
              is lifted by QA.
            check: >-
              state.from == "quarantined" ||
              (state.from == "on_hold" && last.disposition.on_hold.from == "available")
            message: >-
              A lot is made available from Quarantined, or from On hold when it was
              available before. QA lifts its own holds.
          needs_no_qa_release:
            description: >-
              A lot that needs Lot QA's signed release, as its stock item or its record
              says, or as Lot QA required, is only ever released by QA.
            check: >-
              record.release_requirement == "not_required" ||
              (record.release_requirement == "as_recorded" && record.requires_qa_release != true)
            message: >-
              This lot needs Lot QA's signed release, so a stock keeper can't make it
              available. Lot QA releases it once it's tested.
      retest_due:
        label: Due for retest
        description: >-
          Past its retest date, and not expired: only QA sampling, until QA releases it
          again on its retest or it expires.
        set_by: [qa]
        reason: optional
        guards:
          past_its_retest_date:
            check: record.retest_on != null && record.retest_on <= today
            message: Its retest date hasn't come.
          in_use:
            check: state.from == "released" || state.from == "available"
            message: A released or available lot comes due for retest.
      on_hold:
        label: On hold
        description: >-
          Kept from use while something is looked into, such as a deviation or a
          result out of its specification.
        set_by: [qa, stock_keeper]
        reason: required
        holds_amount: true
        guards:
          not_rejected:
            check: state.from != "rejected" && state.from != "expired"
            message: A rejected or expired lot isn't put on hold.
      rejected:
        label: Rejected
        description: It doesn't meet its specification. It's kept, with its records, but not used.
        set_by: [qa]
        locks: true
        reason: required
        holds_amount: true
        signatures:
          - meaning: responsibility
            label: QA rejection
            statement: I reject this lot; it isn't to be used.
      expired:
        label: Expired
        description: >-
          Past its expiry date, or past its retest date where the lab's procedure expires
          it then rather than marking it Due for retest. It's kept, but not used.
        set_by: [qa, stock_keeper]
        locks: true
        reason: optional
        holds_amount: true
        guards:
          past_its_date:
            description: A lot expires once its expiry or retest date has come.
            check: >-
              (record.expires_on != null && record.expires_on <= today) ||
              (record.retest_on != null && record.retest_on <= today)
            message: Its expiry and retest dates haven't come, so it hasn't expired.
draws:
  purposes:
    qa_sampling: { drawn_by: [qa] }
  guards:
    expiry_date:
      check: record.expires_on == null || record.expires_on > today
      message: This lot has reached its expiry date. No material can be taken.
    retest_date:
      check: record.retest_on == null || record.retest_on > today || purpose == "qa_sampling"
      message: This lot is due for retesting. Only a QA sampling draw is allowed.
    sampling_only_in_quarantine:
      when: operation == "draw"
      check: record.disposition != "quarantined" || purpose == "qa_sampling"
      message: This lot is quarantined. Only a QA sampling draw is allowed.
rules:
  expires_after_it_was_made:
    label: It expires after it was made
    check: record.expires_on > record.made_on
    message: It expires on {{ record.expires_on }}, before it was made, on {{ record.made_on }}.
    fields: [expires_on]
  retested_before_it_expires:
    label: It's retested by its expiry
    check: record.retest_on <= record.expires_on
    message: >-
      Its retest date, {{ record.retest_on }}, is after it expires, on
      {{ record.expires_on }}.
    fields: [retest_on]
notifications:
  released:
    label: Released
    description: Whoever made a lot, and whoever's responsible for it, hear when QA releases it.
    when: { field: disposition, to: released }
    notify: { fields: [made_by, responsible], watchers: true }
    message:
      title: "{{ hrid }} was released"
      body: "QA released lot {{ lot_number or hrid }} for use."
  available:
    label: Made available
    description: >-
      Whoever made a lot, and whoever's responsible for it, hear when a stock keeper makes
      it available without a QA release.
    when: { field: disposition, to: available }
    notify: { fields: [made_by, responsible], watchers: true }
    message:
      title: "{{ hrid }} is available"
      body: "Lot {{ lot_number or hrid }} is available for use under the lab's procedure, not QA released."
  held:
    label: On hold or rejected
    description: >-
      Whoever made a lot, whoever's responsible for it, and the project's stock keepers
      hear when it's put on hold or rejected. It's required: material that can't be used
      needs following up.
    when: { field: disposition, to: [on_hold, rejected] }
    notify: { fields: [made_by, responsible], roles: [stock_keeper], watchers: true }
    required: true
    message:
      title: "{{ hrid }} is {{ disposition }}"
      body: "Lot {{ lot_number or hrid }} can't be used. Its history says why."
