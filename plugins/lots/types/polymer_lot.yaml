# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: PolymerLot
label: Polymer lot
label_plural: Polymer lots
extends: Lot
schema_version: 4
description: >-
  A lot of a synthetic polymer: one synthesis's chains, whose lengths vary, so it has
  its own molecular weight distribution: its number-average (Mn) and weight-average
  (Mw) molecular weights, and their ratio, its molar-mass dispersity (Đ = Mw/Mn,
  IUPAC 2009), and how each was measured.
hrid: { prefix: PYLOT }
amount:
  unit: mg
  label: Amount
  description: How much of it is left.
  material: polymer
fields:
  polymer:
    type: ref
    to: iki/polymer.Polymer
    label: Lot of
    required: true
    immutable: true
    description: The registered polymer design this lot contains.
  mn:
    type: quantity
    label: Mn
    unit: g/mol
    display_unit: kg/mol
    min: 0
    indexed: true
    description: Its number-average molecular weight.
  mw:
    type: quantity
    label: Mw
    unit: g/mol
    display_unit: kg/mol
    min: 0
    indexed: true
    description: Its weight-average molecular weight.
  mp:
    type: quantity
    label: Mp
    unit: g/mol
    display_unit: kg/mol
    min: 0
    description: The molecular weight at its chromatogram's peak.
  dispersity:
    type: float
    label: Đ
    computed: true
    min: 1
    indexed: true
    description: >-
      Its molar-mass dispersity, Mw/Mn (IUPAC's Đ_M, formerly the polydispersity
      index): 1 when every chain has the same molar mass, more the more their molar
      masses vary. Chains of one length but different composition, such as a
      copolymer's, can have one above 1.
  mn_method:
    type: ref
    to: MolarMassMethod
    label: Mn by
    description: >-
      How Mn was measured, from the lab's list of molar mass methods that give it: by SEC
      (GPC) against standards, by universal calibration, or with multi-angle light
      scattering, which needs none; by MALDI-TOF MS; by NMR end-group analysis; or by
      membrane or vapour pressure osmometry, which count molecules (IUPAC, 2009).
  mw_method:
    type: ref
    to: MolarMassMethod
    label: Mw by
    description: >-
      How Mw was measured, from the lab's list of molar mass methods that give it: by
      SEC, as for Mn, or MALDI-TOF MS, or by static light scattering of the whole sample
      (batch mode), or by sedimentation equilibrium in an analytical ultracentrifuge,
      which weigh molecules by their mass.
  calibration_standard:
    type: ref
    to: SECCalibrationStandard
    description: >-
      The standards a conventional SEC was calibrated with, from the lab's list: the
      molecular weights it gives are relative to theirs.
  eluent:
    type: string
    max_length: 200
    description: The SEC's solvent, such as THF at 1 mL/min, 35 °C.
rules:
  mn_method_gives_mn:
    label: Its Mn method gives Mn
    check: '"mn" in record.mn_method.averages'
    message: >-
      {{ record.mn_method.label }} doesn't give a number average: choose a method that
      counts molecules, or record it as Mw by.
    fields: [mn_method]
  mw_method_gives_mw:
    label: Its Mw method gives Mw
    check: '"mw" in record.mw_method.averages'
    message: >-
      {{ record.mw_method.label }} doesn't give a weight average: choose a method that
      weighs molecules, or record it as Mn by.
    fields: [mw_method]
  mw_is_at_least_mn:
    label: Mw is at least Mn
    check: record.mw >= record.mn
    message: >-
      Its Mw, {{ record.mw }} g/mol, is below its Mn, {{ record.mn }} g/mol: a
      weight average is never below the number average of the same chains.
    fields: [mw]
display:
  title: "{{ lot_number or hrid }}"
