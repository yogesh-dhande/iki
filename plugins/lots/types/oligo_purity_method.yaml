# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: List
name: OligoPurityMethod
label: Oligonucleotide purity method
schema_version: 1
description: >-
  How an oligonucleotide lot's purity, its full-length product's share, is measured. A
  lab list (ADR 0270).
options:
  - { code: ip_rp_hplc, label: IP-RP-HPLC, description: Ion-pair reversed-phase HPLC. }
  - { code: ae_hplc, label: AEX-HPLC, description: Anion-exchange HPLC. }
  - { code: ce, label: Capillary electrophoresis }
  - { code: lc_ms, label: LC-MS }
