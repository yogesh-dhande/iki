# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: OligoLot
label: Oligonucleotide lot
label_plural: Oligonucleotide lots
extends: Lot
schema_version: 2
description: >-
  A synthesis lot of an oligonucleotide: its scale and purification, its yield in OD
  and in nmol, its purity, and its mass by ESI-MS checked against the one its HELM
  gives, within its specification's tolerance. A lot whose mass is outside it is held
  until QA reviews it.
hrid: { prefix: OLOT }
# How much of it is left (ADR 0139): kept in nmol, drawn by volume at its
# concentration, so 5 nmol of a 100 µM solution is 50 µL; only its oligonucleotide's.
amount:
  unit: nmol
  label: Amount
  description: How much of it is left.
  concentration: concentration
  material: oligonucleotide
fields:
  oligonucleotide:
    type: ref
    to: iki/oligo.Oligonucleotide
    label: Lot of
    required: true
    immutable: true
    description: The oligonucleotide it's a lot of, whose HELM says its mass and ε260.
  synthesis_scale:
    type: quantity
    unit: umol
    min: 0
    indexed: true
    description: The scale it was synthesised at, such as 0.2 or 1 µmol, or 10 mmol for a drug's batch.
  purification:
    type: enum
    values: [desalted, cartridge, rp_hplc, ie_hplc, page]
    indexed: true
    description: >-
      How it was purified: desalted only, on a reverse-phase cartridge, by
      reverse-phase or ion-exchange HPLC, or by PAGE.
  counterion:
    type: enum
    values: [sodium, ammonium, triethylammonium]
    description: The cation its phosphates carry, such as sodium for a drug's oligonucleotide.
  yield_od:
    type: float
    label: Yield (OD260)
    min: 0
    description: >-
      How much there was, in OD260 units: its absorbance at 260 nm over 1 cm, times
      its volume in mL.
  extinction_260:
    type: quantity
    label: ε260 (given)
    unit: L/(mol.cm)
    min: 0
    description: >-
      Its molar extinction coefficient at 260 nm, such as its supplier's, for one
      whose oligonucleotide has none worked out (modified sugars or bases, ADR 0146).
      More than 0. Left empty, its oligonucleotide's is used.
  yield_amount:
    type: quantity
    label: Yield (nmol)
    unit: nmol
    computed: true
    min: 0
    description: Its yield in nmol, from its OD260 and ε260 (nmol = OD × 10⁶ / ε260).
  concentration:
    type: quantity
    unit: umol/L
    min: 0
    description: Its concentration, once it's dissolved.
  purity:
    type: quantity
    label: Purity
    unit: "%"
    min: 0
    max: 100
    indexed: true
    description: Its full-length product's share of the peak area, such as by IP-RP HPLC or CE.
  purity_method:
    type: enum
    label: Purity by
    values: [ip_rp_hplc, ae_hplc, ce, lc_ms]
    description: >-
      How its purity was measured: ion-pair reverse-phase or anion-exchange HPLC,
      capillary electrophoresis, or LC-MS.
  measured_mass:
    type: quantity
    unit: u
    min: 0
    description: Its neutral mass by ESI-MS, deconvoluted from its charge states.
  mass_basis:
    type: enum
    label: Compared with
    values: [monoisotopic, average]
    default: monoisotopic
    required: true
    description: >-
      Which of its oligonucleotide's masses its measured mass is compared with: the
      monoisotopic one, for a mass resolved to its isotopes, or the average one, for
      an unresolved peak's.
  mass_tolerance:
    type: quantity
    unit: u
    min: 0
    description: >-
      How far its measured mass may be from the expected one, as the lab's approved
      identity specification says for this instrument and basis, such as ±0.02 u for a
      resolved monoisotopic mass or ±2 u for an unresolved average one. Iki assumes
      none: a measured mass needs it.
  mass_specification:
    type: string
    label: Tolerance from
    max_length: 200
    description: >-
      The approved specification the tolerance comes from, such as its identity test's
      method and revision (SOP-AN-031 rev 4).
  expected_mass:
    type: quantity
    unit: u
    computed: true
    min: 0
    description: Its oligonucleotide's monoisotopic or average mass, as the free acid.
  mass_error:
    type: quantity
    label: Mass difference
    unit: u
    computed: true
    description: Its measured mass less its expected mass, exactly as the two differ.
# Its identity by ESI-MS is checked at every save from what's measured and what its
# oligonucleotide's HELM gives, not from the mass difference a run writes later, so a
# lot is held the moment its mass is out of its specification, or can't be checked,
# with or without its triggers on (ADR 0127, ADR 0162). Compare to the inclusive bounds of the stated tolerance.
rules:
  mass_within_tolerance:
    label: Its mass is its oligonucleotide's
    description: >-
      Identity by ESI-MS: its measured mass within its tolerance of its
      oligonucleotide's monoisotopic or average mass. A lot outside it is kept as
      measured, and held until QA reviews it.
    check: >-
      record.measured_mass <= (record.mass_basis == "average" ?
      record.oligonucleotide.molecular_weight :
      record.oligonucleotide.monoisotopic_mass) + record.mass_tolerance &&
      record.measured_mass >= (record.mass_basis == "average" ?
      record.oligonucleotide.molecular_weight :
      record.oligonucleotide.monoisotopic_mass) - record.mass_tolerance
    message: >-
      Its measured mass, {{ record.measured_mass }} Da, is outside its tolerance of
      ±{{ record.mass_tolerance }} Da of its oligonucleotide's {{ record.mass_basis }}
      mass, {{ record.mass_basis == "average" ? record.oligonucleotide.molecular_weight :
      record.oligonucleotide.monoisotopic_mass }} Da.
    fields: [measured_mass]
    hold: { reviewed_by: [qa] }
  mass_tolerance_is_stated:
    label: A measured mass has its specification's tolerance
    description: >-
      A measured mass is checked against the tolerance the lab's approved specification
      gives, which the lot names. Iki has no tolerance of its own to fall back on.
    check: record.measured_mass == null || record.mass_tolerance != null
    message: >-
      Give the mass tolerance its identity specification allows before recording its
      measured mass.
    fields: [mass_tolerance]
  mass_tolerance_names_its_specification:
    label: Its tolerance names its specification
    check: record.mass_tolerance == null || record.mass_specification != null
    message: Name the specification its mass tolerance comes from.
    fields: [mass_specification]
  mass_is_checked:
    label: Its mass is checked against its oligonucleotide's
    description: >-
      A lot whose measured mass can't be checked, because its oligonucleotide's mass
      isn't computed, is held until QA reviews its identity another way.
    check: >-
      record.measured_mass == null ||
      (record.mass_basis == "average" ? record.oligonucleotide.molecular_weight :
      record.oligonucleotide.monoisotopic_mass) != null
    message: >-
      Its measured mass can't be checked: its oligonucleotide's {{ record.mass_basis }}
      mass isn't computed, as for a monomer whose structure isn't known.
    fields: [measured_mass]
    hold: { reviewed_by: [qa] }
  extinction_260_is_positive:
    label: Its ε260 is more than 0
    check: record.extinction_260 > 0
    message: >-
      Its ε260 is {{ record.extinction_260 }} L/(mol·cm): an OD260 is nmol only through
      an ε260 above 0.
    fields: [extinction_260]
display:
  title: "{{ lot_number or hrid }}"
