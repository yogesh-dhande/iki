# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Action
name: number_chains
label: Number antibody chains (ANARCI)
description: >-
  Finds the antibody variable domains in proteins, with ANARCI, numbers them in
  the scheme chosen, and gives their CDRs by the definition chosen, the species
  they're closest to, the human germline V and J genes they're closest to, and
  how much of the V region is the same: their humanness. An scFv's chain has two
  domains, a heavy and a light one. A protein without one is left as it was, and
  the run says so. The species and genes are assignments against ANARCI's
  IMGT germlines, which the chain records as its germline set. What it finds
  is the project's record of each protein, so numbering it again, in another
  scheme, replaces it there. A chain whose sequence liabilities were found
  (find_liabilities) on another scheme or CDR definition has that screen
  cleared, since its numbers and regions were that numbering's: screen it
  again to find them on this one.
inputs:
  protein: { type: iki/protein.Protein, schema_version: ">=2", label: Chain }
params:
  scheme:
    type: enum
    values: [imgt, kabat, chothia, martin, aho]
    default: imgt
    description: >-
      How residues are numbered: IMGT's, Kabat's, Chothia's, Martin's (enhanced
      Chothia) or AHo's numbering.
  cdr_definition:
    type: enum
    values: [imgt, kabat, chothia, abm, contact]
    description: >-
      Where the CDRs are: IMGT's, Kabat's, Chothia's, AbM's or Contact's
      definition, each read in the numbering it's published in, so it finds
      the same residues whichever scheme numbers the chain. Without one, the
      scheme's own: Chothia's for Martin's numbering, and IMGT's for AHo's,
      which defines none.
effects:
  updates:
    protein:
      fields:
        - chain_type
        - species
        - germline_set
        - numbering_scheme
        - cdr_definition
        - cdr_h1
        - cdr_h2
        - cdr_h3
        - cdr_l1
        - cdr_l2
        - cdr_l3
        - heavy_v_gene
        - heavy_germline_identity
        - heavy_j_gene
        - light_v_gene
        - light_germline_identity
        - light_j_gene
        - variable_domains
        - liability_screen
        - liabilities
        - liability_counts
        - liability_count
software:
  - { name: ANARCI, version: "2026.2.13.2", url: https://github.com/oxpig/ANARCI }
  - { name: HMMER, version: "3.4", url: https://github.com/EddyRivasLab/hmmer }
runs_on: { tier: container, environment: numbering-tools }
command: [python, ./scripts/numbering.py]
deterministic: true
batchable: 500
timeout: 10m
