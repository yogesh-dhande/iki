# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Action
name: assemble
label: Assemble an antibody
description: >-
  Registers the antibody that a heavy chain and a light chain make, or that one
  chain is for a VHH or an scFv. An antibody already in Iki with the same chains
  is reused. The chains must have been numbered (number_chains): where their
  variable domains end, and which of IMGT's human constant domains follow,
  say whether they have the constant regions the format says they do. Where
  the heavy chain has a constant region, it says the isotype: aligned with
  IMGT's human constant regions (Biopython's pairwise aligner, BLOSUM62),
  it's the one it matches. For `other`, a heavy chain without numbered
  variable domains, such as an Fc fusion's, is compared whole. Its parts are
  its chains, two copies of each for an IgG and one for a Fab, an Fv, an scFv
  or a VHH, and for an IgG1 or an IgG4 its chains' disulfides are given as the
  subclass places them: each light chain to its heavy chain, and the heavy
  chains to each other at the hinge. A bond one of whose cysteines a chain
  hasn't is left out and said, and its bond map says whether its bonds are
  all it has: not an IgG2's or IgG3's between its chains, which aren't given,
  and only the predominant form's for a native IgG4's hinge. An IgM's chains
  make one of its subunits: its pentamer or hexamer is a protein complex. A
  constant region no human reference matches, such as a mouse's, keeps the
  isotype and species given, which must be one that species has.
inputs:
  heavy_chain: { type: iki/protein.Protein, schema: ">=2", label: Heavy chain }
  light_chain: { type: iki/protein.Protein, schema: ">=2", label: Light chain, optional: true }
params:
  name:
    type: string
    max_length: 255
    description: Its name. Without one, it's named after its chains.
  format:
    type: enum
    values: [igg, fab, fv, scfv, vhh, other]
    default: igg
    description: >-
      igg a whole IgG, fab one arm of one, fv the heavy and light variable
      domains alone, scfv both on one chain, vhh a single domain, other
      anything else.
  isotype:
    type: enum
    values: [igg1, igg2, igg2a, igg2b, igg2c, igg3, igg4, igg, iga1, iga2, iga, igm, ige, igd]
    description: >-
      Its heavy chain constant region's class, as its species names it: IgG or
      one of its subclasses for an IgG; none for an Fv, scFv or VHH. Left out,
      it's the heavy chain's human constant region's, where it has one; given,
      it must be that. For a constant region no human one matches, give it with
      its species.
  constant_species:
    type: enum
    values: [human, mouse, rat, rabbit]
    label: Constant region species
    description: >-
      The species of the heavy chain's constant region. Left out, it's human
      when the chain matches a human constant region. Give it for a mouse's,
      rat's or rabbit's, whose isotype is then as given.
  target: { type: string, max_length: 255, description: What it binds. }
  copies:
    type: int
    min: 1
    max: 2
    description: >-
      How many copies of each chain, for `other` only: two for a chain with an
      Fc's CH3 (or an IgM's or IgE's CH4), which pairs, and one without, such as
      an isolated CH2, if left out.
effects:
  creates: [{ type: Antibody, cardinality: one, derived_from: [heavy_chain, light_chain] }]
software:
  - { name: Biopython, version: "1.88", url: https://biopython.org }
runs_on: { tier: backend, environment: antibody-tools }
command: [python, ./scripts/antibodies.py, assemble]
deterministic: true
timeout: 5m
