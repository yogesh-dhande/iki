apiVersion: iki/v1
kind: ActionTest
name: the_isotype_is_the_heavy_chains
description: >-
  Without an isotype, trastuzumab's is read off its heavy chain's constant
  region: IgG1's, IMGT's IGHG1*01 (EMBL J00228) but for its allotype's E356
  and M358 (EU numbering) where IGHG1*01 has D and L, and without the
  C-terminal lysine.
action: assemble
inputs:
  heavy_chain:
    - values:
        name: trastuzumab heavy chain
        sequence: 
        variable_domains:
          - { chain: H, start: 1, end: 120, numbering: [], closest: {}, human: {} }
  light_chain:
    - values:
        name: trastuzumab light chain
        sequence: DIQMTQSPSSLSASVGDRVTITCRASQDVNTAVAWYQQKPGKAPKLLIYSASFLYSGVPSRFSGSRSGTDFTLTISSLQPEDFATYYCQQHYTTPPTFGQGTKVEIKRTVAAPSVFIFPPSDEQLKSGTASVVCLLNNFYPREAKVQWKVDNALQSGNSQESVTEQDSKDSTYSLSSTLTLSKADYEKHKVYACEVTHQGLSSPVTKSFNRGEC
        variable_domains:
          - { chain: K, start: 1, end: 107, numbering: [], closest: {}, human: {} }
params: { target: HER2 }
expect:
  output:
    creates:
      - values:
          format: igg
          isotype: igg1
    messages:
      - level: info
        text: "Its isotype is igg1, from its heavy chain: trastuzumab heavy chain's constant region is IgG1's, 99.4% identical to IMGT's IGHG1*01 (J00228) over 329 residues; the next nearest, IgG2's, is 91.8%."
      - level: info
        text: "Its chains' disulfides, as its subclass places them: H223-L214, H′223-L′214, H229-H′229, H232-H′232."
---
