# Run with `iki plugin test plugins/antibody --with plugins/dna --with plugins/protein` (ADR 0093).
apiVersion: iki/v1
kind: ActionTest
name: trastuzumab
description: >-
  Trastuzumab (KEGG D03257): its whole heavy chain, an IgG1's, 120 residues of
  variable domain then CH1, hinge, CH2 and CH3, and its whole kappa light chain.
  The chains are numbered as number_chains leaves them (their residues' numbers
  left out), which says where the variable domains end.
action: assemble
inputs:
  heavy_chain:
    - values:
        name: trastuzumab heavy chain
        sequence: 
        variable_domains:
          - { chain: H, start: 1, end: 120, numbering: [], closest: {}, human: {} }
  light_chain:
    - values:
        name: trastuzumab light chain
        sequence: DIQMTQSPSSLSASVGDRVTITCRASQDVNTAVAWYQQKPGKAPKLLIYSASFLYSGVPSRFSGSRSGTDFTLTISSLQPEDFATYYCQQHYTTPPTFGQGTKVEIKRTVAAPSVFIFPPSDEQLKSGTASVVCLLNNFYPREAKVQWKVDNALQSGNSQESVTEQDSKDSTYSLSSTLTLSKADYEKHKVYACEVTHQGLSSPVTKSFNRGEC
        variable_domains:
          - { chain: K, start: 1, end: 107, numbering: [], closest: {}, human: {} }
params: { isotype: igg1, target: HER2 }
expect:
  output:
    creates:
      - type: iki/antibody.Antibody
        values:
          heavy_chain: 00000000-0000-7000-8003-000000000001
          light_chain: 00000000-0000-7000-8003-000000000002
          name: trastuzumab heavy chain / trastuzumab light chain
          format: igg
          isotype: igg1
          target: HER2
        derived_from:
          - 00000000-0000-7000-8003-000000000001
          - 00000000-0000-7000-8003-000000000002
---
apiVersion: iki/v1
kind: ActionTest
name: trastuzumabs_fv
description: >-
  Trastuzumab's variable domains alone (PDB 1N8Z's): an Fv, with no constant
  region, so no isotype.
action: assemble
inputs:
  heavy_chain:
    - values:
        name: trastuzumab VH
        sequence: EVQLVESGGGLVQPGGSLRLSCAASGFNIKDTYIHWVRQAPGKGLEWVARIYPTNGYTRYADSVKGRFTISADTSKNTAYLQMNSLRAEDTAVYYCSRWGGDGFYAMDYWGQGTLVTVSS
        variable_domains:
          - { chain: H, start: 1, end: 120, numbering: [], closest: {}, human: {} }
  light_chain:
    - values:
        name: trastuzumab VL
        sequence: DIQMTQSPSSLSASVGDRVTITCRASQDVNTAVAWYQQKPGKAPKLLIYSASFLYSGVPSRFSGSRSGTDFTLTISSLQPEDFATYYCQQHYTTPPTFGQGTKVEIK
        variable_domains:
          - { chain: K, start: 1, end: 107, numbering: [], closest: {}, human: {} }
params: { format: fv, target: HER2 }
expect:
  output:
    creates:
      - values:
          heavy_chain: 00000000-0000-7000-8003-000000000001
          light_chain: 00000000-0000-7000-8003-000000000002
          name: trastuzumab VH / trastuzumab VL
          format: fv
          target: HER2
---
apiVersion: iki/v1
kind: ActionTest
name: trastuzumabs_fab
description: >-
  Trastuzumab's Fab: its heavy chain to the cysteine that bonds the light chain
  (H223, KEGG D03257), so CH1 but no Fc, and its whole light chain.
action: assemble
inputs:
  heavy_chain:
    - values:
        name: trastuzumab Fd
        sequence: EVQLVESGGGLVQPGGSLRLSCAASGFNIKDTYIHWVRQAPGKGLEWVARIYPTNGYTRYADSVKGRFTISADTSKNTAYLQMNSLRAEDTAVYYCSRWGGDGFYAMDYWGQGTLVTVSSASTKGPSVFPLAPSSKSTSGGTAALGCLVKDYFPEPVTVSWNSGALTSGVHTFPAVLQSSGLYSLSSVVTVPSSSLGTQTYICNVNHKPSNTKVDKKVEPKSC
        variable_domains:
          - { chain: H, start: 1, end: 120, numbering: [], closest: {}, human: {} }
  light_chain:
    - values:
        name: trastuzumab light chain
        sequence: DIQMTQSPSSLSASVGDRVTITCRASQDVNTAVAWYQQKPGKAPKLLIYSASFLYSGVPSRFSGSRSGTDFTLTISSLQPEDFATYYCQQHYTTPPTFGQGTKVEIKRTVAAPSVFIFPPSDEQLKSGTASVVCLLNNFYPREAKVQWKVDNALQSGNSQESVTEQDSKDSTYSLSSTLTLSKADYEKHKVYACEVTHQGLSSPVTKSFNRGEC
        variable_domains:
          - { chain: K, start: 1, end: 107, numbering: [], closest: {}, human: {} }
params: { format: fab, isotype: igg1 }
expect:
  output:
    creates:
      - values:
          heavy_chain: 00000000-0000-7000-8003-000000000001
          light_chain: 00000000-0000-7000-8003-000000000002
          name: trastuzumab Fd / trastuzumab light chain
          format: fab
          isotype: igg1
---
apiVersion: iki/v1
kind: ActionTest
name: variable_domains_arent_an_igg
description: >-
  Two variable domains have no constant regions, so they can't be an IgG1: the
  same chains would be one antibody whatever isotype each assembly claimed.
action: assemble
inputs:
  heavy_chain:
    - values:
        name: trastuzumab VH
        sequence: EVQLVESGGGLVQPGGSLRLSCAASGFNIKDTYIHWVRQAPGKGLEWVARIYPTNGYTRYADSVKGRFTISADTSKNTAYLQMNSLRAEDTAVYYCSRWGGDGFYAMDYWGQGTLVTVSS
        variable_domains:
          - { chain: H, start: 1, end: 120, numbering: [], closest: {}, human: {} }
  light_chain:
    - values:
        name: trastuzumab VL
        sequence: DIQMTQSPSSLSASVGDRVTITCRASQDVNTAVAWYQQKPGKAPKLLIYSASFLYSGVPSRFSGSRSGTDFTLTISSLQPEDFATYYCQQHYTTPPTFGQGTKVEIK
        variable_domains:
          - { chain: K, start: 1, end: 107, numbering: [], closest: {}, human: {} }
params: { isotype: igg1 }
expect:
  error: "A whole antibody (IgG) has a light chain with a constant domain, and trastuzumab VL has 0 residues after its variable domain: if it's the variable domains alone, choose fv."
---
