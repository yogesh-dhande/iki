apiVersion: iki/v1
kind: ActionTest
name: variable_domains_arent_an_igg
description: >-
  Two variable domains have no constant regions, so they can't be an IgG1: the
  same chains would be one antibody whatever isotype each assembly claimed.
action: assemble
inputs:
  heavy_chain:
    - values:
        name: trastuzumab VH
        sequence: EVQLVESGGGLVQPGGSLRLSCAASGFNIKDTYIHWVRQAPGKGLEWVARIYPTNGYTRYADSVKGRFTISADTSKNTAYLQMNSLRAEDTAVYYCSRWGGDGFYAMDYWGQGTLVTVSS
        variable_domains:
          - { chain: H, start: 1, end: 120, numbering: [], closest: {}, human: {} }
  light_chain:
    - values:
        name: trastuzumab VL
        sequence: DIQMTQSPSSLSASVGDRVTITCRASQDVNTAVAWYQQKPGKAPKLLIYSASFLYSGVPSRFSGSRSGTDFTLTISSLQPEDFATYYCQQHYTTPPTFGQGTKVEIK
        variable_domains:
          - { chain: K, start: 1, end: 107, numbering: [], closest: {}, human: {} }
params: { isotype: igg1 }
expect:
  error: "A whole antibody (IgG) has a light chain with a constant domain, and trastuzumab VL has 0 residues after its variable domain: if it's the variable domains alone, choose fv."
