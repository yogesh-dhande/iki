# Run with `iki plugin test plugins/antibody --with plugins/dna --with plugins/protein` (ADR 0093).
apiVersion: iki/v1
kind: ActionTest
name: trastuzumab
description: >-
  Trastuzumab (KEGG D03257): its whole heavy chain, an IgG1's, 120 residues of
  variable domain then CH1, hinge, CH2 and CH3, and its whole kappa light chain,
  two copies of each, joined by the disulfides KEGG lists: each light chain's
  C214 to its heavy chain's C223 (EU C220), and the heavy chains' C229 and C232
  (EU C226 and C229) to each other.
  The chains are numbered as number_chains leaves them (their residues' numbers
  left out), which says where the variable domains end.
action: assemble
inputs:
  heavy_chain:
    - values:
        name: trastuzumab heavy chain
        sequence: 
        variable_domains:
          - { chain: H, start: 1, end: 120, numbering: [], closest: {}, human: {} }
  light_chain:
    - values:
        name: trastuzumab light chain
        sequence: DIQMTQSPSSLSASVGDRVTITCRASQDVNTAVAWYQQKPGKAPKLLIYSASFLYSGVPSRFSGSRSGTDFTLTISSLQPEDFATYYCQQHYTTPPTFGQGTKVEIKRTVAAPSVFIFPPSDEQLKSGTASVVCLLNNFYPREAKVQWKVDNALQSGNSQESVTEQDSKDSTYSLSSTLTLSKADYEKHKVYACEVTHQGLSSPVTKSFNRGEC
        variable_domains:
          - { chain: K, start: 1, end: 107, numbering: [], closest: {}, human: {} }
params: { isotype: igg1, target: HER2 }
expect:
  output:
    creates:
      - type: iki/antibody.Antibody
        values:
          components:
            - { part: 00000000-0000-7000-8003-000000000001, copies: 2, role: heavy }
            - { part: 00000000-0000-7000-8003-000000000002, copies: 2, role: light }
          name: trastuzumab heavy chain / trastuzumab light chain
          format: igg
          isotype: igg1
          target: HER2
          # KEGG DRUG D03257's inter-chain bridges: H223-L214, H229-H'229 and H232-H'232.
          bonds:
            - {
                kind: disulfide,
                part: 00000000-0000-7000-8003-000000000001,
                copy: 1,
                residue: 223,
                partner: 00000000-0000-7000-8003-000000000002,
                partner_copy: 1,
                partner_residue: 214,
              }
            - {
                kind: disulfide,
                part: 00000000-0000-7000-8003-000000000001,
                copy: 2,
                residue: 223,
                partner: 00000000-0000-7000-8003-000000000002,
                partner_copy: 2,
                partner_residue: 214,
              }
            - {
                kind: disulfide,
                part: 00000000-0000-7000-8003-000000000001,
                copy: 1,
                residue: 229,
                partner: 00000000-0000-7000-8003-000000000001,
                partner_copy: 2,
                partner_residue: 229,
              }
            - {
                kind: disulfide,
                part: 00000000-0000-7000-8003-000000000001,
                copy: 1,
                residue: 232,
                partner: 00000000-0000-7000-8003-000000000001,
                partner_copy: 2,
                partner_residue: 232,
              }
        derived_from:
          - 00000000-0000-7000-8003-000000000001
          - 00000000-0000-7000-8003-000000000002
---
