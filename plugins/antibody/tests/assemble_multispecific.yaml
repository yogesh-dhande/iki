# Run with `iki plugin test plugins/antibody --with plugins/dna --with plugins/protein` (ADR 0093).
#
# Each antibody's chains are KEGG DRUG's, numbered as number_chains leaves them (their
# residues' numbers left out): each VH ends at its J region's VTVSS and each VL at its
# FGxGTKLEIK, IMGT's 128 and 127.
apiVersion: iki/v1
kind: ActionTest
name: emicizumab
description: >-
  Emicizumab (KEGG DRUG D10821), an IgG4 whose two heavy chains, anti-factor
  IXa (448 residues) and anti-factor X (444), as Japan's PMDA's review report
  gives them, share one kappa light chain: two copies of it, one for each arm.
  Its heavy chains are made to pair by charge pairs, E356K in the anti-FIXa
  chain and K439E in the anti-FX chain (EU numbering), and its disulfides are
  KEGG's: H137-L214, h133-L'214, H229-h225 and H232-h228.
action: assemble_multispecific
inputs:
  heavy_chain:
    - values:
        name: emicizumab anti-FIXa heavy chain
        sequence: 
        variable_domains:
          - { chain: H, start: 1, end: 123, numbering: [], closest: {}, human: {} }
  second_heavy_chain:
    - values:
        name: emicizumab anti-FX heavy chain
        sequence: 
        variable_domains:
          - { chain: H, start: 1, end: 119, numbering: [], closest: {}, human: {} }
  light_chain:
    - values:
        name: emicizumab light chain
        sequence: DIQMTQSPSSLSASVGDRVTITCKASRNIERQLAWYQQKPGQAPELLIYQASRKESGVPDRFSGSRYGTDFTLTISSLQPEDIATYYCQQYSDPPLTFGGGTKVEIKRTVAAPSVFIFPPSDEQLKSGTASVVCLLNNFYPREAKVQWKVDNALQSGNSQESVTEQDSKDSTYSLSSTLTLSKADYEKHKVYACEVTHQGLSSPVTKSFNRGEC
        variable_domains:
          - { chain: K, start: 1, end: 107, numbering: [], closest: {}, human: {} }
params: { name: emicizumab, targets: [F9, F10] }
expect:
  output:
    creates:
      - type: iki/antibody.MultispecificAntibody
        values:
          name: emicizumab
          components:
            - { part: 00000000-0000-7000-8003-000000000001, copies: 1, role: heavy }
            - { part: 00000000-0000-7000-8003-000000000002, copies: 1, role: heavy }
            - { part: 00000000-0000-7000-8003-000000000003, copies: 2, role: light }
          binding_sites:
            - {
                heavy: 00000000-0000-7000-8003-000000000001,
                domain: 1,
                light: 00000000-0000-7000-8003-000000000003,
                target: F9,
              }
            - {
                heavy: 00000000-0000-7000-8003-000000000002,
                domain: 1,
                light: 00000000-0000-7000-8003-000000000003,
                target: F10,
              }
          bonds:
            - {
                kind: disulfide,
                part: 00000000-0000-7000-8003-000000000001,
                copy: 1,
                residue: 137,
                partner: 00000000-0000-7000-8003-000000000003,
                partner_copy: 1,
                partner_residue: 214,
              }
            - {
                kind: disulfide,
                part: 00000000-0000-7000-8003-000000000002,
                copy: 1,
                residue: 133,
                partner: 00000000-0000-7000-8003-000000000003,
                partner_copy: 2,
                partner_residue: 214,
              }
            - {
                kind: disulfide,
                part: 00000000-0000-7000-8003-000000000001,
                copy: 1,
                residue: 229,
                partner: 00000000-0000-7000-8003-000000000002,
                partner_copy: 1,
                partner_residue: 225,
              }
            - {
                kind: disulfide,
                part: 00000000-0000-7000-8003-000000000001,
                copy: 1,
                residue: 232,
                partner: 00000000-0000-7000-8003-000000000002,
                partner_copy: 1,
                partner_residue: 228,
              }
          isotype: igg4
          fc_pairing: charge_pairs
        derived_from:
          [
            00000000-0000-7000-8003-000000000001,
            00000000-0000-7000-8003-000000000002,
            00000000-0000-7000-8003-000000000003,
          ]
