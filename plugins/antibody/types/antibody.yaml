# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
#
# A two-chain antibody is a specific complex (ADR 0161): its parts are a heavy chain and a
# light chain, each with its copies, so it's found by searching complexes, and a complex of
# the same parts registered as another type is this antibody's entry.
apiVersion: iki/v1
kind: EntityType
name: Antibody
label: Antibody
label_plural: Antibodies
extends: iki/core.Complex
schema_version: 4
description: >-
  An antibody by the proteins that are its chains: at most one kind of heavy
  chain and one of light chain, each with its copies. Two copies of each for a
  whole IgG and one for a Fab or an Fv; one chain for a single-domain antibody
  (a VHH) or an scFv; and for other, any one chain or pair, such as an Fc
  fusion's chain, or blinatumomab's, two scFvs of two specificities on one
  chain. Two with the same chains and copies are the same antibody, so
  assembling one again finds its registry entry. Its format and isotype are its
  chains': an IgG1 and an IgG4 of the same variable domains have different
  heavy chains, so they're different antibodies, and a heavy and a light
  variable domain alone are an Fv. One of more kinds of chain, such as a
  bispecific IgG's two heavy and two light chains, or more copies, such as an
  IgM pentamer's ten of each and its J chain, is a protein complex.
hrid: { prefix: ABY }
# Its parts are its chains (ADR 0164): a heavy chain, and a light chain unless it's a VHH
# or an scFv, each a protein.
refines:
  components:
    roles:
      heavy:
        label: Heavy chain
        min: 1
        max: 1
        to: { part: iki/protein.Protein }
      light:
        label: Light chain
        max: 1
        to: { part: iki/protein.Protein }
fields:
  format:
    type: enum
    registry: derived
    values: [igg, fab, fv, scfv, vhh, other]
    default: igg
    required: true
    indexed: true
    description: >-
      What its chains make: igg a whole IgG (two heavy chains with CH1, hinge,
      CH2 and CH3, and two light chains with their constant domain), fab one arm
      of one (CH1 but no Fc), fv the heavy and light variable domains alone, on
      two chains, scfv both on one chain, vhh a single domain (a camelid's, or a
      nanobody), and other anything else, such as a VHH fused to an Fc.
  isotype:
    type: enum
    registry: fact
    values: [igg1, igg2, igg2a, igg2b, igg2c, igg3, igg4, igg, iga1, iga2, iga, igm, ige, igd]
    indexed: true
    description: >-
      Its heavy chain constant region's class and subclass, which its heavy
      chain's sequence carries, as its constant region's species names them:
      igg1 to igg4, iga1 and iga2 for a human's; igg1, igg2a, igg2b, igg2c and
      igg3 for a mouse's; igg1, igg2a, igg2b and igg2c for a rat's; igg for a
      rabbit's one IgG; and iga where a species' IgA isn't split by subclass
      here. An IgG's is one of IgG's, a Fab's or another format's with a
      constant region any, and an Fv, scFv or VHH has none. A registry fact:
      given once, then changed only by its registrars.
  constant_species:
    type: enum
    registry: fact
    values: [human, mouse, rat, rabbit]
    label: Constant region species
    indexed: true
    description: >-
      The species whose constant region the heavy chain has, which names its
      isotype: a chimeric antibody's mouse variable domains on a human IgG1 is
      human here. `assemble` gives human when the chain matches a human
      constant region, and takes another species as given. A registry fact.
  target:
    type: string
    max_length: 255
    indexed: true
    description: What it binds, such as HER2 or PD-1.
# What its format says of its chains, their copies and its isotype, kept at every save,
# however it's registered: by `assemble`, through the API, by a bulk import or in a bundle
# (ADR 0127). Whether a chain has the constant region its format and isotype say is
# `assemble`'s check: it reads where the chain's variable domains end, which is each
# project's record's numbering, not the registry entry a reference holds.
rules:
  stated_bonds_name_their_source:
    label: Curated and observed bonds name their source
    description: >-
      Bonds read from a source or seen in this molecule say where, so a
      reader can tell them from bonds placed by its kind's pattern.
    check: record.bonds_source != null
    when: record.bonds_from == "curated" || record.bonds_from == "observed"
    message: >-
      Give the source of its {{ record.bonds_from }} bonds as a link: the
      database entry, structure or publication that records them, or the
      peptide map that saw them.
    fields: [bonds_source]
  paired_formats_have_a_light_chain:
    label: An IgG, a Fab and an Fv have a light chain
    check: record.components.exists(c, c.role == "light")
    when: record.format in ["igg", "fab", "fv"]
    message: >-
      An IgG, a Fab and an Fv have a light chain: give one, or choose vhh or
      scfv for an antibody of one chain.
    fields: [components]
  single_chain_formats_have_one_chain:
    label: A VHH and an scFv have one chain
    check: '!record.components.exists(c, c.role == "light")'
    when: record.format in ["vhh", "scfv"]
    message: A VHH and an scFv have one chain, so no light chain.
    fields: [components]
  an_igg_has_two_of_each_chain:
    label: An IgG has two copies of each chain
    description: >-
      A whole IgG is two heavy chains, joined at the hinge, each with its light
      chain.
    check: record.components.all(c, c.copies == 2)
    when: record.format == "igg"
    message: >-
      A whole IgG has two copies of its heavy chain and two of its light chain:
      give copies 2 for each.
    fields: [components]
  one_arm_has_one_of_each_chain:
    label: A Fab, an Fv, an scFv and a VHH have one copy of each chain
    check: record.components.all(c, c.copies == 1)
    when: record.format in ["fab", "fv", "scfv", "vhh"]
    message: >-
      A Fab, an Fv, an scFv and a VHH are one binding site, so one copy of each
      chain: for two, choose igg or other.
    fields: [components]
  no_isotype_without_a_constant_region:
    label: An Fv, scFv or VHH has no isotype
    description: >-
      An isotype is a heavy chain constant region's class, and these formats
      are variable domains alone.
    check: '!(record.format in ["fv", "scfv", "vhh"])'
    when: record.isotype != null
    message: >-
      An Fv, scFv or VHH has no constant region, so no isotype: leave it out,
      or choose the format its chains are.
    fields: [isotype]
  no_constant_species_without_a_constant_region:
    label: An Fv, scFv or VHH has no constant region species
    check: '!(record.format in ["fv", "scfv", "vhh"])'
    when: record.constant_species != null
    message: >-
      An Fv, scFv or VHH has no constant region, so no constant region
      species: leave it out, or choose the format its chains are.
    fields: [constant_species]
  an_iggs_isotype_is_a_subclass:
    label: An IgG's isotype is IgG's
    check: record.isotype in ["igg1", "igg2", "igg2a", "igg2b", "igg2c", "igg3", "igg4", "igg"]
    when: record.format == "igg" && record.isotype != null
    message: >-
      An IgG's isotype is IgG or one of its subclasses, not {{ record.isotype }}:
      for a whole antibody of another class, choose other.
    fields: [isotype]
  the_isotype_is_its_species:
    label: The isotype is one its constant region's species has
    description: >-
      Subclasses are named per species, as IMGT's Repertoire names each
      species' IGHC genes: a mouse has IgG2a, IgG2b and IgG2c but no IgG2 or
      IgG4, a rat no IgG3, and a rabbit one IgG and no IgD.
    check: >-
      record.constant_species == "human" ?
        record.isotype in ["igg1", "igg2", "igg3", "igg4", "iga1", "iga2", "igm", "ige", "igd"] :
      record.constant_species == "mouse" ?
        record.isotype in ["igg1", "igg2a", "igg2b", "igg2c", "igg3", "iga", "igm", "ige", "igd"] :
      record.constant_species == "rat" ?
        record.isotype in ["igg1", "igg2a", "igg2b", "igg2c", "iga", "igm", "ige", "igd"] :
      record.isotype in ["igg", "iga", "igm", "ige"]
    when: record.isotype != null && record.constant_species != null
    message: >-
      A {{ record.constant_species }} constant region has no {{ record.isotype }}:
      give the isotype as that species names it.
    fields: [isotype, constant_species]
display:
  title: "{{ name or hrid }}"
