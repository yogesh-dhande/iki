# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: Antibody
label: Antibody
label_plural: Antibodies
schema_version: 1
description: >-
  An antibody, by the proteins that are its chains: a heavy chain and a light
  chain, or for a single-domain antibody (a VHH) or an scFv, one chain. Two with
  the same chains are the same antibody, so assembling one again reuses it.
hrid: { prefix: ABY }
identity: [heavy_chain, light_chain]
on_duplicate: reuse
fields:
  heavy_chain:
    type: ref
    to: iki/protein.Protein
    required: true
    immutable: true
    description: >-
      Its heavy chain. For an scFv, its one chain, with both variable domains;
      for a VHH, its one domain.
  light_chain:
    type: ref
    to: iki/protein.Protein
    immutable: true
    description: Its light chain. A VHH or an scFv has none.
  name: { type: string, max_length: 255, indexed: true }
  description: { type: text, max_length: 10000 }
  format:
    type: enum
    values: [igg, fab, scfv, vhh, other]
    default: igg
    required: true
    indexed: true
    description: >-
      igg is a whole antibody, fab one arm of it, scfv the two variable domains
      on one chain, vhh a single domain (a camelid's, or a nanobody).
  isotype:
    type: enum
    values: [igg1, igg2, igg3, igg4, iga1, iga2, igm, ige, igd]
    indexed: true
    description: Its heavy chain's constant region, for a whole antibody or a Fab.
  target:
    type: string
    max_length: 255
    indexed: true
    description: What it binds, such as HER2 or PD-1.
display:
  title: "{{ name or hrid }}"
