apiVersion: iki/v1
kind: ActionTest
name: a_rearrangement_of_unknown_productivity_is_linked_with_a_warning
description: >-
  AIRR writes a null productive as an empty cell; the link is made, and the run says the curator
  should check it.
action: link_rearrangement
files: { data: tests/data/airr-standards-productive.tsv }
inputs:
  result:
    - values:
        format: airr
        report: { $file: data }
        report_sha256: 9ec489bd85648f11537650b1114e88132aa89a28ef3fa460d3f339fcefb05af4
        summary: { selector: "" }
  antibody:
    - values: { name: IGHV4-31 clone }
params:
  sequence_id: IVKNQEJ01EI5S4
expect:
  output:
    creates:
      - type: iki/antibody_rearrangements.AntibodyRearrangement
        values:
          sequence_id: IVKNQEJ01EI5S4
          locus: IGH
          nonproductive_reason: null
    messages:
      - level: warning
        text: >-
          The report doesn't say whether 'IVKNQEJ01EI5S4' is productive: check that it's in frame
          and without a stop codon, since only a productive rearrangement encodes a chain.
