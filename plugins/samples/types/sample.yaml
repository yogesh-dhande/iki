# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: Sample
label: Sample
abstract: true
schema_version: 2
sample: true
description: >-
  A portion drawn from one tube or lot for identified work, with its measurements. Each
  kind of sample is a testing procedure the lab chooses as it creates one.
draws:
  received: receipt
due: due_on
fields:
  source: { type: ref, to: [iki/inventory.Tube, iki/lots.Lot], required: true, immutable: true }
  purpose:
    type: ref
    to: iki/core.Entity
    immutable: true
    description: The request, plate or other work this sample was taken for.
  run:
    type: string
    label: Run
    pattern: "^RUN-[0-9]+$"
    immutable: true
    description: The run this sample was taken for, when the work is an action run.
  receipt: { type: json, computed: true, label: Material draw }
  measurements:
    type: list
    max_items: 200
    items:
      type: row
      fields:
        method: { type: string, required: true, max_length: 150 }
        value:
          {
            type: string,
            required: true,
            max_length: 250,
            description: The observation as reported.,
          }
        unit: { type: string, max_length: 40 }
        notes: { type: text }
  notes: { type: text }
  due_on: { type: date }
rules:
  identified_work:
    check: (record.purpose != null) != (record.run != null)
    message: Identify the work with either a record or a run.
    fields: [purpose, run]
