apiVersion: iki/v1
kind: Plugin
name: iki/qc_release
version: 0.3.0
title: QC release testing
description: Effective-dated lot specifications, out-of-specification investigations and signed certificates of analysis.
license: Apache-2.0
iki: ">=0.1"
homepage: https://ikisci.org/plugins/qc_release
starters: { lot-release-testing: "1.0.0" }
dependencies:
  iki/lots:
    types: { Lot: ">=2" }
  iki/plate_assays:
    types: { AssayResult: ">=2" }
settings:
  review_flow:
    type: enum
    label: Release testing review
    values: [research, regulated_qc]
    default: research
    description: >-
      The deployment's default for projects that haven't chosen one with the Lot release
      testing starter. A release case keeps the flow it was opened with for its
      investigations and certificate.
roles:
  analyst:
    label: QC analyst
    description: Records tests and signs an investigation or certificate submission.
  reviewer:
    label: QC reviewer
    description: Signs off research work or independently reviews regulated QC work.
  qa:
    label: Release testing QA
    description: Approves specifications and releases independently reviewed regulated work.
