apiVersion: iki/v1
kind: ActionTest
name: a_result_that_rounds_to_the_acceptance_limit_passes
action: record_test
description: >-
  A synthetic observation of 98.96% against the historical USP sodium chloride assay's
  99.0% lower limit. Rounded to the limit's tenths, it's 99.0%, which conforms (USP General
  Notices 7.20); the test keeps 98.96 as measured.
params:
  {
    attribute: NaCl assay,
    method: USP Sodium Chloride assay (2015),
    unit: "% NaCl, dried basis",
    value: 98.96,
  }
inputs:
  case:
    - values:
        lot: 00000000-0000-7000-8003-000000000099
        specification_revision: 1
        review_flow: research
        sealed: false
      included:
        specification:
          - values:
              approval: approved
              # USP Sodium Chloride, official December 1, 2015, Definition and Assay.
              criteria:
                - {
                    attribute: NaCl assay,
                    method: USP Sodium Chloride assay (2015),
                    unit: "% NaCl, dried basis",
                    lower: "99.0",
                    upper: "100.5",
                  }
expect:
  output:
    creates:
      - type: iki/qc_release.ReleaseTest
        values:
          case: 00000000-0000-7000-8003-000000000001
          lot: 00000000-0000-7000-8003-000000000099
          attribute: NaCl assay
          method: USP Sodium Chloride assay (2015)
          unit: "% NaCl, dried basis"
          value: 98.96
          reported: "99.0"
          rounding: limit_places
          lower: "99.0"
          upper: "100.5"
          outcome: pass
          sequence: 1
          observed_by: 00000000-0000-7000-8005-000000000001
    updates:
      case:
        - require_unchanged: true
          values: { attempts: [{ sequence: 1, attribute: NaCl assay, outcome: pass }] }
---
apiVersion: iki/v1
kind: ActionTest
name: an_out_of_specification_observation_opens_an_investigation
action: record_test
description: A synthetic observation falls below the published lower limit. Retain the original observation and open its regulated investigation in the same update.
params:
  {
    attribute: NaCl assay,
    method: USP Sodium Chloride assay (2015),
    unit: "% NaCl, dried basis",
    value: 98.9,
  }
inputs:
  case:
    - values:
        lot: 00000000-0000-7000-8003-000000000099
        specification_revision: 1
        review_flow: regulated_qc
        sealed: false
      included:
        specification:
          - values:
              approval: approved
              # USP Sodium Chloride, official December 1, 2015, Definition and Assay.
              criteria:
                - {
                    attribute: NaCl assay,
                    method: USP Sodium Chloride assay (2015),
                    unit: "% NaCl, dried basis",
                    lower: "99.0",
                    upper: "100.5",
                  }
expect:
  output:
    creates:
      - type: iki/qc_release.ReleaseTest
        values: { value: 98.9, reported: "98.9", outcome: oos, sequence: 1 }
      - type: iki/qc_release.QCOOSInvestigation
        values: { case: 00000000-0000-7000-8003-000000000001, test: { $create: measurement } }
    updates:
      case:
        - require_unchanged: true
          values: { attempts: [{ sequence: 1, attribute: NaCl assay, outcome: oos }] }
---
apiVersion: iki/v1
kind: ActionTest
name: an_unsigned_plate_fit_is_not_release_evidence
action: record_test
description: The dose-response values and limits in this fixture are synthetic.
params: { attribute: IC50, method: 4PL-OLS/1, unit: nM }
inputs:
  case:
    - values:
        lot: 00000000-0000-7000-8003-000000000099
        specification_revision: 1
        review_flow: research
        sealed: false
      included:
        specification:
          - values:
              approval: approved
              criteria:
                - attribute: IC50
                  method: 4PL-OLS/1
                  procedure: SOP-A
                  procedure_revision: "2"
                  unit: nM
                  lower: "20"
                  upper: "30"
  assay:
    - type: iki/plate_assays.AssayResult
      values:
        sample: 00000000-0000-7000-8003-000000000099
        endpoint_kind: IC50
        endpoint_value: 25
        concentration_unit: nM
        procedure: SOP-A
        procedure_revision: "2"
        fit_version: 4PL-OLS/1
        fit_status: fitted
        qualifier: within_range
        review: recorded
        review_procedure: iki/core.result_review@1
        review_flow: research
expect: { error: signed }
---
