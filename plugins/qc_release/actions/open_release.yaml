apiVersion: iki/v1
kind: Action
name: open_release
label: Open lot release testing
description: Select and pin the approved specification in force for the lot on its testing date.
inputs:
  lot: { type: iki/lots.Lot }
  schedule: { type: SpecificationSchedule, include: [versions] }
params:
  testing_on:
    type: date
    required: true
    label: Testing date
    description: The date on which this set of tests was performed.
effects:
  updates: [{ input: schedule, fields: [versions, tested_through] }]
  creates: [{ type: ReleaseCase, derived_from: [lot, schedule] }]
runs_on: { tier: backend, environment: qc-tools }
command: [python, ./scripts/qc_release.py, open_release]
timeout: 1m
