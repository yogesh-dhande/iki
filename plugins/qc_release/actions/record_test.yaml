apiVersion: iki/v1
kind: Action
name: record_test
label: Record a release test
inputs:
  case: { type: ReleaseCase, include: [specification] }
  assay:
    type: iki/plate_assays.AssayResult
    optional: true
    description: A signed, reportable 4PL result measured on this lot. Leave the manual observed value empty when using an assay.
  repeat_of:
    type: ReleaseTest
    optional: true
    description: The most recent out-of-specification attempt for this attribute, if this test repeats it after a signed invalidation.
  investigation:
    type: OOSInvestigation
    optional: true
    include: [test]
    description: >-
      The signed invalidation of the attempt being repeated, or, for an investigational
      test, the open investigation whose plan it's run under.
params:
  purpose:
    type: enum
    values: [reportable, investigational]
    default: reportable
    description: >-
      Reportable counts toward release. Investigational is run under an open
      investigation's plan, such as a retest of the same preparation, and replaces nothing.
  attribute: { type: string, max_length: 120, required: true }
  method: { type: string, max_length: 200, required: true }
  unit:
    type: string
    max_length: 50
    description: The numeric criterion's reporting unit. Leave it empty for a conforming result.
  value: { type: float, label: Observed value }
  result:
    type: enum
    label: Conforms
    values: [conforms, does_not_conform]
    description: For a criterion with a requirement, whether the observation meets it.
  observation:
    type: text
    max_length: 2000
    description: What was seen, such as the solution's colour or the spectrum's match.
  lab_report:
    type: file
    label: Laboratory report
    media_types: [application/pdf, text/plain, text/csv]
    max_size: 50MiB
    description: Optional raw evidence for a manually recorded observation.
effects:
  creates:
    - { type: ReleaseTest, derived_from: [case, assay, repeat_of, investigation] }
    - { type: ResearchOOSInvestigation, derived_from: [case, assay, repeat_of, investigation] }
    - { type: QCOOSInvestigation, derived_from: [case, assay, repeat_of, investigation] }
  updates: [{ input: case, fields: [attempts] }]
runs_on: { tier: backend, environment: qc-tools }
command: [python, ./scripts/qc_release.py, record_test]
timeout: 1m
