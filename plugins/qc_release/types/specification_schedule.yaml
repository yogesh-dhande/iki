apiVersion: iki/v1
kind: EntityType
name: SpecificationSchedule
label: Specification schedule
schema_version: 2
hrid: { prefix: SPS }
description: The ordered catalogue of published specification versions for one material and context in this project.
fields:
  material: { type: ref, to: iki/core.Entity, required: true, immutable: true }
  context:
    type: string
    max_length: 120
    required: true
    immutable: true
    default: Release
    description: >-
      Which approved specification this is for the material, such as Release, Shelf life,
      a market or a product grade (ICH Q6A §2.2). Each context has its own versions and
      effective dates.
  versions:
    type: list
    items: { type: ref, to: SpecificationVersion }
    max_items: 100
    computed: true
    description: The publication action appends approved versions in effective-date order.
rules:
  material_schedule:
    label: One specification schedule per material and context
    unique: [material, context]
    message: This project already has a specification schedule for the material in that context.
display: { title: "{{ context }} specification · {{ hrid }}" }
