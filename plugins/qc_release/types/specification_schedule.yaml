apiVersion: iki/v1
kind: EntityType
name: SpecificationSchedule
label: Specification schedule
schema_version: 3
hrid: { prefix: SPS }
description: The ordered catalogue of published specification versions for one material and context in this project.
fields:
  material: { type: ref, to: iki/core.Entity, required: true, immutable: true }
  context:
    type: string
    max_length: 120
    required: true
    immutable: true
    default: Release
    description: >-
      Which approved specification this is for the material, such as Release, Shelf life,
      a market or a product grade (ICH Q6A §2.2). Each context has its own versions and
      effective dates.
  grade:
    type: string
    max_length: 120
    immutable: true
    description: >-
      The grade the material is released as under this specification, where it has one,
      such as USP or Reagent grade. Its certificate of analysis states it with the
      material's name (ICH Q7 §11.41).
  versions:
    type: list
    items: { type: ref, to: SpecificationVersion }
    max_items: 100
    computed: true
    description: The publication action appends approved versions in effective-date order.
  tested_through:
    type: date
    label: Latest testing date pinned
    computed: true
    description: >-
      The latest testing date a release case has pinned from this schedule. A successor
      version takes effect after it, so publishing never changes which version a case's
      testing date was under.
rules:
  material_schedule:
    label: One specification schedule per material and context
    unique: [material, context]
    message: This project already has a specification schedule for the material in that context.
display: { title: "{{ context }} specification · {{ hrid }}" }
