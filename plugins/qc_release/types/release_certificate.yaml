apiVersion: iki/v1
kind: EntityType
name: ReleaseCertificate
label: Certificate record
schema_version: 2
abstract: true
description: A lot's evaluated results and investigation decisions, assembled for review and signed issue.
fields:
  case: { type: ref, to: ReleaseCase, computed: true, immutable: true }
  lot: { type: ref, to: iki/lots.Lot, computed: true, immutable: true }
  specification: { type: ref, to: SpecificationVersion, computed: true, immutable: true }
  specification_revision: { type: int, min: 1, computed: true, immutable: true }
  version: { type: string, max_length: 100, computed: true, immutable: true }
  testing_on: { type: date, computed: true, immutable: true }
  review_flow: { type: enum, values: [research, regulated_qc], computed: true, immutable: true }
  report:
    type: json
    computed: true
    immutable: true
    label: Evidence
    description: >-
      The internal evidence for the certificate: every attempt, its analyst and evidence,
      the evaluated criteria and the signed investigation decisions.
  coa:
    type: json
    computed: true
    immutable: true
    label: Certificate
    description: >-
      What its certificate of analysis will state: the issuer, the lot and its dates, the
      specification, and each criterion's limits and final result (ICH Q7 §11.4). Failed
      attempts, investigations and analysts stay in the evidence.
  coa_digest:
    type: string
    label: Certificate SHA-256
    max_length: 64
    computed: true
    immutable: true
    indexed: true
    description: >-
      The SHA-256 of the certificate's canonical JSON. The certificate of analysis issued
      from this record holds the same digest, which links the two inside Iki only.
  analysts:
    type: list
    items: { type: person }
    max_items: 250
    computed: true
    immutable: true
    description: People who recorded any observation in this release case.
  notes:
    type: text
    max_length: 10000
    description: Review remarks to carry with the signed certificate.
rules:
  assembled:
    label: The certificate was assembled by the lot release procedure
    check: >-
      record.case != null && record.lot != null && record.specification != null &&
      record.specification_revision != null && record.version != null &&
      record.testing_on != null && record.review_flow != null && record.report != null &&
      record.coa != null && record.coa_digest != null &&
      record.analysts != null && size(record.analysts) > 0
    message: Assemble the certificate from the completed release case.
display: { title: "Certificate record · {{ version or hrid }}" }
