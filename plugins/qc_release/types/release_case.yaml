apiVersion: iki/v1
kind: EntityType
name: ReleaseCase
label: Lot release case
schema_version: 3
hrid: { prefix: QRC }
description: One cycle of a lot's tests against the specification in force on its testing date, in one specification context.
fields:
  lot: { type: ref, to: iki/lots.Lot, computed: true, immutable: true }
  lot_revision: { type: int, min: 1, computed: true, immutable: true }
  lot_number: { type: string, max_length: 100, computed: true, immutable: true }
  material:
    type: ref
    to: iki/core.Entity
    computed: true
    immutable: true
    description: The material the lot is of and the specification is for, which its certificate names.
  schedule: { type: ref, to: SpecificationSchedule, computed: true, immutable: true }
  schedule_revision: { type: int, min: 1, computed: true, immutable: true }
  context: { type: string, max_length: 120, computed: true, immutable: true }
  grade: { type: string, max_length: 120, computed: true, immutable: true }
  cycle:
    type: int
    min: 1
    computed: true
    immutable: true
    description: The lot's first testing against this specification is cycle 1. A retest or retesting after rework is the next.
  previous:
    type: ref
    to: ReleaseCase
    computed: true
    immutable: true
    description: The cycle before this one, whose attempts and decisions remain as they were.
  reason:
    type: text
    max_length: 2000
    computed: true
    immutable: true
    label: Reason for testing again
  superseded:
    type: bool
    computed: true
    description: A later cycle for the lot and specification has been opened. This case takes no more tests.
  specification: { type: ref, to: SpecificationVersion, computed: true, immutable: true }
  specification_revision: { type: int, min: 1, computed: true, immutable: true }
  version: { type: string, max_length: 100, computed: true, immutable: true }
  testing_on: { type: date, computed: true, immutable: true }
  review_flow:
    type: enum
    values: [research, regulated_qc]
    computed: true
    immutable: true
  attempts:
    type: json
    computed: true
    description: The sequence, attribute and outcome of every test. Certificate preparation checks this list for completeness.
  sealed:
    type: bool
    computed: true
    description: The certificate was assembled from all test attempts and their signed exception decisions.
rules:
  lot_cycle:
    label: Each release cycle of a lot against a specification is one case
    unique: [lot, schedule, cycle]
    message: >-
      This lot already has that cycle for the specification. Choose its latest case as the
      previous cycle to open the next.
  cycles:
    label: A later cycle follows the one before it, for a stated reason
    check: >-
      record.cycle == null || (record.cycle == 1 ? record.previous == null :
      record.previous != null && record.reason != null && size(record.reason) > 0)
    message: A later release cycle names the cycle before it and why the lot is tested again.
  pinned:
    label: The release case pins the effective specification
    check: >-
      record.lot != null && record.lot_revision != null && record.lot_number != null &&
      record.material != null && record.schedule != null && record.schedule_revision != null &&
      record.specification != null && record.specification_revision != null &&
      record.version != null && record.testing_on != null && record.review_flow != null &&
      record.attempts != null && record.sealed != null && record.cycle != null &&
      record.context != null
    message: Open the lot release case with the effective specification action.
display: { title: "{{ lot_number or hrid }} · {{ context }} cycle {{ cycle }} · {{ testing_on }}" }
