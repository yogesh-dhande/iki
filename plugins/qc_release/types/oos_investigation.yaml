apiVersion: iki/v1
kind: EntityType
name: OOSInvestigation
label: Out-of-specification investigation
schema_version: 2
abstract: true
description: A signed explanation and decision about an original out-of-specification observation.
fields:
  case: { type: ref, to: ReleaseCase, computed: true, immutable: true }
  test: { type: ref, to: ReleaseTest, computed: true, immutable: true }
  resolution:
    type: enum
    values: [confirmed, invalidated, inconclusive]
    description: >-
      Confirm the original finding, document the assignable cause that invalidates it, or
      record that the investigation found no cause either way. An inconclusive one leaves
      the original result standing in the lot's disposition (FDA OOS guidance, §V).
  plan:
    type: text
    label: Testing plan
    max_length: 4000
    description: >-
      The testing the investigation will do under the lab's approved procedure, such as a
      retest of the same preparation and how many. Iki records investigational tests only
      once a plan is written, and pins the revision each was run under (FDA OOS guidance,
      §IV.B).
  findings:
    type: text
    max_length: 12000
    description: The investigation, its conclusion and the reason for that conclusion.
  evidence:
    type: file
    description: The investigation report or other evidence for the assignable cause.
    media_types: [application/pdf, text/plain, text/csv, image/png, image/jpeg]
    max_size: 50MiB
rules:
  original_attempt:
    label: Investigate the original observation
    check: >-
      record.case != null && record.test != null && record.test.outcome == "oos" &&
      record.test.case == record.case.id
    message: Record an out-of-specification test to open its investigation.
display: { title: "OOS investigation · {{ hrid }}" }
