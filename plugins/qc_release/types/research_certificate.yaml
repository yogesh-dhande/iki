apiVersion: iki/v1
kind: EntityType
name: ResearchCertificate
label: Research certificate record
schema_version: 2
extends: ReleaseCertificate
hrid: { prefix: RCA }
fields:
  review:
    type: state
    initial: recorded
    states:
      recorded: { label: Recorded }
      signed_off:
        label: Signed off
        set_by: [reviewer]
        locks: true
        signatures:
          - meaning: review
            statement: I reviewed the pinned specification, test results and investigations, and approve the certificate they support.
        guards:
          complete:
            check: state.from == "recorded" && record.review_flow == "research" && record.case.sealed == true
            message: Sign the certificate assembled from a completed research release case.
