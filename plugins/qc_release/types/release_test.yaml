apiVersion: iki/v1
kind: EntityType
name: ReleaseTest
label: Release test
schema_version: 4
hrid: { prefix: QRT }
description: An immutable observed result and its evaluation against a pinned lot release criterion.
fields:
  case: { type: ref, to: ReleaseCase, computed: true, immutable: true }
  lot: { type: ref, to: iki/lots.Lot, computed: true, immutable: true }
  sequence: { type: int, min: 1, computed: true, immutable: true }
  attribute: { type: string, max_length: 120, computed: true, immutable: true, indexed: true }
  method: { type: string, max_length: 200, computed: true, immutable: true }
  kind: { type: enum, label: Result, values: [numeric, conforms], computed: true, immutable: true }
  unit: { type: string, max_length: 50, computed: true, immutable: true }
  value:
    type: float
    label: Observed value
    computed: true
    immutable: true
    description: The value as measured, before any rounding.
  reported:
    type: string
    label: Reportable value
    max_length: 400
    computed: true
    immutable: true
    description: >-
      The value compared with the limits and stated on the certificate: the observed value
      rounded to the limits' last place (USP General Notices 7.20), or as measured when the
      criterion compares it unrounded.
  rounding:
    type: enum
    label: Compared as
    values: [limit_places, unrounded]
    computed: true
    immutable: true
  lower:
    type: string
    max_length: 17
    computed: true
    immutable: true
    label: Inclusive lower limit
  upper:
    type: string
    max_length: 17
    computed: true
    immutable: true
    label: Inclusive upper limit
  acceptance: { type: string, max_length: 500, computed: true, immutable: true, label: Requirement }
  result:
    type: enum
    label: Conforms
    values: [conforms, does_not_conform]
    computed: true
    immutable: true
  observation:
    type: text
    max_length: 2000
    computed: true
    immutable: true
    description: What the analyst saw, for a result that conforms or doesn't.
  outcome: { type: enum, values: [pass, oos], computed: true, immutable: true, indexed: true }
  observed_by: { type: person, computed: true, immutable: true }
  repeat_of: { type: ref, to: ReleaseTest, computed: true, immutable: true }
  purpose:
    type: enum
    values: [reportable, investigational]
    computed: true
    immutable: true
    description: >-
      A reportable result, which counts toward the lot's release, or a test run as part of
      an open investigation's plan, which informs it and replaces nothing.
  investigation:
    type: ref
    to: OOSInvestigation
    computed: true
    immutable: true
    description: The open investigation an investigational test was run for.
  investigation_revision:
    type: int
    min: 1
    computed: true
    immutable: true
    description: The revision of the investigation, and so of its testing plan, the test was run under.
  evidence:
    type: ref
    to: iki/plate_assays.AssayResult
    computed: true
    immutable: true
  evidence_revision: { type: int, min: 1, computed: true, immutable: true }
  lab_report:
    type: file
    computed: true
    immutable: true
    media_types: [application/pdf, text/plain, text/csv]
    max_size: 50MiB
    description: The source laboratory report for a manually recorded observation, if supplied.
rules:
  ordered_attempt:
    label: Each attempt occupies one position in the release case
    unique: [case, sequence]
    message: This release case already has that attempt number.
  recorded_observation:
    label: Keep the value, criterion and origin of every attempt
    check: >-
      record.case != null && record.lot != null && record.sequence != null &&
      record.attribute != null && record.method != null && record.kind != null &&
      (record.kind == "conforms" ?
      record.result != null && record.acceptance != null && record.value == null :
      record.unit != null && record.value != null && record.reported != null &&
      record.rounding != null &&
      (record.lower != null || record.upper != null) && record.result == null) &&
      record.outcome != null && record.observed_by != null &&
      (record.purpose == "investigational") == (record.investigation != null) &&
      (record.investigation != null) == (record.investigation_revision != null) &&
      (record.evidence != null) == (record.evidence_revision != null)
    message: Record the observation using the lot release testing action.
display: { title: "{{ attribute or hrid }} · {{ outcome or 'pending' }}" }
