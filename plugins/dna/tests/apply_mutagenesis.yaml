# Run with `iki plugin test plugins/dna` (ADR 0093).
apiVersion: iki/v1
kind: ActionTest
name: a_stated_change_is_made_and_the_quikchange_primers_that_make_it_are_registered
description: >-
  Sickle cell haemoglobin: human beta-globin's GAG to GTG at the sixth codon of the mature
  protein (Ingram, Nature 180:326, 1957), which HGVS numbers from the initiator
  methionine, so the change is g.20A>T and the protein change is p.Glu7Val. The mutant is
  registered as a DNA sequence of the template's length, and the QuikChange pair that
  makes it -- complementary to each other, the change in the middle, each ending in a C or
  a G -- as two primers.
action: apply_mutagenesis
inputs:
  mutagenesis:
    - values:
        name: HBB sickle
        changes: ["g.20A>T"]
        coding_start: 1
        coding_end: 444
        primer_design: overlapping
      included:
        template:
          - values:
              name: HBB
              accession: NM_000518.5
              bases: ""
              topology: linear
              strandedness: double
expect:
  output:
    creates:
      - type: iki/dna.DNASequence
        key: mutant-1
        values:
          bases: ""
          topology: linear
          strandedness: double
          name: HBB sickle, g.20A>T
      - type: iki/dna.Primer
        key: primer-1-1
        values:
          bases: "GCATCTGACTCCTGTGGAGAAGTCTGCCG"
          direction: forward
          name: HBB sickle g.20A>T forward
      - type: iki/dna.Primer
        key: primer-1-2
        values:
          bases: "CGGCAGACTTCTCCACAGGAGTCAGATGC"
          direction: reverse
          name: HBB sickle g.20A>T reverse
    updates:
      mutagenesis:
        - values:
            product_length: 444
            primers_designed: 2
            protein_changes:
              - { effect: missense, name: p.Glu7Val }
            changes_made:
              - stated: "g.20A>T"
                name: "g.20A>T"
                kind: substitution
                start: 20
                end: 20
                difference: 0
    metrics:
      changes: 1
      primers: 2
---
apiVersion: iki/v1
kind: ActionTest
name: a_change_in_a_plasmid_gets_partially_overlapping_primers_with_their_own_3_ends
description: >-
  pUC19 (GenBank L09137.2, 2,686 bp, circular) with the C of its EcoRI site changed to a
  T, so the site is gone from the polylinker. The primers are Zheng's and Liu and
  Naismith's design: they share the stretch that carries the change at their 5' ends and
  each has bases of its own at its 3' end, so neither can extend on the other.
action: apply_mutagenesis
inputs:
  mutagenesis:
    - values:
        name: pUC19 EcoRI out
        changes: ["o.401C>T"]
        primer_design: partially_overlapping
      included:
        template:
          - values:
              name: pUC19
              accession: L09137.2
              topology: circular
              strandedness: double
              bases: ""
expect:
  output:
    creates:
      - type: iki/dna.DNASequence
        key: mutant-1
        values:
          topology: circular
          strandedness: double
          name: pUC19 EcoRI out, o.401C>T
      - type: iki/dna.Primer
        key: primer-1-1
        values:
          bases: "AATTTGAGCTCGGTACCCGGGGATCC"
          direction: forward
      - type: iki/dna.Primer
        key: primer-1-2
        values:
          bases: "ACCGAGCTCAAATTCACTGGCCGTCG"
          direction: reverse
    updates:
      mutagenesis:
        - values:
            product_length: 2686
            primers_designed: 2
            changes_made:
              - stated: "o.401C>T"
                name: "o.401C>T"
                kind: substitution
                start: 401
                end: 401
                difference: 0
    metrics:
      changes: 1
      primers: 2
---
apiVersion: iki/v1
kind: ActionTest
name: a_change_whose_stated_base_isnt_the_templates_is_refused
description: >-
  HGVS has a substitution state the reference's own base so that a change written against
  the wrong sequence, or against the other strand, is caught before anyone orders a
  primer. HBB's base 20 is an A, so g.20C>T is not a change to HBB, and nothing is
  registered.
action: apply_mutagenesis
inputs:
  mutagenesis:
    - values:
        changes: ["g.20C>T"]
      included:
        template:
          - values:
              bases: "ATGGTGCATCTGACTCCTGAGGAGAAGTCTGCCGTTACTGCCCTGTGGTAA"
              topology: linear
              strandedness: double
expect:
  error: >-
    MUT-000001: g.20C>T says the template has C at 20, and it has A. Check the change is
    written against this sequence, on this strand.
---
apiVersion: iki/v1
kind: ActionTest
name: back_to_back_primers_are_refused_on_a_linear_template
description: >-
  Back-to-back primers amplify a circle outwards and the product is ligated blunt, so
  there is nothing for them to go round on a linear molecule. The run says so and says
  which designs do work there, rather than registering primers that can't be used.
action: apply_mutagenesis
inputs:
  mutagenesis:
    - values:
        changes: ["g.20A>T"]
        primer_design: back_to_back
      included:
        template:
          - values:
              bases: "ATGGTGCATCTGACTCCTGAGGAGAAGTCTGCCGTTACTGCCCTGTGGTAA"
              topology: linear
              strandedness: double
expect:
  error: >-
    MUT-000001, g.20A>T: Back-to-back primers amplify a circle outwards and the product is
    ligated blunt, so they need a circular template. Use overlapping or partially
    overlapping primers on a linear one.
---
apiVersion: iki/v1
kind: ActionTest
name: two_changes_that_touch_the_same_bases_are_refused
description: >-
  No sequence has both a base deleted and that base changed, so a design that asks for
  both is a design nobody can make. It is refused before anything is registered.
action: apply_mutagenesis
inputs:
  mutagenesis:
    - values:
        changes: ["g.10_15del", "g.12G>C"]
      included:
        template:
          - values:
              bases: "ATGGTGCATCTGACTCCTGAGGAGAAGTCTGCCGTTACTGCCCTGTGGTAA"
              topology: linear
              strandedness: double
expect:
  error: >-
    MUT-000001: g.10_15del and g.12G>C change the same bases of the template: name them as
    one change, such as a deletion-insertion.
