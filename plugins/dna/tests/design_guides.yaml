# Run with `iki plugin test plugins/dna` (ADR 0093).
apiVersion: iki/v1
kind: ActionTest
name: guides_in_a_gene_two_plasmids_share_find_each_other_as_off_targets
description: >-
  pUC19's ampicillin resistance gene came from pBR322, so a guide placed in it has a
  perfect match in the other plasmid -- which is what an off-target search is for. Six
  guides in bases 1,901 to 2,000 of pUC19, searched against pUC19 and pBR322 (GenBank
  J01749.1): the three whose protospacer is identical in both score 50% specificity, since
  one perfect match elsewhere adds 100 to the sum the aggregate formula divides by, and
  the three with a single base different score by where that base lies -- 64.3% for a
  mismatch at position 11, 76.0% at 19 and 78.9% at 15, counting from the end furthest
  from the PAM, as the weights behind the formula are numbered.
action: design_guides
inputs:
  design:
    - values:
        name: bla guides
        nuclease: spcas9
        region_start: 1901
        region_end: 2000
        most_mismatches: 3
        most_guides: 6
      included:
        target:
          - values:
              name: pUC19
              accession: L09137.2
              topology: circular
              strandedness: double
              bases: ""
        search_in:
          - values:
              name: pUC19
              accession: L09137.2
              topology: circular
              strandedness: double
              bases: ""
          - values:
              name: pBR322
              accession: J01749.1
              topology: circular
              strandedness: double
              bases: ""
expect:
  output:
    updates:
      design:
        - values:
            guides_found: 8
            searched: "pUC19 (2,686 bp), pBR322 (4,361 bp)"
    metrics:
      guides: 8
      off_targets: 6
---
apiVersion: iki/v1
kind: ActionTest
name: cas12a_reads_its_motif_before_the_protospacer_and_cuts_staggered
description: >-
  Cas12a is not Cas9 the other way round: its TTTV motif lies 5' of the protospacer, the
  protospacer is 23 bases rather than 20, and it cuts both strands in different places --
  after the 18th base of the protospacer strand and the 23rd of the other -- leaving a
  five-base 5' overhang (Zetsche et al., Cell 163:759, 2015). Bases 400 to 500 of pUC19
  hold two such sites, and the record says where each cuts on both strands.
action: design_guides
inputs:
  design:
    - values:
        name: Cas12a in the polylinker
        nuclease: ascas12a
        region_start: 400
        region_end: 500
      included:
        target:
          - values:
              name: pUC19
              topology: circular
              strandedness: double
              bases: ""
expect:
  output:
    updates:
      design:
        - values:
            guides_found: 2
            searched: "nothing: no sequence was given to search"
    metrics:
      guides: 2
      off_targets: 0
---
apiVersion: iki/v1
kind: ActionTest
name: a_region_with_no_pam_in_it_is_said_rather_than_returning_nothing
description: >-
  A guide can only be placed where the DNA already carries the nuclease's motif, and no
  design can change that. Forty bases of A and T carry no NGG on either strand, so the run
  says so and names the motif, rather than registering a design with an empty list that
  reads as "none found" for some other reason.
action: design_guides
inputs:
  design:
    - values:
        nuclease: spcas9
        region_start: 1
        region_end: 40
      included:
        target:
          - values:
              bases: "ATATATATATATATATATATATATATATATATATATATATATATATATATATATATATAT"
              topology: linear
              strandedness: double
expect:
  error: >-
    GDE-000001: No SpCas9 (Streptococcus pyogenes) site lies in bases 1 to 40: it cuts
    only beside NGG, and there is none here on either strand.
---
apiVersion: iki/v1
kind: ActionTest
name: a_design_with_nothing_to_search_gets_guides_with_no_specificity
description: >-
  A specificity is a number about a search. A design that names nothing to search has
  nothing to be particular against, so the run reports no specificity and says why, rather
  than leaving an absent number to read as a guide with nothing else to cut.
action: design_guides
inputs:
  design:
    - values:
        nuclease: spcas9
        region_start: 400
        region_end: 450
        most_guides: 3
      included:
        target:
          - values:
              name: pUC19
              topology: circular
              strandedness: double
              bases: ""
expect:
  output:
    updates:
      design:
        - values:
            searched: "nothing: no sequence was given to search"
    messages:
      - level: warning
        text: >-
          GDE-000001 names nothing to search, so its guides have no specificity: give the
          genome the cut is to be made in, and anything else in the cell, to find where
          else each could cut.
