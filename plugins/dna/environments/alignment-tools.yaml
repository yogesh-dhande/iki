# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
#
# MAFFT on the container tier. The image is built from images/alignment-tools, which
# Iki's publish workflow signs (ADR 0065), pinned by its multi-arch digest; changing
# the image is a commit to its Dockerfile, then one here.
apiVersion: iki/v1
kind: Environment
name: alignment-tools
label: Alignment tools
description: MAFFT 7.505, and the plugin's Python packages.
tiers: [container]
resources: { cpu: 1, memory: 2Gi }
image: ghcr.io/yogesh-dhande/iki-dna-alignment-tools@sha256:a6792250dfaa87d5c2398b24c6d33d144a646053c63984481be17706ffdbda39
