# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: Primer
label: Primer
label_plural: Primers
extends: iki/core.Sequence
schema_version: 2
description: >-
  An oligonucleotide primer. Two with the same bases are the same primer, so
  ordering one again finds its
  registry entry.
hrid: { prefix: PRM }
identity: [bases]
fields:
  bases:
    type: string
    format: dna_sequence
    required: true
    immutable: true
    max_length: 200
    description: The bases, 5′ to 3′, in IUPAC codes.
  direction: { type: enum, values: [forward, reverse] }
  target: { type: ref, to: DNASequence, description: The sequence it binds. }
  length: { registry: derived, type: quantity, unit: "{b}", computed: true, indexed: true }
  gc_content: { registry: derived, type: quantity, unit: "%", computed: true, min: 0, max: 100 }
  melting_temperature:
    type: quantity
    registry: derived
    unit: Cel
    computed: true
    indexed: true
    label: Tm (50 mM Na⁺)
    description: >-
      Its melting temperature (Tm) by SantaLucia's nearest-neighbour model, at
      50 mM Na+ with no Mg2+ or dNTPs, and 50 nM of strands in all
      (SantaLucia's CT): 25 nM each of the primer and its complement, or 50 nM
      of a primer that pairs with itself. The same measurement the sequence
      viewer quotes for a selection (ADR 0191); for the Tm a PCR anneals at,
      see its Tm in PCR buffer.
  buffer_melting_temperature:
    type: quantity
    registry: derived
    unit: Cel
    computed: true
    indexed: true
    label: Tm in PCR buffer (1.5 mM Mg²⁺, 0.6 mM dNTPs)
    description: >-
      Its melting temperature (Tm) by SantaLucia's nearest-neighbour model in
      Primer3's default PCR buffer — 50 mM Na+, 1.5 mM Mg2+ and 0.6 mM dNTPs,
      with 25 nM each of the primer and its complement — corrected for the
      magnesium by Owczarzy et al. (2008). Several degrees above its Tm in
      sodium alone, and the one to set an annealing temperature by (ADR 0201).
  hairpin_free_energy:
    type: quantity
    registry: derived
    unit: kcal/mol
    computed: true
    indexed: true
    description: >-
      The free energy at 37 °C of the most stable hairpin it folds into, where
      it folds into one. The more negative, the more of the primer is tied up
      instead of priming; below about −9 kcal/mol is worth redesigning.
  self_dimer_free_energy:
    type: quantity
    registry: derived
    unit: kcal/mol
    computed: true
    indexed: true
    description: >-
      The free energy at 37 °C of the most stable dimer it forms with another
      copy of itself. A stable self-dimer is amplified in place of the target.
  end_stability:
    type: quantity
    registry: derived
    unit: kcal/mol
    computed: true
    description: >-
      The free energy at 37 °C of its last five bases against their
      complement: how firmly the 3' end a polymerase extends from is held. A
      loose end primes poorly; one much tighter than the rest of the primer
      mis-primes elsewhere.
  longest_run:
    type: quantity
    registry: derived
    unit: "{b}"
    computed: true
    description: >-
      Its longest run of one base. Four or more G in a row can stack into a
      quadruplex, and a long run of any base makes synthesis and priming less
      specific.
  vendor: { type: string, max_length: 200 }
  order_number: { type: string, max_length: 100 }
display:
  title: "{{ name or hrid }}"
