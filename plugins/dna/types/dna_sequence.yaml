# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: DNASequence
label: DNA sequence
label_plural: DNA sequences
extends: iki/core.Sequence
schema_version: 4
description: >-
  A DNA sequence: a plasmid, a gene, a construct, a genome. Two with the same
  bases, topology and strandedness are the same sequence, so registering one
  again finds its registry entry: a circular one from any origin, and a
  double-stranded one from either strand.
hrid: { prefix: DNA }
identity: [bases, topology, strandedness]
fields:
  bases:
    type: string
    format: dna_sequence
    # Its identity reads it as the molecule it is (ADR 0138): a circular one's
    # rotations are one sequence, and a duplex's two strands are.
    topology: topology
    strands: strandedness
    required: true
    immutable: true
    description: >-
      The bases, 5′ to 3′, in IUPAC codes, as they were first registered: from
      that origin, on that strand.
  topology:
    type: enum
    values: [linear, circular]
    default: linear
    required: true
    immutable: true
  strandedness:
    type: enum
    values: [double, single]
    default: double
    required: true
    immutable: true
  length: { registry: derived, type: quantity, unit: "{bp}", computed: true, indexed: true }
  gc_content:
    type: quantity
    registry: derived
    unit: "%"
    computed: true
    indexed: true
    min: 0
    max: 100
    description: The share of G and C among its bases.
  accession:
    type: string
    max_length: 64
    indexed: true
    pattern: "^[A-Za-z0-9_.]+$"
    # The project's, not the entry's (ADR 0154): one molecule is in several
    # databases' records (pUC19 is L09137.2 and M77789.2).
    description: >-
      The accession, with its version, of the GenBank, ENA or DDBJ record it
      came from (such as L09137.2). The same sequence may be in several
      records: each import or fetch keeps the one it read as its origin.
  features:
    type: json
    description: >-
      Its annotated regions, as GenBank lists them: each with a type (a
      Sequence Ontology or GenBank feature key), where it lies, its strand, and
      its qualifiers.
    schema:
      type: array
      maxItems: 10000
      items:
        type: object
        additionalProperties: false
        required: [type, start, end]
        properties:
          type:
            type: string
            minLength: 1
            maxLength: 64
            description: Such as CDS, promoter or rep_origin.
          name: { type: string, maxLength: 200 }
          start:
            type: integer
            minimum: 1
            description: >-
              The first base, counting from 1, of the stretch it lies within.
          end:
            type: integer
            minimum: 1
            description: >-
              The last base. Before start, it wraps the origin of a circular
              sequence.
          strand:
            enum: [forward, reverse, mixed, none]
            default: none
            description: Mixed when its parts lie on both strands.
          operator:
            enum: [join, order]
            default: join
            description: >-
              How its parts go together, as INSDC writes it: joined, one
              molecule (join), or found in that order, with nothing said of
              joining them (order).
          parts:
            type: array
            minItems: 1
            maxItems: 1000
            description: >-
              Where it lies, part by part, when that isn't all of start to end
              exactly: a join's or an order's parts in the order they're read
              (a reverse-strand one's last first), each with its strand, a site
              between two bases (GenBank's 5^6), which covers none, or a part
              whose ends go on beyond the bases they name.
            items:
              type: object
              additionalProperties: false
              required: [start, end]
              properties:
                start: { type: integer, minimum: 1 }
                end:
                  type: integer
                  minimum: 1
                  description: Before start, it wraps the origin.
                strand: { enum: [forward, reverse, none], default: none }
                between:
                  type: boolean
                  description: >-
                    A site between start and end, two neighbouring bases,
                    covering neither.
                partial_start:
                  type: boolean
                  description: >-
                    It goes on beyond start, which is only as far as it's
                    known (INSDC's <, a partial end).
                partial_end:
                  type: boolean
                  description: >-
                    It goes on beyond end, which is only as far as it's known
                    (INSDC's >, a partial end).
          qualifiers:
            type: object
            maxProperties: 50
            additionalProperties: { type: string, maxLength: 10000 }
  library_features:
    type: json
    computed: true
    description: >-
      Exact matches to the routine cloning-vector library, with their coordinates,
      strand and source record. An empty list records a completed search with no hits.
    schema:
      type: array
      maxItems: 5000
      items:
        type: object
        additionalProperties: false
        required: [type, name, start, end, strand, qualifiers]
        properties:
          type: { type: string, minLength: 1, maxLength: 64 }
          name: { type: string, minLength: 1, maxLength: 200 }
          start: { type: integer, minimum: 1 }
          end:
            type: integer
            minimum: 1
            description: Before start, it wraps the origin of a circular sequence.
          strand: { enum: [forward, reverse, none] }
          qualifiers:
            type: object
            maxProperties: 20
            additionalProperties: { type: string, maxLength: 1000 }
  library_annotated_with:
    type: string
    max_length: 200
    computed: true
    description: The name and version of the library that produced the record's library features.
display:
  title: "{{ name or accession or hrid }}"
  # A tab with its bases, and its features as a track along them.
  viewers:
    - { viewer: sequence, sequence: bases, features: features }
# Downloads as GenBank and FASTA, written by Iki from these fields at any revision, for
# anyone who can read it, each download audited (ADR 0171).
exports:
  - export: sequence
    sequence: bases
    features: features
    description: description
    accession: accession
    organism: organism
