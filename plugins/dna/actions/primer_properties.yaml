# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Action
name: primer_properties
label: Compute length, GC content, Tm and the primer's own checks
inputs:
  primer: { type: Primer, schema: ">=1" }
effects:
  updates:
    - input: primer
      fields:
        [
          length,
          gc_content,
          melting_temperature,
          hairpin_free_energy,
          self_dimer_free_energy,
          end_stability,
          longest_run,
        ]
software:
  - { name: Iki oligo checks module, version: "0.12.0", url: https://ikisci.org/plugins/dna }
runs_on: { tier: backend, environment: sequence-tools }
command: [python, ./scripts/sequences.py, primers]
deterministic: true
batchable: 100
timeout: 5m
