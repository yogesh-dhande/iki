# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Plugin
name: iki/dna
version: 0.13.1
title: DNA
description: >-
  DNA sequences, with their features, and primers; and the designs that make a new
  sequence from one: a coding sequence rewritten in a host's own codons.
license: Apache-2.0
iki: ">=0.1"
homepage: https://ikisci.org/plugins/dna
settings:
  ncbi_email:
    type: string
    required: false
    format: email
    description: >-
      The address NCBI asks automated clients to give, so it can contact the
      lab before blocking heavy use. Fetching from NCBI needs it.
