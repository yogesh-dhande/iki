          sha256: 9396ffd5e05d4428713792f3f324d328435a114c2db48555d64c38e3c724820b
      - type: iki/oligo.Oligonucleotide
        values: { name: separator, bases: AT }
        origin:
          id: separator
          sha256: f81f2ff0e4aa4802a58b30546a83a85a8de90ea0401c8212ea932bb07556b435
