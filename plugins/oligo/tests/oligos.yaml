  imported and the other row named, as iki-wasm refuses it ("Expected a monomer").
action: import_oligonucleotides
params:
  file: { $file: oligos }
  on_error: skip
files: { oligos: tests/data/an-empty-strand.csv }
expect:
  output:
    creates:
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - type: iki/oligo.Oligonucleotide
        values: { name: plain primer, bases: ACGT }
    metrics: { rows: 2, skipped: 1 }
    messages:
      - level: warning
        text: "Row 2: RNA1 has a unit with no monomer in it: HELM separates monomer units with “.”, such as R(A)P.R(C)."
