# Run with `iki plugin test plugins/oligo` (ADR 0093). Each published value is cited
# where it's from; Iki's are the free acid, from CIAAW's 2021 atomic weights.
apiVersion: iki/v1
kind: ActionTest
name: nusinersen
description: >-
  Nusinersen (Spinraza), an 18-mer of 2′-O-methoxyethyl nucleotides with
  phosphorothioates throughout and every C a 5-methylcytosine: C234H340N61O128P17S17,
  7127 g/mol as the free acid, monoisotopic 7122.2763 (PubChem CID 131801471); its
  sodium salt, C234H323N61O128P17S17Na17, is 7501.0 g/mol (EMA's EPAR for Spinraza),
  which is this with 17 sodiums for 17 hydrogens. Its ε260 isn't computed: no
  nearest-neighbour parameters describe MOE nucleotides or 5-methylcytosine.
action: register_oligonucleotide
params:
  helm: "RNA1{[MOE](T)[sP].[MOE]([5meC])[sP].[MOE](A)[sP].[MOE]([5meC])[sP].[MOE](T)[sP].[MOE](T)[sP].[MOE](T)[sP].[MOE]([5meC])[sP].[MOE](A)[sP].[MOE](T)[sP].[MOE](A)[sP].[MOE](A)[sP].[MOE](T)[sP].[MOE](G)[sP].[MOE]([5meC])[sP].[MOE](T)[sP].[MOE](G)[sP].[MOE](G)}$$$$V2.0"
  name: nusinersen
  purpose: antisense
expect:
  output:
    creates:
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - type: iki/oligo.Oligonucleotide
        values:
          bases: "TCACTTTCATAATGCTGG"
          length: 18
          molecular_formula: "C234H340N61O128P17S17"
          molecular_weight: 7127.17
          # EMA's 7,501.0 g/mol for nusinersen sodium: 17 sodiums for 17 protons.
          molecular_weight_sodium: 7500.86
          monoisotopic_mass: 7122.2763
          modifications:
            ["2′-O-Methoxyethylribose (18)", "5-Methylcytosine (4)", "Phosphorothioate (17)"]
  tolerance: 1.0e-6
---
apiVersion: iki/v1
kind: ActionTest
name: fomivirsen
description: >-
  Fomivirsen (Vitravene), a 21-mer of DNA with phosphorothioates throughout:
  C204H263N63O114P20S20, 6682 g/mol, monoisotopic 6677.5886 (PubChem CID 16133810). Its
  ε260 is by nearest neighbours, its phosphorothioates read as phosphates, and the note
  says so.
action: register_oligonucleotide
params:
  helm: "RNA1{[dR](G)[sP].[dR](C)[sP].[dR](G)[sP].[dR](T)[sP].[dR](T)[sP].[dR](T)[sP].[dR](G)[sP].[dR](C)[sP].[dR](T)[sP].[dR](C)[sP].[dR](T)[sP].[dR](T)[sP].[dR](C)[sP].[dR](T)[sP].[dR](T)[sP].[dR](C)[sP].[dR](T)[sP].[dR](T)[sP].[dR](G)[sP].[dR](C)[sP].[dR](G)}$$$$V2.0"
expect:
  output:
    creates:
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - type: iki/oligo.Oligonucleotide
        values:
          bases: "GCGTTTGCTCTTCTTCTTGCG"
          molecular_formula: "C204H263N63O114P20S20"
          molecular_weight: 6682.35
          monoisotopic_mass: 6677.5886
          extinction_260: 174300
          extinction_note: "Single strand, by nearest neighbours: DNA parameters from Cantor, Warshaw & Shapiro (1970). Its 20 phosphorothioate links are read as phosphates: the parameters were measured on phosphodiesters."
          modifications: ["Phosphorothioate (20)"]
  tolerance: 1.0e-6
---
