# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: Compound
label: Compound
label_plural: Compounds
schema_version: 2
description: >-
  A chemical compound, by its standardised structure. Two with the same standard
  InChIKey are the same compound: one registry entry, with one ID, which each
  project holding it keeps its own record of. Its batches (lots) are registered on
  their own, each with its salt form.
hrid: { prefix: CPD }
identity: [inchikey]
# The fields Iki reads its formula by (ADR 0284).
roles: { formula: molecular_formula }
fields:
  smiles:
    type: string
    registry: derived
    label: SMILES
    max_length: 20000
    required: true
    immutable: true
    description: >-
      Its structure, standardised as RDKit's MolStandardize does it, as RDKit's
      canonical isomeric SMILES.
  inchikey:
    type: string
    label: InChIKey
    max_length: 27
    pattern: "^[A-Z]{14}-[A-Z]{8}SA-[A-Z]$"
    required: true
    immutable: true
    indexed: true
    description: >-
      Its standard InChIKey, such as BSYNRYMUTXBXSQ-UHFFFAOYSA-N (aspirin): a hash
      of its standard InChI, which makes it this compound.
  inchi:
    type: string
    registry: derived
    label: InChI
    max_length: 20000
    computed: true
    description: Its standard InChI, from the InChI Trust's library.
  molfile:
    type: text
    registry: derived
    label: Molfile
    max_length: 4000000
    computed: true
    # Machine text: its "words" are coordinates and atom symbols (ADR 0233).
    searchable: false
    description: >-
      Its structure as an MDL Molfile, laid out in 2D by RDKit's CoordGen, kekulized,
      with its stereocentres wedged: V2000, or V3000 when it has more atoms or bonds
      than V2000's 999. Iki writes its Molfile and SDF exports from it.
  name:
    type: string
    max_length: 255
    indexed: true
    description: What people call it, such as aspirin.
  synonyms:
    type: list
    items: { type: string, max_length: 255 }
    max_items: 200
    description: Other names it goes by, such as acetylsalicylic acid or a code name.
  description: { type: text, max_length: 10000 }
  molecular_formula:
    type: string
    registry: derived
    max_length: 200
    computed: true
    indexed: true
    description: >-
      Its formula in Hill order, with its charge if it has one, such as C9H8O4. An
      atom drawn as a particular isotope is written as it, as RDKit writes it: D2O
      for heavy water, [13C]H4O for carbon-13 methanol.
  molecular_weight:
    type: quantity
    registry: derived
    unit: g/mol
    computed: true
    indexed: true
    min: 0
    description: >-
      Its average molecular weight, from IUPAC's standard atomic weights, and an
      atom drawn as a particular isotope at that isotope's mass.
  exact_mass:
    type: quantity
    registry: derived
    unit: u
    computed: true
    min: 0
    description: >-
      Its monoisotopic mass, from each element's most abundant isotope, or the
      isotope an atom is drawn as.
  formal_charge:
    { registry: derived, type: int, computed: true, indexed: true, description: Its net charge. }
  heavy_atoms:
    type: int
    registry: derived
    computed: true
    indexed: true
    min: 0
    description: How many atoms it has other than hydrogen.
  logp:
    type: float
    registry: derived
    label: Crippen logP
    computed: true
    indexed: true
    description: >-
      Its octanol–water partition coefficient, as Wildman and Crippen's atom
      contributions estimate it (1999).
  tpsa:
    type: quantity
    registry: derived
    label: TPSA
    unit: Ao2
    computed: true
    indexed: true
    min: 0
    description: >-
      Its topological polar surface area, from Ertl's contributions of its nitrogens
      and oxygens (2000), in Å².
  hbd:
    type: int
    registry: derived
    label: H-bond donors
    computed: true
    indexed: true
    min: 0
    description: Its hydrogen-bond donors, as RDKit counts them.
  hba:
    type: int
    registry: derived
    label: H-bond acceptors
    computed: true
    indexed: true
    min: 0
    description: Its hydrogen-bond acceptors, as RDKit counts them.
  rotatable_bonds:
    type: int
    registry: derived
    computed: true
    indexed: true
    min: 0
    description: >-
      Its rotatable bonds, by RDKit's strict definition: single bonds outside rings
      between two heavy atoms that aren't terminal, leaving out the partly double
      C–N, C–O and C–S bonds of amides, esters and their kin, bonds to triple-bonded
      atoms, and bonds to CF3, CCl3, CBr3 and tert-butyl groups.
  rings:
    type: int
    registry: derived
    computed: true
    min: 0
    description: >-
      Its rings, as RDKit counts them: its symmetrised smallest set of smallest
      rings, which counts each ring a symmetric cage could have chosen, so 6 for
      cubane, whose smallest set has 5.
  aromatic_rings: { registry: derived, type: int, computed: true, indexed: true, min: 0 }
  fraction_csp3:
    type: float
    registry: derived
    label: Fraction Csp3
    computed: true
    indexed: true
    min: 0
    max: 1
    description: The share of its carbons that are sp3.
  stereocentres:
    type: int
    registry: derived
    computed: true
    min: 0
    description: Its tetrahedral stereocentres, defined or not.
  undefined_stereocentres:
    type: int
    registry: derived
    computed: true
    indexed: true
    min: 0
    description: Those whose configuration its structure doesn't give.
  qed:
    type: float
    registry: derived
    label: QED
    computed: true
    indexed: true
    min: 0
    max: 1
    description: >-
      Its quantitative estimate of drug-likeness (Bickerton et al., 2012), from 0
      to 1.
  lipinski_violations:
    type: int
    registry: derived
    computed: true
    indexed: true
    min: 0
    max: 4
    description: >-
      How many of Lipinski's rule of five it breaks: a molecular weight over 500,
      a logP over 5, more than 5 donors (NH and OH) or more than 10 acceptors (N
      and O).
  pubchem_cid:
    type: string
    registry: fact
    label: PubChem CID
    max_length: 20
    pattern: "^[1-9][0-9]*$"
    indexed: true
    unique: true
    link: "https://pubchem.ncbi.nlm.nih.gov/compound/{value}"
    description: Its PubChem Compound ID, such as 2244.
  chembl_id:
    type: string
    registry: fact
    label: ChEMBL ID
    max_length: 20
    pattern: "^CHEMBL[1-9][0-9]*$"
    indexed: true
    unique: true
    link: "https://www.ebi.ac.uk/chembl/explore/compound/{value}"
    description: Its ChEMBL ID, such as CHEMBL25.
  cas_number:
    type: string
    registry: fact
    label: CAS number
    max_length: 12
    pattern: "^[1-9][0-9]{1,6}-[0-9]{2}-[0-9]$"
    indexed: true
    description: Its CAS Registry Number, such as 50-78-2.
  inn:
    type: string
    registry: fact
    label: INN
    max_length: 100
    pattern: "^[a-z][a-z -]*[a-z]$"
    indexed: true
    description: >-
      Its International Nonproprietary Name, as the WHO gives it, in lower case,
      such as acetylsalicylic acid.
  stereochemistry:
    type: enum
    registry: fact
    values: [achiral, absolute, relative, racemic, mixture, unknown]
    indexed: true
    description: >-
      What's known of its stereochemistry, as its registrars record it: achiral;
      one stereoisomer whose absolute or relative configuration is known; a
      racemate; a mixture of stereoisomers; or not known. Its structure says which
      stereocentres it has, not which of these the material is.
display:
  title: "{{ name or hrid }}"
# Its structure as a Molfile, and with its fields as an SDF's data, alone or with others
# from the records table, written by Iki from its Molfile at any revision (ADR 0229).
exports:
  - export: compound
    structure: molfile
