# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
#
# RDKit from PyPI, on the backend tier like the protein plugin's Biopython: its wheels
# hold everything it needs (Boost, the InChI library), so it needs no image of its own.
apiVersion: iki/v1
kind: Environment
name: chemistry-tools
label: Chemistry tools
description: RDKit 2026.09.2, with the InChI library 1.07.3, on Python 3.12.
tiers: [backend, client]
# What it needs at least: RDKit and a few thousand molecules fit in 512 MiB.
resources: { cpu: 0.25, memory: 512Mi }
python: { version: "3.12", requirements: requirements.txt }
