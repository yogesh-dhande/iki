# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Trigger
name: compute_batch_formula_weight
label: Compute each new batch's formula weight
description: >-
  Computes a batch's formula weight, from its compound and its salt and solvent, as
  soon as it's registered, such as from its form.
on: entity.created
type: CompoundBatch
action: compute_formula_weight
---
# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Trigger
name: recompute_batch_formula_weight
label: Compute a batch's formula weight again when its salt form changes
description: >-
  Computes a batch's formula weight again when someone changes its salt or solvent,
  or how many of either it has.
on: entity.updated
type: CompoundBatch
fields: [compound, salt, salt_equivalents, solvate, solvate_equivalents]
# Its compound's SMILES is fixed once registered, so this never fires: it says that the
# formula weight is worked out from nothing else of the compound.
watch_included:
  compound: [smiles]
action: compute_formula_weight
