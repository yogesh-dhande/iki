# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Trigger
name: compute_new_compound_descriptors
label: Compute each new compound's descriptors
description: >-
  Computes a compound's molecular weight, logP, TPSA and its other descriptors as
  soon as it's registered: once for each identity, as they're its registry entry's,
  which every project with a record of it shares. Runs that compute them only fill
  in fields, so they never fire a trigger again.
on: entity.registered
type: Compound
action: compute_descriptors
