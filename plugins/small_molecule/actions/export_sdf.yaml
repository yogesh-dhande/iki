# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Action
name: export_sdf
label: Export compounds to an SDF file
description: >-
  Writes compounds to an SDF file, which the run keeps to download: each with 2D
  coordinates RDKit computes, its name (or HRID) as its title, and its HRID, SMILES,
  InChIKey, descriptors and IDs as SD fields, as they were when the run was
  launched.
inputs:
  compounds:
    type: Compound
    schema: ">=1"
    cardinality: many
    max: 50000
    description: The compounds to write, in the order they're written.
software:
  - { name: RDKit, version: "2026.09.2", url: https://www.rdkit.org }
runs_on: { tier: backend, environment: chemistry-tools }
command: [python, ./scripts/sdf.py, export]
artifacts: { keep: [compounds.sdf] }
metrics:
  compounds: { label: Compounds, description: How many it wrote. }
timeout: 1h
