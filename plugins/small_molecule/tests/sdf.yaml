# Run with `iki plugin test plugins/small_molecule` (ADR 0093). data/stockroom.sdf was
# written for these tests by RDKit, from the structures' SMILES: no one else's data.
apiVersion: iki/v1
kind: ActionTest
name: a_stockrooms_sdf_file
description: >-
  Two records with their batches: aspirin's sodium salt, registered as its parent,
  aspirin, its salt's name and CAS number left off it (the name is its batch's);
  and pheniramine, drawn as its free base, whose Salt field makes its batch a
  hydrochloride, so its name is its batch's too.
action: import_sdf
params:
  file: { $file: stockroom }
  name_field: Name
  parent: true
  batches: true
files: { stockroom: tests/data/stockroom.sdf }
expect:
  output:
    creates:
      - type: iki/small_molecule.Compound
        values: { inchikey: BSYNRYMUTXBXSQ-UHFFFAOYSA-N, smiles: CC(=O)Oc1ccccc1C(=O)O }
      - type: iki/small_molecule.CompoundBatch
        values:
          name: aspirin sodium
          salt: sodium
          salt_equivalents: 1
          formula_weight: 202.141
          purity: 98.5
          amount: 250
          supplier: Stockroom
          supplier_lot: B-17
      - type: iki/small_molecule.Compound
        values: { inchikey: IJHNSHDBIRRJRN-UHFFFAOYSA-N }
      - type: iki/small_molecule.CompoundBatch
        values:
          name: pheniramine
          salt: hydrochloride
          salt_equivalents: 1
          formula_weight: 276.811
    metrics: { records: 2, skipped: 0 }
