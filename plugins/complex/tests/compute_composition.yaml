apiVersion: iki/v1
kind: ActionTest
name: an_ambiguous_residue
description: A part with an X has no one formula, so the complex has none.
action: compute_composition
inputs:
  complex:
    - type: iki/complex.ProteinComplex
      values:
        components:
          - { copies: 2 }
      included:
        components.part:
          - type: iki/protein.Protein
            values: { name: partly read, sequence: MKXLV }
expect:
  error: "partly read has 'X', an ambiguous or unknown residue, which has no one formula."
