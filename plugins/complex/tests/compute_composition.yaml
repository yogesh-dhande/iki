apiVersion: iki/v1
kind: ActionTest
name: trastuzumab_fab_bound_to_her2
description: >-
  Trastuzumab's Fab bound to HER2's extracellular domain, as PDB 1N8Z shows
  it (Cho et al., Nature 421:756, 2003): a complex of a complex. Its parts
  are the Fab, an antibody whose composition was computed from its light
  chain (1N8Z's chain A, 214 residues, 23,442.82 u) and its heavy chain's Fd
  (chain B, 220, 23,403.96 u), and HER2's residues 1 to 607 (chain C,
  66,919.62 u), each as Biopython weighs it; RCSB's entity weights for the
  three are 0.1% higher (23.466, 23.425 and 66.989 kDa). Its chains are the
  Fab's two and HER2's one. Its bonds are HER2's 23 disulfides, as 1N8Z's
  SSBOND records give them; the Fab's 4 (A23-A88, A134-A194, B22-B96 and
  B147-B203 in 1N8Z, its chains not joined, as its Fd stops before the hinge)
  are the Fab's own, which it counts as its parts' disulfides, for a lot of it. At 280 nm the Fab has 71,280 L/(mol.cm) with its thiols
  free (its chains' 7 tryptophans and 22 tyrosines) and HER2 62,340 (7 and 16),
  as Biopython's ProtParam gives them: 133,620 together, 136,495 with HER2's
  disulfides, and 136,995 with the Fab's as well.
action: compute_composition
inputs:
  complex:
    - type: iki/complex.ProteinComplex
      values:
        name: trastuzumab Fab–HER2
