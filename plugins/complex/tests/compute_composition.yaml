apiVersion: iki/v1
kind: ActionTest
name: a_deuterated_ligand
description: >-
  Human VMAT2 (UniProt Q05940, 514 residues) with deutetrabenazine, its
  inhibitor tetrabenazine with its two methoxy groups' hydrogens deuterium
  (PubChem CID 73442840, C19H27NO3 as PubChem writes it, 323.2368 u
  monoisotopic): RDKit writes it C19H21D6NO3, and its six deuteriums weigh
  as deuterium, 2.0141 u each, not hydrogen's 1.0078, in both of the
  complex's masses. A formula is read as RDKit writes one, isotopes and all.
action: compute_composition
inputs:
  complex:
