apiVersion: iki/v1
kind: ActionTest
name: a_dna_duplex_with_a_drug
description: >-
  The Drew-Dickerson dodecamer, CGCGAATTCGCG, self-complementary, so two
  strands (Drew et al., PNAS 78:2179, 1981; PDB 1BNA), with netropsin in its
  minor groove (Kopka et al., PNAS 82:1376, 1985; PubChem CID 4461,
  C18H26N10O3). A DNA sequence's formula is its bases': its two strands,
  each its deoxynucleotides' less a water for each of its 11 phosphodiester
  bonds, with a 5′ phosphate, as Biopython's molecular_weight weighs a
  double-stranded one (7,452.73 u); so it's two chains, not one. The
  dodecamer was made with a 5′ hydroxyl on each strand, HPO3 lighter, which
  the run says. DNA absorbs at 280 nm in ways Pace's values don't weigh.
action: compute_composition
inputs:
  complex:
    - type: iki/complex.ProteinComplex
      values:
        name: dodecamer with netropsin
        components:
          - { part: 00000000-0000-7000-8003-000000000051, copies: 1, role: DNA }
          - { part: 00000000-0000-7000-8003-000000000052, copies: 1, role: drug }
      included:
        components.part:
          - type: iki/dna.DNASequence
            values:
              {
                name: Drew-Dickerson dodecamer,
                bases: CGCGAATTCGCG,
                topology: linear,
                strandedness: double,
              }
          - type: iki/small_molecule.Compound
            values:
              {
                name: netropsin,
                smiles: "CN1C=C(C=C1C(=O)NC2=CN(C(=C2)C(=O)NCCC(=N)N)C)NC(=O)CN=C(N)N",
                molecular_formula: C18H26N10O3,
              }
expect:
  output:
    updates:
      complex:
        - values:
            molecular_formula: C250H322N102O149P24
            molecular_weight: 7883.26
            monoisotopic_mass: 7879.4458
            chain_count: 2
    messages:
      - level: info
        text: "Its molar absorbance at 280 nm isn't computed: Drew-Dickerson dodecamer and netropsin aren't proteins, and Pace's values weigh only proteins' tryptophans, tyrosines and cystines. Its linear DNA's strands are weighed with a 5′ phosphate and a 3′ hydroxyl, as Biopython weighs DNA: a strand made with a 5′ hydroxyl, as a synthetic or PCR-made one is, is HPO3 (79.98 u) lighter."
