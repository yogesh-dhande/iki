description: >-
  Amivantamab's four chains (KEGG DRUG D11894) as a protein complex, one copy
  of each, with the 16 disulfides KEGG lists. Its parts as they are, each
  cysteine's thiol free, are C6472H10046N1730O2023S46; with its disulfides,
  C6472H10014N1730O2023S46, as KEGG gives it, 145,900.13 u average and
  145,810.1054 u monoisotopic, where KEGG gives 145,900.22 and 145,810.1055:
  its atomic weights differ from Biopython's in their last figures.
  At 280 nm its chains have 214,410 L/(mol.cm) with every thiol free, as
  Biopython's ProtParam gives them one by one (80,790, 82,280, 24,410 and
  26,930), and 216,410 with its 16 disulfides' cystines: counting each chain's
  own pairs of cysteines, as one protein's oxidized value does, would give
