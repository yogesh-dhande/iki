# Run with `iki plugin test plugins/complex --with plugins/dna --with plugins/protein --with plugins/small_molecule --with plugins/antibody` (ADR 0093).
apiVersion: iki/v1
kind: ActionTest
name: hemoglobin_a
description: >-
  Human hemoglobin A (Complex Portal CPX-2158, "2xHBA1:2xHBB"): two α chains
  (UniProt P69905 without its initiator methionine, 141 residues), two β
  chains (P68871, 146) and a heme b on each (C34H32FeN4O4). Its α chain alone
  is 15,126.16 u, as Rai, Landin and Green measured a normal α chain by
  electrospray (15,126.4 Da; Waters application note, "The analysis of human
  haemoglobin variants using mass spectrometry"), and the whole is 64.45 ku,
  Complex Portal's 64 kD.
action: compute_composition
inputs:
  complex:
    - type: iki/complex.ProteinComplex
      values:
        name: hemoglobin A
        complex_portal_id: CPX-2158
        components:
          - { copies: 2, role: alpha }
          - { copies: 2, role: beta }
          - { copies: 4, role: heme }
      included:
        components.part:
          - type: iki/protein.Protein
            values:
              {
                name: hemoglobin subunit alpha,
                sequence: VLSPADKTNVKAAWGKVGAHAGEYGAEALERMFLSFPTTKTYFPHFDLSHGSAQVKGHGKKVADALTNAVAHVDDMPNALSALSDLHAHKLRVDPVNFKLLSHCLLVTLAAHLPAEFTPAVHASLDKFLASVSTVLTSKYR,
              }
          - type: iki/protein.Protein
            values:
              {
                name: hemoglobin subunit beta,
                sequence: VHLTPEEKSAVTALWGKVNVDEVGGEALGRLLVVYPWTQRFFESFGDLSTPDAVMGNPKVKAHGKKVLGAFSDGLAHLDNLKGTFATLSELHCDKLHVDPENFRLLGNVLVCVLAHHFGKEFTPPVQAAYQKVVAGVANALAHKYH,
              }
          - type: iki/small_molecule.Compound
            values:
              {
                name: heme b,
                smiles: "CC1=C(CCC(O)=O)C2=CC3=C(CCC(O)=O)C(C)=C4C=C5C(C)=C(C=C)C6=[N]5[Fe]7(N34)N2C1=CC1=C(C)C(C=C)=C6[N]17",
                molecular_formula: C34H32FeN4O4,
              }
expect:
  output:
    updates:
      complex:
        - values:
            molecular_formula: C2954H4508Fe4N780O806S12
            molecular_weight: 64452.3
            monoisotopic_mass: 64412.9788
            chain_count: 4
