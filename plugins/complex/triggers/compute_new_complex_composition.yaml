# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Trigger
name: compute_new_complex_composition
label: Compute each new complex's composition
description: >-
  Computes a complex's formula and masses as soon as it's registered, whatever
  its type (an antibody, a multispecific antibody, an Fc fusion, a protein
  complex, or a lab's own): once for each identity, as they're its registry
  entry's. Runs that compute them only fill in fields, so they never fire a
  trigger again.
on: entity.registered
type: iki/core.Complex
run: compute_composition
