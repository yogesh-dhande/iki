# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Action
name: compute_composition
label: Compute a complex's composition
description: >-
  A complex's formula, average and monoisotopic masses and chain count, from
  its parts, each times its copies: a protein's formula from its residues and
  water, a DNA sequence's from its bases, its strands and topology, and a
  small molecule's, an oligonucleotide's or another complex's from its entry's
  molecular formula. A part with none (a sequence with an ambiguous residue or
  base, or a molecule whose formula isn't known yet) is named, and nothing is
  computed for that complex. And its molar absorbance at 280 nm, Pace's, from
  its parts' tryptophans and tyrosines with each cysteine's thiol free, if its
  parts are all proteins or complexes with one. It counts the disulfides its
  parts have of their own, such as a Fab's in a complex of the Fab and its
  antigen, for this project's record. The run also says its formula, masses
  and absorbance with its disulfides, its own and its parts': two hydrogens
  off and a cystine's 125 L/(mol.cm) on for each.
inputs:
  complex: { type: iki/core.Complex, schema: ">=1", include: [components.part] }
effects:
  updates:
    - input: complex
      fields:
        [
          molecular_formula,
          molecular_weight,
          monoisotopic_mass,
          chain_count,
          extinction_coefficient_reduced,
          part_disulfides,
          part_bonds_complete,
        ]
runs_on: { tier: backend, environment: complex-tools }
command: [python, ./scripts/composition.py]
deterministic: true
batchable: 100
timeout: 5m
