# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Action
name: check_assembly
label: Check an assembly against its product
description: >-
  Works out what a cloning plan makes and checks it against the sequence its clone turned
  out to have: the same bases from any origin and on either strand are the same molecule
  (ADR 0138). It says how long the circle is, where its junctions are, and, when they
  differ, by how much. A plan whose parts make several circles is settled here, since the
  clone's sequence says which was made; one Iki can't work out leaves no result, and the
  old one is cleared rather than left to be read as current.
inputs:
  assembly: { type: Assembly, schema: ">=1", include: [backbone, inserts, product] }
params:
  min_overlap:
    type: int
    min: 10
    max: 200
    default: 15
    label: Least Gibson overlap
    description: The shortest stretch two fragments must share for a Gibson assembly to join them.
  backbone_fragment:
    type: enum
    values: [longest, any]
    default: longest
    label: Which fragment of the backbone
    description: >-
      Which of the backbone's fragments goes into the reaction. By default its longest,
      as a vector digest is purified down to the band cut out of the gel; `any` tries
      every fragment of it, for a plan that keeps another one.
effects:
  updates:
    - input: assembly
      fields: [simulated_length, matches_product, junctions]
software:
  - { name: Biopython, version: "1.88", url: https://biopython.org }
runs_on: { tier: backend, environment: plasmid-tools }
command: [python, ./scripts/plasmids.py, check]
deterministic: true
batchable: 10
timeout: 30m
