# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
#
# A plasmid's map, drawn round a circle: Iki's own sequence viewer draws a sequence in
# rows, which a plasmid isn't read as. It draws the annotation the plugin's actions find
# (ADR 0084); Iki sets `entity` to the plasmid, as the person viewing it may read it.
apiVersion: iki/v1
kind: Component
name: plasmid_map
label: Map
description: >-
  The plasmid round a circle, each annotated part an arc pointing the way its strand
  runs, with its coordinates, how much of the library's part matched, and where that
  part's bases are from.
module: ./components/plasmid-map.js
element: plasmid-map
slots: [{ slot: entity.tab, type: Plasmid }]
