# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
#
# A plasmid is its sequence. Its identity is the DNA sequence's registry entry, so the
# DNA plugin reads the molecule (a circle from any origin, a duplex from either strand:
# ADR 0138) and this plugin never spells a plasmid's bases again. Its topology comes with
# that molecule: the same bases as a circle and as a linear molecule are two entries, so
# they are two plasmids (ADR 0168).
#
# What a plasmid is, for everyone who holds it, is its entry's: its length, which follows
# from the sequence alone, and the facts a registration team curates (its copy number,
# the hosts it works in, what it is, its biosafety level). What depends on the choices a
# run or a project made is each project's record's: the annotation, which depends on the
# library and the identity a run asked for, as an antibody's numbering depends on its
# scheme; and where the plasmid came from, under what agreement, in which strain.
apiVersion: iki/v1
kind: EntityType
name: Plasmid
label: Plasmid
label_plural: Plasmids
schema_version: 4
description: >-
  A plasmid or vector, by the DNA sequence that is it, circular or linear. Two plasmids of
  the same sequence are the same plasmid, so registering one again finds its registry
  entry, whatever origin or strand its sequence was read from. Its record says what the
  sequence alone doesn't: how it's selected, where it replicates and at what copy number,
  the hosts it works in, its promoters, its biosafety level, and where it came from.
hrid: { prefix: PLS }
identity: [sequence]
fields:
  sequence:
    type: ref
    to: iki/dna.DNASequence
    required: true
    immutable: true
    description: >-
      The double-stranded DNA sequence that is this plasmid, by its registry entry: its
      bases, topology, features and accession are the sequence's. The same bases as a
      circle and as a linear molecule are two sequence entries, so they are two plasmids.
  length:
    type: quantity
    registry: derived
    unit: "{bp}"
    computed: true
    indexed: true
    min: 0
    description: Its base pairs, the sequence's length.
  topology:
    type: enum
    registry: derived
    indexed: true
    computed: true
    values: [circular, linear]
    description: >-
      Whether it is a circle or a molecule with two ends, as its sequence says (a
      GenBank record's LOCUS line, a SnapGene file's flag, or what whoever registered it
      chose). It follows from the sequence alone, so it is the registry entry's, the same
      for every project, and nobody states it against the molecule: the same bases are a
      different molecule read each way. Most plasmids are circles. Linear ones are real
      -- Kluyveromyces lactis carries pGKL1 and pGKL2, Borrelia burgdorferi a set of
      them, Streptomyces coelicolor SCP1 -- and their two ends are what a map must draw
      and an annotation must not read across (ADR 0168).
  name: { type: string, max_length: 255, indexed: true }
  description: { type: text, max_length: 10000 }
  vector_type:
    type: enum
    registry: fact
    indexed: true
    values:
      [
        cloning,
        bacterial_expression,
        mammalian_expression,
        yeast_expression,
        insect_expression,
        shuttle,
        lentiviral,
        retroviral,
        aav,
        adenoviral,
        crispr,
        reporter,
        gateway_donor,
        gateway_destination,
        other,
      ]
    description: >-
      What the vector is for. A registry fact: whoever registers it may set it, and then
      only its registrars change it, with a reason.
  hosts:
    type: list
    registry: fact
    max_items: 7
    items:
      type: enum
      values: [bacterial, yeast, mammalian, insect, plant, cell_free, viral]
    description: >-
      The hosts it replicates or is expressed in: bacterial for an E. coli plasmid,
      viral for a vector packaged into virus particles, such as a lentiviral one.
  copy_number:
    type: enum
    registry: fact
    indexed: true
    values: [high, low, single]
    description: >-
      How many copies a cell carries, as its origin keeps it: high for a pUC origin
      (some hundreds), low for pBR322's or pSC101's, single for a yeast centromere
      vector. It depends on the host and how it's grown, so it's curated, not computed.
  biosafety_level:
    type: enum
    registry: fact
    indexed: true
    values: [bsl1, bsl2, bsl3, bsl4]
    description: >-
      The containment level the plasmid itself calls for, as its depositor or vendor
      states it: BSL-1 for an E. coli cloning vector, BSL-2 for a lentiviral or
      retroviral one. It isn't the lab's risk assessment of the work, which an
      institutional committee makes: `biosafety_approval` names that.
  replication_origins:
    type: list
    max_items: 10
    items: { type: string, max_length: 60, pattern: "^[A-Za-z0-9][A-Za-z0-9 ()./+'-]{0,59}$" }
    description: >-
      Its origins of replication, as the annotation finds them: pMB1/pUC, f1, SV40,
      ARSH4. A centromere (CEN6) segregates a plasmid rather than replicating it, so it
      is annotated as a centromere feature and isn't one of these.
  bacterial_resistance:
    type: list
    max_items: 8
    items:
      type: enum
      values:
        [
          ampicillin,
          kanamycin,
          chloramphenicol,
          tetracycline,
          spectinomycin,
          streptomycin,
          gentamicin,
          zeocin,
        ]
    description: The antibiotics it is selected with in bacteria, as the annotation finds them.
  selection_markers:
    type: list
    max_items: 8
    items:
      type: enum
      values:
        [
          neomycin_g418,
          puromycin,
          hygromycin,
          blasticidin,
          zeocin,
          ura3,
          leu2,
          his3,
          trp1,
          lys2,
          ade2,
          dhfr,
          gs,
        ]
    description: >-
      What selects cells carrying it, beyond bacteria: a mammalian resistance marker, or
      a yeast auxotrophic one, as the annotation finds them.
  promoters:
    type: list
    max_items: 12
    items: { type: string, max_length: 60, pattern: "^[A-Za-z0-9][A-Za-z0-9 ()./+'-]{0,59}$" }
    description: "Its promoters, as the annotation finds them: T7, lac, CMV, SV40 early."
  annotated_features:
    type: json
    computed: true
    description: >-
      The parts of the library found along its sequence, as a sequence viewer's features
      (ADR 0085): each with where it lies, its strand, how much of the part matched, and
      the INSDC record the part's bases are from.
    schema:
      type: array
      maxItems: 2000
      items:
        type: object
        additionalProperties: false
        required: [type, name, start, end, strand]
        properties:
          type: { type: string, minLength: 1, maxLength: 64 }
          name: { type: string, minLength: 1, maxLength: 200 }
          start: { type: integer, minimum: 1 }
          end:
            type: integer
            minimum: 1
            description: Before start, it wraps the plasmid's origin.
          strand: { enum: [forward, reverse] }
          qualifiers:
            type: object
            maxProperties: 20
            additionalProperties: { type: string, maxLength: 1000 }
  orfs:
    type: json
    computed: true
    label: Open reading frames
    description: >-
      Its open reading frames, in all six frames, as the ORF action found them: each with
      its frame, where it lies, its length and the protein it codes for (ADR 0172). One on
      a circle may read across the origin, and none on a linear molecule reads across its
      ends.
    schema:
      type: array
      maxItems: 5000
      items:
        type: object
        additionalProperties: false
        required: [start, end, strand, frame, length, amino_acids, start_codon, translation]
        properties:
          start:
            type: integer
            minimum: 1
            description: Its first base on the forward strand, its start or stop codon's.
          end:
            type: integer
            minimum: 1
            description: >-
              Its last base on the forward strand, the stop codon's included. Before
              start, it reads across a circle's origin.
          strand: { enum: [forward, reverse] }
          frame:
            type: integer
            minimum: -3
            maximum: 3
            description: >-
              Which of the six frames it is read in: 1, 2 or 3 on the forward strand, by
              the base it starts at, and -1, -2 or -3 on the reverse.
          length:
            type: integer
            minimum: 6
            description: Its bases, its stop codon's included.
          amino_acids:
            type: integer
            minimum: 1
            description: Its codons, its start codon's included and its stop codon's not.
          start_codon: { type: string, minLength: 3, maxLength: 3 }
          translation:
            type: string
            maxLength: 20000
            description: >-
              The protein it codes for, by the translation table the run used, its start
              codon read as methionine.
  orfs_found_with:
    type: string
    max_length: 200
    computed: true
    label: ORFs found with
    description: >-
      What the ORFs were found with, so they can be read years later: "ORFs of at least
      75 codons, translation table 11 (Bacterial, Archaeal, Plant Plastid), starting at
      ATG only; read across its origin".
  primer_binding_sites:
    type: json
    computed: true
    label: Primer binding sites
    description: >-
      Where the primers a run was given bind it, on both strands: each with the primer it
      is, where it lies, the base its 3' end pairs with, how much of it annealed, its 5'
      tail, each mismatch and how far that is from its 3' end, and the site's melting
      temperature (ADR 0172). One on a circle may cross the origin.
    schema:
      type: array
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        required: [primer, name, strand, start, end, three_prime, annealed, tail, mismatches]
        properties:
          primer:
            type: string
            maxLength: 32
            description: The primer's ID, such as PRM-000001, which its row links to.
          name: { type: string, minLength: 1, maxLength: 255 }
          strand:
            enum: [forward, reverse]
            description: >-
              The strand the primer's own bases are those of, and so the way it extends:
              rightwards along the forward strand, leftwards along the reverse.
          start: { type: integer, minimum: 1 }
          end:
            type: integer
            minimum: 1
            description: Before start, it crosses a circle's origin.
          three_prime:
            type: integer
            minimum: 1
            description: The base its 3' end pairs with, from which a polymerase extends.
          annealed:
            type: integer
            minimum: 1
            description: Its bases that pair with the template, from its 3' end.
          tail:
            type: integer
            minimum: 0
            description: >-
              Its 5' bases that don't pair with the template. A product has them, since
              there it is copied from the primer.
          mismatches:
            type: array
            maxItems: 50
            items:
              type: object
              additionalProperties: false
              required: [from_three_prime, primer, template]
              properties:
                from_three_prime:
                  type: integer
                  minimum: 1
                  description: >-
                    How far the mismatched base is from the primer's 3' end, its 3'-most
                    base being 1.
                primer: { type: string, minLength: 1, maxLength: 1 }
                template: { type: string, minLength: 1, maxLength: 1 }
          melting_temperature:
            type: number
            description: >-
              The site's Tm in degrees Celsius, of its annealed bases against the
              template's own, so a mismatch lowers it. Left out where there are no
              parameters for a mismatch.
  primer_binding_sites_found_with:
    type: string
    max_length: 300
    computed: true
    label: Binding sites found with
    description: >-
      How the sites were found and their melting temperatures computed: the 3' bases a
      primer was placed by, the mismatch weighting it was kept under, and the Tm method
      with its salt and strand concentrations.
  annotated_with:
    type: string
    max_length: 200
    computed: true
    description: >-
      Which library annotated it, and the identity a hit needed: "iki/plasmid features
      1.0 (34 parts), at least 90% identity".
  source:
    type: enum
    values: [in_house, addgene, vendor, collaborator, other]
    indexed: true
    description: Where this project's plasmid came from.
  source_assembly:
    type: ref
    to: Assembly
    label: Source assembly
    description: >-
      The assembly that produced this project’s material. Its record names the backbone,
      inserts, method and observed product. Leave this empty when the route is unknown.
  addgene_id:
    type: string
    max_length: 7
    pattern: "^[1-9][0-9]{0,6}$"
    indexed: true
    link: "https://www.addgene.org/{value}/"
    description: Its Addgene plasmid number, if it's from Addgene, such as 52961.
  vendor: { type: string, max_length: 200 }
  catalog_number: { type: string, max_length: 100, indexed: true }
  depositor:
    type: string
    max_length: 200
    description: Who deposited or made it, as its source names them.
  received_on: { type: date, label: Received on }
  growth_strain:
    type: string
    max_length: 100
    description: >-
      The strain it's propagated in, where it matters: Stbl3 for a vector with long
      terminal repeats, ccdB Survival for a Gateway destination vector, DH5-alpha
      otherwise.
  growth_temperature:
    type: quantity
    unit: Cel
    min: 0
    max: 50
    description: The temperature it's grown at, where it isn't 37 °C.
  mta_required:
    type: bool
    label: Under an MTA
    indexed: true
    description: >-
      Whether a material transfer agreement covers it. One that does limits what may be
      done with it and with what's made from it.
  mta_reference:
    type: string
    max_length: 100
    indexed: true
    label: MTA reference
    description: The agreement's number in the lab's own records, or the provider's.
  mta_provider: { type: string, max_length: 200, label: MTA provider }
  mta_signed_on: { type: date, label: MTA signed on }
  mta_restrictions:
    type: text
    max_length: 5000
    label: MTA restrictions
    description: >-
      What the agreement limits: non-commercial use only, no passing it on, a
      publication to acknowledge, results to share before publishing.
  biosafety_approval:
    type: string
    max_length: 100
    description: >-
      The institutional biosafety approval that covers work with it, by its number: what
      a committee decided, not what the plasmid is.
# Kept at every save, however a record is written: by an action, through the API, by a
# bulk import or in a bundle (ADR 0127).
rules:
  source_assembly_product:
    label: The source assembly produced this plasmid’s sequence
    when: record.source_assembly != null
    check: record.source_assembly.product != null && record.source_assembly.product == record.sequence.id
    message: Select an assembly whose recorded product is this plasmid’s DNA sequence.
    fields: [source_assembly]
  topology_is_the_sequences:
    label: A plasmid's topology is its sequence's
    description: >-
      Its topology comes with the molecule, so it is never stated against it: a run that
      wrote another value would say a circle is linear, and the map, the annotation and
      every cloning plan read it from here.
    check: record.topology == null || record.topology == record.sequence.topology
    message: >-
      {{ record.sequence }} says it is {{ record.sequence.topology }}, so the plasmid's
      topology is that: it follows from the sequence, and the same bases read as a circle
      and as a linear molecule are two different sequences, each with its own plasmid.
    fields: [topology]
  a_plasmid_is_double_stranded:
    label: A plasmid's sequence is double-stranded
    description: >-
      A plasmid is a duplex, which its preps are quantified as (50 µg/mL of
      double-stranded DNA for an A260 of 1).
    check: record.sequence.strandedness == "double"
    message: >-
      A plasmid is a double-stranded molecule, and {{ record.sequence }} is
      single-stranded. Register a single-stranded circle, such as a phage's genome, as a
      DNA sequence.
    fields: [sequence]
  an_mta_is_named:
    label: A plasmid under an MTA names the agreement
    check: record.mta_reference != null
    when: record.mta_required
    message: >-
      It's under a material transfer agreement, so name the agreement: whoever uses it
      has to know which terms they're under.
    fields: [mta_reference]
  containment_is_approved:
    label: A BSL-2 plasmid names its biosafety approval
    check: record.biosafety_approval != null
    when: record.biosafety_level in ["bsl2", "bsl3", "bsl4"]
    message: >-
      Work with a plasmid at this containment level needs an institutional biosafety
      approval: name it.
    fields: [biosafety_approval]
display:
  title: "{{ name or hrid }}"
# Downloads as its sequence's GenBank or FASTA under its own name and description, with
# the parts its annotation found after the sequence's own features (ADR 0171).
exports:
  - export: sequence
    sequence: sequence
    features: annotated_features
    description: description
