# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
#
# How a construct was made: a backbone, the inserts that go into it, and the reaction
# that joins them. It has no identity: one molecule can be made by several routes, and
# two labs that clone the same plasmid each have their own plan, so an assembly is a
# project's own record (ADR 0115).
#
# Its product is the DNA sequence the clone turned out to have, not the plasmid record:
# the sequence is what a simulation can be compared with, and the plasmid registered from
# that sequence is the same molecule, so a plan, the sequence it makes and the plasmid
# that is it are one chain in the graph (ADR 0123). What the plan makes is a prediction,
# which `assemble` registers as its own records made from the plan.
apiVersion: iki/v1
kind: EntityType
name: Assembly
label: Assembly
label_plural: Assemblies
schema_version: 6
description: >-
  A cloning plan: a backbone, the inserts going into it, and how they're joined
  (restriction-ligation with its enzymes, Golden Gate, Gibson, Gateway LR or BP, TOPO), or
  a digest that cuts one molecule and keeps a band. Iki works out what the plan makes --
  a circle where the parts close one, a linear molecule where they don't -- and checks it
  against the sequence the clone turned out to have.
hrid: { prefix: ASM }
fields:
  name: { type: string, max_length: 255, indexed: true }
  description: { type: text, max_length: 10000 }
  method:
    type: enum
    required: true
    indexed: true
    values: [digest, restriction_ligation, golden_gate, gibson, gateway_lr, gateway_bp, topo]
    description: >-
      How the parts are joined, or how one is cut. A digest cuts the backbone with the
      plan's enzymes and keeps a band, which is a linear molecule: a vector linearised by
      one cut, or a fragment cut out of a plasmid. Restriction-ligation, Golden Gate and
      Gibson join the parts, and what they make is a circle where the parts close one and
      a linear molecule where they only join end to end. All four are worked out from the
      sequences; Gateway and TOPO are recorded, not simulated.
  enzymes:
    type: list
    max_items: 6
    items: { type: string, max_length: 20, pattern: "^[A-Za-z][A-Za-z0-9.-]{1,19}$" }
    description: >-
      The restriction enzymes the reaction cuts with, named as REBASE names them (EcoRI,
      BamHI, BsaI, BsmBI). Each part is cut with all of them. A Gibson assembly whose
      backbone is linearised by an enzyme names it too.
  backbone:
    type: ref
    to: iki/dna.DNASequence
    required: true
    description: >-
      The vector the inserts go into. For Gateway BP it's the donor vector, and for
      Gateway LR the destination vector. For a digest it's the molecule being cut.
  inserts:
    type: list
    max_items: 5
    items: { type: ref, to: iki/dna.DNASequence }
    description: >-
      The fragments going into the backbone, each by its DNA sequence: a PCR product, a
      synthesised fragment, or another plasmid a fragment is cut out of. For Gateway LR
      it's the entry clone.
  product:
    type: ref
    to: iki/dna.DNASequence
    description: >-
      The sequence the clone or the band turned out to have, once it's known: what Iki
      checks the plan against, its topology included. Register the plasmid for it from
      the same sequence, where what it makes is a vector.
  simulated_length:
    type: quantity
    unit: "{bp}"
    computed: true
    min: 0
    description: The base pairs of the molecule the plan makes, as Iki works it out.
  simulated_topology:
    type: enum
    computed: true
    indexed: true
    values: [circular, linear]
    label: Topology of what the plan makes
    description: >-
      Whether what the plan makes is a circle or has two ends. It follows from the method
      and the parts, and is never stated: a digest leaves a linear molecule; the
      assemblies make the circle their parts close, and the linear molecule they make
      when no arrangement closes (ADR 0168).
  verification_note:
    type: text
    computed: true
    label: Verification status
    max_length: 10000
    description: Why the current plan still needs re-verification.
  matches_product:
    type: bool
    computed: true
    label: Plan matches the product
    description: >-
      Whether what the plan makes is the same molecule as its product: the same bases and
      the same topology, a circle read from any origin and either strand, a linear
      molecule from either strand (ADR 0138).
  junctions:
    type: json
    computed: true
    description: >-
      Each junction of the molecule the plan makes: where it lies, which part meets
      which, and the overhang or shared stretch that joins them. A circle has one per
      part; a linear molecule has one fewer, since its two outer ends join nothing.
    schema:
      type: array
      maxItems: 50
      items:
        type: object
        additionalProperties: false
        required: [at, from, to]
        properties:
          at: { type: integer, minimum: 1 }
          from: { type: string, maxLength: 200 }
          to: { type: string, maxLength: 200 }
          overhang: { type: string, maxLength: 100 }
          overlap: { type: string, maxLength: 100 }
          bases: { type: string, maxLength: 200 }
          enzymes: { type: array, maxItems: 6, items: { type: string, maxLength: 20 } }
  fragments:
    type: list
    computed: true
    label: Virtual digest
    max_items: 500
    description: >-
      Every fragment of each of its parts cut with its enzymes, as Digest a plan's
      parts virtually lists them, largest first, as a gel reads: for a digest, the
      bands its backbone gives, every one of them, where Work out what an assembly
      makes keeps one. Each end names the enzyme that made it and its overhang, so the
      table says what it was cut with.
    items:
      type: row
      fields:
        part:
          type: string
          max_length: 255
          required: true
          description: The part it's a fragment of, by name and ID.
        length:
          type: int
          label: Length (bp)
          min: 1
          required: true
          description: Its base pairs, from the cut at one end to the cut at the other.
        start:
          type: int
          min: 1
          required: true
          description: Its first base on the part's top strand, from 1.
        end:
          type: int
          min: 1
          required: true
          description: >-
            Its last base on the part's top strand: before its start for a fragment that
            runs across a circle's origin.
        left:
          type: string
          max_length: 200
          label: Left end
          description: >-
            The enzyme that made its left end and the overhang it left, or the
            molecule's own end.
        right:
          type: string
          max_length: 200
          label: Right end
          description: >-
            The enzyme that made its right end and the overhang it left, or the
            molecule's own end.
rules:
  enzymes_for_cutting:
    label: A digest, restriction-ligation and Golden Gate name their enzymes
    check: size(record.enzymes) > 0
    when: record.method in ["digest", "restriction_ligation", "golden_gate"]
    message: >-
      Cutting needs the enzymes: name each as REBASE does, such as EcoRI and BamHI, or
      BsaI for Golden Gate.
    fields: [enzymes]
  a_digest_cuts_one_molecule:
    label: A digest names no inserts
    description: >-
      A digest cuts the backbone and keeps a band. Nothing goes into it, so an insert on
      such a plan would be read by nobody: what joins parts is one of the assembly
      methods.
    check: size(record.inserts) == 0
    when: record.method == "digest"
    message: >-
      A digest cuts {{ record.backbone }} and keeps a band of it, so it takes no inserts:
      for a plan that puts something into a vector, choose restriction-ligation, Golden
      Gate or Gibson.
    fields: [inserts]
display:
  title: "{{ name or hrid }}"
