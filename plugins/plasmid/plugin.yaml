# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Plugin
name: iki/plasmid
version: 0.7.2
title: Plasmids and vectors
description: >-
  Plasmids and vectors by the sequence that is each one, circular or linear, with what the
  sequence alone doesn't say: its selection markers, origins and copy number, the hosts it
  works in, its promoters, its biosafety level, where it came from and the agreement it
  came under; the cloning plans that make them, simulated and checked against the sequence
  they give; the open reading frames and primer binding sites along them, and the PCRs
  that amplify them; and the common vector parts a plasmid is annotated from.
license: Apache-2.0
iki: ">=0.1"
homepage: https://ikisci.org/plugins/plasmid
dependencies:
  iki/dna:
    types:
      DNASequence: ">=4"
      Primer: ">=1"
