# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Action
name: align_pair
label: Align two proteins
description: >-
  Aligns two proteins' sequences, as EMBOSS needle (global) or water (local)
  does with its defaults: BLOSUM62, a gap opening penalty of 10 and an
  extension penalty of 0.5, with gaps at the ends free in a global alignment.
  The run keeps the alignment, in EMBOSS's pair format and as aligned FASTA,
  and records its score, identity, similarity and gaps. U, O and J, which the
  matrices lack, are aligned as X. A local alignment with nothing scoring
  above zero is none, and the run says so. The FASTA is also an
  alignment of the two in Iki, the target its reference, for the alignment
  viewer.
inputs:
  query: { type: Protein, schema_version: ">=1" }
  target: { type: Protein, schema_version: ">=1" }
params:
  mode:
    type: enum
    values: [global, local]
    default: global
    description: Global aligns the whole of both (needle); local, their best-matching parts (water).
  matrix:
    type: enum
    label: Substitution matrix
    values: [BLOSUM62, BLOSUM45, BLOSUM50, BLOSUM80, BLOSUM90, PAM30, PAM70, PAM250]
    default: BLOSUM62
  gap_open:
    type: float
    label: Gap opening penalty
    min: 0
    max: 100
    default: 10
  gap_extend:
    type: float
    label: Gap extension penalty
    min: 0
    max: 10
    default: 0.5
effects:
  creates: [{ type: iki/core.Alignment, derived_from: [query, target] }]
software:
  - { name: Biopython, version: "1.88", url: https://biopython.org }
runs_on: { tier: backend, environment: protein-tools }
command: [python, ./scripts/align.py]
deterministic: true
artifacts: { keep: ["alignment.txt", "alignment.fasta"] }
metrics:
  score: { label: Score, description: The alignment's score under the matrix and penalties chosen. }
  length: { label: Length, description: "The alignment's length, gaps included." }
  identity_percent:
    label: Identity (%)
    description: The share of the alignment's columns that are identical, unrounded.
  similarity_percent:
    label: Similarity (%)
    description: >-
      The share of columns the matrix scores above zero (U, O and J scored as X,
      but similar to themselves), unrounded.
  gaps_percent: { label: Gaps (%), description: "The share of columns with a gap, unrounded." }
timeout: 10m
