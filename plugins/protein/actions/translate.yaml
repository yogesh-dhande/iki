# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Action
name: translate
label: Translate DNA into protein
description: >-
  Translates a DNA sequence, in the frame and with the genetic code chosen, and
  registers the translation as a protein, linked to the DNA. A frame is read
  codon by codon; a complete coding sequence is read as NCBI's tables say of
  one, its start codon giving methionine. A protein already in Iki (the same
  sequence) is reused.
inputs:
  sequence: { type: iki/dna.DNASequence, schema_version: ">=1" }
params:
  strand:
    type: enum
    values: [forward, reverse]
    default: forward
    description: Reverse translates the reverse complement.
  frame:
    type: int
    min: 1
    max: 3
    default: 1
    description: The base it starts at, on the strand chosen.
  table:
    type: int
    label: Genetic code
    min: 1
    max: 33
    default: 1
    description: >-
      NCBI's translation table: 1 is the standard code, 2 vertebrate
      mitochondrial, 4 mold and mycoplasma, 11 bacterial, archaeal and plastid.
  to_stop:
    type: bool
    label: Stop at the first stop codon
    default: true
    description: >-
      Otherwise each stop codon is kept, as *. Genetic codes 27, 28 and 31,
      whose stop codons can also code for amino acids, can't stop at the first.
  complete_cds:
    type: bool
    label: Complete coding sequence
    default: false
    description: >-
      Translate it as a whole coding sequence: its first codon must be one of
      the genetic code's start codons, translated as methionine, and its last a
      stop codon, left out, with no other stop and no bases left over. Stop at
      the first stop codon doesn't apply.
effects:
  creates: [{ type: Protein, cardinality: one, derived_from: [sequence] }]
software:
  - { name: Biopython, version: "1.88", url: https://biopython.org }
runs_on: { tier: backend, environment: protein-tools }
command: [python, ./scripts/proteins.py, translate]
deterministic: true
batchable: 100
timeout: 5m
