# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: ProteinStructure
label: Protein structure
label_plural: Protein structures
schema_version: 3
description: >-
  A three-dimensional structure of one or more proteins: an experimental one,
  from the PDB or a lab's own, or a prediction. Two with the same file are the
  same structure, so importing one again finds its
  registry entry.
hrid: { prefix: PST }
identity: [structure]
fields:
  structure:
    type: file
    media_types: [chemical/x-mmcif, chemical/x-pdb]
    max_size: 2GiB
    required: true
    immutable: true
    description: Its coordinates, in mmCIF or PDB format.
  name: { type: string, max_length: 255, indexed: true }
  description: { type: text, max_length: 10000, description: Such as the PDB entry's title. }
  pdb_id:
    type: string
    registry: fact
    label: PDB ID
    max_length: 12
    indexed: true
    pattern: "^([0-9][A-Z0-9]{3}|PDB_[0-9A-Z]{8})$"
    description: >-
      Its PDB entry, such as 4HHB, or an entry that has only wwPDB's extended
      ID, PDB_ and eight letters or digits, such as PDB_1001BA3C. An entry with
      both is kept as its four characters: PDB_00004HHB is 4HHB.
  method:
    type: enum
    registry: derived
    values: [xray, nmr, cryo_em, electron_crystallography, neutron, predicted, other]
    indexed: true
    description: >-
      How it was determined: for a structure determined by several methods,
      such as a joint X-ray and neutron structure, the first its file lists,
      with each in resolutions.
  resolution:
    type: quantity
    registry: derived
    unit: Ao
    min: 0
    indexed: true
    description: >-
      For diffraction and cryo-EM, the highest resolution its data reached: for
      a structure determined by several methods, its method's.
  resolutions:
    type: list
    registry: derived
    label: Resolution by method
    max_items: 20
    items:
      type: row
      fields:
        method:
          type: enum
          values: [xray, nmr, cryo_em, electron_crystallography, neutron, predicted, other]
          required: true
          description: The method.
        resolution:
          type: quantity
          unit: Ao
          min: 0
          description: The highest resolution its refinement reached, if the file says.
    description: >-
      For a structure determined by several methods, such as a joint X-ray and
      neutron structure, each one's resolution, from its own refinement, in the
      order its file lists them.
  chains:
    type: list
    registry: derived
    items: { type: ref, to: Protein }
    max_items: 10000
    description: The protein each of its chains is, in the order of chain_ids.
  chain_ids:
    type: list
    registry: derived
    label: Chain IDs
    items: { type: string, max_length: 4 }
    max_items: 10000
    description: The chains' IDs in the file, as their authors gave them (A, B, ...).
  released:
    type: date
    registry: fact
    description: >-
      When its PDB entry was first released: its first revision's date. A
      structure with no PDB entry, such as a prediction, has none.
  secondary_structure:
    type: list
    registry: derived
    items: { type: string, pattern: "^[HGIPEBTS?-]*$" }
    max_items: 10000
    computed: true
    description: >-
      Each chain's secondary structure as DSSP assigns it, in the order of
      chain_ids: a letter for each residue of its protein's sequence. H is an
      alpha helix, G a 3-10 helix, I a pi helix, P a polyproline II helix, E a
      strand in a sheet, B an isolated bridge, T a turn, S a bend, - none, and ?
      a residue DSSP didn't assign: one the structure has no coordinates for, or
      one DSSP leaves out, such as a chromophore (GFP's CRO).
  helix_fraction:
    type: quantity
    registry: derived
    unit: "%"
    min: 0
    max: 100
    computed: true
    indexed: true
    description: The share of the residues DSSP assigned in its chains that are in helices (H, G or I).
  strand_fraction:
    type: quantity
    registry: derived
    unit: "%"
    min: 0
    max: 100
    computed: true
    indexed: true
    description: The share of the residues DSSP assigned in its chains that are in strands or bridges (E or B).
  accessible_surface_area:
    type: quantity
    registry: derived
    label: Solvent-accessible surface area
    unit: Ao2
    display_unit: nm2
    min: 0
    computed: true
    description: >-
      Its proteins' surface that a water molecule can reach, summed over their
      residues, as DSSP computes it for the first model.
  dssp:
    type: file
    registry: derived
    label: DSSP annotations
    media_types: [chemical/x-mmcif]
    max_size: 4GiB
    computed: true
    description: >-
      Its coordinates as mmCIF with DSSP's annotations: each residue's
      secondary structure, accessibility, hydrogen bonds and backbone angles.
display:
  title: "{{ name or pdb_id or hrid }}"
  viewers: [{ viewer: structure, structure: structure }]
