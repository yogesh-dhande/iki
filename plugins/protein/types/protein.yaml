# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: Protein
label: Protein
label_plural: Proteins
extends: iki/core.Sequence
schema_version: 2
description: >-
  A protein, by its amino acid sequence. Two with the same sequence are the same
  protein, so registering one again finds its
  registry entry.
hrid: { prefix: PRT }
identity: [sequence]
fields:
  sequence:
    type: string
    format: protein_sequence
    required: true
    immutable: true
    description: >-
      Its residues, N- to C-terminus, in one-letter codes: the 20 standard amino
      acids, U (selenocysteine), O (pyrrolysine), and B, Z, J or X where a residue
      is ambiguous or unknown.
  length: { registry: derived, type: quantity, unit: "{aa}", computed: true, indexed: true }
  molecular_weight:
    type: quantity
    registry: derived
    unit: u
    display_unit: ku
    computed: true
    indexed: true
    min: 0
    description: Its average mass, from the average isotopic masses of its residues and water.
  isoelectric_point:
    type: float
    registry: derived
    computed: true
    indexed: true
    min: 0
    max: 14
    description: The pH at which it carries no net charge, from Bjellqvist's pK values.
  extinction_coefficient_oxidized:
    type: quantity
    registry: derived
    unit: L/(mol.cm)
    computed: true
    min: 0
    description: >-
      Its molar absorbance at 280 nm in water, if every pair of cysteines forms a
      cystine (Pace et al., 1995).
  extinction_coefficient_reduced:
    type: quantity
    registry: derived
    unit: L/(mol.cm)
    computed: true
    min: 0
    description: >-
      Its molar absorbance at 280 nm in water, with every cysteine reduced (Pace
      et al., 1995).
  gravy:
    type: float
    registry: derived
    label: GRAVY
    computed: true
    description: >-
      Its grand average of hydropathy: the mean of its residues' Kyte–Doolittle
      values. Above zero, it's hydrophobic on the whole.
  hydropathy:
    type: json
    registry: derived
    computed: true
    description: >-
      Its hydropathy along its sequence, as ExPASy's ProtScale draws it: for
      each residue, the mean of the Kyte–Doolittle values of the nine residues
      centred on it. The first and last four residues have none (null). Above
      zero, that stretch is hydrophobic, as a transmembrane helix is.
    schema:
      type: array
      maxItems: 100000
      items: { type: [number, "null"], minimum: -4.5, maximum: 4.5 }
  instability_index:
    type: float
    registry: derived
    computed: true
    description: >-
      Guruprasad's estimate of its stability in a test tube: above 40, it's
      probably unstable.
  uniprot_accession:
    type: string
    registry: fact
    label: UniProt accession
    max_length: 20
    indexed: true
    pattern: "^([OPQ][0-9][A-Z0-9]{3}[0-9]|[A-NR-Z][0-9]([A-Z][A-Z0-9]{2}[0-9]){1,2})(-[0-9]+)?$"
    description: Its UniProtKB accession, such as P69905, or P69905-2 for an isoform.
  gene:
    type: string
    max_length: 100
    indexed: true
    description: The gene that encodes it, such as HBA1.
  encoded_by:
    type: ref
    to: iki/dna.DNASequence
    description: The DNA sequence it was translated from.
display:
  title: "{{ name or uniprot_accession or hrid }}"
  viewers:
    - { viewer: sequence, sequence: sequence, tracks: [{ field: hydropathy }] }
