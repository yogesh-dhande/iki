apiVersion: iki/v1
kind: EntityType
name: ReorderLine
label: Reorder line
schema_version: 1
hrid: { prefix: ROL }
description: One order line for a fixed number of catalogue packs. Each accepted delivery increments the received count.
fields:
  order_reference:
    {
      type: string,
      required: true,
      immutable: true,
      unique: true,
      indexed: true,
      max_length: 100,
      pattern: '.*\S.*',
      description: A line reference unique in the project.,
    }
  item: { type: ref, to: StockItem, required: true, immutable: true, indexed: true }
  ordered_packs: { type: int, required: true, immutable: true, min: 1, max: 1000000000 }
  received_packs:
    {
      type: int,
      min: 0,
      computed: true,
      description: Updated atomically with the receipt lot. An empty value means no packs have arrived.,
    }
rules:
  within_order:
    check: record.received_packs <= record.ordered_packs
    message: A line cannot receive more packs than ordered.
    fields: [received_packs]
display: { title: "{{ order_reference }}" }
