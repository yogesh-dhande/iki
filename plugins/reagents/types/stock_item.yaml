apiVersion: iki/v1
kind: EntityType
name: StockItem
label: Stock item
schema_version: 4
hrid: { prefix: SCI }
description: A supplier catalogue pack of a reagent or consumable. Choose a new catalogue record when its unit or pack size changes.
stock_catalogue:
  name: name
  unit: stock_unit
  threshold: low_stock_at
  notify: { roles: [stock_manager] }
  lots: { type: StockLot, item: item, number: lot_number, expiry: expires_on }
  orders:
    {
      type: ReorderLine,
      item: item,
      ordered: ordered_packs,
      received: received_packs,
      reference: order_reference,
    }
fields:
  name: { type: string, required: true, max_length: 200, indexed: true }
  supplier:
    type: ref
    to: iki/inventory.Supplier
    required: true
    immutable: true
    description: Who sells this pack, from the registry's suppliers. Its lots are bought from them.
  catalogue_number:
    {
      type: string,
      required: true,
      immutable: true,
      max_length: 100,
      indexed: true,
      pattern: '.*\S.*',
    }
  stock_unit:
    type: enum
    values: [mg, mL, "1"]
    required: true
    immutable: true
    description: The stock ledger unit. Use 1 for a count of individual consumables.
  pack_size:
    type: float
    label: Units per pack
    required: true
    immutable: true
    min: 0
    description: The amount per ordered pack in the selected stock unit.
  low_stock_at:
    type: float
    label: Low-stock threshold
    min: 0
    description: >-
      Alert the project's stock managers when the available stock reaches or falls below this
      amount in stock units. Leave it empty for an item the lab doesn't reorder by level.
  release_requirement:
    type: state
    label: QA release requirement
    initial: not_required
    description: >-
      Whether its lots need Lot QA's signed release before use, as a critical reagent's
      do. Each lot received takes it then; changing it later leaves lots already received
      as they are. Only Lot QA changes it, saying why, and its history keeps each change.
    states:
      not_required:
        label: Not required
        description: Its lots may be made available by a stock keeper, under the lab's own procedure.
        set_by: [iki/lots.qa]
        reason: required
      required:
        label: Required
        description: Each lot received is only made usable by Lot QA's signed release.
        set_by: [iki/lots.qa]
        reason: required
rules:
  positive_pack:
    check: record.pack_size > 0
    message: The amount per pack must be greater than zero.
    fields: [pack_size]
  whole_pack:
    when: record.stock_unit == "1"
    check: double(int(record.pack_size)) == record.pack_size
    message: A pack of individual consumables must contain a whole number of units.
    fields: [pack_size]
display: { title: "{{ name }}" }
