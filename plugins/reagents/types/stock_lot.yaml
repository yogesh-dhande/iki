apiVersion: iki/v1
kind: EntityType
name: StockLot
label: Received stock lot
schema_version: 2
abstract: true
extends: iki/lots.Lot
storage: {}
description: Material from one delivery line, transfer or opening count, received together into storage.
fields:
  item: { type: ref, to: StockItem, required: true, immutable: true, indexed: true }
  order_line:
    type: ref
    to: ReorderLine
    immutable: true
    indexed: true
    description: The reorder line this delivery answered. Stock received without an order has none.
  received_as:
    type: enum
    computed: true
    indexed: true
    label: Received as
    values: [order, delivery, transfer, opening_balance]
    description: >-
      How the lot came into the project's stock: against a reorder line, as a supplier
      delivery without one, as a transfer from another lab or site, or as stock already on
      hand when the lab started counting it.
  received_from:
    type: string
    computed: true
    max_length: 200
    description: The lab, site or organization that sent a transferred lot.
  receipt_key:
    type: string
    computed: true
    indexed: true
    unique: true
    max_length: 64
    description: >-
      Project-unique digest of who issued the receipt document, its reference and line: the
      supplier for a delivery, the sender for a transfer. A repeated line cannot post another
      receipt.
  delivery_note:
    {
      type: string,
      computed: true,
      max_length: 160,
      description: "The delivery note, transfer form or count sheet the lot was received on.",
    }
  delivery_line:
    {
      type: string,
      computed: true,
      max_length: 100,
      description: The line or subline of that document.,
    }
  packs: { type: int, computed: true, min: 1, label: Packs received }
rules:
  receipted:
    check: record.receipt_key != null && record.received_as != null
    message: Receive a delivery, with or without a reorder line, to create a stock lot.
    fields: [order_line]
  ordered:
    check: (record.order_line != null) == (record.received_as == "order")
    message: A lot received against a reorder line names it, and only such a lot does.
    fields: [order_line]
  ordered_item:
    when: record.order_line != null
    check: record.item.id == record.order_line.item
    message: The lot must be for the catalogue item on its reorder line.
    fields: [item, order_line]
display: { title: "{{ lot_number or hrid }}" }
