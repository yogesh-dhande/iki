apiVersion: iki/v1
kind: EntityType
name: StockLocation
label: Stock location
extends: StockStore
schema_version: 2
hrid: { prefix: SLC }
description: A rack or shelf of receipt lots. Rows and columns define its labelled storage positions.
storage:
  holds: [StockLot]
  grid: { rows: rows, columns: columns, labels: letter_number, order: by_row }
fields:
  rows: { type: int, required: true, immutable: true, min: 1, max: 26, default: 1 }
  columns: { type: int, required: true, immutable: true, min: 1, max: 48, default: 12 }
display: { title: "{{ name }}" }
