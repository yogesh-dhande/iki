apiVersion: iki/v1
kind: Action
name: receive_stock
label: Receive stock without an order
description: >-
  Receive a supplier delivery, a transfer from another lab or site, or the stock already on
  hand, as a lot of this catalogue item at the selected storage. The document reference and
  line identify the receipt, so it can't be posted twice.
inputs:
  item: { type: StockItem, schema_version: ">=1" }
  storage: { type: StockStore, schema_version: ">=1" }
params:
  received_as:
    type: enum
    values: [delivery, transfer, opening_balance]
    default: delivery
    label: Received as
    description: >-
      A supplier delivery with no reorder line in Iki, a transfer from another lab or site, or
      stock on hand when the lab starts counting it.
  received_from:
    type: string
    max_length: 200
    label: Received from
    description: The lab, site or organization that sent a transfer.
  packs: { type: int, min: 1, max: 1000000000, required: true, label: Packs received }
  delivery_note:
    type: string
    required: true
    max_length: 160
    label: Document reference
    description: The supplier's delivery note, the transfer form, or the count sheet for opening stock.
  delivery_line: { type: string, required: true, max_length: 100, label: Document line }
  lot_number: { type: string, required: true, max_length: 100, label: Supplier lot number }
  received_on: { type: date, required: true }
  expires_on: { type: date }
  position:
    {
      type: string,
      max_length: 16,
      description: "The location's slot label. Leave it empty for the first free slot, or for a stock area.",
    }
  certificate:
    {
      type: file,
      media_types: [application/pdf, image/png, image/jpeg, text/csv],
      max_size: 50MiB,
      description: The supplier's certificate for the received lot.,
    }
effects:
  creates:
    - { type: MassStockLot, cardinality: many, receive_into: storage, derived_from: [item] }
    - { type: VolumeStockLot, cardinality: many, receive_into: storage, derived_from: [item] }
    - { type: CountStockLot, cardinality: many, receive_into: storage, derived_from: [item] }
runs_on: { tier: backend, environment: reagent-tools }
command: [python, ./scripts/replenishment.py, receive_stock]
timeout: 2m
