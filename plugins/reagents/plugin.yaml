apiVersion: iki/v1
kind: Plugin
name: iki/reagents
version: 0.3.2
title: Reagents and consumables
description: Track catalogue packs, stock across storage, reorder lines, partial deliveries and stock received without an order.
iki: ">=0.1"
license: Apache-2.0
dependencies:
  iki/lots: { types: { Lot: ">=4" } }
settings:
  receipts_without_order:
    type: enum
    label: Receipts without an order
    values: [allowed, refused]
    default: allowed
    description: >-
      Allowed lets a project receive a supplier delivery, a transfer or its opening stock
      without a reorder line. Refused receives stock only against a reorder line, for a lab
      whose purchasing procedure requires one.
roles:
  stock_manager:
    {
      label: Stock manager,
      description: Receives alerts when catalogue stock is low and coordinates replenishment.,
    }
