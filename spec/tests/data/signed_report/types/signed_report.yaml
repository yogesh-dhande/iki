apiVersion: iki/v1
kind: EntityType
name: SignedReport
label: Signed report
schema_version: 1
hrid: { prefix: RPT }
fields:
  report: { type: json, required: true }
  source: { type: ref, to: SignedReport }
  review:
    type: state
    initial: recorded
    states:
      recorded:
        label: Recorded
        set_by: [analyst]
        reason: required
      submitted:
        label: Submitted
        set_by: [analyst]
        locks: true
        signatures: [{ meaning: authorship }]
      reviewed:
        label: Reviewed
        set_by: [reviewer]
        locks: true
        signatures: [{ meaning: review }]
      issued:
        label: Issued
        set_by: [qa]
        locks: true
        signatures: [{ meaning: approval }]
exports: [{ export: signed_report, report: report, review: review, issued: [issued] }]
