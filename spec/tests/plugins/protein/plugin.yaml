apiVersion: iki/v1
kind: Plugin
name: acme/protein
version: 3.0.0
iki: ">=0.1"
formats:
  model_pdb:
    label: Model coordinates
    media_types: [chemical/x-acme-model, chemical/x-acme-coordinates]
    extensions: [.model.pdb]
    # PDB coordinates with the lab's model provenance remark at the start.
    signatures: [{ offset: 0, hex: "52454d41524b20373030204d4f44454c20" }]
    viewer: structure-pdb
dependencies:
  acme/dna:
    types:
      Sequence: ">=1"
      DNASequence: ">=2,<4"
      Plasmid: ">=1"
roles:
  analyst: { label: Analyst, description: Measures proteins and records the results. }
  reviewer: { label: Reviewer, description: Checks another analyst's results. }
  qa: { label: QA, description: Releases what was reviewed. }
apis:
  fold:
    label: FoldCloud
    host: fold.models.example
    purpose: Predicts protein structures with FoldCloud's hosted models.
    credential:
      secret: FOLD_API_KEY
      description: A key from FoldCloud's console.
    reports:
      model: /model
      version: header:x-model-version
      parameters: [/recycles]
      usage: { gpu_seconds: /usage/gpu_seconds }
    jobs:
      poll: /v1/predictions/{id}
      status: /status
      done: [succeeded]
      failed: [failed, canceled]
      message: /error
      cancel: /v1/predictions/{id}/cancel
      every: 30s
      timeout: 1d
      usage: { gpu_seconds: /usage/gpu_seconds }
      webhook: { signature: standard-webhooks, secret: FOLD_WEBHOOK_SECRET }
