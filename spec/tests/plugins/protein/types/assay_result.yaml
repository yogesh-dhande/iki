apiVersion: iki/v1
kind: EntityType
name: AssayResult
label: Assay result
schema_version: 1
description: What a core measured for an assay request, released back once reviewed (ADR 0132).
hrid: { prefix: ARS }
service:
  result:
    of: request
    released: { field: review, states: [released] }
fields:
  request: { type: ref, to: AssayRequest, required: true, immutable: true }
  sample: { type: ref, to: Sample }
  purity: { type: float, min: 0, max: 100 }
  # The instrument's own report, such as a chromatogram.
  report: { type: file }
  review:
    type: state
    initial: draft
    states:
      draft: { label: Draft, set_by: [analyst] }
      reviewed: { label: Reviewed, set_by: [reviewer] }
      released: { label: Released, set_by: [qa], locks: true }
