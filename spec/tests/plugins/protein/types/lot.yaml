apiVersion: iki/v1
kind: EntityType
name: Lot
label: Lot
schema_version: 1
description: A lot of protein, signed for at each step under 21 CFR Part 11.
hrid: { prefix: LOT }
# How much of it there is (ADR 0139), split into samples, each naming its lot.
amount: { unit: mL, label: Volume, display_unit: L, aliquots: { type: Sample, of: lot } }
fields:
  label: { type: string, required: true, max_length: 200 }
  protein: { type: ref, to: Protein }
  yield_mg: { type: float, min: 0 }
  report: { type: file }
  # Who made it, and what went into it, each by whom (ADR 0122, ADR 0137): what a bundle
  # names by the IDs where it was made, and an import by the IDs where it arrives.
  made_by: { type: person }
  inputs:
    type: list
    max_items: 10
    items:
      type: row
      fields:
        protein: { type: ref, to: Protein, required: true }
        amount_mg: { type: float, min: 0 }
        by: { type: person }
  # Its state field (ADR 0125), whose states past Open are each set by signing for it
  # (ADR 0126).
  status:
    type: state
    initial: open
    states:
      open: { label: Open, set_by: [reviewer, qa], reason: required }
      in_review:
        label: In review
        set_by: [analyst]
        signatures: [{ meaning: authorship }]
      approved:
        label: Approved
        set_by: [reviewer]
        locks: true
        reason: optional
        signatures:
          - { meaning: review }
          - { meaning: approval, role: qa, label: QA approval, statement: I approve this lot. }
      released:
        label: Released
        set_by: [qa]
        locks: true
        reason: required
        signatures: [{ meaning: responsibility }]
# A signed state tells of itself as any other does (ADR 0129).
notifications:
  in_review:
    label: Signed for review
    when: { field: status, to: in_review }
    tell: { roles: [reviewer] }
