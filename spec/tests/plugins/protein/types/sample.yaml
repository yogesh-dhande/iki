apiVersion: iki/v1
kind: EntityType
name: Sample
label: Sample
schema_version: 1
hrid: { prefix: SMP }
fields:
  label: { type: string, required: true, unique: true, indexed: true, max_length: 200 }
  protein: { type: ref, to: Protein }
  purity: { type: float, min: 0, max: 100 }
  tags: { type: list, items: { type: string, max_length: 40 } }
  notes: { type: text }
  # People in records (ADR 0122): who tests it, who reviews it, and when it's due.
  analyst:
    { type: person, role: analyst, assignment: { field: status, states: [received, in_testing] } }
  reviewer: { type: person, role: reviewer, assignment: { field: status, states: [in_review] } }
  helpers: { type: list, items: { type: person }, assignment: true, max_items: 5 }
  received_by: { type: person }
  due_on: { type: date }
  # Its state fields (ADR 0125): where it is in testing, and where it is.
  status:
    type: state
    initial: received
    states:
      received: { label: Received, set_by: [analyst] }
      in_testing: { label: In testing, set_by: [analyst, reviewer, qa], reason: optional }
      in_review: { label: In review, set_by: [analyst] }
      reviewed: { label: Reviewed, set_by: [reviewer], locks: true }
      released:
        label: Released
        set_by: [qa]
        locks: true
        reason: optional
        description: Its results can be used.
  custody:
    type: state
    initial: in_lab
    states:
      in_lab: { label: In the lab, set_by: [analyst, qa] }
      quarantined: { label: Quarantined, set_by: [qa], locks: true, reason: required }
      disposed: { label: Disposed, set_by: [qa], reason: required }
due: due_on
