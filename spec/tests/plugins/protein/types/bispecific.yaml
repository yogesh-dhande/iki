# A lab's own specific complex (ADR 0161): its plugin, not Iki's, fixes which parts its
# bispecifics take (ADR 0164), so searching iki/core.Complex finds them beside every other
# complex, and the same chains and copies registered as another type of complex are this
# one's entry.
#
# Its identity is its chain inventory, by design: the chains and how many copies, not
# how they pair. Two pairings of the same four chains (a molecule and its mispaired
# assembly) are one entry, whose arms say the intended pairing; a type that registers
# each pairing as its own molecule would make its paired arms (heavy and light chain
# together) its components instead, and compare them as an unordered pair.
apiVersion: iki/v1
kind: EntityType
name: Bispecific
label: Bispecific antibody
extends: iki/core.Complex
schema_version: 2
description: >-
  An IgG-like bispecific antibody, by its chains and how many copies of each:
  its two heavy chains, its light chains (one protein twice where both arms
  share it, as emicizumab's do) and at most one linker. Its chains and copies
  are its identity, whatever their order (ADR 0138); which light chain pairs
  with which heavy chain is its arms, a fact of its registry entry, so a
  mispaired assembly of the same chains is the same molecule's impurity, not
  another molecule.
hrid: { prefix: BSP }
refines:
  components:
    roles:
      heavy: { min: 1, max: 2, to: { part: Protein } }
      light: { label: Light chain, min: 1, max: 2, to: { part: Protein } }
      linker: { max: 1, to: { part: acme/dna.DNASequence } }
fields:
  arms:
    type: list
    registry: fact
    max_items: 2
    description: Each arm's heavy chain and the light chain it pairs with, and what it binds.
    items:
      type: row
      fields:
        heavy: { type: ref, to: Protein, required: true }
        light: { type: ref, to: Protein, required: true }
        target: { type: string, max_length: 40, pattern: "^[A-Z0-9][A-Za-z0-9-]*$" }
      identity: [heavy, light]
rules:
  two_heavy_chains:
    label: Two heavy chains in all
    check: >-
      record.components.filter(c, c.role == "heavy").size() == 1
      ? record.components.all(c, c.role != "heavy" || c.copies == 2)
      : record.components.all(c, c.role != "heavy" || c.copies == 1)
    message: It has two heavy chains in all.
    fields: [components]
