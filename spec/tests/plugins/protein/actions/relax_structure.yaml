apiVersion: iki/v1
kind: Action
name: relax_structure
label: Relax structure
inputs:
  # It reads the coordinates, and the chains it includes; nothing else of the structure.
  structure: { type: ProteinStructure, schema: ">=1", include: [chains], reads: [structure] }
effects:
  creates: [{ type: ProteinStructure, cardinality: one, derived_from: [structure] }]
runs_on: { tier: backend, environment: protein-tools }
command: [python, ./scripts/relax.py]
deterministic: true
timeout: 10m
