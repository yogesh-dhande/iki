apiVersion: iki/v1
kind: Action
name: relax_structure
label: Relax structure
inputs:
  structure: { type: ProteinStructure, schema: ">=1" }
effects:
  creates: [{ type: ProteinStructure, cardinality: one, derived_from: [structure] }]
runs_on: { tier: backend, environment: protein-tools }
command: [python, ./scripts/relax.py]
deterministic: true
timeout: 10m
