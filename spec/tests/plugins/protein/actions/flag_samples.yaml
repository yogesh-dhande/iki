apiVersion: iki/v1
kind: Action
name: flag_samples
label: Flag samples
inputs:
  protein: { type: Protein, schema_version: ">=1" }
  samples: { type: Sample, cardinality: many, max: 50 }
  structures: { type: ProteinStructure, cardinality: many, optional: true }
effects:
  updates: { samples: { fields: [notes] } }
runs_on: { tier: backend, environment: protein-tools }
command: [python, ./scripts/flag.py]
timeout: 5m
