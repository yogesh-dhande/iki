apiVersion: iki/v1
kind: Action
name: measure_purity
label: Measure purity
inputs:
  # With the lot it's of, and the lot's report (ADR 0105).
  sample: { type: Sample, schema_version: ">=1", include: [lot] }
effects:
  updates: { sample: { fields: [purity] } }
runs_on: { tier: backend, environment: protein-tools }
command: [python, ./scripts/purity.py]
deterministic: true
timeout: 5m
