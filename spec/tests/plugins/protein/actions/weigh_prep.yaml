apiVersion: iki/v1
kind: Action
name: weigh_prep
label: Weigh a prep
description: Reads the purification method its prep names, an option of a lab list (ADR 0270).
inputs:
  prep: { type: Prep, schema_version: ">=1", include: [method] }
effects:
  updates: { prep: { fields: [name] } }
runs_on: { tier: backend, environment: protein-tools }
command: [python, ./scripts/relax.py]
deterministic: true
timeout: 10m
