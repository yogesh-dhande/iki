apiVersion: iki/v1
kind: EntityType
name: Sequence
abstract: true
extends: iki/core.Sequence
schema_version: 1
description: Anything with a sequence of residues, as the fixtures have it under iki/core.Sequence.
---
apiVersion: iki/v1
kind: EntityType
name: DNASequence
label: DNA sequence
extends: Sequence
schema_version: 2
hrid: { prefix: DNA }
annotations:
  gxp_classification: GAMP 5 category 4
identity: [bases]
roles: { residues: bases }
fields:
  bases: { type: string, format: dna_sequence, required: true, immutable: true }
  topology:
    type: enum
    values: [linear, circular]
    default: linear
    description: Whether its ends are joined, as a plasmid's are.
  length: { type: quantity, unit: "{bp}", registry: derived, computed: true, indexed: true }
  gc_content: { type: quantity, unit: "%", computed: true, min: 0, max: 100 }
display:
  title: "{{ name or hrid }}"
