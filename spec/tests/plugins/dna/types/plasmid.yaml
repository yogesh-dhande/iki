apiVersion: iki/v1
kind: EntityType
name: Plasmid
label: Plasmid
extends: Sequence
schema_version: 1
description: >-
  A circular sequence with features, as the fixtures have it: registered again
  from another origin, or as its other strand, it's found, and its features are
  placed along its entry's.
hrid: { prefix: PLS }
identity: [bases, topology, strandedness]
roles: { residues: bases }
fields:
  bases:
    type: string
    format: dna_sequence
    topology: topology
    strands: strandedness
    required: true
    immutable: true
  topology:
    { type: enum, values: [linear, circular], default: circular, required: true, immutable: true }
  strandedness:
    { type: enum, values: [double, single], default: double, required: true, immutable: true }
  features:
    type: json
    schema:
      type: array
      items:
        type: object
        required: [type, start, end]
        properties:
          type: { type: string }
          start: { type: integer, minimum: 1 }
          end: { type: integer, minimum: 1 }
          strand: { enum: [forward, reverse, mixed, none] }
display:
  title: "{{ name or hrid }}"
  viewers:
    - { viewer: sequence, sequence: bases, features: features }
exports:
  - export: sequence
    sequence: bases
    features: features
    description: description
    organism: organism
