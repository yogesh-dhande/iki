apiVersion: iki/v1
kind: Plugin
name: acme/dna
version: 1.2.0
title: DNA
description: DNA sequences and primers.
license: Apache-2.0
iki: ">=0.1"
annotations:
  acme.com/owner: Molecular biology
x-acme-reviewed: 2026-11-01
settings:
  ncbi_email:
    type: string
    format: email
    required: true
    description: The address NCBI asks automated clients to give.
  max_sequence_length:
    type: int
    min: 1
    default: 10000000
