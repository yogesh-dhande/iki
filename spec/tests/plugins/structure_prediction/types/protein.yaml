apiVersion: iki/v1
kind: EntityTypeExtension
extends_type: acme/protein.Protein
fields:
  # Its entry's (ADR 0115): what its sequence alone gives.
  disorder: { type: float, registry: derived, computed: true, min: 0, max: 1 }
  # Each project's own.
  predicted_by: { type: string, max_length: 64 }
rules:
  # An extension's rule (ADR 0127): `acme/structure_prediction:predictor_named`.
  predictor_named:
    label: Its predictor is named
    check: record.predicted_by != "unknown"
    message: Name what predicted it, not “unknown”.
