[project]
name = "iki-spec"
version = "0.1.0.dev0"
description = "Iki's versioned plugin specs (JSON Schemas), their validator, and UCUM units."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/iki_spec/units/UCUM-LICENSE.md"]
authors = [{ name = "The Iki Authors" }]
dependencies = [
  "jsonschema>=4.25.1",
  "pyyaml>=6.0.3",
  # Runs iki-wasm, which browsers evaluate CEL with, to check and evaluate plugins' rules
  # and guards (ADR 0127) and apps' expressions (ADR 0090) as browsers will.
  "wasmtime>=50.0.1",
]

# uv_build, after scripts/build-wasm.sh: a wheel can't be built without iki-wasm, nor with a
# stale one (backend/iki_spec_build.py).
[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "iki_spec_build"
backend-path = ["backend"]

[tool.uv.build-backend]
# The backend, so a wheel builds from the source distribution too.
source-include = ["backend/iki_spec_build.py"]
