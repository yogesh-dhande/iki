[project]
name = "iki-spec"
version = "0.1.0.dev0"
description = "Iki's versioned plugin specs (JSON Schemas), their validator, and UCUM units."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/iki_spec/units/UCUM-LICENSE.md"]
authors = [{ name = "The Iki Authors" }]
dependencies = [
  "jsonschema>=4.25.1",
  "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
