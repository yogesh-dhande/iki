# A taxon: a species, a strain, a genus, by its NCBI Taxonomy ID (ADR 0140). One
# entry per taxon in each registry, so every sequence, strain or sample from it
# names the same record, however its name was spelled where it came from. Imports
# make a taxon's entry the first time they meet it, from its ID and name.
apiVersion: iki/v1
kind: EntityType
name: Organism
label: Organism
label_plural: Organisms
schema_version: 2
description: >-
  A taxon, such as a species or a strain, by its NCBI Taxonomy ID: what a
  sequence, a strain or a sample is from.
hrid: { prefix: TAX }
identity: [taxon_id]
fields:
  taxon_id:
    type: int
    label: NCBI Taxonomy ID
    required: true
    immutable: true
    min: 1
    indexed: true
    description: Its ID in the NCBI Taxonomy, such as 9606 for Homo sapiens.
  scientific_name:
    type: string
    registry: fact
    max_length: 255
    # A scientific name as NCBI writes them: one line, starting with a letter or
    # digit (Homo sapiens, Escherichia coli K-12, synthetic construct), a [
    # where NCBI hasn't placed the genus ([Clostridium] scindens), or a ' for an
    # informal name ('Nostoc azollae' 0708).
    pattern: "^[A-Za-z0-9\\['][^\\t\\r\\n]*$"
    pattern_help: >-
      one line without tabs, starting with a letter, a digit, [ or ', as NCBI
      writes names, such as Escherichia coli K-12
    indexed: true
    description: >-
      Its scientific name, as the file or database it was first imported from
      gives it, such as UniProt's Escherichia coli (strain K12) for NCBI's
      Escherichia coli K-12, until a registrar corrects it. Its NCBI Taxonomy
      ID, not its name, is what it is.
  rank:
    type: string
    registry: fact
    max_length: 64
    pattern: "^[a-z][a-z ]*$"
    pattern_help: lower-case letters and spaces, such as species or no rank
    description: Its rank in the NCBI Taxonomy, such as species, strain or genus.
  parent:
    type: ref
    to: Organism
    registry: fact
    description: The taxon it's in, such as a species' genus, when that's known.
display:
  title: "{{ scientific_name or hrid }}"
