# An app (ADR 0090): a page of Iki's own components, laid out on a twelve-column grid,
# each panel bound to those before it by CEL expressions between {{ and }}. It holds no
# data and no credentials: it shows what the person viewing it may read. The server
# checks, on every save, that each panel's props are its component's, that each
# expression reads, and that it reads only panels before its own, and what they offer.
apiVersion: iki/v1
kind: EntityType
name: App
label: App
label_plural: Apps
schema_version: 1
description: A page of Iki's own components, each panel bound to those before it by expressions.
hrid: { prefix: APP }
fields:
  name: { type: string, required: true, max_length: 200, indexed: true }
  description: { type: text, max_length: 10000 }
  spec:
    type: json
    required: true
    description: >-
      Its panels, in order (app/v1). Each is one of Iki's components, with its props
      and its width on a twelve-column grid. A prop that takes text or an entity can
      hold expressions between {{ and }}, which read the panels before it by their IDs:
      an entities grid offers `rows` and `selection`, a viewer `entity`. An app about
      an entity of a type (`entity.type`) is a tab on their pages in its project, and
      its expressions read that one as `entity`; a grid's conditions can then hold
      expressions too.
    schema:
      type: object
      required: [version, panels]
      additionalProperties: false
      properties:
        version: { const: 1 }
        entity:
          type: object
          required: [type]
          additionalProperties: false
          properties:
            type: { type: string, minLength: 1, maxLength: 200 }
        panels:
          type: array
          minItems: 1
          maxItems: 24
          items:
            type: object
            required: [id, component, props]
            additionalProperties: false
            properties:
              id: { type: string, pattern: "^[a-z][a-z0-9_]{0,39}$" }
              title: { type: string, minLength: 1, maxLength: 200 }
              width: { type: integer, minimum: 1, maximum: 12 }
              component: { enum: [iki.entities, iki.viewer, iki.text] }
              props: { type: object }
            allOf:
              - if: { properties: { component: { const: iki.entities } } }
                then: { properties: { props: { $ref: "#/$defs/entities" } } }
              - if: { properties: { component: { const: iki.viewer } } }
                then: { properties: { props: { $ref: "#/$defs/viewer" } } }
              - if: { properties: { component: { const: iki.text } } }
                then: { properties: { props: { $ref: "#/$defs/text" } } }
      $defs:
        entities:
          type: object
          required: [type]
          additionalProperties: false
          properties:
            type: { type: string, minLength: 1, maxLength: 200 }
            scope: { enum: [project, all] }
            where: { type: object }
            q: { type: string, maxLength: 200 }
            sort: { type: string, minLength: 1, maxLength: 100 }
            descending: { type: boolean }
            limit: { type: integer, minimum: 1, maximum: 100 }
            select: { enum: [none, one, many] }
            columns:
              type: array
              minItems: 1
              maxItems: 20
              items:
                oneOf:
                  - type: object
                    required: [field]
                    additionalProperties: false
                    properties:
                      field: { type: string, minLength: 1, maxLength: 100 }
                      label: { type: string, minLength: 1, maxLength: 100 }
                  - type: object
                    required: [label, value]
                    additionalProperties: false
                    properties:
                      label: { type: string, minLength: 1, maxLength: 100 }
                      value: { type: string, minLength: 1, maxLength: 1000 }
        viewer:
          type: object
          required: [entity]
          additionalProperties: false
          properties:
            entity: { type: string, minLength: 1, maxLength: 1000 }
            viewer: { enum: [sequence, structure, alignment] }
        text:
          type: object
          required: [text]
          additionalProperties: false
          properties:
            text: { type: string, minLength: 1, maxLength: 10000 }
display: { title: "{{ name }}" }
