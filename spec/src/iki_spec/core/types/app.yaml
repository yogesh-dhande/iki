# An app (ADR 0090): a page of Iki's own components, and plugins' (ADR 0117), laid out
# on a twelve-column grid, each panel bound to those before it by CEL expressions
# between {{ and }}. It holds no data and no credentials: it shows what the person
# viewing it may read. The server checks, on every save, that each panel's props are
# its component's, that each expression reads, and that it reads only panels before its
# own, and what they offer.
apiVersion: iki/v1
kind: EntityType
name: App
label: App
label_plural: Apps
schema_version: 1
description: A page of Iki's own components, each panel bound to those before it by expressions.
hrid: { prefix: APP }
fields:
  name: { type: string, required: true, max_length: 200, indexed: true }
  description: { type: text, max_length: 10000 }
  spec:
    type: json
    required: true
    description: >-
      Its panels, in order (app/v1). Each is one of Iki's components, or an installed
      plugin's by its name (`acme/lab.box_map`), with its props and its width on a
      twelve-column grid. A prop that takes text or an entity can hold expressions
      between {{ and }}, which read the panels before it by their IDs: an entities grid
      offers `rows` and `selection`, a viewer `entity`, a plugin's component that lets
      people pick its `selection`. An app about
      an entity of a type (`entity.type`) is a tab on their pages in its project, and
      its expressions read that one as `entity`; a grid's conditions can then hold
      expressions too.
    schema:
      type: object
      required: [version, panels]
      # What a new app's form starts from, to change: a grid of what changed in the
      # project, and text that reads it. Only Iki's own types, so it saves anywhere.
      default:
        version: 1
        panels:
          - id: records
            title: Recently changed
            width: 8
            component: iki.entities
            props:
              type: iki/core.Entity
              scope: project
              sort: updated_at
              descending: true
              limit: 20
              select: many
              columns: [{ field: hrid }, { field: title }, { field: updated_at }]
          - id: about
            title: About this page
            width: 4
            component: iki.text
            props:
              text: >-
                {{ size(records.selection) }} of the {{ size(records.rows) }} records shown
                are picked. Change this app's spec to show what your team needs: a grid of
                one type, with its own columns; a viewer of the record picked in it; or
                notes like these.
      additionalProperties: false
      properties:
        version: { const: 1 }
        entity:
          type: object
          required: [type]
          additionalProperties: false
          properties:
            type: { type: string, minLength: 1, maxLength: 200 }
        panels:
          type: array
          minItems: 1
          maxItems: 24
          items:
            type: object
            required: [id, component, props]
            additionalProperties: false
            properties:
              id: { type: string, pattern: "^[a-z][a-z0-9_]{0,39}$" }
              title: { type: string, minLength: 1, maxLength: 200 }
              width: { type: integer, minimum: 1, maximum: 12 }
              component:
                anyOf:
                  - enum: [iki.entities, iki.viewer, iki.text]
                  # A plugin's component (ADR 0117).
                  - type: string
                    maxLength: 200
                    pattern: "^[a-z][a-z0-9_]*/[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*$"
              props: { type: object }
            allOf:
              - if: { properties: { component: { const: iki.entities } } }
                then: { properties: { props: { $ref: "#/$defs/entities" } } }
              - if: { properties: { component: { const: iki.viewer } } }
                then: { properties: { props: { $ref: "#/$defs/viewer" } } }
              - if: { properties: { component: { const: iki.text } } }
                then: { properties: { props: { $ref: "#/$defs/text" } } }
              - if: { properties: { component: { pattern: "/" } } }
                then: { properties: { props: { $ref: "#/$defs/plugin" } } }
      $defs:
        entities:
          type: object
          required: [type]
          additionalProperties: false
          properties:
            type: { type: string, minLength: 1, maxLength: 200 }
            scope: { enum: [project, all] }
            where: { type: object }
            q: { type: string, maxLength: 200 }
            sort: { type: string, minLength: 1, maxLength: 100 }
            descending: { type: boolean }
            limit: { type: integer, minimum: 1, maximum: 100 }
            select: { enum: [none, one, many] }
            columns:
              type: array
              minItems: 1
              maxItems: 20
              items:
                oneOf:
                  - type: object
                    required: [field]
                    additionalProperties: false
                    properties:
                      field: { type: string, minLength: 1, maxLength: 100 }
                      label: { type: string, minLength: 1, maxLength: 100 }
                  - type: object
                    required: [label, value]
                    additionalProperties: false
                    properties:
                      label: { type: string, minLength: 1, maxLength: 100 }
                      value: { type: string, minLength: 1, maxLength: 1000 }
        viewer:
          type: object
          required: [entity]
          additionalProperties: false
          properties:
            entity: { type: string, minLength: 1, maxLength: 1000 }
            viewer: { enum: [sequence, structure, alignment] }
        text:
          type: object
          required: [text]
          additionalProperties: false
          properties:
            text: { type: string, minLength: 1, maxLength: 10000 }
        # A plugin's component: given one entity, as its tab on that entity's page is, or
        # what a search finds, as the grid's results are.
        plugin:
          oneOf:
            - type: object
              required: [entity]
              additionalProperties: false
              properties:
                entity: { type: string, minLength: 1, maxLength: 1000 }
            - type: object
              required: [type]
              additionalProperties: false
              properties:
                type: { type: string, minLength: 1, maxLength: 200 }
                scope: { enum: [project, all] }
                where: { type: object }
                q: { type: string, maxLength: 200 }
                sort: { type: string, minLength: 1, maxLength: 100 }
                descending: { type: boolean }
display: { title: "{{ name }}" }
