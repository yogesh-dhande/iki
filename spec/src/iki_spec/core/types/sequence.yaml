# Anything with a sequence of residues: DNA, RNA, proteins. Plugins add the
# concrete types (iki/dna.DNASequence, iki/protein.Protein), each with its residues,
# so searching iki/core.Sequence finds every kind at once.
apiVersion: iki/v1
kind: EntityType
name: Sequence
label: Sequence
label_plural: Sequences
abstract: true
schema_version: 2
description: Anything with a sequence of residues, such as DNA or a protein.
fields:
  name: { type: string, max_length: 255, indexed: true }
  description: { type: text, max_length: 10000 }
  # What it's from (ADR 0140): a taxon's entry, not a name that never matches its
  # other spellings.
  organism: { type: ref, to: Organism, description: The organism it's from. }
