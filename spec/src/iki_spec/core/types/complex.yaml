# Molecules held together as one (ADR 0161): an antibody's chains, hemoglobin's chains and
# hemes, a receptor bound to its ligand, or any protein complex. Plugins add
# the types (iki/complex.ProteinComplex, of any parts; iki/antibody.Antibody, of a heavy
# and a light chain), each saying in `refines` which parts it takes, so searching
# iki/core.Complex finds every kind at once, and `components.part` finds the complexes a
# molecule is part of.
apiVersion: iki/v1
kind: EntityType
name: Complex
label: Complex
label_plural: Complexes
abstract: true
schema_version: 2
description: >-
  Molecules held together as one: an antibody's chains, hemoglobin's chains
  and hemes, a receptor bound to its ligand, or any other complex. It's
  its parts and how many copies of each, whatever their order, so one set of
  parts is one registry entry, whichever type of complex registered it.
# Its parts and their copies (ADR 0138's sets of parts): not their roles, which each
# type of complex names its own way, so a protein complex of the same parts as an antibody
# is that antibody.
identity: [components]
fields:
  name: { type: string, max_length: 255, indexed: true }
  description: { type: text, max_length: 10000 }
  components:
    type: list
    label: Parts
    required: true
    immutable: true
    min_items: 1
    max_items: 100
    description: >-
      What it's made of: each part once, with how many copies of it the complex
      has, and its role in it. An IgG is its heavy chain, two copies, and its
      light chain, two copies.
    items:
      type: row
      fields:
        part:
          type: ref
          to: iki/core.Entity
          required: true
          description: >-
            A molecule it's made of, as its registry entry: a protein, a nucleic
            acid, a small molecule, or a complex of its own.
        copies:
          type: int
          min: 1
          max: 10000
          default: 1
          required: true
          description: How many of it the complex has.
        role:
          type: string
          pattern: "^[a-z][a-z0-9]*(_[a-z0-9]+)*$"
          pattern_help: >-
            lower-case letters, digits and underscores, starting with a letter,
            such as heavy or chain_a
          max_length: 40
          default: part
          required: true
          description: >-
            What the part is in it, in lower case, such as heavy, light,
            antigen or chain_a. A type of complex says which roles its parts
            may have.
      identity: [part, copies]
      by: role
  bonds:
    type: list
    registry: fact
    label: Bonds
    max_items: 1000
    description: >-
      The covalent bonds between its parts' residues, such as the disulfides
      between an antibody's chains, or within a part, if they're wanted too. Each
      names its two residues by their part, which copy of it (from 1), and where
      they are in its sequence (from 1). A part that's a complex has its own
      bonds, on it. A registry fact: given once, then changed only by its
      registrars.
    items:
      type: row
      fields:
        kind:
          type: enum
          values: [disulfide, isopeptide, thioether, other]
          default: disulfide
          required: true
          description: >-
            disulfide two cysteines; isopeptide an amide to a side chain, such as
            SpyTag's aspartate to SpyCatcher's lysine, or ubiquitin's last glycine
            to a lysine; thioether a cysteine's sulfur to a carbon; and other
            anything else, such as sortase A's ligation, a backbone amide from a
            threonine's carboxyl to an N-terminal glycine.
        part: { type: ref, to: iki/core.Entity, required: true, description: One residue's part. }
        copy:
          { type: int, min: 1, max: 10000, default: 1, required: true, description: Which copy. }
        residue:
          { type: int, min: 1, required: true, description: Where it is in the part's sequence. }
        partner:
          { type: ref, to: iki/core.Entity, required: true, description: The other residue's part. }
        partner_copy:
          {
            type: int,
            min: 1,
            max: 10000,
            default: 1,
            required: true,
            label: Partner's copy,
            description: Which copy of it.,
          }
        partner_residue:
          {
            type: int,
            min: 1,
            required: true,
            label: Partner's residue,
            description: Where it is in its sequence.,
          }
  bond_map:
    type: enum
    registry: fact
    label: Its bonds are
    values: [complete, incomplete, predominant]
    description: >-
      How much of what bonds it its bonds give: complete, every bond it has;
      incomplete, not all of them, such as an IgG2's between its chains, which
      take more than one arrangement, so what's worked out with its bonds
      counts too few; predominant, those of its predominant form, while some of
      its molecules are bonded otherwise, as a native IgG4's hinge is in some
      molecules within each heavy chain. Left empty, it isn't said. A registry
      fact: given once, then changed only by its registrars, as when peptide
      mapping confirms its disulfides.
  bonds_from:
    type: enum
    registry: fact
    label: Its bonds come from
    values: [pattern, curated, observed]
    description: >-
      Where its bonds come from: pattern, placed where its kind places them,
      not read from this molecule, as `assemble` places an IgG1's or IgG4's
      disulfides by its subclass; curated, a source that records this
      molecule's, such as a database entry, a monograph or a solved structure;
      observed, seen in this molecule, as by non-reduced peptide mapping.
      Curated and observed bonds name their source. Left empty, it isn't said.
      A registry fact: given once, then changed only by its registrars.
  bonds_source:
    type: string
    format: uri
    max_length: 500
    registry: fact
    label: Its bonds' source
    description: >-
      Where curated or observed bonds are recorded, as a link: a database
      entry such as KEGG DRUG's https://www.kegg.jp/entry/D03257, a PDB entry,
      a publication's DOI, or the peptide map that saw them. A registry fact.
  # What its parts and copies make it, whatever its type (computed by the complex plugin's
  # compute_composition): its registry entry's, as they come from its identity alone, so
  # its parts as they are, each cysteine's thiol free. Its bonds are a registry fact that
  # may be corrected, so what they take off (two hydrogens for each disulfide) is worked
  # out where they're shown rather than kept here to go stale.
  molecular_formula:
    type: string
    registry: derived
    label: Molecular formula
    pattern: "^((\\[[1-9][0-9]*[A-Z][a-z]?\\]|[A-Z][a-z]?)[0-9]*)+$"
    max_length: 255
    computed: true
    description: >-
      Its parts' formulas, each times its copies, in Hill order (C, then H,
      then the rest alphabetically): a protein's from its residues and water,
      a DNA sequence's from its bases, another part's as its entry gives it,
      with any isotope it gives written as RDKit writes it ([13C], D for 2H).
      Each cysteine's thiol free, before its disulfides, and without glycans or
      any other modification its parts' formulas don't have.
  molecular_weight:
    type: quantity
    registry: derived
    label: Molecular weight
    unit: u
    display_unit: ku
    computed: true
    indexed: true
    min: 0
    description: >-
      Its average mass, from its formula and IUPAC's standard atomic weights (a
      labelled atom's isotope's mass), each cysteine's thiol free: each
      disulfide takes 2.016 u off. It's its parts' sequences' or formulas' mass,
      so a glycoprotein's is its chains' without their glycans.
  monoisotopic_mass:
    type: quantity
    registry: derived
    label: Monoisotopic mass
    unit: u
    computed: true
    min: 0
    description: >-
      Its mass from each element's most abundant isotope (AME2020), each
      cysteine's thiol free: each disulfide takes 2.01565 u off.
  chain_count:
    type: int
    registry: derived
    label: Chains
    computed: true
    min: 0
    description: >-
      How many polymer chains it has, counting each copy, its parts' own
      included: a double-stranded DNA's two strands.
  extinction_coefficient_reduced:
    type: quantity
    registry: derived
    label: Extinction coefficient (reduced)
    unit: L/(mol.cm)
    computed: true
    min: 0
    description: >-
      Its molar extinction coefficient at 280 nm (ε280) in water, each cysteine's thiol free (Pace
      et al., 1995): 5,500 for each tryptophan in its parts and 1,490 for each
      tyrosine, each times its copies, or a part complex's own. Each disulfide
      makes a cystine, 125 more. None if a part isn't a protein or a complex
      with one, as Pace's values weigh only those.
  # What its parts' own bonds add (computed by the complex plugin's compute_composition
  # too): each project's record's, not its entry's, as they're its parts' entries' facts,
  # which their registrars may correct (ADR 0131), and computing it again counts them as
  # they are then. Its own bonds are read where they're shown, as they are.
  part_disulfides:
    type: int
    # Its label says it isn't its bonds' count: an antibody's 16 disulfides are its own
    # bonds, and its chains have none of their own, so this is 0 beside its 16.
    label: Its parts' own disulfides, besides its bonds
    computed: true
    min: 0
    description: >-
      The disulfides its parts have of their own, each times its copies, and
      their parts' too: a Fab's four, in a complex of the Fab and its antigen.
      Its own bonds aren't counted here: an antibody's disulfides are its own
      bonds between and within its chains, which have none of their own, so
      it has none here. With its own bonds' disulfides, they're the cystines a
      lot of it has while its cysteines are oxidized.
  part_bonds_complete:
    type: bool
    label: Its parts' bonds counted
    computed: true
    description: >-
      Whether its parts' disulfides are all counted: false when a part's bonds
      are said to be incomplete or only its predominant form's, or a part
      complex's own parts' weren't counted in this project.
display:
  title: "{{ name or hrid }}"
