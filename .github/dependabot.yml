version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      python-dev: { dependency-type: development }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      js-dev: { dependency-type: development }
    ignore:
      # Node types must match the Node major we run (24 LTS, see .node-version).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript <6.1; move to 7 together with it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /worker
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }

  - package-ecosystem: docker
    # Dockerfiles and the image references in the dev Kubernetes manifests.
    directories: ["/server", "/deploy/dev/manifests"]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
