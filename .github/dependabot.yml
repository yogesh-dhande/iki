version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      python-dev: { dependency-type: development }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      js-dev: { dependency-type: development }

  - package-ecosystem: cargo
    directory: /worker
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }

  - package-ecosystem: docker
    # Dockerfiles and the image references in the dev Kubernetes manifests.
    directories: ["/server", "/deploy/dev/manifests"]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
