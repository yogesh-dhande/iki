name: Publish ImmuneBuilder weights

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-immunebuilder-weights
  cancel-in-progress: false

jobs:
  weights:
    name: Publish the checksummed weights
    if: github.repository == 'yogesh-dhande/iki'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # publish the data-only image and its provenance
      attestations: write # store the SLSA attestation on GitHub
      id-token: write # sign the attestation with the workflow's OIDC identity
    env:
      IMAGE: ghcr.io/yogesh-dhande/iki-immunebuilder-weights
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify the eight weight files
        run: bash plugins/antibody_3d/images/structure-tools/prepare-weights.sh "$RUNNER_TEMP/immunebuilder-weights"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the scratch image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/immunebuilder-weights
          platforms: linux/amd64,linux/arm64
          build-args: SOURCE_DATE_EPOCH=0
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify and tag the published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="$IMAGE@$DIGEST"
          gh attestation verify "oci://$ref" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-immunebuilder-weights.yml" \
            --source-digest "$GITHUB_SHA" --predicate-type https://slsa.dev/provenance/v1
          # Preserve each distinct digest even if a rerun of a commit produces another image.
          docker buildx imagetools create --tag "$IMAGE:sha256-${DIGEST#sha256:}" --tag "$IMAGE:published" "$ref"
          manifest_hash=$(docker buildx imagetools inspect --raw "$IMAGE:published" | sha256sum)
          test "sha256:${manifest_hash%% *}" = "$DIGEST"
          printf 'Published %s\n' "$ref" | tee -a "$GITHUB_STEP_SUMMARY"
