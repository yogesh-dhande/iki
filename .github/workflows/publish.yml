name: Publish images

# Builds the server image for amd64 and arm64 on native runners, scans each
# platform image, then publishes a multi-arch image that is:
#   - signed with cosign (keyless: the signature is bound to this workflow's
#     GitHub OIDC identity, so there is no signing key to leak);
#   - attested with SLSA build provenance and a CycloneDX SBOM per platform
#     (GitHub artifact attestations, stored in the registry and on GitHub);
#   - verified in the same run, so a broken signature fails the workflow.
#
# main publishes :main and :sha-<commit>; tags vX.Y.Z publish :X.Y.Z and :X.Y.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the platform image by digest
    outputs:
      digest-amd64: ${{ steps.out.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.out.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/${OWNER,,}/iki-server" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ matrix.platform }}
          # Untagged until the scan below passes and the merge job tags it.
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # Provenance and SBOM are attested separately with GitHub artifact attestations.
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Install Grype and Syft (pinned, checksum verified)
        run: scripts/ci/install-tools.sh grype syft
      - name: Vulnerability scan (fails on fixable high/critical)
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
        run: grype "registry:$REF" --config .grype.yaml
      - name: SBOM (CycloneDX)
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: syft "registry:$REF" -o "cyclonedx-json=sbom-$ARCH.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.arch }}
          path: sbom-${{ matrix.arch }}.cdx.json
          retention-days: 7
      - name: Export digest
        id: out
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "digest-$ARCH=$DIGEST" >> "$GITHUB_OUTPUT"

  publish:
    name: Tag, sign, attest and verify
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # tag the image, push signatures and attestations
      id-token: write # keyless signing: GitHub OIDC token for Sigstore
      attestations: write # store provenance and SBOM attestations on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/${OWNER,,}/iki-server" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create the multi-arch image
        id: index
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          AMD64: ${{ needs.build.outputs.digest-amd64 }}
          ARM64: ${{ needs.build.outputs.digest-arm64 }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          first_tag=$(head -n1 <<< "$TAGS")
          digest=$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE@$digest"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign (keyless)
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.index.outputs.digest }}
        run: cosign sign --yes "$REF"
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          merge-multiple: true
      - name: Attest SBOM (amd64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ needs.build.outputs.digest-amd64 }}
          sbom-path: sbom-amd64.cdx.json
          push-to-registry: true
      - name: Attest SBOM (arm64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ needs.build.outputs.digest-arm64 }}
          sbom-path: sbom-arm64.cdx.json
          push-to-registry: true
      - name: Verify signature and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.index.outputs.digest }}
          AMD64: ${{ needs.build.outputs.digest-amd64 }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          REPO: ${{ github.repository }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "cosign signature verified for $IDENTITY"
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$REPO" \
            --predicate-type https://slsa.dev/provenance/v1 > /dev/null
          echo "SLSA provenance verified"
          gh attestation verify "oci://$IMAGE@$AMD64" --repo "$REPO" \
            --predicate-type https://cyclonedx.org/bom > /dev/null
          echo "CycloneDX SBOM attestation verified"
      - name: Summary
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.index.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published \`$REF\`"
            echo
            echo "Tags:"
            while IFS= read -r tag; do [ -n "$tag" ] && printf -- '- %s\n' "$tag"; done <<< "$TAGS"
            echo
            echo "Signed with cosign (keyless), with SLSA provenance and CycloneDX SBOM attestations."
          } >> "$GITHUB_STEP_SUMMARY"
