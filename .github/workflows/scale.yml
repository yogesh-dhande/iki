name: Scale

# Load tests take too long for every push: they run nightly, and on demand.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scale
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.7"
  FORCE_COLOR: "1"

jobs:
  import:
    name: Import 10M entities, interrupted halfway
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    # No database service: the tests start Postgres themselves, sized as a deployment's
    # is (a service's settings can't be changed), and an S3-compatible store.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Import 10M entities
        run: make check-scale
