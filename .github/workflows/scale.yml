name: Scale

# Load tests take too long for every push: they run nightly, and on demand.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: Which load tests to run
        required: false
        default: all
        type: choice
        options: [all, import, grid, queue]

permissions: {}

concurrency:
  group: scale
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.7"
  FORCE_COLOR: "1"

jobs:
  import:
    name: Import 10M entities, interrupted halfway
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'import' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    # No database service: the tests start Postgres themselves, sized as a deployment's
    # is (a service's settings can't be changed), and an S3-compatible store.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Import 10M entities
        run: make check-scale-import

  grid:
    name: The grid at 10M rows
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'grid' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      # 10M rows are a 12 GB database, and its indexes are rebuilt beside it: the
      # runner's disk has room once the toolchains this job doesn't use are gone. 100M
      # rows (119 GB) is `make check-scale-grid` on a machine with the disk, before a
      # release (docs/adr/0103).
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h / /var/lib/docker
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Open the grid's pages at 10M rows
        env:
          IKI_SCALE_GRID_ROWS: "10000000"
        run: make check-scale-grid

  queue:
    name: 32 workers leasing from 100k queued jobs
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'queue' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Lease and complete 5,000 jobs from 100k queued behind 1M finished
        run: make check-scale-queue
