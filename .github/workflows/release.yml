name: Release

# Builds, signs and publishes release artifacts for a version tag (vX.Y.Z):
#   - iki-worker binaries for Linux (static, musl) and macOS, amd64 and arm64,
#     each with a cosign keyless signature bundle, SLSA build provenance and a
#     CycloneDX SBOM attestation, plus a SHA256SUMS file;
#   - the Helm chart, with a CycloneDX SBOM, also signed and attested in ghcr.io;
#   - @ikisci/component, @ikisci/science and @ikisci/ui on npm, at the release version;
#   - iki-plugin-runtime on PyPI: the wheel the release ships in iki-spec (ADR 0288);
#   - iki-writer, the SDK plugins' writers build against, on crates.io, at the release
#     version: packaged in the writer builder, checked against the checksum committed
#     beside it (which Iki's own writers' Cargo.locks pin), then published;
#     its version moves with the workspace's, so the commit that bumps it runs
#     scripts/pin-iki-writer.sh and rebuilds Iki's writers' digests;
#   - a GitHub release with the worker and chart artifacts.
# Container images are published by publish.yml on the same tag.
#
# Run it manually (workflow_dispatch) for a dry run: everything is built,
# signed and verified, but nothing is published.
#
# Before anything builds, a tag must have passed the live cloud tests: a passing
# run on each cloud, recorded in deploy/live-runs.json, of a commit the tag
# descends from with nothing they test changed since (deploy/live/live_runs.py).
# A dry run reports what's missing but goes on.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-tests:
    name: Live cloud tests passed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All of history: the gate asks git which tested commits this one descends from.
          fetch-depth: 0
      # CI never runs the live tests (they bill real clouds): it reads deploy/live-runs.json,
      # which each passing make check-<cloud>-live appends to. A tag needs every cloud's
      # passing run of a commit it descends from, with nothing they test changed since; any
      # other ref only reports.
      - name: Each cloud's live test passed for this commit
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 deploy/live/live_runs.py gate HEAD
          else
            python3 deploy/live/live_runs.py gate HEAD --dry-run
          fi

  version:
    name: Resolve version
    needs: live-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
            # A tag must match the versions committed in the repo.
            chart=$(awk '/^version:/ {print $2}' deploy/helm/iki/Chart.yaml)
            cargo=$(awk -F'"' '/^version =/ {print $2; exit}' worker/Cargo.toml)
            runtime=$(awk -F'"' '/^version =/ {print $2; exit}' runtime/pyproject.toml)
            writer=$(awk -F'"' '/^version =/ {print $2; exit}' worker/crates/iki-writer/Cargo.toml)
            for found in "$chart" "$cargo" "$runtime" "$writer"; do
              if [ "$found" != "$version" ]; then
                echo "::error::Tag $REF_NAME doesn't match committed version $found"
                exit 1
              fi
            done
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            version="0.0.0-dryrun.$RUN"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  worker:
    name: iki-worker ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Install pinned toolchain and target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          # Whose release workflow signs updates this worker accepts (ADR 0060).
          IKI_RELEASE_REPOSITORY: ${{ github.repository }}
        run: cargo build --release --locked --target "$TARGET" -p iki-worker
      - name: Check the Linux binary is fully static
        if: contains(matrix.target, 'musl')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          file "target/$TARGET/release/iki-worker"
          # Rust's musl targets produce static PIE executables ("static-pie linked").
          file "target/$TARGET/release/iki-worker" | grep -Eq "static(-pie|ally) linked"
          ! file "target/$TARGET/release/iki-worker" | grep -q "interpreter"
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          "target/$TARGET/release/iki-worker" --version
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          name="iki-worker-$VERSION-$TARGET"
          mkdir -p "../dist/$name"
          cp "target/$TARGET/release/iki-worker" ../LICENSE ../NOTICE "../dist/$name/"
          tar -C ../dist -czf "../dist/$name.tar.gz" "$name"
          rm -rf "../dist/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 7

  sign-worker:
    name: Sign and attest worker binaries
    needs: [version, worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # keyless signing: GitHub OIDC token for Sigstore
      attestations: write # store provenance and SBOM attestations on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: worker-*
          path: dist
          merge-multiple: true
      - name: Install Syft (pinned, checksum verified)
        run: scripts/ci/install-tools.sh syft
      - name: Checksums and SBOM
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          (cd dist && sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS && cat SHA256SUMS)
          syft scan dir:worker --source-name iki-worker --source-version "$VERSION" \
            -o "cyclonedx-json=dist/iki-worker-$VERSION.cdx.json"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign (keyless)
        run: |
          for f in dist/*.tar.gz dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" > /dev/null
          done
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/iki-worker-${{ needs.version.outputs.version }}.cdx.json
      - name: Verify signatures and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          REPO: ${{ github.repository }}
        run: |
          for f in dist/*.tar.gz dist/SHA256SUMS; do
            cosign verify-blob "$f" --bundle "$f.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          done
          echo "cosign signatures verified"
          for f in dist/*.tar.gz; do
            gh attestation verify "$f" --repo "$REPO" --predicate-type https://slsa.dev/provenance/v1 > /dev/null
            gh attestation verify "$f" --repo "$REPO" --predicate-type https://cyclonedx.org/bom > /dev/null
          done
          echo "SLSA provenance and SBOM attestations verified"
      - name: Check iki-worker itself accepts these signatures, and only these
        env:
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # What a worker checks before updating to a release (ADR 0060), offline.
          name="iki-worker-$VERSION-x86_64-unknown-linux-musl"
          tar -xzf "dist/$name.tar.gz" -C "$RUNNER_TEMP" "$name/iki-worker"
          worker="$RUNNER_TEMP/$name/iki-worker"
          for f in dist/*.tar.gz; do
            "$worker" verify "$f" "$f.sigstore.json" --identity "$IDENTITY"
          done
          cp "dist/$name.tar.gz" "$RUNNER_TEMP/tampered.tar.gz"
          printf x >> "$RUNNER_TEMP/tampered.tar.gz"
          if "$worker" verify "$RUNNER_TEMP/tampered.tar.gz" "dist/$name.tar.gz.sigstore.json" \
              --identity "$IDENTITY"; then
            echo "::error::iki-worker accepted a tampered release"; exit 1
          fi
          if "$worker" verify "dist/$name.tar.gz" "dist/$name.tar.gz.sigstore.json" \
              --identity "https://github.com/someone/else/.github/workflows/release.yml@refs/tags/v$VERSION"; then
            echo "::error::iki-worker accepted another repository's signature"; exit 1
          fi
          echo "iki-worker verifies releases, and refuses tampered or foreign ones"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-signed
          path: dist/
          retention-days: 7

  chart:
    name: Package Helm chart
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # sign the packaged chart's SBOM attestation
      attestations: write # store the chart archive's attestation on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
      - name: Install Syft (pinned, checksum verified)
        run: scripts/ci/install-tools.sh syft
      - name: Package and inventory the chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SYFT_FILE_METADATA_SELECTION: all
          SYFT_FILE_METADATA_DIGESTS: sha256
        run: |
          mkdir -p dist
          helm package deploy/helm/iki --version "$VERSION" --app-version "$VERSION" -d dist
          chart_dir=$(mktemp -d)
          tar -xzf "dist/iki-$VERSION.tgz" -C "$chart_dir"
          syft scan "dir:$chart_dir" --source-name iki --source-version "$VERSION" \
            -o "cyclonedx-json=dist/iki-chart-$VERSION.cdx.json"
          # Check every archived file, including the versioned Chart.yaml, against the SBOM.
          (cd "$chart_dir" && find iki -type f -exec sha256sum {} + | sort) > "$RUNNER_TEMP/chart-files"
          jq -r '.components[] | select(.type == "file") as $f | $f.hashes[] |
            select(.alg == "SHA-256") | "\(.content)  \($f.name | ltrimstr("/"))"' \
            "dist/iki-chart-$VERSION.cdx.json" | sort | diff -u "$RUNNER_TEMP/chart-files" -
      - name: Attest the packaged chart's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/iki-${{ needs.version.outputs.version }}.tgz
          sbom-path: dist/iki-chart-${{ needs.version.outputs.version }}.cdx.json
      - name: Verify the packaged chart's SBOM attestation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh attestation verify "dist/iki-$VERSION.tgz" --repo "$REPO" --predicate-type https://cyclonedx.org/bom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: |
            dist/*.tgz
            dist/*.cdx.json
          retention-days: 7

  publish-chart:
    name: Publish Helm chart
    needs: [version, chart]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # push the chart to ghcr.io
      id-token: write # keyless signing
      attestations: write # provenance and SBOM attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart
          path: dist
      # Helm, cosign and the OCI attestation action share this registry login.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          repo="ghcr.io/${OWNER,,}/charts"
          out=$(helm push dist/*.tgz "oci://$repo" --registry-config "${DOCKER_CONFIG:-$HOME/.docker}/config.json" 2>&1)
          echo "$out"
          digest=$(sed -n 's/^Digest: //p' <<< "$out")
          echo "ref=$repo/iki" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign (keyless)
        env:
          REF: ${{ steps.push.outputs.ref }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest the OCI chart's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: dist/iki-chart-${{ needs.version.outputs.version }}.cdx.json
          push-to-registry: true
      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ steps.push.outputs.ref }}@${{ steps.push.outputs.digest }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          cosign verify "$REF" --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          gh attestation verify "oci://$REF" --repo "$REPO" --predicate-type https://slsa.dev/provenance/v1
          gh attestation verify "oci://$REF" --repo "$REPO" --predicate-type https://cyclonedx.org/bom

  npm:
    name: Package and publish ${{ matrix.package }} to npm
    needs: version
    strategy:
      fail-fast: false
      matrix:
        package: [component, science, ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance, bound to release.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Test, build and pack at the Iki release version
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd "web/packages/$PACKAGE"
          npm pkg set "version=$VERSION"
          pnpm build
          pnpm test
          pnpm pack --pack-destination "$RUNNER_TEMP"
          if [ "$PACKAGE" = science ]; then
            for notice in rust-wasm.txt rust-standard-library.html binaryen.txt; do
              tar -xOf "$RUNNER_TEMP/ikisci-$PACKAGE-$VERSION.tgz" "package/dist/licenses/$notice" \
                | cmp - "dist/licenses/$notice"
            done
          fi
          npm publish --dry-run --ignore-scripts "$RUNNER_TEMP/ikisci-$PACKAGE-$VERSION.tgz"
      # Configure each package's trusted publisher for this repository and release.yml.
      # A manual run exercises packaging only, including when dispatched on a tag.
      - name: Publish the checked tarball
        if: github.event_name == 'push' && needs.version.outputs.publish == 'true'
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish --ignore-scripts --access public --provenance --tag "$tag" \
            "$RUNNER_TEMP/ikisci-$PACKAGE-$VERSION.tgz"

  plugin-runtime:
    name: Build the plugin runtime's wheel
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      # The wheel iki-spec carries in this release's images: runtime/pyproject.toml pins
      # its build backend, so the same source gives the same file. Built twice to check.
      - name: Build, twice, and compare
        run: |
          scripts/build-plugin-runtime.sh dist
          scripts/build-plugin-runtime.sh "$RUNNER_TEMP/again"
          cmp dist/iki_plugin_runtime-*.whl "$RUNNER_TEMP"/again/iki_plugin_runtime-*.whl
          (cd dist && sha256sum ./*.whl | sed 's| \./| |')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-runtime
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  publish-plugin-runtime:
    name: Publish the plugin runtime to PyPI
    needs: [version, plugin-runtime]
    if: github.event_name == 'push' && needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # PyPI's trusted publisher for iki-plugin-runtime names this repository, release.yml
    # and this environment; no token is stored anywhere.
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing, and the wheel's PEP 740 attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-runtime
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  iki-writer:
    name: Package and publish iki-writer to crates.io
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing, bound to release.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # In the writer builder, as a plugin image's build packages it: the checksum it
      # must have is committed beside it, and Iki's own writers' Cargo.locks pin it.
      - name: Package it, and check it's the crate Iki's writers pin
        run: |
          image=$(scripts/writer-toolchain.sh --image)
          mkdir -p "$RUNNER_TEMP/iki-writer"
          docker run --rm --platform linux/amd64 \
            -v "$PWD/worker/crates/iki-writer:/sdk:ro" -v "$RUNNER_TEMP/iki-writer:/dist" \
            "$image" sh /sdk/build-writer.sh package /dist > "$RUNNER_TEMP/iki-writer.sha256"
          diff -u worker/crates/iki-writer/iki-writer.crate.sha256 "$RUNNER_TEMP/iki-writer.sha256"
      # Configure the crate's trusted publisher for this repository and release.yml.
      - name: Get a crates.io token
        if: github.event_name == 'push' && needs.version.outputs.publish == 'true'
        id: crates-io
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the checked crate
        if: github.event_name == 'push' && needs.version.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          image=$(scripts/writer-toolchain.sh --image)
          docker run --rm --platform linux/amd64 -e CARGO_REGISTRY_TOKEN \
            -v "$PWD/worker/crates/iki-writer:/sdk:ro" -v "$RUNNER_TEMP/iki-writer:/dist" \
            "$image" sh /sdk/build-writer.sh publish /dist
          # What crates.io serves is the crate that was checked.
          want=$(cut -d' ' -f1 worker/crates/iki-writer/iki-writer.crate.sha256)
          for _ in 1 2 3 4 5 6; do
            if curl -fsSL "https://static.crates.io/crates/iki-writer/iki-writer-$VERSION.crate" \
                -o "$RUNNER_TEMP/published.crate"; then
              break
            fi
            sleep 10
          done
          echo "$want  $RUNNER_TEMP/published.crate" | sha256sum -c -

  github-release:
    name: GitHub release
    needs: [version, sign-worker, chart, publish-chart, npm, publish-plugin-runtime]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{worker-signed,chart,plugin-runtime}"
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --repo "$REPO" --verify-tag --generate-notes "${prerelease[@]}"
