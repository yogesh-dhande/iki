name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

# Every job starts with no token permissions and asks only for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.7"
  HELM_VERSION: "v4.3.1"
  FORCE_COLOR: "1"

jobs:
  workflows:
    name: Lint GitHub workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: actionlint
        run: |
          uvx --from actionlint-py==1.7.12.25 actionlint -color
          # The plugin template's workflow, which plugin repositories start from.
          uvx --from actionlint-py==1.7.12.25 actionlint -color plugin-template/.github/workflows/*.yml
      - name: zizmor (workflow security audit)
        env:
          # Read-only token so zizmor can also check actions against known advisories.
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.32.0 --persona=auditor --format=github .github/ plugin-template/.github/

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    # A guard against hangs, with room for the suite to grow: it takes about 14 minutes
    # on 3.14, which also runs the browser and worker end-to-end tests.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the oldest supported version; 3.14 is what servers run.
        # The browser tests don't depend on Python's version: they run once,
        # on the version servers run.
        # So do the iki-worker end-to-end tests, which need Rust to build it.
        include:
          - python: "3.12"
            markers: not built_web_app and not worker_e2e
          - python: "3.14"
            browsers: true
            rust: true
            markers: ""
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: iki
          POSTGRES_PASSWORD: iki-ci-only
          POSTGRES_DB: iki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iki"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      IKI_TEST_DATABASE_URL: postgres://iki:iki-ci-only@localhost:5432/iki
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install (locked)
        run: uv sync --locked
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: matrix.browsers
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.browsers
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Build the web app (for the browser tests)
        if: matrix.browsers
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @ikisci/app build
      - name: Install browsers (Chromium, Firefox, WebKit)
        if: matrix.browsers
        # A stuck package mirror fails in minutes, not at the job's limit.
        timeout-minutes: 10
        run: uv run --no-sync playwright install --with-deps chromium firefox webkit
      - name: Install the pinned Rust toolchain (for the worker end-to-end tests)
        if: matrix.rust
        working-directory: worker
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: matrix.rust
        with:
          workspaces: worker
      - name: Build iki-worker
        if: matrix.rust
        working-directory: worker
        run: cargo build --locked -p iki-worker
      - name: Ruff lint
        run: uv run --no-sync ruff check --output-format=github
      - name: Ruff format
        run: uv run --no-sync ruff format --check
      - name: mypy (strict)
        run: uv run --no-sync mypy
      - name: Helm lint (strict)
        run: make check-chart
      - name: pytest (includes Helm chart policy tests)
        env:
          MARKERS: ${{ matrix.markers }}
        run: uv run --no-sync pytest --cov --cov-report=term-missing -m "$MARKERS"

  web:
    name: TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Vitest
        run: pnpm test
      - name: The API client is generated from the committed OpenAPI document
        run: scripts/check-client.sh
      - name: Build
        run: pnpm build

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # rustup reads worker/rust-toolchain.toml and installs exactly that version.
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: worker
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets

  server-image:
    name: Server image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -f server/Dockerfile -t iki-server:ci .
      - name: Django deployment checks inside the image
        run: |
          docker run --rm \
            -e IKI_SECRET_KEY="$(openssl rand -base64 48)" \
            -e IKI_ALLOWED_HOSTS=iki.example.com \
            -e IKI_ENVIRONMENT=ci \
            -e IKI_DATABASE_URL=postgres://iki:unused@db.invalid/iki \
            -e IKI_ENCRYPTION_KEYS="$(openssl rand -base64 32 | tr '+/' '-_')" \
            iki-server:ci check --deploy --fail-level WARNING
      - name: Static files and the web app are collected into the image
        run: |
          docker run --rm --entrypoint sh iki-server:ci -c \
            'ls /opt/iki/static/staticfiles.json /opt/iki/static/iki/iki.*.css.gz \
                /opt/iki/static/app/manifest.json /opt/iki/static/app/assets/main-*.js.gz >/dev/null'
      - name: Runs as non-root with psycopg's C implementation
        run: |
          test "$(docker run --rm --entrypoint id iki-server:ci -u)" = "10001"
          docker run --rm --entrypoint python iki-server:ci \
            -c "import psycopg; assert psycopg.pq.__impl__ == 'c', psycopg.pq.__impl__"
      - name: Install Grype and Syft (pinned, checksum verified)
        run: scripts/ci/install-tools.sh grype syft
      - name: Vulnerability scan (fails on fixable high/critical)
        run: grype iki-server:ci --config .grype.yaml
      - name: SBOM (CycloneDX)
        run: syft iki-server:ci -o cyclonedx-json=iki-server.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iki-server-sbom
          path: iki-server.cdx.json
          retention-days: 30

  worker-image:
    name: Worker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - name: Build the worker image, and a deployment's on top of it
        run: scripts/ci/worker-image.sh iki-worker:ci
      - name: Install Grype and Syft (pinned, checksum verified)
        run: scripts/ci/install-tools.sh grype syft
      - name: Vulnerability scan (fails on fixable high/critical)
        run: grype iki-worker:ci --config .grype.yaml
      - name: SBOM (CycloneDX)
        run: syft iki-worker:ci -o cyclonedx-json=iki-worker.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iki-worker-sbom
          path: iki-worker.cdx.json
          retention-days: 30

  dependencies:
    name: Dependency vulnerabilities, licenses and release age
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        working-directory: worker
        run: rustup show active-toolchain || rustup toolchain install
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install OSV-Scanner and cargo-deny (pinned, checksum verified)
        run: scripts/ci/install-tools.sh osv-scanner cargo-deny
      - name: Scan all lockfiles
        run: make check-deps

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml

  dev-cluster:
    name: Dev cluster end to end (kind + Tilt)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          cluster_name: iki
          config: deploy/dev/kind-config.yaml
          wait: 120s
      - name: Install Tilt (pinned, checksum verified)
        run: scripts/ci/install-tools.sh tilt
      # The sign-in checks (deploy/dev/sso.py) run with the project's locked Python environment.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # The checks sign in through Keycloak in Chromium.
      - name: Install Chromium
        timeout-minutes: 10
        run: uv run playwright install --with-deps chromium
      - name: Bring up the dev cluster and run end-to-end checks
        run: make dev-ci
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl --context kind-iki get pods -A -o wide || true
          kubectl --context kind-iki -n iki get events --sort-by=.lastTimestamp | tail -50 || true
          for d in iki-web keycloak seaweedfs otel-lgtm; do
            echo "--- logs: $d"; kubectl --context kind-iki -n iki logs "deploy/$d" --tail=100 || true
          done
          kubectl --context kind-iki -n iki logs job/iki-migrate --tail=100 || true

  # A single required status check for branch protection: it passes only when
  # every job above passed (dependency review is skipped outside pull requests).
  ci-ok:
    name: CI passed
    if: always()
    needs:
      [workflows, python, web, rust, server-image, dependencies, dependency-review, dev-cluster]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results of required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::A required job did not succeed ($r)."
              exit 1
            fi
          done
