name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

# Every job starts with no token permissions and asks only for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.7"
  HELM_VERSION: "v4.3.1"
  TILT_VERSION: "0.37.8"
  TILT_SHA256: "e39513f958705d30524d55f68b1d46fbef2b46a0da568efd00e6383dee6be44f"
  FORCE_COLOR: "1"

jobs:
  workflows:
    name: Lint GitHub workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: actionlint
        run: uvx --from actionlint-py==1.7.12.25 actionlint -color
      - name: zizmor (workflow security audit)
        env:
          # Read-only token so zizmor can also check actions against known advisories.
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.32.0 --persona=auditor --format=github .github/

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the oldest supported version; 3.14 is what servers run.
        python: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: iki
          POSTGRES_PASSWORD: iki-ci-only
          POSTGRES_DB: iki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iki"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      IKI_TEST_DATABASE_URL: postgres://iki:iki-ci-only@localhost:5432/iki
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run --no-sync ruff check --output-format=github
      - name: Ruff format
        run: uv run --no-sync ruff format --check
      - name: mypy (strict)
        run: uv run --no-sync mypy
      - name: Helm lint (strict)
        run: make check-chart
      - name: pytest (includes Helm chart policy tests)
        run: uv run --no-sync pytest --cov --cov-report=term-missing

  web:
    name: TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Vitest
        run: pnpm test
      - name: Build
        run: pnpm build

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # rustup reads worker/rust-toolchain.toml and installs exactly that version.
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: worker
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets

  server-image:
    name: Server image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -f server/Dockerfile -t iki-server:ci .
      - name: Django deployment checks inside the image
        run: |
          docker run --rm \
            -e IKI_SECRET_KEY="$(openssl rand -base64 48)" \
            -e IKI_ALLOWED_HOSTS=iki.example.com \
            -e IKI_ENVIRONMENT=ci \
            -e IKI_DATABASE_URL=postgres://iki:unused@db.invalid/iki \
            iki-server:ci check --deploy --fail-level WARNING
      - name: Runs as non-root with psycopg's C implementation
        run: |
          test "$(docker run --rm --entrypoint id iki-server:ci -u)" = "10001"
          docker run --rm --entrypoint python iki-server:ci \
            -c "import psycopg; assert psycopg.pq.__impl__ == 'c', psycopg.pq.__impl__"

  dev-cluster:
    name: Dev cluster end to end (kind + Tilt)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          cluster_name: iki
          config: deploy/dev/kind-config.yaml
          wait: 120s
      - name: Install Tilt (checksum verified)
        run: |
          curl -fsSL -o /tmp/tilt.tar.gz \
            "https://github.com/tilt-dev/tilt/releases/download/v${TILT_VERSION}/tilt.${TILT_VERSION}.linux.x86_64.tar.gz"
          echo "${TILT_SHA256}  /tmp/tilt.tar.gz" | sha256sum --check
          sudo tar -xzf /tmp/tilt.tar.gz -C /usr/local/bin tilt
          tilt version
      - name: Bring up the dev cluster and run end-to-end checks
        run: make dev-ci
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl --context kind-iki get pods -A -o wide || true
          kubectl --context kind-iki -n iki get events --sort-by=.lastTimestamp | tail -50 || true
          for d in iki-web keycloak seaweedfs otel-lgtm; do
            echo "--- logs: $d"; kubectl --context kind-iki -n iki logs "deploy/$d" --tail=100 || true
          done
          kubectl --context kind-iki -n iki logs job/iki-migrate --tail=100 || true

  # A single required status check for branch protection: it passes only when
  # every job above passed.
  ci-ok:
    name: CI passed
    if: always()
    needs: [workflows, python, web, rust, server-image, dev-cluster]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results of required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job did not succeed ($r)."
              exit 1
            fi
          done
