name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

# Every job starts with no token permissions and asks only for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.7"
  HELM_VERSION: "v4.3.1"
  FORCE_COLOR: "1"

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      server_image: ${{ steps.diff.outputs.server_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Only documentation changed? Then the docs job runs instead of the code jobs.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: scripts/ci/changes.sh

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm format:check
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # Links between Markdown files, and release links' GitHub account (docs/tests).
      - name: Docs tests
        run: |
          pytest_version=$(sed -n '/^name = "pytest"$/{n;p;}' uv.lock | cut -d'"' -f2)
          uv run --no-project --with "pytest==$pytest_version" \
            pytest -q -p no:cacheprovider -c /dev/null --rootdir . docs/tests

  workflows:
    name: Lint GitHub workflows
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: actionlint
        run: |
          uvx --from actionlint-py==1.7.12.25 actionlint -color
          # The plugin template's workflow, which plugin repositories start from.
          uvx --from actionlint-py==1.7.12.25 actionlint -color plugin-template/.github/workflows/*.yml
      - name: zizmor (workflow security audit)
        env:
          # Read-only token so zizmor can also check actions against known advisories.
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.32.0 --persona=auditor --format=github .github/ plugin-template/.github/

  python-checks:
    name: Python ${{ matrix.python }} lint and types
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the oldest supported version; 3.14 is what servers run.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run --no-sync ruff check --output-format=github
      - name: Ruff format
        run: uv run --no-sync ruff format --check
      - name: mypy (strict)
        run: uv run --no-sync mypy
      - name: Import workspace modules on Python 3.12
        if: matrix.python == '3.12'
        run: uv run --no-sync python -I scripts/ci/check_imports.py --all
      - name: Helm lint (strict)
        run: make check-chart

  # The tests, in shards side by side (scripts/ci/pytest_shards.py). Every shard builds
  # iki-wasm: saves and the validator evaluate plugins' rules with it (ADR 0127). Beyond
  # that, each kind of test gets the setup it needs: plain ones only Python, Postgres
  # and Docker; worker ones (iki-worker end to end) iki-worker, built with cargo;
  # browser ones the built web app and Chromium, Firefox and WebKit. Python 3.12, the
  # oldest supported version, runs the plain tests; 3.14, what servers run, runs every
  # kind. "Python tests (summary)" checks that every test ran exactly once, and
  # combines the shards' coverage.
  python-tests:
    name: Python ${{ matrix.python }} tests (${{ matrix.kind }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # A guard against hangs, with room for the suite to grow. And, for the browsers, room
    # for a slow Ubuntu mirror before their packages are cached: that install alone has
    # taken 17 minutes.
    timeout-minutes: ${{ matrix.kind == 'browser' && 45 || 30 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.12", kind: plain, shard: 1, shards: 3 }
          - { python: "3.12", kind: plain, shard: 2, shards: 3 }
          - { python: "3.12", kind: plain, shard: 3, shards: 3 }
          - { python: "3.14", kind: plain, shard: 1, shards: 3 }
          - { python: "3.14", kind: plain, shard: 2, shards: 3 }
          - { python: "3.14", kind: plain, shard: 3, shards: 3 }
          - { python: "3.14", kind: worker, shard: 1, shards: 1 }
          - { python: "3.14", kind: browser, shard: 1, shards: 2 }
          - { python: "3.14", kind: browser, shard: 2, shards: 2 }
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: iki
          POSTGRES_PASSWORD: iki-ci-only
          POSTGRES_DB: iki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iki"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      IKI_TEST_DATABASE_URL: postgres://iki:iki-ci-only@localhost:5432/iki
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      # The Helm chart's policy tests render it.
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install (locked)
        run: uv sync --locked
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: matrix.kind == 'browser'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.kind == 'browser'
        with:
          node-version-file: .node-version
          cache: pnpm
      # Rust builds iki-wasm (the web app's parsers, and CEL for apps and rules) and
      # iki-worker.
      - name: Install the pinned Rust toolchain
        working-directory: worker
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: worker
          # Each kind builds different crates.
          key: ${{ matrix.kind }}
      - name: Build iki-wasm (without the web app)
        if: matrix.kind != 'browser'
        run: scripts/build-wasm.sh
      - name: Build the packaged DNA annotation module
        run: scripts/build-dna-annotation-wasm.sh
      # The plasmid plugin's actions call this module, and no .wasm is committed, so the
      # tests that run those actions build it here. It checks itself against the tracked
      # digest as it goes (ADR 0200).
      - name: Build the plugins' modules
        run: |
          scripts/build-plasmid-tools-wasm.sh
          scripts/build-oligo-checks-wasm.sh
      - name: Build iki-worker
        if: matrix.kind == 'worker'
        working-directory: worker
        run: cargo build --locked -p iki-worker
      - name: Build the web app (with iki-wasm) and the package stories
        if: matrix.kind == 'browser'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @ikisci/app --filter @ikisci/science --filter @ikisci/ui build
      # The browsers' system packages, kept between runs: Ubuntu's mirrors are
      # sometimes too slow from the runners to download them in time.
      # A stalled cache service once held this step for the job's whole timeout: give
      # up after a few minutes and install without the cache.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt-all
        timeout-minutes: 5
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3
        if: matrix.kind == 'browser'
        with:
          path: ~/.cache/ci-apt
          key: apt-${{ runner.os }}-${{ runner.arch }}-all-${{ hashFiles('uv.lock') }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-all-
      - name: Install browsers (Chromium, Firefox, WebKit)
        if: matrix.kind == 'browser'
        # Each try is bounded, so a stuck package mirror moves on rather than wait.
        timeout-minutes: 30
        env:
          UV_NO_SYNC: "1"
          CI_APT_CACHE: ~/.cache/ci-apt
        run: scripts/ci/install-browsers.sh chromium firefox webkit
      # Saved at once, not at the job's end, so a job that fails later still keeps them.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.kind == 'browser' && steps.apt-all.outputs.cache-hit != 'true' && steps.apt-all.outputs.cache-primary-key != ''
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: ~/.cache/ci-apt
          key: ${{ steps.apt-all.outputs.cache-primary-key }}
      - name: pytest (includes Helm chart policy tests)
        env:
          SHARD: ${{ matrix.kind }}:${{ matrix.shard }}/${{ matrix.shards }}
        run: |
          uv run --no-sync pytest -p pytest_shards --shard "$SHARD" \
            --shard-report "$RUNNER_TEMP/shard" \
            -n auto --dist worksteal --cov --cov-report=
          # This shard's coverage, which the summary combines with the others'.
          mv .coverage "$RUNNER_TEMP/shard/coverage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-shard-${{ matrix.python }}-${{ matrix.kind }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard/
          if-no-files-found: error
          retention-days: 7
      - name: Upload click stability reports
        if: ${{ !cancelled() && matrix.kind == 'browser' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: click-stability-${{ matrix.python }}-${{ matrix.shard }}
          path: .pytest_cache/click-stability/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  python-summary:
    name: Python tests (summary)
    needs: python-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-shard-*
          path: ${{ runner.temp }}/shards
      # Fails if a test ran in no shard or in two: a shard missing from the matrix, one
      # there twice, or shards that collected different suites.
      - name: Every test ran exactly once
        run: |
          python3 scripts/ci/shard_summary.py "$RUNNER_TEMP/shards" \
            --durations "$RUNNER_TEMP/test-durations.json" --markdown "$GITHUB_STEP_SUMMARY"
      # Copy it to scripts/ci/test-durations.json when the shards drift apart.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-durations
          path: ${{ runner.temp }}/test-durations.json
          retention-days: 30
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # Each version's shards' coverage together, reported on that version.
      - name: Coverage
        run: |
          coverage_version=$(sed -n '/^name = "coverage"$/{n;p;}' uv.lock | cut -d'"' -f2)
          versions=$(find "$RUNNER_TEMP/shards" -mindepth 1 -maxdepth 1 -name 'python-shard-*' \
            | sed 's/.*python-shard-\([0-9.]*\)-.*/\1/' | sort -u)
          for python in $versions; do
            # coverage COMMAND, on this version's combined data, then the command's arguments.
            coverage() {
              command=$1
              shift
              uv run --no-project --python "$python" --with "coverage==$coverage_version" \
                coverage "$command" --data-file="$RUNNER_TEMP/coverage-$python" "$@"
            }
            echo "::group::Python $python"
            coverage combine --keep "$RUNNER_TEMP/shards/python-shard-$python-"*/coverage
            coverage report --show-missing
            echo "::endgroup::"
            echo "Python $python coverage: $(coverage report --format=total)%" >>"$GITHUB_STEP_SUMMARY"
          done

  web:
    name: TypeScript
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # The app's parsers are Rust built for browsers (iki-wasm): its tests and build use them.
      - name: Install the pinned Rust toolchain
        working-directory: worker
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: worker
      - name: Build the parsers
        run: pnpm --filter @ikisci/app build:wasm
      - name: ESLint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Vitest
        run: pnpm test
      - name: The API client is generated from the committed OpenAPI document
        run: scripts/check-client.sh
      - name: Build
        run: pnpm build

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # rustup reads worker/rust-toolchain.toml and installs exactly that version.
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: worker
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Check the packaged DNA annotation module
        run: ../scripts/build-dna-annotation-wasm.sh --check
      - name: Check the packaged primer and digest module
        run: ../scripts/build-plasmid-tools-wasm.sh --check
      - name: Check the packaged primer-checks module
        run: ../scripts/build-oligo-checks-wasm.sh --check

  server-wasm:
    name: Build server Wasm
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.server_image == 'true'
    permissions:
      contents: read
    # The pinned actionlint release does not yet accept the $/ call spelling.
    uses: ./.github/workflows/build-server-wasm.yml # zizmor: ignore[self-repository]

  server-image:
    name: Server image
    needs: [changes, server-wasm]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.server_image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.server-wasm.outputs.artifact-id }}
          path: ${{ runner.temp }}/server-wasm
      - name: Verify the server Wasm artifacts
        run: scripts/verify-server-wasm.sh "$RUNNER_TEMP/server-wasm"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        run: >-
          docker buildx build --platform linux/amd64 --file server/Dockerfile
          --build-context "server-wasm-artifacts=$RUNNER_TEMP/server-wasm"
          --tag iki-server:ci --load .
      - name: Check the server runtime
        run: scripts/ci/smoke-server-image.sh iki-server:ci linux/amd64 "$RUNNER_TEMP/server-wasm"
      - name: Install Grype and Syft (pinned, checksum verified)
        run: scripts/ci/install-tools.sh grype syft
      - name: Vulnerability scan (fails on fixable high/critical)
        run: grype iki-server:ci --config .grype.yaml
      - name: SBOM (CycloneDX)
        run: syft iki-server:ci -o cyclonedx-json=iki-server.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iki-server-sbom
          path: iki-server.cdx.json
          retention-days: 30

  # Server inputs include package READMEs even when changes skips the code jobs.
  server-image-arm64:
    name: Server image (native arm64)
    needs: [changes, server-wasm]
    if: >-
      needs.changes.outputs.server_image == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.server-wasm.outputs.artifact-id }}
          path: ${{ runner.temp }}/server-wasm
      - name: Verify the server Wasm artifacts
        run: scripts/verify-server-wasm.sh "$RUNNER_TEMP/server-wasm"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the final server image on the release platform
        run: >-
          docker buildx build --platform linux/arm64 --file server/Dockerfile
          --build-context "server-wasm-artifacts=$RUNNER_TEMP/server-wasm"
          --tag iki-server:ci --load .
      - name: Check the server runtime
        run: scripts/ci/smoke-server-image.sh iki-server:ci linux/arm64 "$RUNNER_TEMP/server-wasm"

  worker-image:
    name: Worker image
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      # `iki deploy build` checks the plugins' rules and guards with iki-wasm (ADR 0127).
      - name: Install the pinned Rust toolchain (for iki-wasm)
        working-directory: worker
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: worker
      - name: Build iki-wasm
        run: scripts/build-wasm.sh
      # `iki deploy build` puts each plugin's module in its bundle, taking it from
      # iki-spec, which this builds it into; no .wasm is committed (ADR 0200).
      - name: Build the plugins' modules
        run: |
          scripts/build-plasmid-tools-wasm.sh
          scripts/build-oligo-checks-wasm.sh
      - name: Build the worker image, and a deployment's on top of it
        run: scripts/ci/worker-image.sh iki-worker:ci
      - name: Install Grype and Syft (pinned, checksum verified)
        run: scripts/ci/install-tools.sh grype syft
      - name: Vulnerability scan (fails on fixable high/critical)
        run: grype iki-worker:ci --config .grype.yaml
      - name: SBOM (CycloneDX)
        run: syft iki-worker:ci -o cyclonedx-json=iki-worker.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iki-worker-sbom
          path: iki-worker.cdx.json
          retention-days: 30

  plugin-images:
    name: Plugin image ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: iki-protein-structure-tools
            plugin: plugins/protein
            dir: plugins/protein/images/structure-tools
          - image: iki-protein-alignment-tools
            plugin: plugins/protein
            dir: plugins/protein/images/alignment-tools
          - image: iki-dna-alignment-tools
            plugin: plugins/dna
            dir: plugins/dna/images/alignment-tools
          - image: iki-antibody-numbering-tools
            plugin: plugins/antibody
            dir: plugins/antibody/images/numbering-tools
          - image: iki-antibody-structure-tools
            plugin: plugins/antibody
            dir: plugins/antibody/images/structure-tools
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        env:
          IMAGE: ${{ matrix.image }}
          PLUGIN: ${{ matrix.plugin }}
          DIR: ${{ matrix.dir }}
        # A build downloads its files from their sources (ImmuneBuilder's weights from
        # Zenodo, licences from GitHub), each checked against its SHA-256: a source's bad
        # moment fails that check. A second try reuses every layer the first built, so it
        # fetches only what failed; a real fault fails both.
        run: |
          if ! docker build -f "$DIR/Dockerfile" -t "$IMAGE:ci" "$PLUGIN"; then
            echo "::warning::Building $IMAGE failed; trying once more."
            sleep 30
            docker build -f "$DIR/Dockerfile" -t "$IMAGE:ci" "$PLUGIN"
          fi
      - name: Runs as non-root, and its tools work
        # The plugin's scripts are there too, for a check that runs them on the image's tools.
        env:
          IMAGE: ${{ matrix.image }}
          PLUGIN: ${{ matrix.plugin }}
          DIR: ${{ matrix.dir }}
        run: |
          test "$(docker run --rm --entrypoint id "$IMAGE:ci" -u)" != "0"
          docker run --rm --network none -v "$PWD/$DIR:/check:ro" -v "$PWD/$PLUGIN/scripts:/scripts:ro" \
            "$IMAGE:ci" python -I /check/check.py
      - name: Install Grype and Syft (pinned, checksum verified)
        run: scripts/ci/install-tools.sh grype syft
      - name: Vulnerability scan (fails on fixable high/critical)
        env:
          IMAGE: ${{ matrix.image }}
        run: grype "$IMAGE:ci" --config .grype.yaml
      - name: SBOM (CycloneDX)
        env:
          IMAGE: ${{ matrix.image }}
        run: syft "$IMAGE:ci" -o "cyclonedx-json=$IMAGE.cdx.json"
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.image }}-sbom
          path: ${{ matrix.image }}.cdx.json
          retention-days: 30

  dependencies:
    name: Dependency vulnerabilities, licenses and release age
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        working-directory: worker
        run: rustup show active-toolchain || rustup toolchain install
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install OSV-Scanner and cargo-deny (pinned, checksum verified)
        run: scripts/ci/install-tools.sh osv-scanner cargo-deny
      - name: Scan all lockfiles
        run: make check-deps

  infrastructure:
    name: Cloud modules (OpenTofu, AWS and Google Cloud)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # Each module and root tests on its own, about 10 minutes for both clouds.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Format, validate, test against mocked AWS and Google providers, and Checkov
        run: |
          # Each provider is downloaded once for the whole job, not once a module.
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/tofu-plugins"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          make check-infra

  dependency-review:
    name: Dependency review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The action reads its config from the checkout: without one, it fails every PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml

  slurm:
    name: Slurm cluster end to end
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # Building the cluster's image and a static iki-worker takes most of it.
    timeout-minutes: 40
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: iki
          POSTGRES_PASSWORD: iki-ci-only
          POSTGRES_DB: iki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iki"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      IKI_TEST_DATABASE_URL: postgres://iki:iki-ci-only@localhost:5432/iki
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      # make check-slurm builds iki-wasm: the test server's plugins' rules and guards are checked
      # with it (ADR 0127).
      - name: Install the pinned Rust toolchain (for iki-wasm)
        working-directory: worker
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: worker
      - name: Run iki-worker on a Slurm cluster in a container
        run: make check-slurm
      - name: Slurm's logs on failure
        if: failure()
        run: tail -n 100 .pytest_cache/slurm-e2e/logs/* || true

  dev-cluster:
    name: Dev cluster end to end (kind + Tilt)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          cluster_name: iki
          config: deploy/dev/kind-config.yaml
          wait: 120s
      - name: Install Tilt (pinned, checksum verified)
        run: scripts/ci/install-tools.sh tilt
      # The sign-in checks (deploy/dev/sso.py) run with the project's locked Python environment.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # The checks sign in through Keycloak in Chromium.
      # A stalled cache service once held this step for the job's whole timeout: give
      # up after a few minutes and install without the cache.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt-chromium
        timeout-minutes: 5
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3
        with:
          path: ~/.cache/ci-apt
          key: apt-${{ runner.os }}-${{ runner.arch }}-chromium-${{ hashFiles('uv.lock') }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-chromium-
      - name: Install Chromium
        timeout-minutes: 30
        env:
          CI_APT_CACHE: ~/.cache/ci-apt
        run: scripts/ci/install-browsers.sh chromium
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.apt-chromium.outputs.cache-hit != 'true' && steps.apt-chromium.outputs.cache-primary-key != ''
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: ~/.cache/ci-apt
          key: ${{ steps.apt-chromium.outputs.cache-primary-key }}
      - name: Bring up the dev cluster and run end-to-end checks
        run: make dev-ci
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl --context kind-iki get pods -A -o wide || true
          kubectl --context kind-iki -n iki get events --sort-by=.lastTimestamp | tail -50 || true
          for d in iki-web keycloak seaweedfs otel-lgtm; do
            echo "--- logs: $d"; kubectl --context kind-iki -n iki logs "deploy/$d" --tail=100 || true
          done
          kubectl --context kind-iki -n iki logs job/iki-migrate --tail=100 || true

  # A single required status check for branch protection: it passes only when
  # every job above passed (dependency review is skipped outside pull requests).
  ci-ok:
    name: CI passed
    if: always()
    needs:
      [
        changes,
        docs,
        workflows,
        python-checks,
        python-tests,
        python-summary,
        web,
        rust,
        server-wasm,
        server-image,
        server-image-arm64,
        worker-image,
        plugin-images,
        dependencies,
        infrastructure,
        dependency-review,
        slurm,
        dev-cluster,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results of required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::A required job did not succeed ($r)."
              exit 1
            fi
          done
