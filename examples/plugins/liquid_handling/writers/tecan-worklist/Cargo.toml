# The liquid-handling plugin's Tecan worklist writer (ADR 0230): a Freedom EVOware or
# FluentControl worklist (.gwl), one aspirate, dispense and wash per transfer.
#
# Its own workspace, so no other is ever taken for it. It depends on iki-writer, Iki's SDK,
# from crates.io, and its Cargo.lock pins the version with its checksum: this Iki's own,
# which the build takes from Iki's checkout until it's published (build-writer.sh). Its
# unit tests run natively, from Iki's checkout:
#
#   sh worker/crates/iki-writer/build-writer.sh fetch examples/plugins/liquid_handling/writers/tecan-worklist
#   sh worker/crates/iki-writer/build-writer.sh test examples/plugins/liquid_handling/writers/tecan-worklist
#
# scripts/build-writer-wasm.sh builds the module here; `uv run iki plugin writers
# examples/plugins/liquid_handling --update` writes its digest, from the Linux x86-64
# builder.
[package]
name = "tecan-worklist"
description = "Writes liquid transfers as a Tecan Freedom EVOware or FluentControl worklist."
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
publish = false

[workspace]

[lib]
# cdylib for the writer's module; rlib for its unit tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
iki-writer = "=0.1.0-dev.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "s"
