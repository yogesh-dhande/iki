# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: EntityType
name: Transfer
label: Transfer
schema_version: 1
hrid: { prefix: TRF }
description: One liquid transfer, from a well of one plate to a well of another.
fields:
  source: { type: ref, to: Plate, required: true, label: Source plate }
  source_well: { type: string, required: true, max_length: 4, description: Such as B3. }
  destination: { type: ref, to: Plate, required: true, label: Destination plate }
  destination_well: { type: string, required: true, max_length: 4 }
  volume: { type: quantity, unit: uL, min: 0, required: true }
  liquid_class:
    type: string
    max_length: 64
    description: The liquid class the instrument pipettes it with, if not the method's own.
display: { title: "{{ source_well }} to {{ destination_well }}, {{ volume }} µL" }
exports:
  - export: tecan_worklist
    fields:
      source_plate: source
      source_well: source_well
      destination_plate: destination
      destination_well: destination_well
      volume: volume
      liquid_class: liquid_class
