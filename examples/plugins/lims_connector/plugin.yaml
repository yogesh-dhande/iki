# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Plugin
name: acme/lims_connector
version: 0.1.1
title: Protein LIMS connector
description: Example of synchronizing Iki protein records with an external LIMS by its record ID.
license: Apache-2.0
iki: ">=0.1"
dependencies:
  iki/protein: { types: { Protein: ">=1" } }
settings:
  lims_host:
    type: string
    format: hostname
    required: true
    description: The LIMS hostname used for HTTPS API calls and links to protein records.
