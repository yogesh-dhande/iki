# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Action
name: compute_properties
label: Compute protein properties
description: >-
  A protein's length, molecular weight, isoelectric point, extinction
  coefficients, GRAVY and instability index, as ExPASy's ProtParam computes
  them, and its hydropathy along its sequence, as ProtScale draws it. Each
  property needs residues it has values for: the 20 standard amino acids, and
  for molecular weight also U, O and J, and for the isoelectric point and
  extinction coefficients also J. For others the run says which residue left
  which properties out.
inputs:
  protein: { type: iki/protein.Protein, schema: ">=2" }
effects:
  updates:
    - input: protein
      fields:
        - length
        - molecular_weight
        - isoelectric_point
        - extinction_coefficient_oxidized
        - extinction_coefficient_reduced
        - gravy
        - hydropathy
        - instability_index
software:
  - { name: Biopython, version: "1.88", url: https://biopython.org }
runs_on: { tier: backend, environment: protein-tools }
command: [python, ./scripts/proteins.py, properties]
deterministic: true
batchable: 100
timeout: 5m
