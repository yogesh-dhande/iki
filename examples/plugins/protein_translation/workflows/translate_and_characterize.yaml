# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Workflow
name: translate_and_characterize
label: Translate and characterize
description: >-
  Translates a DNA sequence into the protein it encodes, then computes that
  protein's properties, with the Protein plugin's own two actions.
inputs:
  sequence: { type: iki/dna.DNASequence, schema_version: ">=1" }
params:
  frame:
    type: int
    min: 1
    max: 3
    default: 1
    description: The base translation starts at.
  table:
    type: int
    label: Genetic code
    min: 1
    max: 33
    default: 1
    description: NCBI's translation table; 1 is the standard code.
  complete_cds:
    type: bool
    label: Complete coding sequence
    default: false
    description: >-
      Translate it as a whole coding sequence, from a start codon (methionine)
      to a stop codon.
steps:
  translate:
    action: iki/protein.translate
    inputs: { sequence: $inputs.sequence }
    params: { frame: $params.frame, table: $params.table, complete_cds: $params.complete_cds }
  properties:
    action: iki/protein.compute_properties
    inputs: { protein: $steps.translate.created.iki/protein.Protein }
