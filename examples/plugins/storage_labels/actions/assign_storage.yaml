# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
#
# An action: what it takes, what it changes, and where its command runs. This
# one runs on the container tier, in the `tools` environment's image.
apiVersion: iki/v1
kind: Action
name: assign_storage
label: Assign default storage
description: Records where a sample is stored as the deployment's default, if nobody said.
inputs:
  sample: { type: Sample, schema_version: ">=1" }
effects:
  updates: { sample: { fields: [storage] } }
runs_on: { tier: container, environment: tools }
# An action that runs a tool lists it, with the version its environment
# installs, so what its runs make is recorded as made with it (ADR 0106). This
# one runs only its own script, so it lists none. One that ran Biopython would say
# software: [{ name: Biopython, version: "1.88", url: https://biopython.org }]
command: [python, ./scripts/storage.py]
deterministic: true
batchable: 50
timeout: 5m
