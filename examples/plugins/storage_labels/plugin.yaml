# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Plugin
name: acme/storage_labels
version: 0.1.3
title: Sample storage labels
description: Assign and expand local storage codes for sample labels using a versioned code list.
license: Apache-2.0
iki: ">=0.1"
# A rack scanner's export. The header is the ASCII word TUBESCAN and a tab.
# File fields and action file parameters can accept it by its full format ID.
formats:
  tube_scan:
    label: Tube scanner export
    media_types: [application/x-tube-scan]
    extensions: [.tubescan]
    signatures: [{ hex: "545542455343414e09" }]
dependencies:
  iki/dna:
    types:
      DNASequence: ">=1"
settings:
  default_storage:
    type: string
    max_length: 100
    default: "-80"
    description: The code or full location to assign when a sample has no storage location.
