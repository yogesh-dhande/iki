# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
apiVersion: iki/v1
kind: Plugin
name: acme/hosted_models
version: 0.2.1
iki: ">=0.1"
title: Hosted model adapter
description: >-
  Predicts protein structures with a model behind an outside API: each run
  sends a protein's sequence to the API, waits for its job without holding a
  worker, and imports the structure it predicts, with the model that made
  it; the run's record of each call keeps the version the API reported. A
  starting point for a plugin that calls a hosted
  model, such as a structure predictor, a language model or an ADMET
  service.
license: Apache-2.0
dependencies:
  iki/protein:
    types:
      Protein: ">=1"
      ProteinStructure: ">=2"
settings:
  fold_api_host:
    type: string
    format: hostname
    required: true
    description: >-
      The structure-prediction API's host name, such as api.foldcloud.example.
      An Org Admin approves it for each project that may send it data.
apis:
  foldcloud:
    label: FoldCloud
    host: "{settings.fold_api_host}"
    purpose: >-
      Predicts protein structures from their sequences with FoldCloud's
      hosted models.
    credential:
      secret: FOLDCLOUD_API_KEY
      description: An API key from FoldCloud's console, for the organization's account.
    reports:
      model: /model
      version: header:x-model-version
      parameters: [/model, /num_recycles]
      usage: { gpu_seconds: /usage/gpu_seconds }
    jobs:
      poll: /v1/predictions/{id}
      status: /status
      done: [succeeded]
      failed: [failed, canceled]
      message: /error
      cancel: /v1/predictions/{id}/cancel
      every: 30s
      timeout: 1d
      usage: { gpu_seconds: /usage/gpu_seconds }
      webhook: { signature: standard-webhooks, secret: FOLDCLOUD_WEBHOOK_SECRET }
