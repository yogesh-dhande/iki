apiVersion: iki/v1
kind: ActionTest
name: a_file_other_than_the_one_the_record_names
description: >-
  The record names one export's SHA-256 and holds another file. The import refuses to
  read results into a record that doesn't name its file.
action: import_quantstudio_results
files: { export: tests/data/qs7-flex-tgfb-comparative-ct.txt }
inputs:
  run:
    - values:
        results_file: { $file: export }
        source_sha256: 4f6fc56e7a65fad44fea0932d926686b080d9002a32d588aee5a450363c95859
expect: { error: "The results file isn't the export this run's record names" }
---
