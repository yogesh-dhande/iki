apiVersion: iki/v1
kind: ActionTest
name: a_5_10_5_moe_gapmer
description: >-
  Mipomersen (Kynamro) designed from its bases: a 5-10-5 gapmer, 2′-MOE wings round a
  deoxy gap, phosphorothioates throughout, every C a 5-methylcytosine:
  C230H324N67O122P19S19, 7177.25 g/mol in ChEMBL (CHEMBL2219536), whose atomic weights
  are older: sulfur at 32.065, not CIAAW's 32.06, is 0.10 of the 0.14 between them. The
  Kynamro label's sodium salt, C230H305N67O122P19S19Na19, is the same molecule.
action: design_oligonucleotide
params:
  bases: GCCTCAGTCTGCTTCGCACC
  wings: 5-10-5
  wing_sugar: MOE
  sugar: DNA
  backbone: phosphorothioate
  methyl_cytosine: true
  name: mipomersen
expect:
  output:
    creates:
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - type: iki/oligo.Oligonucleotide
        values:
          helm: "RNA1{[MOE](G)[sP].[MOE]([5meC])[sP].[MOE]([5meC])[sP].[MOE](T)[sP].[MOE]([5meC])[sP].[dR](A)[sP].[dR](G)[sP].[dR](T)[sP].[dR]([5meC])[sP].[dR](T)[sP].[dR](G)[sP].[dR]([5meC])[sP].[dR](T)[sP].[dR](T)[sP].[dR]([5meC])[sP].[MOE](G)[sP].[MOE]([5meC])[sP].[MOE](A)[sP].[MOE]([5meC])[sP].[MOE]([5meC])}$$$$V2.0"
          name: mipomersen
          molecular_formula: C230H324N67O122P19S19
          molecular_weight: 7177.11
          modifications:
            ["2′-O-Methoxyethylribose (10)", "5-Methylcytosine (9)", "Phosphorothioate (19)"]
  tolerance: 1.0e-6
