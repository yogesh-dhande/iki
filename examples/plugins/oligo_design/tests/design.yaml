apiVersion: iki/v1
kind: ActionTest
name: a_fam_bhq1_probe
description: >-
  A probe with 6-FAM on its 5′ end and BHQ-1 on its 3′: a different oligonucleotide
  from the plain one, with the same bases. Each adds what IDT lists it adding (6-FAM
  537.5, BHQ-1 554.5 g/mol), and its ε260 is the strand's by nearest neighbours with
  theirs (IDT: 20,960 and 8,000) added.
action: design_oligonucleotide
params:
  bases: ACGTACGTAC
  backbone: phosphodiester
  five_prime: 6-FAM
  three_prime: BHQ-1
  purpose: probe
expect:
  output:
    creates:
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - { type: iki/oligo.Monomer }
      - type: iki/oligo.Oligonucleotide
        values:
          helm: "RNA1{P.[dR](A)P.[dR](C)P.[dR](G)P.[dR](T)P.[dR](A)P.[dR](C)P.[dR](G)P.[dR](T)P.[dR](A)P.[dR](C)P}|CHEM1{[5FAM]}|CHEM2{[BHQ1]}$RNA1,CHEM1,1:R1-1:R1|RNA1,CHEM2,31:R2-1:R1$$$V2.0"
          bases: ACGTACGTAC
          molecular_formula: C149H174N45O73P11
          molecular_weight: 4103.99
          extinction_260: 129360
          modifications:
            - 5′ 6-FAM (6-carboxyfluorescein on a C6 amino linker)
            - 3′ BHQ-1 (Black Hole Quencher 1)
          purpose: probe
  tolerance: 1.0e-6
