# Local observability: an OpenTelemetry collector plus Grafana, Tempo
# (traces), Loki (logs), Prometheus (metrics) and Pyroscope in one pod.
# Development only. Production sends OTLP to the operator's own collector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-lgtm
  namespace: iki
  labels: { app.kubernetes.io/name: otel-lgtm }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: otel-lgtm }
  template:
    metadata:
      labels: { app.kubernetes.io/name: otel-lgtm }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: otel-lgtm
          image: grafana/otel-lgtm:0.41.0@sha256:2e3290657f2f2a256c7a9175f097424a3ac5b54840741ace433e108e109348b6
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: grafana-dev, key: admin-password }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
          ports:
            - { name: grafana, containerPort: 3000 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: tempo, containerPort: 3200 }
          readinessProbe:
            httpGet: { path: /ready, port: tempo }
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: tempo, mountPath: /var/tempo }
            # Iki's dashboard (ADR 0098): the chart's file, in a ConfigMap Tilt makes.
            - name: dashboards-provider
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/iki.yaml
              subPath: iki.yaml
              readOnly: true
            - { name: dashboards, mountPath: /var/lib/iki-dashboards, readOnly: true }
      volumes:
        - { name: data, emptyDir: { sizeLimit: 4Gi } }
        - { name: tmp, emptyDir: { sizeLimit: 512Mi } }
        - { name: tempo, emptyDir: { sizeLimit: 2Gi } }
        - name: dashboards-provider
          configMap: { name: grafana-iki-dashboards }
        - name: dashboards
          configMap: { name: iki-dashboards, optional: true }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-iki-dashboards
  namespace: iki
  labels: { app.kubernetes.io/name: otel-lgtm }
data:
  iki.yaml: |
    apiVersion: 1
    providers:
      - name: Iki
        folder: Iki
        type: file
        allowUiUpdates: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/iki-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: otel-lgtm
  namespace: iki
  labels: { app.kubernetes.io/name: otel-lgtm }
spec:
  selector: { app.kubernetes.io/name: otel-lgtm }
  ports:
    - { name: grafana, port: 3000, targetPort: grafana }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: tempo, port: 3200, targetPort: tempo }
