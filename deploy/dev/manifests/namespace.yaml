# Everything Iki runs in development lives here, under the same Pod Security
# "restricted" profile production uses.
apiVersion: v1
kind: Namespace
metadata:
  name: iki
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Container-tier runs (ADR 0061): plugins' images run here, apart from Iki's
# own Secrets, under the same profile.
apiVersion: v1
kind: Namespace
metadata:
  name: iki-runs
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# A second place for runs, whose template reads reference data from a shared
# file system (ADR 0077): manifests/shared-filesystem.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: iki-runs-shared
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
