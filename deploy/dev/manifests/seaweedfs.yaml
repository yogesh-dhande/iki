# S3-compatible object storage for development (production uses AWS S3).
# `weed mini` runs master, volume, filer and S3 gateway in one process.
# Credentials come from Secret seaweedfs-s3, generated by deploy/dev/up.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: iki
  labels: { app.kubernetes.io/name: seaweedfs }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: seaweedfs }
  template:
    metadata:
      labels: { app.kubernetes.io/name: seaweedfs }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
          args:
            - mini
            - -dir=/data
            - -ip=127.0.0.1
            - -ip.bind=0.0.0.0
            - -bucket=iki
            - -s3.config=/etc/seaweedfs/s3.json
            - -s3.autoCreateBucket=false
            - -admin.ui=false
            # No anonymous usage reports from developer machines or CI.
            - -master.telemetry=false
          ports:
            - { name: s3, containerPort: 8333 }
          readinessProbe:
            # The S3 gateway answers this unauthenticated health endpoint.
            httpGet: { path: /healthz, port: s3 }
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: s3-config, mountPath: /etc/seaweedfs, readOnly: true }
      volumes:
        - name: data
          emptyDir: { sizeLimit: 5Gi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: s3-config
          secret:
            secretName: seaweedfs-s3
            items: [{ key: s3.json, path: s3.json }]
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: iki
  labels: { app.kubernetes.io/name: seaweedfs }
spec:
  selector: { app.kubernetes.io/name: seaweedfs }
  ports:
    - { name: s3, port: 8333, targetPort: s3 }
