# A fake LIMS for the dev cluster, with the REST API the example LIMS plugin
# talks to (plugins/example_lims/scripts/lims.py): GET /api/v1/proteins, a
# page at a time, and PATCH /api/v1/proteins/<id>, with the bearer token in
# iki-run-secrets. It answers at https://fake-lims.iki.svc, with a certificate
# from the dev CA up.sh made, so runs reach it as they would a lab's LIMS:
# through the egress proxy, checking TLS end to end. GET /requests on port
# 8080 lists the last 200 API requests (without the token), for you and
# e2e.sh. Development only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-lims
  namespace: iki
data:
  lims.py: |
    import collections
    import json
    import os
    import ssl
    import threading
    from datetime import UTC, datetime
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import parse_qs, unquote, urlsplit

    TOKEN = open("/secrets/example_lims.LIMS_TOKEN").read().strip()
    PAGE = 2
    lock = threading.Lock()
    received = collections.deque(maxlen=200)


    def now():
        return datetime.now(UTC).isoformat(timespec="seconds")


    proteins = {
        "LIMS-0001": {"name": "Ubiquitin", "sequence": "MQIFVKTLTGKTITLEVEPSDTIENVKAKIQDKEGIPPDQQRLIFAGKQLEDGRTLSDYNIQKESTLHLVLRLRGG"},
        "LIMS-0002": {"name": "Insulin A chain", "sequence": "GIVEQCCTSICSLYQLENYCN"},
        "LIMS-0003": {"name": "Insulin B chain", "sequence": "FVNQHLCGSHLVEALYLVCGERGFFYTPKT"},
    }
    for lims_id, protein in proteins.items():
        protein.update(id=lims_id, modified_at=now())


    class Api(BaseHTTPRequestHandler):
        def answer(self, code, body=None):
            payload = json.dumps(body).encode() if body is not None else b""
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def allowed(self, body=None):
            with lock:
                received.append({"method": self.command, "path": self.path, "body": body})
            if self.headers.get("Authorization") != f"Bearer {TOKEN}":
                self.answer(401, {"error": "bad token"})
                return False
            return True

        def do_GET(self):
            if not self.allowed():
                return
            url = urlsplit(self.path)
            if url.path != "/api/v1/proteins":
                return self.answer(404, {"error": "not found"})
            query = {k: v[0] for k, v in parse_qs(url.query).items()}
            since = query.get("modified_since")
            start = int(query.get("cursor", "0"))
            with lock:
                changed = sorted(
                    (p for p in proteins.values()
                     if not since or datetime.fromisoformat(p["modified_at"]) > datetime.fromisoformat(since)),
                    key=lambda p: (p["modified_at"], p["id"]),
                )
            items = changed[start : start + PAGE]
            more = start + PAGE < len(changed)
            self.answer(200, {"items": items, "next_cursor": str(start + PAGE) if more else None})

        def do_PATCH(self):
            length = min(int(self.headers.get("Content-Length") or 0), 100_000)
            body = json.loads(self.rfile.read(length) or b"{}")
            if not self.allowed(body):
                return
            lims_id = unquote(urlsplit(self.path).path.removeprefix("/api/v1/proteins/"))
            with lock:
                protein = proteins.get(lims_id)
                if protein is None:
                    return self.answer(404, {"error": "not found"})
                protein.update({k: v for k, v in body.items() if k in ("name", "iki_id")})
                protein["modified_at"] = now()
                self.answer(200, protein)

        def log_message(self, format, *args):
            print(self.command, self.path, flush=True)


    class Requests(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                payload = b"ok"
            elif self.path == "/requests":
                with lock:
                    payload = json.dumps(list(received)).encode()
            else:
                self.send_error(404)
                return
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def log_message(self, format, *args):
            pass


    context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
    context.load_cert_chain("/tls/tls.crt", "/tls/tls.key")
    api = ThreadingHTTPServer(("", 443), Api)
    api.socket = context.wrap_socket(api.socket, server_side=True)
    threading.Thread(target=api.serve_forever, daemon=True).start()
    ThreadingHTTPServer(("", 8080), Requests).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-lims
  namespace: iki
  labels: { app.kubernetes.io/name: fake-lims }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: fake-lims }
  template:
    metadata:
      labels: { app.kubernetes.io/name: fake-lims }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
        # Port 443 without root (a safe sysctl).
        sysctls:
          - { name: net.ipv4.ip_unprivileged_port_start, value: "0" }
      containers:
        - name: lims
          # The server image's own base (server/Dockerfile), pinned by digest.
          image: python:3.14-slim-trixie@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
          command: ["python", "-I", "/app/lims.py"]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
          ports:
            - { name: https, containerPort: 443 }
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: secrets, mountPath: /secrets, readOnly: true }
      volumes:
        - name: app
          configMap: { name: fake-lims }
        - name: tls
          secret: { secretName: fake-lims-tls }
        - name: secrets
          secret:
            secretName: iki-run-secrets
            items: [{ key: example_lims.LIMS_TOKEN, path: example_lims.LIMS_TOKEN }]
---
apiVersion: v1
kind: Service
metadata:
  name: fake-lims
  namespace: iki
  labels: { app.kubernetes.io/name: fake-lims }
spec:
  selector: { app.kubernetes.io/name: fake-lims }
  ports:
    - { name: https, port: 443, targetPort: https }
    - { name: http, port: 8080, targetPort: http }
