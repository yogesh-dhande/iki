# Postgres for development, run by the CloudNativePG operator. CNPG creates:
# - Secret iki-db-app with the app user's connection `uri`
# - Secret iki-db-ca with the CA that signs the server certificate (TLS is on)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: iki-db
  namespace: iki
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:de572898499fab9406f0da51929da562f96f3be40ca79fafea8ec1a8d5b42065
  bootstrap:
    initdb:
      database: iki
      owner: iki
  storage:
    size: 2Gi
  postgresql:
    parameters:
      log_min_duration_statement: "500ms"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
