# A webhook receiver for the dev cluster: it answers 204 to every POST and
# keeps the last 200, which GET /requests lists (method, path, headers and
# body), so you can see what Iki sends and e2e.sh can check the signatures.
# Add a webhook to http://webhook-receiver.iki.svc:8080/<anything>, then read
# http://localhost:8090/requests. Development only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-receiver
  namespace: iki
data:
  receiver.py: |
    import collections
    import json
    import threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    received = collections.deque(maxlen=200)
    lock = threading.Lock()


    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = min(int(self.headers.get("Content-Length") or 0), 1_000_000)
            body = self.rfile.read(length).decode("utf-8", "replace")
            with lock:
                received.append(
                    {"path": self.path, "headers": dict(self.headers.items()), "body": body}
                )
            self.send_response(204)
            self.end_headers()

        def do_GET(self):
            if self.path == "/healthz":
                payload = b"ok"
            elif self.path == "/requests":
                with lock:
                    payload = json.dumps(list(received)).encode()
            else:
                self.send_error(404)
                return
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def log_message(self, format, *args):
            print(self.command, self.path, flush=True)


    ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-receiver
  namespace: iki
  labels: { app.kubernetes.io/name: webhook-receiver }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: webhook-receiver }
  template:
    metadata:
      labels: { app.kubernetes.io/name: webhook-receiver }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: receiver
          # The server image's own base (server/Dockerfile), pinned by digest.
          image: python:3.14-slim-trixie@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
          command: ["python", "-I", "/app/receiver.py"]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
      volumes:
        - name: app
          configMap: { name: webhook-receiver }
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-receiver
  namespace: iki
  labels: { app.kubernetes.io/name: webhook-receiver }
spec:
  selector: { app.kubernetes.io/name: webhook-receiver }
  ports:
    - { name: http, port: 8080, targetPort: http }
