# Keycloak as the development identity provider, over OIDC and SAML 2.0.
# (Keycloak can't push SCIM; the end-to-end checks play the provisioning
# side themselves.) The "iki" realm is imported on start. ${...} placeholders are filled
# from the keycloak-dev Secret generated by deploy/dev/up.sh, so no password
# is ever written in this repo. Users have fixed IDs: those are their OIDC
# subjects, and Keycloak re-imports the realm (in-memory) on every start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: iki
data:
  iki-realm.json: |
    {
      "realm": "iki",
      "displayName": "Iki (development)",
      "enabled": true,
      "sslRequired": "external",
      "registrationAllowed": false,
      "resetPasswordAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "bruteForceProtected": true,
      "clients": [
        {
          "clientId": "iki-web",
          "name": "Iki web (development)",
          "protocol": "openid-connect",
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "${IKI_DEV_OIDC_CLIENT_SECRET}",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "redirectUris": ["http://localhost:8000/accounts/oidc/*"],
          "webOrigins": [],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "http://localhost:8000/signed-out/"
          }
        },
        {
          "clientId": "http://localhost:8000/accounts/saml/sso/metadata/",
          "name": "Iki web SAML (development)",
          "protocol": "saml",
          "enabled": true,
          "frontchannelLogout": false,
          "redirectUris": ["http://localhost:8000/accounts/saml/sso/acs/"],
          "attributes": {
            "saml.assertion.signature": "true",
            "saml.server.signature": "true",
            "saml.client.signature": "false",
            "saml.force.post.binding": "true",
            "saml.authnstatement": "true",
            "saml.signature.algorithm": "RSA_SHA256",
            "saml_name_id_format": "username",
            "saml_force_name_id_format": "true",
            "saml_assertion_consumer_url_post": "http://localhost:8000/accounts/saml/sso/acs/"
          },
          "protocolMappers": [
            {
              "name": "email",
              "protocol": "saml",
              "protocolMapper": "saml-user-property-mapper",
              "config": { "user.attribute": "email", "attribute.name": "email", "attribute.nameformat": "Basic" }
            },
            {
              "name": "firstName",
              "protocol": "saml",
              "protocolMapper": "saml-user-property-mapper",
              "config": { "user.attribute": "firstName", "attribute.name": "firstName", "attribute.nameformat": "Basic" }
            },
            {
              "name": "lastName",
              "protocol": "saml",
              "protocolMapper": "saml-user-property-mapper",
              "config": { "user.attribute": "lastName", "attribute.name": "lastName", "attribute.nameformat": "Basic" }
            }
          ]
        }
      ],
      "users": [
        {
          "id": "24dcc41a-b8be-47f6-951a-cbb5faf1ec4f",
          "username": "alice",
          "email": "alice@iki.test",
          "firstName": "Alice",
          "lastName": "Scientist",
          "emailVerified": true,
          "enabled": true,
          "credentials": [
            { "type": "password", "value": "${IKI_DEV_USER_PASSWORD}", "temporary": false }
          ]
        },
        {
          "id": "21365ffa-0541-4d39-9f7d-c62e1a4ee34c",
          "username": "bob",
          "email": "bob@iki.test",
          "firstName": "Bob",
          "lastName": "Admin",
          "emailVerified": true,
          "enabled": true,
          "credentials": [
            { "type": "password", "value": "${IKI_DEV_USER_PASSWORD}", "temporary": false }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: iki
  labels: { app.kubernetes.io/name: keycloak }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: keycloak }
  template:
    metadata:
      labels: { app.kubernetes.io/name: keycloak }
      annotations:
        # Keycloak imports the realm only on start. Bump this when the realm
        # above changes, so applying the manifests restarts Keycloak.
        iki.dev/realm-revision: "3"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.2@sha256:723b1d6e254c0fc96d5cffec860c7e0744d6a3277822b865bb538cf891575e41
          args: ["start-dev", "--import-realm", "--http-port=8080"]
          env:
            - { name: KC_HEALTH_ENABLED, value: "true" }
            # One URL everywhere, so the OIDC issuer matches for browsers and
            # for Iki: browsers resolve *.localhost to loopback (Tilt forwards
            # 8080), and the cluster's CoreDNS rewrites the name to this
            # Service (configured by deploy/dev/up.sh).
            - { name: KC_HOSTNAME, value: "http://keycloak.iki.localhost:8080" }
            - { name: KC_LOG_CONSOLE_OUTPUT, value: json }
            - { name: JAVA_OPTS_KC_HEAP, value: "-XX:MaxRAMPercentage=70" }
          envFrom:
            - secretRef: { name: keycloak-dev }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          startupProbe:
            httpGet: { path: /health/started, port: management }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            # start-dev writes its build and H2 database under /opt/keycloak.
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: iki
  labels: { app.kubernetes.io/name: keycloak }
spec:
  selector: { app.kubernetes.io/name: keycloak }
  ports:
    - { name: http, port: 8080, targetPort: http }
