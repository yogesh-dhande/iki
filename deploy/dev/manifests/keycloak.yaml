# Keycloak as the development identity provider (OIDC now, SAML and SCIM
# later). The "iki" realm is imported on start. ${...} placeholders are filled
# from the keycloak-dev Secret generated by deploy/dev/up.sh, so no password
# is ever written in this repo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: iki
data:
  iki-realm.json: |
    {
      "realm": "iki",
      "displayName": "Iki (development)",
      "enabled": true,
      "sslRequired": "external",
      "registrationAllowed": false,
      "resetPasswordAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "bruteForceProtected": true,
      "clients": [
        {
          "clientId": "iki-web",
          "name": "Iki web (development)",
          "protocol": "openid-connect",
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "${IKI_DEV_OIDC_CLIENT_SECRET}",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "redirectUris": ["http://localhost:8000/accounts/oidc/*"],
          "webOrigins": [],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "http://localhost:8000/signed-out/"
          }
        }
      ],
      "users": [
        {
          "username": "alice",
          "email": "alice@iki.test",
          "firstName": "Alice",
          "lastName": "Scientist",
          "emailVerified": true,
          "enabled": true,
          "credentials": [
            { "type": "password", "value": "${IKI_DEV_USER_PASSWORD}", "temporary": false }
          ]
        },
        {
          "username": "bob",
          "email": "bob@iki.test",
          "firstName": "Bob",
          "lastName": "Admin",
          "emailVerified": true,
          "enabled": true,
          "credentials": [
            { "type": "password", "value": "${IKI_DEV_USER_PASSWORD}", "temporary": false }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: iki
  labels: { app.kubernetes.io/name: keycloak }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: keycloak }
  template:
    metadata:
      labels: { app.kubernetes.io/name: keycloak }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.2@sha256:723b1d6e254c0fc96d5cffec860c7e0744d6a3277822b865bb538cf891575e41
          args: ["start-dev", "--import-realm", "--http-port=8080"]
          env:
            - { name: KC_HEALTH_ENABLED, value: "true" }
            # One URL everywhere, so the OIDC issuer matches for browsers and
            # for Iki: browsers resolve *.localhost to loopback (Tilt forwards
            # 8080), and the cluster's CoreDNS rewrites the name to this
            # Service (configured by deploy/dev/up.sh).
            - { name: KC_HOSTNAME, value: "http://keycloak.iki.localhost:8080" }
            - { name: KC_LOG_CONSOLE_OUTPUT, value: json }
            - { name: JAVA_OPTS_KC_HEAP, value: "-XX:MaxRAMPercentage=70" }
          envFrom:
            - secretRef: { name: keycloak-dev }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          startupProbe:
            httpGet: { path: /health/started, port: management }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            # start-dev writes its build and H2 database under /opt/keycloak.
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: iki
  labels: { app.kubernetes.io/name: keycloak }
spec:
  selector: { app.kubernetes.io/name: keycloak }
  ports:
    - { name: http, port: 8080, targetPort: http }
