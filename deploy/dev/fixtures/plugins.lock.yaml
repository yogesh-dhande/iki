# Additional plugins for the dev-ci fixture build. Paths are relative to this file.
apiVersion: iki/v1
kind: PluginLock
plugins:
  # Imports from the fake LIMS (../manifests/fake-lims.yaml), and writes back.
  - name: iki/lims_connector_example
    local: ../../../plugins/lims_connector_example
    state: active
    settings: settings/lims_connector_example.yaml
  # Calls the fake FoldCloud (../manifests/fake-foldcloud.yaml), an outside API.
  - name: iki/example_models
    local: ../../../plugins/example_models
    state: active
    settings: settings/example_models.yaml
  # The plugin template, for its container-tier action (ADR 0061).
  - { name: acme/example, local: ../../../plugin-template, state: active }
