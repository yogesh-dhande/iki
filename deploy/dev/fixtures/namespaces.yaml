# A second place for runs, whose template reads reference data from a shared
# file system (ADR 0077): manifests/shared-filesystem.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: iki-runs-shared
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# A third, whose template reads reference data from a bucket (ADR 0078):
# manifests/bucket.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: iki-runs-bucket
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
