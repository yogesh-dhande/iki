# The CI fixture for examples/plugins/hosted_models. POST /v1/predictions
# takes a sequence and answers with a job. Each requested recycle takes five
# seconds. GET /v1/predictions/<id> returns the job status and any finished
# structure. An empty POST to /v1/predictions/<id>/cancel cancels the job.
# A sequence containing X fails. The fixture checks the key the proxy adds from
# iki-run-secrets, answers at https://fake-foldcloud.iki.svc with a
# certificate from the dev CA up.sh made, and calls the run's webhook, signed
# (Standard Webhooks), when a job ends. GET /requests on port 8080 lists the
# last 200 API requests and successful callback responses for the e2e checks.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-foldcloud
  namespace: iki
data:
  foldcloud.py: |
    import base64
    import collections
    import hashlib
    import hmac
    import json
    import math
    import os
    import ssl
    import threading
    import time
    import urllib.request
    import uuid
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import urlsplit

    KEY = open("/secrets/lab__hosted_models.FOLDCLOUD_API_KEY").read().strip()
    HOOK = open("/secrets/lab__hosted_models.FOLDCLOUD_WEBHOOK_SECRET").read().strip()
    # Iki's public URL isn't reachable from inside the cluster: call its web pods.
    CALLBACKS = os.environ["CALLBACK_ORIGIN"]
    VERSION = "2.1.0"
    lock = threading.Lock()
    received = collections.deque(maxlen=200)
    jobs = {}


    def structure(sequence):
        """An ideal alpha helix of C-alpha atoms, one per residue."""
        lines = []
        for i, residue in enumerate(sequence, start=1):
            angle = math.radians(100 * i)
            x, y, z = 2.3 * math.cos(angle), 2.3 * math.sin(angle), 1.5 * i
            lines.append(
                f"ATOM  {i:5d}  CA  {'ALA':3s} A{i:4d}    "
                f"{x:8.3f}{y:8.3f}{z:8.3f}  1.00 90.00           C"
            )
        return "\n".join([*lines, "END", ""])


    def notify(job):
        url = job.get("webhook")
        if not url:
            return
        parts = urlsplit(url)
        target = CALLBACKS + parts.path
        body = json.dumps({"id": job["id"], "status": job["status"]}).encode()
        ident, stamp = f"msg_{uuid.uuid4().hex}", str(int(time.time()))
        secret = base64.b64decode(HOOK.removeprefix("whsec_"))
        signed = hmac.new(secret, f"{ident}.{stamp}.".encode() + body, hashlib.sha256)
        request = urllib.request.Request(target, data=body, method="POST", headers={
            "Content-Type": "application/json",
            "webhook-id": ident,
            "webhook-timestamp": stamp,
            "webhook-signature": "v1," + base64.b64encode(signed.digest()).decode(),
        })
        try:
            with urllib.request.urlopen(request, timeout=10) as response, lock:
                received.append({"method": "CALLBACK", "job": job["id"], "status": response.status})
        except OSError as error:
            print(f"Callback for {job['id']} failed ({type(error).__name__})", flush=True)


    def work(job):
        time.sleep(5 * job["num_recycles"])
        with lock:
            if job["status"] != "running":
                return
            if "X" in job["sequence"]:
                job.update(status="failed", error="The sequence has an unknown residue (X).")
            else:
                job.update(
                    status="succeeded",
                    output={"pdb": structure(job["sequence"])},
                    usage={"gpu_seconds": round(len(job["sequence"]) * 0.5, 1)},
                )
        notify(job)


    def public(job):
        return {k: v for k, v in job.items() if k not in ("sequence", "webhook")}


    class Api(BaseHTTPRequestHandler):
        def answer(self, code, body):
            payload = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.send_header("x-model-version", VERSION)
            self.end_headers()
            self.wfile.write(payload)

        def checked(self):
            with lock:
                received.append({"method": self.command, "path": self.path})
            if self.headers.get("Authorization") != f"Bearer {KEY}":
                self.answer(401, {"error": "A valid API key is needed."})
                return False
            return True

        def do_GET(self):
            if not self.checked():
                return
            parts = self.path.strip("/").split("/")
            with lock:
                job = jobs.get(parts[-1]) if parts[:2] == ["v1", "predictions"] else None
                found = public(job) if job else None
            self.answer(200, found) if found else self.answer(404, {"error": "No such job."})

        def do_POST(self):
            if not self.checked():
                return
            parts = self.path.strip("/").split("/")
            if parts == ["v1", "predictions"]:
                body = json.loads(self.rfile.read(int(self.headers.get("Content-Length") or 0)))
                job = {
                    "id": f"pred_{uuid.uuid4().hex[:12]}",
                    "status": "running",
                    "model": body.get("model", "fold-2"),
                    "num_recycles": body.get("num_recycles", 3),
                    "sequence": body["sequence"],
                    "webhook": body.get("webhook"),
                }
                with lock:
                    jobs[job["id"]] = job
                threading.Thread(target=work, args=(job,), daemon=True).start()
                self.answer(201, public(job))
            elif parts[:2] == ["v1", "predictions"] and parts[-1] == "cancel":
                with lock:
                    job = jobs.get(parts[2])
                    if job and job["status"] == "running":
                        job["status"] = "canceled"
                    found = public(job) if job else None
                self.answer(200, found) if found else self.answer(404, {"error": "No such job."})
            else:
                self.answer(404, {"error": "No such path."})

        def log_message(self, *args):
            pass


    class Requests(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                payload = b"ok"
            elif self.path == "/requests":
                with lock:
                    payload = json.dumps(list(received)).encode()
            else:
                self.send_response(404)
                self.end_headers()
                return
            self.send_response(200)
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def log_message(self, *args):
            pass


    context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
    context.load_cert_chain("/tls/tls.crt", "/tls/tls.key")
    api = ThreadingHTTPServer(("", 443), Api)
    api.socket = context.wrap_socket(api.socket, server_side=True)
    threading.Thread(target=api.serve_forever, daemon=True).start()
    ThreadingHTTPServer(("", 8080), Requests).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-foldcloud
  namespace: iki
  labels: { app.kubernetes.io/name: fake-foldcloud }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: fake-foldcloud }
  template:
    metadata:
      labels: { app.kubernetes.io/name: fake-foldcloud }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
        # Port 443 without root (a safe sysctl).
        sysctls:
          - { name: net.ipv4.ip_unprivileged_port_start, value: "0" }
      containers:
        - name: foldcloud
          # The server image's own base (server/Dockerfile), pinned by digest.
          image: python:3.15-slim-trixie@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
          command: ["python", "-I", "/app/foldcloud.py"]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: CALLBACK_ORIGIN, value: "http://iki-web.iki.svc:8000" }
          ports:
            - { name: https, containerPort: 443 }
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: secrets, mountPath: /secrets, readOnly: true }
      volumes:
        - name: app
          configMap: { name: fake-foldcloud }
        - name: tls
          secret: { secretName: fake-foldcloud-tls }
        - name: secrets
          secret:
            secretName: iki-run-secrets
            items:
              - key: lab__hosted_models.FOLDCLOUD_API_KEY
                path: lab__hosted_models.FOLDCLOUD_API_KEY
              - key: lab__hosted_models.FOLDCLOUD_WEBHOOK_SECRET
                path: lab__hosted_models.FOLDCLOUD_WEBHOOK_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: fake-foldcloud
  namespace: iki
  labels: { app.kubernetes.io/name: fake-foldcloud }
spec:
  selector: { app.kubernetes.io/name: fake-foldcloud }
  ports:
    - { name: https, port: 443, targetPort: https }
    - { name: http, port: 8080, targetPort: http }
