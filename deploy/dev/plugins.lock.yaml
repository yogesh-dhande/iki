# The dev cluster's plugins. Tilt builds them with
# `iki deploy build deploy/dev --allow-local` into the server image.
#
# A plugin being developed comes from its directory, so changing it rebuilds
# the cluster's image. Deployments pin plugins to commits instead.
apiVersion: iki/v1
kind: PluginLock
plugins:
  # Its ncbi_email setting, so the cluster can fetch from NCBI.
  - { name: iki/dna, local: ../../plugins/dna, state: active, settings: settings/dna.yaml }
  - { name: iki/protein, local: ../../plugins/protein, state: active }
  - { name: iki/antibody, local: ../../plugins/antibody, state: active }
  - { name: iki/antibody_3d, local: ../../plugins/antibody_3d, state: active }
  - { name: iki/biologics_ms, local: ../../plugins/biologics_ms, state: active }
  - { name: iki/small_molecule, local: ../../plugins/small_molecule, state: active }
  - { name: iki/oligo, local: ../../plugins/oligo, state: active }
  - { name: iki/plasmid, local: ../../plugins/plasmid, state: active }
  - { name: iki/complex, local: ../../plugins/complex, state: active }
  - { name: iki/conjugate, local: ../../plugins/conjugate, state: active }
  - { name: iki/polymer, local: ../../plugins/polymer, state: active }
  - { name: iki/lots, local: ../../plugins/lots, state: active }
  - { name: iki/plate_assays, local: ../../plugins/plate_assays, state: active }
  - { name: iki/experiments, local: ../../plugins/experiments, state: active }
  - { name: iki/reagents, local: ../../plugins/reagents, state: active }
  - { name: iki/qc_release, local: ../../plugins/qc_release, state: active }
  - { name: iki/proteomics, local: ../../plugins/proteomics, state: active }
  - { name: iki/sequencing, local: ../../plugins/sequencing, state: active }
  - { name: iki/sequencing_analysis, local: ../../plugins/sequencing_analysis, state: active }
  - {
      name: iki/antibody_rearrangements,
      local: ../../plugins/antibody_rearrangements,
      state: active,
    }
  - { name: iki/plasmid_sequencing, local: ../../plugins/plasmid_sequencing, state: active }
  - { name: iki/inventory, local: ../../plugins/inventory, state: active }
  - { name: iki/lab_roles, local: ../../plugins/lab_roles, state: active }
  - { name: iki/requests, local: ../../plugins/requests, state: active }
  - { name: iki/samples, local: ../../plugins/samples, state: active }
  - { name: iki/equipment, local: ../../plugins/equipment, state: active }
  - { name: iki/cell_lines, local: ../../plugins/cell_lines, state: active }
  - { name: iki/stability, local: ../../plugins/stability, state: active }
  - { name: iki/strains, local: ../../plugins/strains, state: active }
  - { name: iki/mouse_strains, local: ../../plugins/mouse_strains, state: active }
