# The dev cluster's plugins. Tilt builds them with
# `iki deploy build deploy/dev --allow-local` into the server image.
#
# A plugin being developed comes from its directory, so changing it rebuilds
# the cluster's image. Deployments pin plugins to commits instead.
apiVersion: iki/v1
kind: PluginLock
plugins:
  - { name: dna, local: ../../plugins/dna, state: active }
  - { name: protein, local: ../../plugins/protein, state: active }
  # Imports from the fake LIMS (manifests/fake-lims.yaml), and writes back.
  - name: example_lims
    local: ../../plugins/example_lims
    state: active
    settings: settings/example_lims.yaml
  # The plugin template, for its container-tier action (ADR 0061).
  - { name: example, local: ../../plugin-template, state: active }
