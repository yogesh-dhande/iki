# The test cluster `hpc1`: one node, `slurm` (the container), in the `batch` partition.
ClusterName=hpc1
SlurmctldHost=slurm
SlurmUser=slurm
AuthType=auth/munge
MpiDefault=none
ReturnToService=2
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
# No cgroups in a container: track processes by their parent, and bind nothing.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
# Accounting, as sacct reads it, enforced so a job must name an account it may use.
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurm
AccountingStorageEnforce=associations,limits
# Keeps each job's comment (Iki's `iki:<job>`), so sacct can find Iki's jobs.
AccountingStoreFlags=job_comment
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=5
JobCompType=jobcomp/none
# Quick to notice jobs that end, for the tests.
MinJobAge=30
# The node, as slurmd -C finds it, written at start.
include /etc/slurm/nodes.conf
PartitionName=batch Nodes=ALL Default=YES MaxTime=2:00:00 State=UP
