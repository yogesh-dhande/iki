# Values for the Iki chart in the local kind cluster (used by the Tiltfile).
image:
  # Tilt builds this image and rewrites the reference to the exact build.
  repository: iki-server
  tag: dev
environment: dev
plugins:
  # The dev lockfile (deploy/dev/plugins.lock.yaml) may use local directories.
  allowLocal: true
publicUrl: http://localhost:8000
allowedHosts: ["localhost", "127.0.0.1"]
# Local access is plain HTTP through port-forwards.
https: false
forwardedAllowIps: "127.0.0.1"
log:
  level: INFO
  format: json
secretKey:
  existingSecret: iki-secret-key
  key: secret-key
encryptionKeys:
  existingSecret: iki-encryption-keys
  key: keys
email:
  # Mailpit (deploy/dev/manifests/mailpit.yaml); read it at localhost:8025.
  existingSecret: iki-email
  from: "Iki <iki@iki.localhost>"
webhooks:
  # The dev receiver (deploy/dev/manifests/webhook-receiver.yaml) is a cluster
  # Service on plain HTTP: allow kind's Service network, and http:// (only
  # because https is false here).
  allowedNetworks: ["10.96.0.0/16"]
  allowHttp: true
files:
  # SeaweedFS (deploy/dev/manifests/seaweedfs.yaml), with the keys up.sh made.
  # Browsers reach it through Tilt's port-forward, so signed URLs name that.
  bucket: iki
  endpoint: http://seaweedfs.iki.svc:8333
  publicEndpoint: http://localhost:8333
  credentials:
    existingSecret: seaweedfs-s3
    accessKeyIdKey: access-key
    secretAccessKeyKey: secret-key
database:
  # The app's least-privileged role (iki_app), created by up.sh and managed
  # by CloudNativePG.
  existingSecret: iki-db-runtime
  uriKey: uri
  migrator:
    # The schema owner (iki), created by CloudNativePG for the iki-db cluster.
    existingSecret: iki-db-app
    uriKey: uri
  sslmode: verify-full
  caSecret:
    name: iki-db-ca
    key: ca.crt
otel:
  endpoint: http://otel-lgtm.iki.svc:4318
  resourceAttributes: k8s.cluster.name=kind-iki
web:
  replicas: 1
  # `make web-dev` serves the web app with instant reloads at localhost:5173.
  devServer: true
  podDisruptionBudget:
    enabled: false
networkPolicy:
  enabled: true
  egress:
    database:
      to:
        - podSelector:
            matchLabels: { cnpg.io/cluster: iki-db }
    otel:
      to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: otel-lgtm }
    # Keycloak runs in the cluster, on plain HTTP.
    identityProvider:
      ports: [8080]
      to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: keycloak }
    email:
      ports: [1025]
      to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: mailpit }
    objectStorage:
      ports: [8333]
      to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: seaweedfs }
    webhooks:
      ports: [8080]
      to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: webhook-receiver }
