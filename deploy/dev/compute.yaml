---
# The protein plugin's DSSP (structure-tools): its image is about 1 GB, and a
# structure and DSSP's annotated copy of it share the scratch disk.
apiVersion: iki/v1
kind: ComputeTemplate
name: container-structures
provisioner: k8s_job
capacity: { cpu: 0.25, memory: 1Gi, scratch_disk: 4Gi }
limits: { max_concurrent: 1 }
price: { per_hour: 0.12, currency: USD }
---
apiVersion: iki/v1
kind: EnvironmentBinding
environment: iki/protein.structure-tools
templates: [{ template: container-structures }]
---
# The protein plugin's MAFFT (alignment-tools): its minimum, one thread and
# memory for a few hundred proteins aligned iteratively. A deployment that
# aligns thousands binds a bigger template; MAFFT uses the CPUs it's given.
apiVersion: iki/v1
kind: ComputeTemplate
name: container-alignments
provisioner: k8s_job
capacity: { cpu: 1, memory: 2Gi, scratch_disk: 2Gi }
limits: { max_concurrent: 1 }
price: { per_hour: 0.20, currency: USD }
---
apiVersion: iki/v1
kind: EnvironmentBinding
environment: iki/protein.alignment-tools
templates: [{ template: container-alignments }]
---
# The dna plugin's MAFFT (alignment-tools), on the same template.
apiVersion: iki/v1
kind: EnvironmentBinding
environment: iki/dna.alignment-tools
templates: [{ template: container-alignments }]
---
# The antibody plugin's ANARCI (numbering-tools): on one CPU and in 1 GiB, a
# batch of 500 chains takes about 12 seconds, both passes. The image is 347 MB.
apiVersion: iki/v1
kind: ComputeTemplate
name: container-numbering
provisioner: k8s_job
capacity: { cpu: 1, memory: 1Gi, scratch_disk: 1Gi }
limits: { max_concurrent: 1 }
price: { per_hour: 0.10, currency: USD }
---
apiVersion: iki/v1
kind: EnvironmentBinding
environment: iki/antibody.numbering-tools
templates: [{ template: container-numbering }]
---
# The antibody plugin's ImmuneBuilder (structure-tools): on one CPU, an antibody
# takes about a minute, its peak memory under 2.5 GiB. One CPU, so it fits CI's
# kind cluster beside everything else. The image is 2.7 GB, half of it weights,
# so a node pulls it once.
apiVersion: iki/v1
kind: ComputeTemplate
name: container-antibody-structures
provisioner: k8s_job
capacity: { cpu: 1, memory: 3Gi, scratch_disk: 1Gi }
limits: { max_concurrent: 1 }
price: { per_hour: 0.20, currency: USD }
---
apiVersion: iki/v1
kind: EnvironmentBinding
environment: iki/antibody.structure-tools
templates: [{ template: container-antibody-structures }]
