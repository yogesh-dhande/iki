# The dev cluster's compute: its backend worker pod (backendWorkers in
# values-dev.yaml), sized as the pod is, and on the container tier
# (containerTier), in the iki-runs namespace, a pod for each run and one kept
# warm for actions that ask for a persistent machine. Prices are made up, so
# runs there have costs to show.
apiVersion: iki/v1
kind: ComputeTemplate
name: backend-small
provisioner: backend_pool
capacity: { cpu: 0.25, memory: 2Gi, scratch_disk: 2Gi }
---
apiVersion: iki/v1
kind: EnvironmentBinding
environment: dna.sequence-tools
templates: [{ template: backend-small }]
---
apiVersion: iki/v1
kind: EnvironmentBinding
environment: protein.protein-tools
templates: [{ template: backend-small }]
---
apiVersion: iki/v1
kind: ComputeTemplate
name: container-small
provisioner: k8s_job
capacity: { cpu: 0.25, memory: 256Mi, scratch_disk: 1Gi }
limits: { max_concurrent: 2 }
price: { per_hour: 0.05, currency: USD }
---
apiVersion: iki/v1
kind: ComputeTemplate
name: container-warm
provisioner: k8s_deployment
capacity: { cpu: 0.25, memory: 256Mi, scratch_disk: 1Gi }
limits: { max_concurrent: 2, min_warm: 1, idle_shutdown: 10m }
price: { per_hour: 0.05, currency: USD }
---
apiVersion: iki/v1
kind: EnvironmentBinding
environment: example.tools
templates: [{ template: container-small }, { template: container-warm }]
---
# The protein plugin's DSSP (structure-tools): its image is about 1 GB, and a
# structure and DSSP's annotated copy of it share the scratch disk.
apiVersion: iki/v1
kind: ComputeTemplate
name: container-structures
provisioner: k8s_job
capacity: { cpu: 0.25, memory: 1Gi, scratch_disk: 4Gi }
limits: { max_concurrent: 1 }
price: { per_hour: 0.12, currency: USD }
---
apiVersion: iki/v1
kind: EnvironmentBinding
environment: protein.structure-tools
templates: [{ template: container-structures }]
---
# The plugin template's reference data (ADR 0075): a setup build fills a disk
# from the CSI host-path driver, which is snapshotted; each run pod gets a
# read-only copy of the newest snapshot.
apiVersion: iki/v1
kind: ComputeTemplate
name: container-reference
provisioner: k8s_job
capacity: { cpu: 0.25, memory: 256Mi, scratch_disk: 1Gi }
limits: { max_concurrent: 2 }
price: { per_hour: 0.05, currency: USD }
volumes:
  storage-codes:
    strategy: clone_from_snapshot
    storage_class: csi-hostpath-sc
    snapshot_class: csi-hostpath-snapclass
---
apiVersion: iki/v1
kind: EnvironmentBinding
environment: example.reference
templates: [{ template: container-reference }]
