apiVersion: v1
kind: Service
metadata:
  name: {{ include "iki.fullname" . }}-web
  labels:
    {{- include "iki.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "iki.selectorLabels" (dict "ctx" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
