{{- if .Values.migrate.enabled }}
# Migrates the database to this release's build before any new web pod
# starts, as the migrator (the schema's owner). Rolling back to an older build
# reverses the plugin migrations it lacks, unless that could lose data (ADR
# 0034). The plugins' migrations, what they need beyond migrations (unique,
# lock and rule triggers, HRID sequences, comments, analyst views) and the
# app role's grants are one transaction, so the old pods serving meanwhile
# never write to a table without its guards (ADR 0134). As a Helm hook it runs
# before the release's other resources exist, so it references only Secrets
# that the operator created beforehand. A failed step fails the install,
# upgrade or rollback, and the old pods keep serving.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "iki.fullname" . }}-migrate
  labels:
    {{- include "iki.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "0"
    # Keep the last run for inspection; replace it on the next upgrade.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "iki.labels" . | nindent 8 }}
        {{- include "iki.selectorLabels" (dict "ctx" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "iki.podSecurityContext" . | nindent 8 }}
      initContainers:
        # Waits for Postgres, so a database that is still starting or failing
        # over delays the upgrade instead of failing it.
        - name: wait-for-database
          image: {{ include "iki.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["wait_for_database", "--timeout", {{ .Values.migrate.waitForDatabaseSeconds | quote }}]
          env:
            {{- include "iki.migratorEnv" . | nindent 12 }}
            - name: IKI_DB_POOL
              value: "false"
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          securityContext:
            {{- include "iki.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "iki.volumeMounts" . | nindent 12 }}
      containers:
        # One transaction: plugins' migrations, sync_plugins, then grant_app_privileges.
        - name: migrate
          image: {{ include "iki.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - migrate_deployment
            {{- range .Values.migrate.acknowledgePreflight }}
            - --acknowledge-preflight
            - {{ . | quote }}
            {{- end }}
          env:
            {{- include "iki.migratorEnv" . | nindent 12 }}
            # One short-lived connection is enough for migrations.
            - name: IKI_DB_POOL
              value: "false"
            {{- with .Values.database.analystRole }}
            - name: IKI_DB_ANALYST_ROLE
              value: {{ . | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          securityContext:
            {{- include "iki.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "iki.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "iki.volumes" . | nindent 8 }}
{{- end }}
