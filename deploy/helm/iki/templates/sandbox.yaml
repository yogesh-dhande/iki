{{- if .Values.sandbox.enabled }}
{{- $s := .Values.sandbox }}
# The export sandbox (ADR 0230): web pods and task runners send it an export's
# records, and it runs the plugin's Wasm writer in a fresh child process for each.
# It holds nothing worth taking: no Secrets, no environment, no Kubernetes token,
# no cloud identity, nothing written to disk, and (networkpolicy.yaml) no egress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iki.fullname" . }}-sandbox
  labels:
    {{- include "iki.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
spec:
  replicas: {{ $s.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "iki.selectorLabels" (dict "ctx" . "component" "sandbox") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "iki.labels" . | nindent 8 }}
        {{- include "iki.selectorLabels" (dict "ctx" . "component" "sandbox") | nindent 8 }}
      {{- with $s.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # Its own account, never annotated: no Workload Identity, IRSA or Pod Identity.
      serviceAccountName: {{ include "iki.fullname" . }}-sandbox
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "iki.podSecurityContext" . | nindent 8 }}
      # Readiness drops first, then preStop gives Services time to stop sending
      # exports, then the launcher finishes the ones it has (a one-record export
      # has 10 seconds).
      terminationGracePeriodSeconds: 30
      containers:
        - name: sandbox
          # The deployment's own image, so its writers are the modules its plugins
          # were built with.
          image: {{ include "iki.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/opt/iki/venv/bin/python", "-I", "-m", "iki_spec.writer_sandbox"]
          args:
            - --port
            - "8090"
            - --health-port
            - "8091"
            - --concurrency
            - {{ $s.concurrency | quote }}
          # No env and no envFrom: nothing from the chart's environment, which
          # names the database, the keys and the cloud.
          ports:
            - name: export
              containerPort: 8090
              protocol: TCP
            - name: health
              containerPort: 8091
              protocol: TCP
          startupProbe:
            httpGet: { path: /healthz/live, port: health }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz/live, port: health }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          # Ready once every writer module in the image has loaded and passed its
          # checks, so an image with a bad module doesn't roll out.
          readinessProbe:
            httpGet: { path: /healthz/ready, port: health }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          resources:
            {{- toYaml $s.resources | nindent 12 }}
          securityContext:
            {{- include "iki.containerSecurityContext" . | nindent 12 }}
      # No volumes: it writes nothing.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "iki.selectorLabels" (dict "ctx" . "component" "sandbox") | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "iki.selectorLabels" (dict "ctx" . "component" "sandbox") | nindent 14 }}
      {{- with $s.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $s.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $s.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "iki.fullname" . }}-sandbox
  labels:
    {{- include "iki.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
spec:
  type: ClusterIP
  selector:
    {{- include "iki.selectorLabels" (dict "ctx" . "component" "sandbox") | nindent 4 }}
  ports:
    - name: export
      port: 8090
      targetPort: export
      protocol: TCP
{{- if $s.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "iki.fullname" . }}-sandbox
  labels:
    {{- include "iki.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
spec:
  minAvailable: {{ $s.podDisruptionBudget.minAvailable }}
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "iki.selectorLabels" (dict "ctx" . "component" "sandbox") | nindent 6 }}
{{- end }}
{{- end }}
