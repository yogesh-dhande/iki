apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "iki.fullname" . }}-web
  labels:
    {{- include "iki.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The web pods never talk to the Kubernetes API.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "iki.fullname" . }}-tasks
  labels:
    {{- include "iki.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Task runners never talk to the Kubernetes API.
automountServiceAccountToken: false
{{- if .Values.maintenance.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "iki.fullname" . }}-maintenance
  labels:
    {{- include "iki.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Its own, so a cloud role for it (expiring stored files) is its alone. It never talks
# to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
{{- if .Values.egressProxy.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "iki.fullname" . }}-egress-proxy
  labels:
    {{- include "iki.labels" . | nindent 4 }}
# The egress proxy never talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
