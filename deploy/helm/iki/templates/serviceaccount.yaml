apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "iki.fullname" . }}-web
  labels:
    {{- include "iki.labels" . | nindent 4 }}
# The web pods never talk to the Kubernetes API.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "iki.fullname" . }}-tasks
  labels:
    {{- include "iki.labels" . | nindent 4 }}
# Task runners never talk to the Kubernetes API.
automountServiceAccountToken: false
