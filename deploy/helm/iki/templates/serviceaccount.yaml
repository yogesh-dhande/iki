apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "iki.fullname" . }}-web
  labels:
    {{- include "iki.labels" . | nindent 4 }}
# The web pods never talk to the Kubernetes API.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "iki.fullname" . }}-tasks
  labels:
    {{- include "iki.labels" . | nindent 4 }}
# Task runners never talk to the Kubernetes API.
automountServiceAccountToken: false
{{- if .Values.egressProxy.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "iki.fullname" . }}-egress-proxy
  labels:
    {{- include "iki.labels" . | nindent 4 }}
# The egress proxy never talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
