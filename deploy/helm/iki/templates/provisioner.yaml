{{- $c := .Values.containerTier }}
{{- $v := .Values.vmTier }}
{{- if or $c.enabled $v.enabled }}
{{- $namespaces := list }}
{{- $url := "" }}
{{- $plain := false }}
{{- if $c.enabled }}
{{- $namespaces = include "iki.runNamespaces" . | fromJsonArray }}
{{- $url = $c.serverUrl | default .Values.backendWorkers.serverUrl | default .Values.publicUrl }}
{{- $plain = and $c.allowHttp (not .Values.https) (hasPrefix "http://" $url) }}
{{- if not (or (hasPrefix "https://" $url) $plain) }}
{{- fail "containerTier.serverUrl (or publicUrl) must be an https:// address: run pods send their token to it (http:// needs containerTier.allowHttp and https: false, for development only)" }}
{{- end }}
{{- end }}
{{- $vmUrl := "" }}
{{- if $v.enabled }}
{{- $owner := required "vmTier.owner is required: the name this deployment's machines are tagged with, such as iki-production" $v.owner }}
{{- if not (regexMatch "^[A-Za-z0-9+=._:/@-]{1,128}$" $owner) }}
{{- fail "vmTier.owner must be a name such as iki-production: letters, digits and +=._:/@-" }}
{{- end }}
{{- $vmUrl = $v.serverUrl | default .Values.publicUrl }}
{{- if not (hasPrefix "https://" $vmUrl) }}
{{- fail "vmTier.serverUrl (or publicUrl) must be an https:// address: machines send their token to it" }}
{{- end }}
{{- end }}
# The provisioner (ADRs 0061 and 0074): starts a Kubernetes Job for each queued
# container-tier run, and a cloud machine for each vm-tier one, and tidies up
# after them. One acts at a time (it holds a
# Postgres lock); a second waits, so a rollout never leaves runs without one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iki.fullname" . }}-provisioner
  labels:
    {{- include "iki.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioner
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "iki.selectorLabels" (dict "ctx" . "component" "provisioner") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "iki.labels" . | nindent 8 }}
        {{- include "iki.selectorLabels" (dict "ctx" . "component" "provisioner") | nindent 8 }}
      {{- with $c.provisioner.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "iki.fullname" . }}-provisioner
      # The one Iki pod that talks to the Kubernetes API (its Role allows only
      # Jobs, and creating Secrets, in the runs' namespaces) or the cloud's
      # (as the IAM role vmTier.serviceAccountAnnotations gives it).
      automountServiceAccountToken: true
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "iki.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: provisioner
          image: {{ include "iki.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["provision"]
          env:
            {{- include "iki.env" (dict "ctx" . "service" "iki-provisioner" "poolMaxSize" 4) | nindent 12 }}
            - name: IKI_RUNS_WORKER_IMAGE
              value: {{ include "iki.runsWorkerImage" . | quote }}
            {{- if $c.enabled }}
            - name: IKI_RUNS_SERVER_URL
              value: {{ $url | quote }}
            - name: IKI_RUNS_SERVICE_ACCOUNT
              value: {{ include "iki.fullname" . }}-run
            {{- with $c.imagePullSecrets }}
            - name: IKI_RUNS_IMAGE_PULL_SECRETS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if $plain }}
            - name: IKI_RUNS_ALLOW_HTTP
              value: "1"
            {{- end }}
            {{- end }}
            {{- if $v.enabled }}
            - name: IKI_RUNS_VM_OWNER
              value: {{ $v.owner | quote }}
            - name: IKI_RUNS_VM_SERVER_URL
              value: {{ $vmUrl | quote }}
            {{- with $v.egressProxyUrl }}
            - name: IKI_RUNS_VM_EGRESS_PROXY_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $v.region }}
            # Where the AWS SDK signs in (STS); templates name their own regions.
            - name: AWS_REGION
              value: {{ . | quote }}
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: regional
            {{- end }}
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet: { path: /healthz/live, port: health }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz/live, port: health }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet: { path: /healthz/ready, port: health }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          resources:
            {{- toYaml $c.provisioner.resources | nindent 12 }}
          securityContext:
            {{- include "iki.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "iki.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "iki.volumes" . | nindent 8 }}
      {{- with $c.provisioner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.provisioner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.provisioner.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "iki.fullname" . }}-provisioner
  labels:
    {{- include "iki.labels" . | nindent 4 }}
  {{- with (and $v.enabled $v.serviceAccountAnnotations) }}
  # The IAM role it acts as (EKS IAM roles for service accounts), such as
  # eks.amazonaws.com/role-arn. docs/adr/0074 has the policy it needs.
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- range $namespace := $namespaces }}
---
# What the provisioner may do where runs go: manage Jobs, see their pods and
# label them with the run they're for (for cost tools), and create Secrets (each owned by its Job). It can't read, change or delete
# any Secret, and has nothing in Iki's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "iki.fullname" $ }}-provisioner
  namespace: {{ $namespace }}
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  # Environment setup builds (ADR 0075): a disk for each volume a setup fills, and the
  # snapshot of it that run pods get a read-only copy of.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, get, list, delete]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots]
    verbs: [create, get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "iki.fullname" $ }}-provisioner
  namespace: {{ $namespace }}
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "iki.fullname" $ }}-provisioner
subjects:
  - kind: ServiceAccount
    name: {{ include "iki.fullname" $ }}-provisioner
    namespace: {{ $.Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "iki.fullname" $ }}-run
  namespace: {{ $namespace }}
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
# Run pods never talk to the Kubernetes API.
automountServiceAccountToken: false
{{- if $.Values.networkPolicy.enabled }}
{{- $egress := $.Values.networkPolicy.egress }}
---
# Runs: nothing reaches them, and they reach DNS, the server, object storage
# (through the URLs it signs), the egress proxy, and what egress.workers adds.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" $ }}-runs
  namespace: {{ $namespace }}
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- if $c.serverInCluster }}
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ $.Release.Namespace }} }
          podSelector:
            matchLabels:
              {{- include "iki.selectorLabels" (dict "ctx" $ "component" "web") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 8000 }
    {{- else }}
    {{- $server := concat ($.Values.networkPolicy.ingressFrom | default list) ($egress.server.to | default list) }}
    {{- with $server }}
    - to:
        {{- include "iki.peersFromElsewhere" (dict "peers" . "namespace" $.Release.Namespace) | nindent 8 }}
      ports:
        {{- range $egress.server.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
    {{- end }}
    {{- if and $.Values.files.bucket $egress.objectStorage.to }}
    - to:
        {{- include "iki.peersFromElsewhere" (dict "peers" $egress.objectStorage.to "namespace" $.Release.Namespace) | nindent 8 }}
      ports:
        {{- range $egress.objectStorage.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
    {{- if $.Values.egressProxy.enabled }}
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ $.Release.Namespace }} }
          podSelector:
            matchLabels:
              {{- include "iki.selectorLabels" (dict "ctx" $ "component" "egress-proxy") | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ $.Values.egressProxy.port }} }
    {{- end }}
    {{- with $egress.workers }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
{{- if and .Values.networkPolicy.enabled $c.enabled }}
---
# The provisioner reaches the Kubernetes API, and nothing else Iki pods don't.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" . }}-provisioner-kubernetes-api
  labels:
    {{- include "iki.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iki.selectorLabels" (dict "ctx" . "component" "provisioner") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        {{- toYaml .Values.networkPolicy.egress.kubernetesApi.to | nindent 8 }}
      ports:
        {{- range .Values.networkPolicy.egress.kubernetesApi.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- end }}
{{- if and .Values.networkPolicy.enabled $v.enabled }}
---
# The provisioner reaches AWS's APIs: EC2, STS (for its role) and SSM (for
# images named by parameter).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" . }}-provisioner-cloud-api
  labels:
    {{- include "iki.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iki.selectorLabels" (dict "ctx" . "component" "provisioner") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        {{- toYaml .Values.networkPolicy.egress.cloudApi.to | nindent 8 }}
      ports:
        {{- range .Values.networkPolicy.egress.cloudApi.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- end }}
{{- if and .Values.networkPolicy.enabled $c.enabled $c.serverInCluster }}
---
# Run pods reach the web pods directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" . }}-web-from-runs
  labels:
    {{- include "iki.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iki.selectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $namespaces }}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ . }} }
          podSelector:
            matchLabels: { app.kubernetes.io/component: run }
        {{- end }}
      ports:
        - { protocol: TCP, port: 8000 }
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.egressProxy.enabled $c.enabled }}
---
# Run pods reach the internet only through the egress proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" . }}-egress-proxy-from-runs
  labels:
    {{- include "iki.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iki.selectorLabels" (dict "ctx" . "component" "egress-proxy") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $namespaces }}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ . }} }
          podSelector:
            matchLabels: { app.kubernetes.io/component: run }
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.egressProxy.port }} }
{{- end }}
{{- end }}
