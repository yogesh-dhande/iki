{{- if .Values.networkPolicy.enabled }}
{{- $egress := .Values.networkPolicy.egress }}
# Default deny: Iki pods accept and send nothing except what is listed below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" . }}-default-deny
  labels:
    {{- include "iki.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "iki.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" . }}-egress
  labels:
    {{- include "iki.labels" . | nindent 4 }}
spec:
  # Every Iki pod but workers, which never reach the database.
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [{{ include "iki.name" . }}] }
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ .Release.Name }}] }
      - { key: app.kubernetes.io/component, operator: NotIn, values: [worker] }
  policyTypes: [Egress]
  egress:
    # DNS through the cluster resolver only.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- with $egress.database.to }}
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        {{- range $egress.database.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
    {{- if and .Values.otel.endpoint $egress.otel.to }}
    - to:
        {{- toYaml $egress.otel.to | nindent 8 }}
      ports:
        {{- range $egress.otel.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
{{- with $egress.identityProvider.to }}
---
# Only web pods talk to the identity provider.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" $ }}-web-identity-provider
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iki.selectorLabels" (dict "ctx" $ "component" "web") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        {{- range $egress.identityProvider.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- end }}
{{- if and .Values.files.bucket $egress.objectStorage.to }}
---
# Web pods, task runners, maintenance (which cancels abandoned uploads) and
# workers (through the URLs the server signs) reach object storage. The
# migrate Job doesn't.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" $ }}-object-storage
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [{{ include "iki.name" $ }}] }
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ $.Release.Name }}] }
      - { key: app.kubernetes.io/component, operator: In, values: [web, tasks, maintenance, worker] }
  policyTypes: [Egress]
  egress:
    - to:
        {{- toYaml $egress.objectStorage.to | nindent 8 }}
      ports:
        {{- range $egress.objectStorage.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- end }}
{{- if and .Values.oauth.clientMetadataDocuments $egress.clientMetadataDocuments.to }}
---
# Only web pods fetch apps' Client ID Metadata Documents.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" $ }}-web-client-metadata
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iki.selectorLabels" (dict "ctx" $ "component" "web") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        {{- toYaml $egress.clientMetadataDocuments.to | nindent 8 }}
      ports:
        {{- range $egress.clientMetadataDocuments.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- end }}
{{- if and .Values.tasks.enabled $egress.webhooks.to }}
---
# Task runners send webhooks to their receivers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" $ }}-tasks-webhooks
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iki.selectorLabels" (dict "ctx" $ "component" "tasks") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        {{- toYaml $egress.webhooks.to | nindent 8 }}
      ports:
        {{- range $egress.webhooks.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- end }}
{{- if and .Values.email.existingSecret $egress.email.to }}
---
# Web pods (the Org Admin's test email) and task runners reach the mail server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" $ }}-email
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [{{ include "iki.name" $ }}] }
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ $.Release.Name }}] }
      - { key: app.kubernetes.io/component, operator: In, values: [web, tasks] }
  policyTypes: [Egress]
  egress:
    - to:
        {{- toYaml $egress.email.to | nindent 8 }}
      ports:
        {{- range $egress.email.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- end }}
{{- if .Values.backendWorkers.enabled }}
---
# Workers: DNS, the server, and whatever egress.workers adds. Object storage
# is above; nothing else, and nothing reaches them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" $ }}-worker-egress
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iki.selectorLabels" (dict "ctx" $ "component" "worker") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- $server := concat (.Values.networkPolicy.ingressFrom | default list) ($egress.server.to | default list) }}
    {{- with $server }}
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        {{- range $egress.server.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
    {{- if .Values.egressProxy.enabled }}
    # Runs reach the internet only through the egress proxy.
    - to:
        - podSelector:
            matchLabels:
              {{- include "iki.selectorLabels" (dict "ctx" $ "component" "egress-proxy") | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.egressProxy.port }} }
    {{- end }}
    {{- with $egress.workers }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if .Values.egressProxy.enabled }}
---
# The egress proxy takes connections from workers only, and reaches the
# hosts actions declare (or the upstream proxy) on networkPolicy.egress.egressProxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" $ }}-egress-proxy
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iki.selectorLabels" (dict "ctx" $ "component" "egress-proxy") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "iki.selectorLabels" (dict "ctx" $ "component" "worker") | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.egressProxy.port }} }
  {{- with $egress.egressProxy.to }}
  egress:
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        {{- range $egress.egressProxy.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
{{- with .Values.networkPolicy.ingressFrom }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" $ }}-web-ingress
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iki.selectorLabels" (dict "ctx" $ "component" "web") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - { protocol: TCP, port: 8000 }
{{- end }}
{{- end }}
