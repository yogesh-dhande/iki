{{- if .Values.networkPolicy.enabled }}
{{- $egress := .Values.networkPolicy.egress }}
# Default deny: Iki pods accept and send nothing except what is listed below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" . }}-default-deny
  labels:
    {{- include "iki.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "iki.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" . }}-egress
  labels:
    {{- include "iki.labels" . | nindent 4 }}
spec:
  # Workers, the scanner and the export sandbox have separate policies; workers and
  # the scanner never reach the database, and the sandbox reaches nothing at all.
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [{{ include "iki.name" . }}] }
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ .Release.Name }}] }
      - { key: app.kubernetes.io/component, operator: NotIn, values: [worker, clamd, sandbox] }
  policyTypes: [Egress]
  egress:
    # DNS through the cluster resolver only.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- with $egress.database.to }}
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        {{- range $egress.database.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
    {{- if and .Values.otel.endpoint $egress.otel.to }}
    - to:
        {{- toYaml $egress.otel.to | nindent 8 }}
      ports:
        {{- range $egress.otel.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
{{- if .Values.files.bucket }}
{{- $clam := .Values.files.scanner.clamd }}
{{- $clients := dict "matchLabels" (dict "app.kubernetes.io/name" (include "iki.name" .) "app.kubernetes.io/instance" .Release.Name) "matchExpressions" (list (dict "key" "app.kubernetes.io/component" "operator" "In" "values" (list "web" "tasks"))) }}
{{- if or $clam.enabled $egress.externalScanner }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" . }}-scan-clients
  labels:
    {{- include "iki.labels" . | nindent 4 }}
spec:
  podSelector:
    {{- toYaml $clients | nindent 4 }}
  policyTypes: [Egress]
  egress:
    {{- if $clam.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "iki.selectorLabels" (dict "ctx" . "component" "clamd") | nindent 14 }}
      ports: [{ protocol: TCP, port: {{ $clam.port }} }]
    {{- end }}
    {{- with $egress.externalScanner }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if $clam.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" . }}-clamd
  labels:
    {{- include "iki.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iki.selectorLabels" (dict "ctx" . "component" "clamd") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            {{- toYaml $clients | nindent 12 }}
      ports: [{ protocol: TCP, port: {{ $clam.port }} }]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    {{- with $egress.signatureUpdates.to }}
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        {{- range $egress.signatureUpdates.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- with $egress.identityProvider.to }}
---
# Only web pods talk to the identity provider.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" $ }}-web-identity-provider
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iki.selectorLabels" (dict "ctx" $ "component" "web") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        {{- range $egress.identityProvider.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- end }}
{{- if and .Values.files.bucket $egress.objectStorage.to }}
---
# Web pods, task runners, maintenance (which cancels abandoned uploads) and
# workers (through the URLs the server signs) reach object storage. The
# migrate Job doesn't.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" $ }}-object-storage
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [{{ include "iki.name" $ }}] }
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ $.Release.Name }}] }
      - { key: app.kubernetes.io/component, operator: In, values: [web, tasks, maintenance, worker] }
  policyTypes: [Egress]
  egress:
    - to:
        {{- toYaml $egress.objectStorage.to | nindent 8 }}
      ports:
        {{- range $egress.objectStorage.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- end }}
{{- if $egress.podIdentity.to }}
---
# Pods with an AWS role reach the node's EKS Pod Identity agent for its
# credentials. Workers, runs and the migrate Job have no role, so don't.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" $ }}-pod-identity
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [{{ include "iki.name" $ }}] }
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ $.Release.Name }}] }
      - { key: app.kubernetes.io/component, operator: In, values: [web, tasks, maintenance{{ if $.Values.vmTier.enabled }}, provisioner{{ end }}] }
  policyTypes: [Egress]
  egress:
    - to:
        {{- toYaml $egress.podIdentity.to | nindent 8 }}
      ports:
        {{- range $egress.podIdentity.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- end }}
{{- if and .Values.oauth.clientMetadataDocuments $egress.clientMetadataDocuments.to }}
---
# Only web pods fetch apps' Client ID Metadata Documents.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" $ }}-web-client-metadata
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iki.selectorLabels" (dict "ctx" $ "component" "web") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        {{- toYaml $egress.clientMetadataDocuments.to | nindent 8 }}
      ports:
        {{- range $egress.clientMetadataDocuments.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- end }}
{{- if and .Values.tasks.enabled $egress.webhooks.to }}
---
# Task runners send webhooks to their receivers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" $ }}-tasks-webhooks
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iki.selectorLabels" (dict "ctx" $ "component" "tasks") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        {{- toYaml $egress.webhooks.to | nindent 8 }}
      ports:
        {{- range $egress.webhooks.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- end }}
{{- if and .Values.email.existingSecret $egress.email.to }}
---
# Web pods (the Org Admin's test email) and task runners reach the mail server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" $ }}-email
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [{{ include "iki.name" $ }}] }
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ $.Release.Name }}] }
      - { key: app.kubernetes.io/component, operator: In, values: [web, tasks] }
  policyTypes: [Egress]
  egress:
    - to:
        {{- toYaml $egress.email.to | nindent 8 }}
      ports:
        {{- range $egress.email.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- end }}
{{- if .Values.sandbox.enabled }}
---
# The export sandbox runs plugins' writers (ADR 0230). Only web pods and task runners
# reach it, on its export port, and it reaches nothing: not the database, not DNS, not
# the Kubernetes API or a metadata service. No other policy here selects it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" $ }}-sandbox
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iki.selectorLabels" (dict "ctx" $ "component" "sandbox") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "iki.selectorLabels" (dict "ctx" $ "component" "web") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "iki.selectorLabels" (dict "ctx" $ "component" "tasks") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 8090 }
  egress: []
---
# Web pods and task runners send exports to the sandbox.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" $ }}-sandbox-clients
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [{{ include "iki.name" $ }}] }
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ $.Release.Name }}] }
      - { key: app.kubernetes.io/component, operator: In, values: [web, tasks] }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "iki.selectorLabels" (dict "ctx" $ "component" "sandbox") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 8090 }
{{- end }}
{{- include "iki.checkWorkerEgress" . }}
{{- if .Values.backendWorkers.enabled }}
---
# Workers: DNS, the server, the egress proxy, and whatever egress.workers adds.
# Object storage is above; nothing else, and nothing reaches them (ADR 0155).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" $ }}-worker-egress
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iki.selectorLabels" (dict "ctx" $ "component" "worker") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- with include "iki.serverPeers" . | fromJsonArray }}
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        {{- range $egress.server.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
    {{- if .Values.egressProxy.enabled }}
    # Runs reach the internet only through the egress proxy.
    - to:
        - podSelector:
            matchLabels:
              {{- include "iki.selectorLabels" (dict "ctx" $ "component" "egress-proxy") | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.egressProxy.port }} }
    {{- end }}
    {{- with $egress.workers }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if .Values.egressProxy.enabled }}
---
# The egress proxy takes connections from workers only, and reaches the
# hosts actions declare (or the upstream proxy) on networkPolicy.egress.egressProxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" $ }}-egress-proxy
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iki.selectorLabels" (dict "ctx" $ "component" "egress-proxy") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "iki.selectorLabels" (dict "ctx" $ "component" "worker") | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.egressProxy.port }} }
  {{- with $egress.egressProxy.to }}
  egress:
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        {{- range $egress.egressProxy.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
{{- with .Values.networkPolicy.ingressFrom }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iki.fullname" $ }}-web-ingress
  labels:
    {{- include "iki.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iki.selectorLabels" (dict "ctx" $ "component" "web") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - { protocol: TCP, port: 8000 }
{{- end }}
{{- end }}
