{{- if .Values.tasks.enabled }}
# Runs background tasks (email, webhooks, ...) from the Postgres queue.
# Runners share the queue safely, so this scales out with replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iki.fullname" . }}-tasks
  labels:
    {{- include "iki.labels" . | nindent 4 }}
    app.kubernetes.io/component: tasks
spec:
  replicas: {{ .Values.tasks.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "iki.selectorLabels" (dict "ctx" . "component" "tasks") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "iki.labels" . | nindent 8 }}
        {{- include "iki.selectorLabels" (dict "ctx" . "component" "tasks") | nindent 8 }}
      {{- with .Values.tasks.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "iki.fullname" . }}-tasks
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "iki.podSecurityContext" . | nindent 8 }}
      # Running tasks get graceSeconds to finish; any still running are
      # retried by another runner once their lease runs out.
      terminationGracePeriodSeconds: {{ add .Values.tasks.graceSeconds 15 }}
      containers:
        - name: tasks
          image: {{ include "iki.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["tasks"]
          env:
            # One database connection per task thread, plus housekeeping and probes.
            {{- include "iki.env" (dict "ctx" . "service" "iki-tasks" "poolMaxSize" (add .Values.tasks.concurrency 2)) | nindent 12 }}
            - name: IKI_TASKS_CONCURRENCY
              value: {{ .Values.tasks.concurrency | quote }}
            - name: IKI_TASKS_GRACE_SECONDS
              value: {{ .Values.tasks.graceSeconds | quote }}
          ports:
            - name: health
              containerPort: 8001
              protocol: TCP
          startupProbe:
            httpGet: { path: /healthz/live, port: health }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz/live, port: health }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet: { path: /healthz/ready, port: health }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          resources:
            {{- toYaml .Values.tasks.resources | nindent 12 }}
          securityContext:
            {{- include "iki.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "iki.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "iki.volumes" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "iki.selectorLabels" (dict "ctx" . "component" "tasks") | nindent 14 }}
      {{- with .Values.tasks.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tasks.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tasks.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
