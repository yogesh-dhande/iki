# Helm values for staging (see the chart's values.yaml). Argo CD or Flux
# applies the chart with this file and image.yaml.
environment: staging
publicUrl: https://iki.staging.acme.example
allowedHosts: ["iki.staging.acme.example"]
secretKey:
  existingSecret: iki-secret-key
encryptionKeys:
  existingSecret: iki-encryption-keys
database:
  existingSecret: iki-db-app
  migrator:
    existingSecret: iki-db-owner
# Backend workers run plugins' actions. Turn them on once a Compute admin has
# made a backend-tier registration token (Compute settings) and you've stored
# it in this Secret, under the key "token". Their image is in image.yaml.
# backendWorkers:
#   enabled: true
#   registrationToken:
#     existingSecret: iki-worker-registration
# Container-tier runs (ADR 0061, 0062) get pods in a namespace of their own:
# create it, labelled to enforce PodSecurity "restricted" and for Sigstore's
# policy-controller (policy.sigstore.dev/include: "true"), then turn them on.
# The cluster then admits only images Iki or this repository's build signed
# there (ADR 0063); image.yaml says where its signatures are.
# containerTier:
#   enabled: true
#   namespace: iki-runs
#   imagePolicy:
#     enabled: true
