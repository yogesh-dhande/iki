# Written by CI (.github/workflows/build.yml) when it builds production's images.
# Merge its pull request to deploy them.
image:
  repository: ghcr.io/acme/iki-production
  digest: ""
backendWorkers:
  image:
    repository: ghcr.io/acme/iki-production-worker
    digest: ""
containerTier:
  imagePolicy:
    approvals:
      repository: ghcr.io/acme/iki-production-approvals
      subject: "https://github.com/acme/iki-config/.github/workflows/build.yml@refs/heads/main"
