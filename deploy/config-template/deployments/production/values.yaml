# Helm values for production (see the chart's values.yaml). Argo CD or Flux
# applies the chart with this file and image.yaml.
environment: production
publicUrl: https://iki.acme.example
allowedHosts: ["iki.acme.example"]
secretKey:
  existingSecret: iki-secret-key
encryptionKeys:
  existingSecret: iki-encryption-keys
# Signs the bundles this deployment exports (ADR 0096): `iki-server bundle_key`
# makes the key, under "key".
bundles:
  signingKey:
    existingSecret: iki-bundle-key
  # Staging's public key (`iki-server bundle_key --public` there), so
  # production imports the bundles staging exports, and only those.
  # trusted:
  #   staging: ["ed25519:..."]
# Where builds can't reach github.com, they fetch Iki's own plugins (iki/...)
# from mirrors of Iki's repository (ADR 0114). The build reads them here, and
# the server refuses plugins fetched from any other. The lockfile still names
# Iki's repository. Give CI read access to them as to your plugins'.
# plugins:
#   mirrors: ["https://git.acme.example/mirrors/iki.git"]
database:
  existingSecret: iki-db-app
  migrator:
    existingSecret: iki-db-owner
web:
  replicas: 3
# Backend workers run plugins' actions. Turn them on once a Compute admin has
# made a backend-tier registration token (Compute settings) and you've stored
# it in this Secret, under the key "token". Their image is in image.yaml.
# They reach the server only where networkPolicy.egress.server.to says: your
# load balancer's own addresses, or your ingress controller's pods
# (ADR 0155). With files, list your object storage's addresses in
# networkPolicy.egress.objectStorage.to too.
# backendWorkers:
#   enabled: true
#   registrationToken:
#     existingSecret: iki-worker-registration
# networkPolicy:
#   egress:
#     server:
#       to:
#         - ipBlock: { cidr: 203.0.113.10/32 }
# Container-tier runs (ADR 0061, 0062) get pods in a namespace of their own:
# create it, labelled to enforce PodSecurity "restricted" and for Sigstore's
# policy-controller (policy.sigstore.dev/include: "true"), then turn them on.
# The cluster then admits only images Iki or this repository's build signed
# there (ADR 0063); image.yaml says where its signatures are.
# containerTier:
#   enabled: true
#   namespace: iki-runs
#   imagePolicy:
#     enabled: true
