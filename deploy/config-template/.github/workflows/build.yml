name: Build

# For each deployment (deployments/<name>):
# - on every pull request, builds and checks its plugins with `iki deploy build`;
# - on main, also builds its images (Iki's server image plus the plugins,
#   and Iki's worker image plus the plugins and their environments), signs
#   them, attests their provenance, and opens a pull request that points the
#   deployment's image.yaml at them. Merging that pull request deploys them.
# - on main, also approves the images container-tier runs use (the plugins'
#   environments'), by signing each: the cluster admits only images Iki or
#   this workflow signed in the runs' namespace (ADR 0063).
#
# Secrets:
# - PLUGIN_REPOS_TOKEN: read-only access to the plugin repositories the
#   lockfiles name (a fine-grained token, or a GitHub App's).

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["deployments/*/image.yaml"]

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.deployment }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        deployment: [staging, production]
    permissions:
      contents: read
      packages: write # push the images (main only)
      id-token: write # sign it without keys (main only)
      attestations: write # store its provenance (main only)
    env:
      NAME: ${{ matrix.deployment }}
      DEPLOYMENT: deployments/${{ matrix.deployment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Read the Iki release
        id: iki
        run: |
          {
            echo "version=$(yq -r .version "$DEPLOYMENT/iki.yaml")"
            echo "server=$(yq -r .serverImage "$DEPLOYMENT/iki.yaml")"
            echo "worker=$(yq -r .workerImage "$DEPLOYMENT/iki.yaml")"
          } >> "$GITHUB_OUTPUT"
      - name: Let git read the plugin repositories
        env:
          # Every pull request's build needs it; it only reads the plugins.
          TOKEN: ${{ secrets.PLUGIN_REPOS_TOKEN }} # zizmor: ignore[secrets-outside-env]
        run: |
          # git runs the helper, so $TOKEN expands then, not here.
          # shellcheck disable=SC2016
          git config --global credential.helper \
            '!f() { echo username=x-access-token; echo "password=$TOKEN"; }; f'
      - name: Build and check the plugins
        env:
          VERSION: ${{ steps.iki.outputs.version }}
        run: |
          uvx --from "iki-cli==$VERSION" iki deploy build "$DEPLOYMENT" \
            --output build/server/plugins --workers build/worker --images build/images.txt

      - if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Check Iki's signatures on the server and worker images
        if: github.ref == 'refs/heads/main'
        env:
          SERVER: ${{ steps.iki.outputs.server }}
          WORKER: ${{ steps.iki.outputs.worker }}
        run: |
          for image in "$SERVER" "$WORKER"; do
            cosign verify "$image" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp '^https://github.com/yogesh-dhande/iki/\.github/workflows/publish\.yml@refs/tags/v'
          done
      - if: github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the images
        if: github.ref == 'refs/heads/main'
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "image=ghcr.io/${OWNER,,}/iki-$NAME"
            echo "worker=ghcr.io/${OWNER,,}/iki-$NAME-worker"
            echo "approvals=ghcr.io/${OWNER,,}/iki-$NAME-approvals"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push the server image
        if: github.ref == 'refs/heads/main'
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build/server
          file: plugins.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: IKI_SERVER_IMAGE=${{ steps.iki.outputs.server }}
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: true
          provenance: false
          sbom: false
      # The worker image's environments are built here, from the packages the
      # lockfiles pin by hash. For a package mirror, add a UV_INDEX_URL secret
      # and pass it with `secrets: uv_index=...`: never as a build argument.
      - name: Build and push the worker image
        if: github.ref == 'refs/heads/main'
        id: worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build/worker
          file: worker.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: IKI_WORKER_IMAGE=${{ steps.iki.outputs.worker }}
          tags: ${{ steps.name.outputs.worker }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: true
          provenance: false
          sbom: false
      - name: Sign the images
        if: github.ref == 'refs/heads/main'
        env:
          SERVER: ${{ steps.name.outputs.image }}@${{ steps.image.outputs.digest }}
          WORKER: ${{ steps.name.outputs.worker }}@${{ steps.worker.outputs.digest }}
        run: cosign sign --yes "$SERVER" "$WORKER"
      # The plugins' environments' images live in registries this repository
      # can't write to (Docker Hub, a vendor's), so their signatures go to a
      # package of its own, where the cluster's admission policy looks. A
      # private registry's images need a docker/login-action step before this.
      - name: Approve the images runs use
        if: github.ref == 'refs/heads/main'
        env:
          COSIGN_REPOSITORY: ${{ steps.name.outputs.approvals }}
        run: |
          while read -r image; do
            cosign sign --yes "$image"
          done < build/images.txt
      - if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.worker }}
          subject-digest: ${{ steps.worker.outputs.digest }}
          push-to-registry: true
      - name: Keep the images' details for the pull request
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          WORKER: ${{ steps.name.outputs.worker }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          APPROVALS: ${{ steps.name.outputs.approvals }}
          SERVER_URL: ${{ github.server_url }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          mkdir -p out
          printf '%s\n' \
            "# Written by CI (.github/workflows/build.yml) when it builds $NAME's images." \
            "# Merge its pull request to deploy them." \
            "image:" \
            "  repository: $IMAGE" \
            "  digest: \"$DIGEST\"" \
            "backendWorkers:" \
            "  image:" \
            "    repository: $WORKER" \
            "    digest: \"$WORKER_DIGEST\"" \
            "containerTier:" \
            "  imagePolicy:" \
            "    approvals:" \
            "      repository: $APPROVALS" \
            "      subject: \"$SERVER_URL/$WORKFLOW_REF\"" > out/image.yaml
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.deployment }}
          path: out/image.yaml

  propose:
    name: Propose deploying ${{ matrix.deployment }}
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        deployment: [staging, production]
    permissions:
      contents: write # push the pull request's branch
      pull-requests: write # open it
    steps:
      # Keeps its credentials to push the branch; this job uploads nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.deployment }}
          path: out
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT: ${{ matrix.deployment }}
        run: |
          cp out/image.yaml "deployments/$DEPLOYMENT/image.yaml"
          if git diff --quiet; then exit 0; fi
          branch="deploy/$DEPLOYMENT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git commit -qam "Deploy $DEPLOYMENT's images built from ${GITHUB_SHA::12}"
          git push --force origin "$branch"
          gh pr create --head "$branch" --title "Deploy $DEPLOYMENT" \
            --body "Points $DEPLOYMENT at the images built from $GITHUB_SHA, signed and attested." \
            || gh pr edit "$branch" --body "Points $DEPLOYMENT at the images built from $GITHUB_SHA, signed and attested."
