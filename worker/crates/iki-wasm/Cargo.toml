[package]
name = "iki-wasm"
description = "Parsers for Iki's web app, compiled to WebAssembly and run in a Web Worker: FASTA, the layout of an alignment, and apps' expressions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
# cdylib for the browser's module; rlib for its tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Apps' expressions (ADR 0090) and rules (step 58): Google's Common Expression Language,
# with its times and durations (chrono), which rules compare. Without its regex and
# encoder extras, which the module doesn't offer.
cel = { version = "=0.16.0", default-features = false, features = ["json", "chrono"] }
# cel's times bring chrono-tz's IANA database (about 1 MB of the module), for getters'
# time zones, which rules don't take: their times are UTC. Its filter keeps the zones
# CHRONO_TZ_TIMEZONE_FILTER names when the module is built (UTC alone); unset, all.
chrono-tz = { version = "0.10", default-features = false, features = ["filter-by-regex"] }

# The workspace's lints, except that the module's exports need `no_mangle`, which the
# unsafe_code lint counts. They're allowed in `exports` alone; there are no unsafe blocks.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
dbg_macro = "deny"
print_stdout = "warn"
todo = "deny"
