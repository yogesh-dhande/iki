[package]
name = "iki-writer"
description = "Write an Iki plugin's export format in Rust: the WebAssembly ABI an Iki writer module exports, as a trait with typed records."
# Nothing here is inherited from the worker workspace, unlike its other crates. A writer
# crate gets this one through a path patch (build-writer.sh), from wherever the SDK sits:
# in this checkout, or copied alone into the plugin image's builder stage, where there is
# no worker/Cargo.toml above it to inherit from. Keep these in step with the workspace's.
version = "0.1.0-dev.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
authors = ["The Iki Authors"]
repository = "https://github.com/yogesh-dhande/iki"
homepage = "https://ikisci.org"
documentation = "https://docs.rs/iki-writer"
readme = "README.md"
keywords = ["iki", "wasm", "export", "plugin", "lims"]
categories = ["wasm", "encoding", "science"]
# What a published crate carries: the SDK, its build script and its documentation.
include = ["src/**/*.rs", "build-writer.sh", "README.md", "Cargo.toml"]

# A writer's build puts the SDK inside the writer's workspace (build-writer.sh), where it
# is a member, so Cargo resolves its dev-dependencies too, and each writer's Cargo.lock
# would need them. It has none: its tests need nothing more than these.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# The workspace's lints, except that the exports `writer!` generates need `no_mangle`,
# which the unsafe_code lint counts. The macro allows it on them alone; there are no
# unsafe blocks.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
dbg_macro = "deny"
print_stdout = "warn"
todo = "deny"
