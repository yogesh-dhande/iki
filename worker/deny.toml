# cargo-deny policy for the Rust workspace. Run with `make check-deps`.

[graph]
all-features = true
# The platforms iki-worker is built for. Dependencies only other targets use (such as
# wasm32's bundled root certificates) aren't shipped, so they aren't judged. iki-wasm,
# the web app's parsers, is built for wasm32 too, but it's also a library on these, so
# its dependencies (serde and serde_json alone) are judged here.
targets = [
  "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin", "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
]

[advisories]
# Fail on any RustSec advisory: vulnerabilities, unmaintained or yanked crates.
version = 2
yanked = "deny"
# chrono and chrono-tz are flagged unmaintained, with no fix to take: cel (rules' CEL,
# ADR 0127) does timestamps and durations only through them. Revisit with each cel
# release, and when osv-scanner.toml's matching ignores expire.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, not a vulnerability: cel's only time backend, for rules' dates and times (ADR 0127), run in iki-wasm, a WebAssembly module with no imports. Remove when cel moves to jiff or time." },
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained, not a vulnerability: cel's only time backend, for rules' dates and times (ADR 0127), run in iki-wasm, a WebAssembly module with no imports. Remove when cel moves to jiff or time." },
  { id = "RUSTSEC-2026-0559", reason = "chrono-tz-build, chrono-tz's build-time zone filter: unmaintained, not a vulnerability: cel's only time backend, for rules' dates and times (ADR 0127), run in iki-wasm, a WebAssembly module with no imports. Remove when cel moves to jiff or time." },
]

[licenses]
version = 2
# Keep in sync with scripts/supply-chain/allowed-licenses.txt.
allow = [
  "0BSD", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MIT", "MIT-0",
  "MPL-2.0", "Unicode-3.0", "Unlicense", "Zlib",
]
confidence-threshold = 0.9
# The allowlist is shared with the other ecosystems; not every entry is used yet.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Crates may only come from crates.io: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
