[workspace]
resolver = "3"
members = ["crates/iki-protocol", "crates/iki-worker"]

[workspace.package]
version = "0.1.0-dev.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
authors = ["The Iki Authors"]
repository = "https://github.com/yogesh-dhande/iki"
homepage = "https://ikisci.org"

[workspace.dependencies]
iki-protocol = { path = "crates/iki-protocol", version = "=0.1.0-dev.0" }
# SHA-256 of files staged and uploaded, as the server checks them.
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Signals sent to a whole process group, without unsafe code.
rustix = { version = "1.1.6", features = ["process", "system"] }
signal-hook = "0.4.6"
# HTTPS with rustls (ring for its cryptography). Certificates are checked against the
# OS's trust store only, so a corporate proxy's CA works once IT has installed it, as it
# does for browsers, and no bundled root list goes stale.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls-no-provider", "platform-verifier", "json"] }
# Plugin bundles from the server (ADR 0059): gzipped tars, unpacked by hand so only
# regular files land, in pure Rust.
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4.46", default-features = false }
# Checking a release's Sigstore signature before updating to it (ADR 0060), offline,
# against the trusted root it embeds: nothing to fetch, so it works air-gapped.
sigstore-verify = { version = "=0.15.1", default-features = false, features = ["aws-lc-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
dbg_macro = "deny"
print_stdout = "warn"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
