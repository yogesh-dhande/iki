[workspace]
resolver = "3"
members = ["crates/iki-protocol", "crates/iki-worker"]

[workspace.package]
version = "0.1.0-dev.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
authors = ["The Iki Authors"]
repository = "https://github.com/ikisci/iki"
homepage = "https://ikisci.org"

[workspace.dependencies]
iki-protocol = { path = "crates/iki-protocol", version = "=0.1.0-dev.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
dbg_macro = "deny"
print_stdout = "warn"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
