<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design tokens · Iki UI</title>
    <link rel="stylesheet" href="../dist/tokens.css" />
    <link rel="stylesheet" href="../dist/fonts.css" />
    <style>
      html {
        font: 81.25%/1.45 var(--font);
        color: var(--text);
        background: var(--bg);
      }
      main {
        max-width: 38rem;
        padding: 1rem;
      }
      h1 {
        font-size: var(--text-xl);
      }
      dt {
        margin-top: 1rem;
        font-weight: 600;
      }
      dd {
        border-radius: var(--radius-sm);
        padding: 0.5rem;
        margin: 0;
      }
      .surface {
        color: var(--muted);
        background: var(--surface-2);
      }
      .success {
        color: var(--success);
        background: var(--success-bg);
      }
      .warning {
        color: var(--warning);
        background: var(--warning-bg);
      }
      .error {
        color: var(--error);
        background: var(--error-bg);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Design tokens</h1>
      <p>
        These examples follow the device’s light or dark theme and use the self-hosted Inter font.
      </p>
      <dl>
        <dt>Secondary surface</dt>
        <dd class="surface">Changes since the last revision</dd>
        <dt>Success</dt>
        <dd class="success">Saved</dd>
        <dt>Warning</dt>
        <dd class="warning">Review pending</dd>
        <dt>Error</dt>
        <dd class="error">A required field is empty</dd>
      </dl>
    </main>
  </body>
</html>
