# yaml-language-server: $schema=https://ikisci.org/schemas/manifest/v1
#
# An action that reads reference data: the `reference` environment's volume,
# which its setup fills. Its runs wait until a setup build has made a version.
apiVersion: iki/v1
kind: Action
name: decode_storage
label: Decode storage codes
description: Writes a sample's storage location in full from the lab's code for it, such as "-80 °C freezer" for "-80".
inputs:
  sample: { type: Sample, schema: ">=1" }
effects:
  updates: [{ input: sample, fields: [storage] }]
runs_on: { tier: container, environment: reference }
command: [python, ./scripts/decode.py]
deterministic: true
batchable: 50
timeout: 5m
