apiVersion: iki/v1
kind: ActionTest
name: default_storage
description: Assign the default location to a new sample.
action: assign_storage
inputs:
  sample: [{ values: { name: Reference vial } }]
expect:
  output:
    updates:
      sample: [{ values: { storage: "-80 °C freezer" } }]
---
apiVersion: iki/v1
kind: ActionTest
name: chosen_storage
description: Use the lab's chosen location when one is supplied.
action: assign_storage
params: { location: Cold room }
inputs:
  sample: [{ values: { name: Reference vial } }]
expect:
  output:
    updates:
      sample: [{ values: { storage: Cold room } }]
---
apiVersion: iki/v1
kind: ActionTest
name: existing_storage
description: Keep the location already recorded.
action: assign_storage
inputs:
  sample: [{ values: { name: Reference vial, storage: Cold room } }]
expect:
  output:
    updates:
      sample: []
