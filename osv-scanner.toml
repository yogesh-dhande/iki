# --- License exceptions --------------------------------------------------------
# psycopg (LGPL-3.0) is the PostgreSQL driver Django supports; there is no
# non-LGPL alternative. Iki uses it unmodified as a dynamically imported
# library, which LGPL permits in Apache-2.0 software, and images ship its
# license text. This exception covers psycopg alone, not LGPL in general.

[[PackageOverrides]]
name = "psycopg"
ecosystem = "PyPI"
license.ignore = true

[[PackageOverrides]]
name = "psycopg-binary"
ecosystem = "PyPI"
license.ignore = true

[[PackageOverrides]]
name = "psycopg-c"
ecosystem = "PyPI"
license.ignore = true

[[PackageOverrides]]
name = "psycopg-pool"
ecosystem = "PyPI"
license.ignore = true

# jwcrypto (LGPL-3.0-or-later) is a required dependency of
# django-oauth-toolkit, which imports it unconditionally for OpenID Connect
# and JWT support (Iki turns neither on). As with psycopg, Iki uses it
# unmodified as a dynamically imported library and images ship its license
# text. This exception covers jwcrypto alone.

[[PackageOverrides]]
name = "jwcrypto"
ecosystem = "PyPI"
license.ignore = true

# Data packages used only by development tools. They are never bundled into
# the web app or installed in an image, so nothing under these licenses ships.
# Each exception covers that package alone, not the license in general.
#
# - caniuse-lite (CC-BY-4.0): browser-support data that browserslist reads
#   for Babel, which ESLint's React hooks plugin uses. CC-BY needs attribution
#   only if the data is redistributed, and Iki doesn't redistribute it.
# - language-subtag-registry (CC0-1.0, public domain): the IANA language tags
#   that eslint-plugin-jsx-a11y uses to check `lang` attributes.
# - mdn-data (CC0-1.0, public domain): CSS definitions that css-tree reads
#   inside jsdom, which runs the web app's unit tests.

[[PackageOverrides]]
name = "caniuse-lite"
ecosystem = "npm"
license.ignore = true

[[PackageOverrides]]
name = "language-subtag-registry"
ecosystem = "npm"
license.ignore = true

[[PackageOverrides]]
name = "mdn-data"
ecosystem = "npm"
license.ignore = true

# webpki-root-certs (CDLA-Permissive-2.0, Mozilla's root certificates as data) is
# locked only because rustls-platform-verifier uses it on wasm32, which iki-worker is
# never built for. Nothing under this license ships: on every platform Iki builds for,
# the worker trusts the operating system's certificates (worker/deny.toml's targets).

[[PackageOverrides]]
name = "webpki-root-certs"
ecosystem = "crates.io"
license.ignore = true
