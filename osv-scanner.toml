# --- License corrections -----------------------------------------------------
# deps.dev reports these with missing or non-SPDX license data; the values
# below are taken from each project's LICENSE file.

[[PackageOverrides]]
name = "colorama"
ecosystem = "PyPI"
license.override = ["BSD-3-Clause"]

[[PackageOverrides]]
name = "sqlparse"
ecosystem = "PyPI"
license.override = ["BSD-3-Clause"]

[[PackageOverrides]]
# The antibody plugin's numbering: its wheel's LICENCE is BSD-3-Clause (OPIG), with
# MUSCLE's public-domain notice. Its germlines are IMGT's, which are CC BY 4.0.
name = "anarci"
ecosystem = "PyPI"
license.override = ["BSD-3-Clause"]

# The antibody plugin's structure-tools image (images/structure-tools/uv.lock),
# each checked against its wheel's metadata and licence files.
[[PackageOverrides]]
# BSD-3-Clause: its LICENSE.txt, and its classifier says BSD.
name = "jinja2"
ecosystem = "PyPI"
license.override = ["BSD-3-Clause"]

[[PackageOverrides]]
# BSD-3-Clause: its LICENSE.txt; the libraries its wheels bundle are listed there.
name = "scipy"
ecosystem = "PyPI"
license.override = ["BSD-3-Clause"]

[[PackageOverrides]]
# BSD-3-Clause ("New BSD"): its LICENSE.
name = "sympy"
ecosystem = "PyPI"
license.override = ["BSD-3-Clause"]

[[PackageOverrides]]
# PyTorch's CPU build, from PyTorch's index, which osv-scanner has no licence for. Its
# PyPI release declares "Apache-2.0 AND Apache-2.0 WITH LLVM-exception AND BSD-2-Clause
# AND BSD-3-Clause AND BSL-1.0 AND ISC AND MIT AND Zlib": the LLVM exception only adds
# permissions to Apache-2.0.
name = "torch"
ecosystem = "PyPI"
license.override = ["Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "ISC", "MIT", "Zlib"]

[[PackageOverrides]]
# Windows-only transitive dependency of the Docker SDK used by tests.
name = "pywin32"
ecosystem = "PyPI"
license.override = ["PSF-2.0"]

# The AWS SDK, for object storage: Apache-2.0 (LICENSE in each repository).
# wasmtime is Apache-2.0 WITH LLVM-exception: Apache-2.0, plus an exception that only
# grants more (code compiled with it needn't carry Apache's attribution). The scanner
# takes license IDs, not expressions, so it's matched to Apache-2.0 here, for wasmtime
# alone.
[[PackageOverrides]]
name = "wasmtime"
ecosystem = "PyPI"
license.override = ["Apache-2.0"]

[[PackageOverrides]]
name = "boto3"
ecosystem = "PyPI"
license.override = ["Apache-2.0"]

[[PackageOverrides]]
name = "botocore"
ecosystem = "PyPI"
license.override = ["Apache-2.0"]

# botocore's date parsing: dual-licensed, Apache-2.0 and BSD-3-Clause (its LICENSE).
[[PackageOverrides]]
name = "python-dateutil"
ecosystem = "PyPI"
license.override = ["Apache-2.0", "BSD-3-Clause"]

# google-auth's ASN.1 modules (Cloud Storage's and Compute Engine's clients, ADR 0109):
