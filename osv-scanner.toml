# OSV-Scanner configuration: vulnerability exceptions and license corrections.
# Run with `make check-deps`. Every exception states why it is safe and when
# it expires; an expired ignore fails CI again.

# --- Vulnerability exceptions -------------------------------------------------

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-15T00:00:00Z
reason = """minimatch (DoS via glob-pattern amplification) is pulled in only by ESLint, \
a development tool, and only ever sees glob patterns from our own lint config, so the \
attack isn't reachable. The fix is minimatch 11, which ESLint's config-array doesn't \
accept yet. Remove this once ESLint moves to minimatch 11."""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0592"
ignoreUntil = 2026-11-25T00:00:00Z
reason = """url 2.5.8: a stack overflow in Url::origin() on nested blob: URLs. iki-worker \
reaches url only through ureq and its cookie store, and talks only to the server it's \
configured with and the addresses that server gives it, never a blob: URL from outside, so \
the overflow isn't reachable. The fix, url 2.5.9, was released on 2026-11-20 and is under \
the three-day minimum age until 2026-11-23. Remove this and take 2.5.9 then."""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0594"
ignoreUntil = 2026-11-28T00:00:00Z
reason = """cookie 0.18.2: private cookies sealed with AES-256-GCM can repeat a nonce across \
a fork, because the nonce came from rand's thread_rng. iki-worker doesn't build the crate at \
all: it sits in worker/Cargo.lock without being in the dependency graph for any target \
(`cargo tree -i cookie --target all` prints nothing), and the flaw needs fork() without exec \
plus PrivateJar::add on the forking thread, neither of which the worker does. The fix, cookie \
0.18.3, was released on 2026-11-23, the day of the advisory, and is under the three-day \
minimum age until 2026-11-26. Remove this and take 0.18.3 then."""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
ignoreUntil = 2027-02-18T00:00:00Z
reason = """chrono: an unmaintained-crate advisory, not a vulnerability, with no fixed \
version. It's cel's only time backend, for plugins' rules' dates and times (ADR 0127), and \
runs in iki-wasm, a WebAssembly module with no imports: it reaches no files, network or \
host. worker/deny.toml ignores it too. Remove both once cel moves to jiff or time."""

