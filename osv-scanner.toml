# --- License exceptions --------------------------------------------------------
# psycopg (LGPL-3.0) is the PostgreSQL driver Django supports; there is no
# non-LGPL alternative. Iki uses it unmodified as a dynamically imported
# library, which LGPL permits in Apache-2.0 software, and images ship its
# license text. This exception covers psycopg alone, not LGPL in general.

[[PackageOverrides]]
name = "psycopg"
ecosystem = "PyPI"
license.ignore = true

[[PackageOverrides]]
name = "psycopg-binary"
ecosystem = "PyPI"
license.ignore = true

[[PackageOverrides]]
name = "psycopg-c"
ecosystem = "PyPI"
license.ignore = true

[[PackageOverrides]]
name = "psycopg-pool"
ecosystem = "PyPI"
license.ignore = true

# openmm, in the antibody plugin's structure-tools image, refines predicted
# antibody structures. Its API and its Reference and CPU platforms, which those
# runs use, are MIT; its CUDA and OpenCL platforms are LGPL-3.0, and its wheel
# carries the OpenCL one, unmodified and unused. What it bundles is BSD-3-Clause,
# Zlib, MIT, CC-BY-3.0 (a PDBx parser) and a notice of Rice University's (Hilbert
# curves). Its PyPI metadata says otherwise ("Python Software Foundation License")
# and its wheel ships no licence text, so the image adds OpenMM's own licence
# files, at the commit the wheel was built from. This exception covers openmm
# alone.

[[PackageOverrides]]
name = "openmm"
ecosystem = "PyPI"
license.ignore = true

# jwcrypto (LGPL-3.0-or-later) is a required dependency of
# django-oauth-toolkit, which imports it unconditionally for OpenID Connect
# and JWT support (Iki turns neither on). As with psycopg, Iki uses it
# unmodified as a dynamically imported library and images ship its license
# text. This exception covers jwcrypto alone.

[[PackageOverrides]]
name = "jwcrypto"
ecosystem = "PyPI"
license.ignore = true

# Data packages used only by development tools. They are never bundled into
# the web app or installed in an image, so nothing under these licenses ships.
# Each exception covers that package alone, not the license in general.
#
# - caniuse-lite (CC-BY-4.0): browser-support data that browserslist reads
#   for Babel, which ESLint's React hooks plugin uses. CC-BY needs attribution
#   only if the data is redistributed, and Iki doesn't redistribute it.
# - language-subtag-registry (CC0-1.0, public domain): the IANA language tags
#   that eslint-plugin-jsx-a11y uses to check `lang` attributes.
# - mdn-data (CC0-1.0, public domain): CSS definitions that css-tree reads
#   inside jsdom, which runs the web app's unit tests.

[[PackageOverrides]]
name = "caniuse-lite"
ecosystem = "npm"
license.ignore = true

[[PackageOverrides]]
name = "language-subtag-registry"
ecosystem = "npm"
license.ignore = true

[[PackageOverrides]]
name = "mdn-data"
ecosystem = "npm"
license.ignore = true

# numpy is BSD-3-Clause, with vendored parts under 0BSD, MIT and Zlib (all allowed)
# and two small random-number routines dedicated to the public domain under CC0-1.0:
# Highway's random-inl.h and SplitMix64. It's installed with the SDK's optional
# `pandas` extra and in the protein plugin's environment (for Biopython), unmodified.
# CC0 is a public-domain dedication: nothing it covers asks anything of Iki. This
# exception covers numpy alone, not CC0-1.0 in general.

[[PackageOverrides]]
name = "numpy"
ecosystem = "PyPI"
license.ignore = true

# Biopython is under the Biopython License Agreement, which has no SPDX identifier:
# a permissive license, like the historical permission notice (HPND), that allows use,
# copying, changing and distribution for any purpose, asking only that its copyright
# and permission notices be kept and that its authors' names not be used to promote
# what's made with it. Some of its files are also offered under BSD-3-Clause. The
# protein plugin's environment installs it unmodified from PyPI, with its LICENSE.rst.
# This exception covers biopython alone.

[[PackageOverrides]]
name = "biopython"
ecosystem = "PyPI"
license.ignore = true

# Pillow is under the MIT-CMU License (its LICENSE, and its metadata's SPDX expression):
# the historical permission notice PIL has always had, permissive like MIT, allowing use,
# copying, changing and distribution for any purpose, asking only that its notices be kept
# and that its authors' names not be used to promote what's made with it. The libraries
# its wheels bundle (libjpeg, libpng, zlib, libtiff, libwebp, FreeType under its FreeType
# License, HarfBuzz, lcms2, OpenJPEG, liblzma and the rest) are under permissive licenses,
# each listed in that LICENSE. RDKit needs it, so the small_molecule and oligo plugins'
# environments install it unmodified from PyPI. This exception covers pillow alone, not MIT-CMU in
# general.

[[PackageOverrides]]
name = "pillow"
ecosystem = "PyPI"
license.ignore = true

# webpki-root-certs (CDLA-Permissive-2.0, Mozilla's root certificates as data) is
# locked only because rustls-platform-verifier uses it on wasm32, which iki-worker is
# never built for. Nothing under this license ships: on every platform Iki builds for,
# the worker trusts the operating system's certificates (worker/deny.toml's targets).

[[PackageOverrides]]
name = "webpki-root-certs"
ecosystem = "crates.io"
license.ignore = true

# Inter, the app's typeface (ADR 0176), is under the SIL Open Font License 1.1,
# which permits bundling the font with software under any licence, so long as
# the font isn't sold by itself and its licence goes with it. Iki serves the
# package's files unmodified from its static files, beside its licence
# (server/src/iki_server/web/static/iki/fonts/inter-LICENSE.txt), and NOTICE
# names it. This exception covers this package alone, not OFL in general.

[[PackageOverrides]]
name = "@fontsource-variable/inter"
ecosystem = "npm"
license.ignore = true
