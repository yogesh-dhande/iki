packages:
  - "web/app"
  # The docs site (ikisci.org, `make docs`) and the tooling Iki's docs sites share.
  - "docs/site"
  - "docs/tooling"
  - "web/packages/*"
  # Builds the small_molecule plugin's depiction component from RDKit.js.
  - "plugins/small_molecule/web"

# Supply-chain hardening.
# Refuse package versions published less than 3 days ago, which gives the
# registry time to pull compromised releases before they reach us.
minimumReleaseAge: 4320
# Dependency install scripts never run unless a package is listed here.
onlyBuiltDependencies: []
# Refused outright: Scarf's install script reports installs to a third party
# (it comes with swagger-ui-dist, which Mol*'s server tools use).
allowBuilds:
  "@scarf/scarf": false
strictDepBuilds: true
# Astro (the docs site) can resize images with sharp, whose libvips binaries are
# LGPL-3.0. The docs site has no images to resize and uses Astro's passthrough image
# service, so sharp isn't installed at all.
ignoredOptionalDependencies:
  - sharp
engineStrict: true
