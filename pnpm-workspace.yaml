packages:
  - "web/app"
  # The internal architecture site, served locally only: `make architecture`.
  - "docs/architecture"
  - "web/packages/*"
  # Builds the small_molecule plugin's depiction component from RDKit.js.
  - "plugins/small_molecule/web"

# Supply-chain hardening.
# Refuse package versions published less than 3 days ago, which gives the
# registry time to pull compromised releases before they reach us.
minimumReleaseAge: 4320
# Dependency install scripts never run unless a package is listed here.
onlyBuiltDependencies: []
# Refused outright: Scarf's install script reports installs to a third party
# (it comes with swagger-ui-dist, which Mol*'s server tools use).
allowBuilds:
  "@scarf/scarf": false
strictDepBuilds: true
# Optional native dependencies nothing here uses:
# - sharp: Astro's optional image service. Nothing here resizes images, and its libvips
#   builds are LGPL. Only the architecture site (docs/architecture) uses Astro.
# - @napi-rs/canvas: pdf.js (file previews, ADR 0226) offers a native canvas for rendering
#   in Node. The app renders in browsers, and a canvas in jsdom would change what the
#   app's tests run.
ignoredOptionalDependencies:
  - sharp
  - "@napi-rs/canvas"
engineStrict: true
