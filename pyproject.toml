# Root of the uv workspace. It is not a package itself; it holds shared tool
# configuration and the dev dependency group used by every Python member.
[project]
name = "iki-workspace"
version = "0.0.0"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.uv]
package = false
required-version = ">=0.13.7"

[tool.uv.workspace]
members = ["server", "cli"]

[tool.uv.sources]
iki-server = { workspace = true }
iki-cli = { workspace = true }

[dependency-groups]
dev = [
  "iki-server",
  "iki-cli",
  "mypy>=2.4.1",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["server/src", "cli/src"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "S",             # bandit security checks
  "SIM", "C4", "RET", "PTH", "PIE", "PERF",
  "RUF",
  "N",             # naming
  "DTZ",           # timezone-aware datetimes only
  "T20",           # no stray print()
  "ANN",           # annotations everywhere
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "ANN"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
mypy_path = ["server/src", "cli/src"]
files = ["server/src", "server/tests", "cli/src", "cli/tests"]
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
testpaths = ["server/tests", "cli/tests"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["iki_server", "iki_cli"]
