# Root of the uv workspace. It is not a package itself; it holds shared tool
# configuration and the dev dependency group used by every Python member.
[project]
name = "iki-workspace"
version = "0.0.0"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.uv]
package = false
required-version = ">=0.13.7"

[tool.uv.workspace]
members = ["server", "cli"]

[tool.uv.sources]
iki-server = { workspace = true }
iki-cli = { workspace = true }

[dependency-groups]
dev = [
  "iki-server",
  "iki-cli",
  "django-stubs[compatible-mypy]>=6.1.2",
  "mypy>=2.4.1",
  "psycopg[binary]>=3.3.8",
  "pytest-asyncio>=1.3.0",
  "pytest-django>=4.14.0",
  "pytest>=9.2.0",
  "pyyaml>=6.0.3",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.4",
  "testcontainers[postgres]>=4.15.0",
  "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["server/src", "cli/src"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "S",             # bandit security checks
  "SIM", "C4", "RET", "PTH", "PIE", "PERF",
  "RUF",
  "N",             # naming
  "DTZ",           # timezone-aware datetimes only
  "T20",           # no stray print()
  "ANN",           # annotations everywhere
]
# UI copy uses typographic apostrophes and quotes.
allowed-confusables = ["’", "“", "”"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "ANN"]
# Generated by makemigrations; reviewed, not hand-formatted.
"**/migrations/**" = ["E501", "RUF012"]
# SAML XML templates read best unwrapped.
"server/tests/fake_saml_idp.py" = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
mypy_path = ["server/src", "server/tests", "cli/src"]
plugins = ["mypy_django_plugin.main"]
files = [
  "server/src",
  "server/tests",
  "cli/src",
  "cli/tests",
  "deploy/helm/iki/tests",
  "deploy/dev/sso.py",
]
explicit_package_bases = true

[[tool.mypy.overrides]]
# django-environ ships no type information.
module = ["environ", "environ.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# django-allauth ships no type information.
module = ["allauth", "allauth.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# python3-saml (allauth's SAML support) ships no type information.
module = ["onelogin", "onelogin.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The allauth adapters subclass allauth's (untyped) base classes.
module = ["iki_server.accounts.adapters"]
disallow_subclassing_any = false

[tool.django-stubs]
django_settings_module = "iki_test_settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "iki_test_settings"
pythonpath = ["server/tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
testpaths = ["server/tests", "cli/tests", "deploy/helm/iki/tests"]
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error",
  # python3-saml still uses datetime.utcnow() and utcfromtimestamp(); harmless.
  "ignore:datetime.datetime.utc:DeprecationWarning:onelogin.saml2.utils",
]

[tool.coverage.run]
branch = true
source = ["iki_server", "iki_cli"]
